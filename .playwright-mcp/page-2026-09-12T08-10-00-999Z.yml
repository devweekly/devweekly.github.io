    - heading "AI时代的业务流程workflow该怎么做？bpmn还是agent" [level=1] [ref=f43e29]
    - generic [ref=f43e30]:
      - generic [ref=f43e34]: "Published:"
      - generic [ref=f43e35]:
        - time [ref=f43e36]: Sep 12, 2026
        - text: "|"
        - generic [ref=f43e37]: at
        - text: 09:23 AM
    - article [ref=f43e38]:
      - paragraph [ref=f43e39]: 2026 年关于“业务流程该用 BPMN 还是 Agent”的讨论，很容易滑向两个极端：一种认为 Workflow 已经过时，另一种把 Agent 当成一个新的节点类型塞进旧流程。把厂商文档、开源实现、学术研究和金融机构的实践放在一起看，得到的答案不是二选一。
      - paragraph [ref=f43e40]: 这篇文章要回答的问题只有一个：在金融服务里，确定性的业务流程和概率性的智能能力，应该怎么被拼在一起？
      - paragraph [ref=f43e41]: 结论先放在这里：
      - blockquote [ref=f43e42]:
        - paragraph [ref=f43e43]: 金融服务不应该在 BPMN 和 Agent 之间二选一。BPMN/DMN 负责确定性的业务流程、业务规则和责任边界；Agent 负责流程内部那些难以规则化的认知任务；Workflow Runtime 负责业务状态和生命周期；Policy/IAM 负责 Agent 的权限；Agent 的输出必须以受约束的 Task Contract 返回，并经过确定性验证、以及按风险需要的人工批准，才能产生业务副作用。
      - heading "这篇文章的结构" [level=3] [ref=f43e44]
      - paragraph [ref=f43e45]: 需要先说明一件事：本文前半部分讨论的 Agent-first 模型（Agent Runtime + Dynamic Plan + Durable Runtime），是通用 Agent 平台这一领域的真实主张，也是 2026 年厂商投入最大的一条线。它是趋势的一部分，但不是本文对金融业务的结论。所以全文按两条线组织：
      - table [ref=f43e46]:
        - rowgroup [ref=f43e47]:
          - row [ref=f43e48]:
            - columnheader "部分" [ref=f43e49]
            - columnheader "回答什么" [ref=f43e50]
            - columnheader "性质" [ref=f43e51]
        - rowgroup [ref=f43e52]:
          - row [ref=f43e53]:
            - cell "第一部分" [ref=f43e54]
            - cell "为什么两个极端都不成立" [ref=f43e55]
            - cell "问题定义" [ref=f43e56]
          - row [ref=f43e57]:
            - cell "第二部分" [ref=f43e58]
            - cell "行业四个架构领域各自在解决什么" [ref=f43e59]
            - cell "趋势观察（含 Agent-first 领域）" [ref=f43e60]
          - row [ref=f43e61]:
            - cell "第三部分" [ref=f43e62]
            - cell "金融为什么不能照搬" [ref=f43e63]
            - cell "约束条件" [ref=f43e64]
          - row [ref=f43e65]:
            - cell "第四、五部分" [ref=f43e66]
            - cell "主线架构与 Agent Task Contract" [ref=f43e67]
            - cell "本文结论" [ref=f43e68]
          - row [ref=f43e69]:
            - cell "第六至九部分" [ref=f43e70]
            - cell "案例、选型、落地、长期演进" [ref=f43e71]
            - cell "可执行部分" [ref=f43e72]
      - paragraph [ref=f43e73]: 只想看结论的读者，可以直接跳到第四部分和第五部分。
      - heading "第一部分：问题定义" [level=1] [ref=f43e74]
      - heading "1. 两个极端" [level=2] [ref=f43e75]
      - paragraph [ref=f43e76]: Agent 进入业务流程的早期，工程团队通常会落到两个极端之一。第一个极端是“BPMN → Agent”：在既有的流程引擎里加一个 Agent 节点，把原来需要智能判断的那一步换成一次 LLM 调用：
      - document [ref=f43e78]:
        - generic [ref=f43e81]:
          - paragraph [ref=f43e88]: Service Task
          - paragraph [ref=f43e95]: LLM Node
          - paragraph [ref=f43e102]: Service Task
      - paragraph [ref=f43e103]: 流程图画得很完整，看起来很可控。
      - paragraph [ref=f43e104]: 第二个极端是“Agent → Everything”：把整个业务流程交给 Agent：
      - document [ref=f43e106]:
        - generic [ref=f43e109]:
          - paragraph [ref=f43e116]: User Intent
          - paragraph [ref=f43e123]: Agent
          - paragraph [ref=f43e130]: Tool / Tool / Tool
          - paragraph [ref=f43e137]: Business Outcome
      - paragraph [ref=f43e138]: 看起来很先进，演示效果通常也很好。
      - paragraph [ref=f43e139]: 两个极端的问题不一样，但根子是同一个：它们都把“业务流程”和“认知任务”当成了同一种东西。业务流程要回答的是“做什么、谁做、什么时候做、结果去哪、出问题谁负责”；认知任务要回答的是“这一步具体怎么想清楚”。前者需要确定性，后者本身不确定。把它们混成一层，无论混在 BPMN 里还是混在 Agent 里，都会出问题。接下来三节分别说明：传统 Workflow 的边界在哪里，以及两种混法各自错在哪，错得有多贵。
      - heading "2. 传统 Workflow 的假设，以及它的真实边界" [level=2] [ref=f43e140]
      - paragraph [ref=f43e141]: 传统 Camunda / Fluxnova / Flowable / ServiceNow Workflow 的核心模型大概是：
      - document [ref=f43e143]:
        - generic [ref=f43e151]:
          - paragraph [ref=f43e158]: Process Definition
          - paragraph [ref=f43e165]: Step A
          - paragraph [ref=f43e172]: Step B
          - paragraph [ref=f43e179]: Decision
          - paragraph [ref=f43e186]: Step C
          - paragraph [ref=f43e193]: Step D
          - paragraph [ref=f43e200]: Step E
      - paragraph [ref=f43e201]: 流程在设计期基本确定。例如：
      - document [ref=f43e203]:
        - generic [ref=f43e206]:
          - paragraph [ref=f43e213]: 收到贷款申请
          - paragraph [ref=f43e220]: 身份验证
          - paragraph [ref=f43e227]: 信用检查
          - paragraph [ref=f43e234]: 风险评分
          - paragraph [ref=f43e241]: 人工审批
          - paragraph [ref=f43e248]: 放款
      - paragraph [ref=f43e249]: 这是很适用的模型，因为路径比较确定，状态比较确定，责任边界、审计要求和 SLA 都明确。所以 BPMN 仍然有价值。但换成 Agent，任务描述会变成：
      - document [ref=f43e251]:
        - paragraph [ref=f43e261]: “调查这个投资机会，并给出一份结论。”
      - paragraph [ref=f43e262]: 而没人能预先确定 Agent 会走哪条路：
      - document [ref=f43e264]:
        - generic [ref=f43e267]:
          - paragraph [ref=f43e274]: search web
          - paragraph [ref=f43e281]: search Bloomberg
          - paragraph [ref=f43e288]: query internal database
          - paragraph [ref=f43e295]: read 17 documents
          - paragraph [ref=f43e302]: ask another agent
          - paragraph [ref=f43e309]: calculate valuation
          - paragraph [ref=f43e316]: discover missing information
          - paragraph [ref=f43e323]: search again
          - paragraph [ref=f43e330]: challenge its own conclusion
          - paragraph [ref=f43e337]: ask human
          - paragraph [ref=f43e344]: continue
          - paragraph [ref=f43e351]: produce report
      - paragraph [ref=f43e352]: 这条路径不可能被提前画出来。所以传统 Workflow 是 Design-Time Control Flow，Agent Workflow 是 Runtime Decision + Execution Boundary，这是根本区别。
      - heading "一个容易被忽略的技术细节：BPMN 不是状态机" [level=3] [ref=f43e353]
      - paragraph [ref=f43e354]: 这里有一个在架构评审时经常被追问、但很多文档写错的点。严格来说，BPMN 是流程建模与编排的记法。运行时才产生 process instance，以及这个实例在流程图上的 token position 与执行状态。所以更准确的表述是：BPMN 提供确定性的流程模型和状态转移语义；具体某个 Process Instance 当前处于什么状态，由 Workflow Runtime 持有。把 BPMN 直接等同于“状态机”，作为通俗解释没问题，但写进架构文档会带来两个后果：一是把模型和运行时状态混为一谈；二是在讨论“状态到底应该存在哪里、出事故时以谁为准”时，失去判断依据。真正需要持有状态的是 Runtime，而不是图。这一点在后面的分层里很关键——因为“Agent 能不能改流程状态”这个问题的答案，取决于状态的所有权在谁手上，而不取决于图是怎么画的。
      - heading "3. 第一个极端：给 BPMN 加一个 LLM Node" [level=2] [ref=f43e355]
      - paragraph [ref=f43e356]: 传统 Low-code：
      - document [ref=f43e358]:
        - generic [ref=f43e361]:
          - paragraph [ref=f43e368]: 拖一个 HTTP Node
          - paragraph [ref=f43e375]: 拖一个 Condition
          - paragraph [ref=f43e382]: 拖一个 LLM Node
          - paragraph [ref=f43e389]: 拖一个 Approval Node
      - paragraph [ref=f43e390]: 看起来非常容易。但真正复杂之后，会冒出一串运行时问题：
      - document [ref=f43e392]:
        - generic [ref=f43e395]:
          - paragraph [ref=f43e402]: LLM 为什么选择这个？
          - paragraph [ref=f43e409]: 为什么重新搜索？
          - paragraph [ref=f43e416]: 为什么调用这个 tool？
          - paragraph [ref=f43e423]: 为什么跳过那个 task？
          - paragraph [ref=f43e430]: 为什么 context 变了？
          - paragraph [ref=f43e437]: 为什么 agent 重新规划？
      - paragraph [ref=f43e438]: 最终暴露出来的问题是连节点只是表面工作，运行时行为才构成主要复杂度。于是最后会出现一个非常荒谬的东西：
      - document [ref=f43e440]:
        - generic [ref=f43e443]:
          - paragraph [ref=f43e450]: Low-code workflow
          - paragraph [ref=f43e457]: Agent Node
          - paragraph [ref=f43e464]: Prompt
          - paragraph [ref=f43e471]: Memory Node
          - paragraph [ref=f43e478]: Agent Router
          - paragraph [ref=f43e485]: Tool Node
          - paragraph [ref=f43e492]: Agent Router
          - paragraph [ref=f43e499]: Condition
          - paragraph [ref=f43e506]: Agent Router
      - paragraph [ref=f43e507]: 这实际上只是用 BPMN GUI 给 Agent 套了一层壳，不是长久方向。同样的道理，也不要把 Agent 的内部逻辑画进 BPMN。例如不要：
      - document [ref=f43e509]:
        - generic [ref=f43e521]:
          - paragraph [ref=f43e528]: BPMN
          - paragraph [ref=f43e535]: Agent Call
          - paragraph [ref=f43e542]: Agent Decision
          - paragraph [ref=f43e549]: Agent Decision
          - paragraph [ref=f43e556]: Agent Loop
          - paragraph [ref=f43e563]: Agent Retry
          - paragraph [ref=f43e570]: Agent Memory
          - paragraph [ref=f43e577]: Agent Tool
          - paragraph [ref=f43e584]: Agent Tool
          - paragraph [ref=f43e591]: Agent Subprocess
      - paragraph [ref=f43e592]: 最终 BPMN 又变成另一种 spaghetti。正确方式是：
      - document [ref=f43e594]:
        - generic [ref=f43e597]:
          - paragraph [ref=f43e604]: BPMN
          - paragraph [ref=f43e611]: Agent Activity
          - paragraph [ref=f43e618]: Agent Runtime
      - paragraph [ref=f43e619]: Agent Runtime 内部再拥有自己的执行模型。
      - heading "4. 第二个极端：让 Agent 决定整个业务流程" [level=2] [ref=f43e620]
      - paragraph [ref=f43e621]: 这同样危险。最差的 AI Workflow：
      - document [ref=f43e623]:
        - generic [ref=f43e626]:
          - paragraph [ref=f43e633]: Agent
          - paragraph [ref=f43e640]: Agent
          - paragraph [ref=f43e647]: Agent
          - paragraph [ref=f43e654]: Agent
          - paragraph [ref=f43e661]: Agent
      - paragraph [ref=f43e662]: 然后让模型自己决定整个业务流程，金融领域尤其不能这么做。例如：
      - document [ref=f43e664]:
        - generic [ref=f43e672]:
          - paragraph [ref=f43e679]: Agent
          - paragraph [ref=f43e686]: approve loan
          - paragraph [ref=f43e693]: move money
          - paragraph [ref=f43e700]: submit trade
          - paragraph [ref=f43e707]: change risk limit
      - paragraph [ref=f43e708]: 这里不应该是 Agent 自由决定，更合理的是：
      - document [ref=f43e710]:
        - generic [ref=f43e712]:
          - generic [ref=f43e720]:
            - paragraph [ref=f43e726]: proposal
            - paragraph [ref=f43e732]: safe
            - paragraph [ref=f43e738]: needs approval
            - paragraph [ref=f43e744]: forbidden
            - paragraph [ref=f43e750]: approved
            - paragraph [ref=f43e756]: success
            - paragraph [ref=f43e762]: failure
          - generic [ref=f43e763]:
            - paragraph [ref=f43e770]: Agent
            - paragraph [ref=f43e777]: Policy Gate
            - paragraph [ref=f43e784]: Tool Execution
            - paragraph [ref=f43e791]: Human Approval
            - paragraph [ref=f43e798]: Reject
            - paragraph [ref=f43e805]: Verification
      - paragraph [ref=f43e806]: Agent 有 autonomy，但没有 unrestricted authority。这一点比 Workflow 这个词本身更值得先弄清楚。两个极端各自错在哪，到这里可以说得很具体了。它们错的不是“用了 BPMN”或“用了 Agent”，而是把基本单元搞错了。本文主张的基本单元不是“LLM Node”，而是 Agent Task：
      - document [ref=f43e808]:
        - generic [ref=f43e811]:
          - paragraph [ref=f43e818]: Business Process
          - paragraph [ref=f43e825]: Agent Task
          - paragraph [ref=f43e832]: Agent Runtime
          - paragraph [ref=f43e839]: Structured Result
          - paragraph [ref=f43e846]: Validation / Policy / Authorization
          - paragraph [ref=f43e853]: Business Process
      - paragraph [ref=f43e854]: 第一个极端把 Agent Task 降级成了一个 LLM Node，于是流程图画满了 Agent 的内部细节，却丢掉了智能本身；第二个极端把 Agent Task 升级成了整个业务流程，于是流程资产、责任边界与审批关系一起消失。第四、第五部分会把这条链路展开成完整架构与契约。
      - heading "第二部分：业界趋势" [level=1] [ref=f43e855]
      - heading "5. 四个架构领域总览" [level=2] [ref=f43e856]
      - paragraph [ref=f43e857]: 2026 年的行业实践，可以按“各自解决什么问题”归成四个架构领域。它们不是互相替代的关系，而是分别占住了架构的不同层。
      - table [ref=f43e858]:
        - rowgroup [ref=f43e859]:
          - row [ref=f43e860]:
            - columnheader "领域" [ref=f43e861]
            - columnheader "解决的问题" [ref=f43e862]
            - columnheader "主要线索" [ref=f43e863]
        - rowgroup [ref=f43e864]:
          - row [ref=f43e865]:
            - cell "领域一 · 确定性业务编排" [ref=f43e866]
            - cell "流程、责任、审批、SLA、审计" [ref=f43e867]
            - cell "Camunda / Fluxnova" [ref=f43e868]
          - row [ref=f43e869]:
            - cell "领域二 · Agent Runtime 与 Harness" [ref=f43e870]
            - cell "Agent 如何工作" [ref=f43e871]
            - cell "OpenAI / Anthropic / LangGraph / Microsoft / Google" [ref=f43e872]
          - row [ref=f43e873]:
            - cell "领域三 · Durable Execution" [ref=f43e874]
            - cell "Agent 如何可靠地长期运行" [ref=f43e875]
            - cell "Temporal / Durable Task" [ref=f43e876]
          - row [ref=f43e877]:
            - cell "领域四 · Enterprise Semantic & Data" [ref=f43e878]
            - cell "Agent 在什么世界里工作" [ref=f43e879]
            - cell "Palantir / Snowflake" [ref=f43e880]
      - document [ref=f43e882]:
        - generic [ref=f43e890]:
          - paragraph [ref=f43e897]: 领域一确定性业务编排
          - paragraph [ref=f43e904]: 领域二Agent Runtime 与 Harness
          - paragraph [ref=f43e911]: 领域三Durable Execution
          - paragraph [ref=f43e918]: 领域四Enterprise Semantic & Data
          - paragraph [ref=f43e925]: 组合点：Agent Task Contract
      - paragraph [ref=f43e926]: 这个分组方式本身就是一个判断：这四件事不在同一个维度上，不能用“谁替代谁”来讨论。其中有一处需要额外说明：领域三（Durable Execution）严格来说不与另外三者处在同一层，而是一层基础能力。它不解决“Agent 怎么决策”，也不解决“流程怎么定义”，它解决的是“执行到一半进程崩了怎么办”。把它当成一个可选方向去和 BPMN 比较，是选型时最常见的误判之一；把它当成所有长任务路径都必须具备的底座，才是它的真实位置。把领域二三混成一句“Agent Workflow 取代了 BPMN”，是这一轮技术讨论里最普遍的一次偷换。后面的第 42 节会把这个问题拆到产品层面。
      - heading "6. 领域一 · 确定性业务编排（Camunda / Fluxnova）" [level=2] [ref=f43e927]
      - paragraph [ref=f43e928]: 为什么用 BPMN 引擎承载 Agent Workflow 会让人本能地抵触？Fluxnova 仍然是 BPMN 引擎：
      - document [ref=f43e930]:
        - generic [ref=f43e933]:
          - paragraph [ref=f43e940]: BPMN
          - paragraph [ref=f43e947]: DMN
          - paragraph [ref=f43e954]: Human Task
          - paragraph [ref=f43e961]: Process State
          - paragraph [ref=f43e968]: Audit
      - paragraph [ref=f43e969]: 它现在已经开始加入：
      - list [ref=f43e970]:
        - listitem [ref=f43e971]: ad-hoc subprocess
        - listitem [ref=f43e972]: agentic subprocess
        - listitem [ref=f43e973]: MCP
        - listitem [ref=f43e974]: AI integration
        - listitem [ref=f43e975]: dynamic routing
      - paragraph [ref=f43e976]:
        - text: 但它仍然是 BPMN-centered orchestration，没有转到 Agent-centered execution runtime。Fluxnova 3.0 本身仍以 BPMN Process Engine 为核心，只是增加了 Ad Hoc Subprocess 等动态能力；其 roadmap 甚至把 AI integration 放到了后续能力路线。(
        - link "GitHub" [ref=f43e977] [cursor=pointer]:
          - /url: https://github.com/finos/fluxnova-bpm-platform/releases
        - text: )
      - heading "更准确的说法：deterministic + dynamic，而不是“把 Agent 塞进 BPMN”" [level=3] [ref=f43e978]
      - paragraph [ref=f43e979]:
        - text: 前面那句“Camunda 的方向是把 Agent 塞进 BPMN”，只说对了一半。Camunda 8.7 的官方文档已经把这件事定义得非常明确：agentic orchestration 是把确定性编排和动态（AI 驱动）编排混合进同一个端到端流程。原文的表述是，AI agent 负责执行流程中非确定性的部分，而 BPMN 提供可预测性、合规性和客户体验的底座。(
        - link "Camunda 8 Docs" [ref=f43e980] [cursor=pointer]:
          - /url: https://docs.camunda.io/docs/8.7/components/agentic-orchestration/
        - text: )
      - paragraph [ref=f43e981]: 分工是清楚的：
      - document [ref=f43e983]:
        - generic [ref=f43e993]:
          - paragraph [ref=f43e1000]: LLM
          - paragraph [ref=f43e1007]: 决定调用什么工具、以什么顺序、什么时候停止
          - paragraph [ref=f43e1014]: Camunda
          - paragraph [ref=f43e1021]: 执行 BPMN elements
          - paragraph [ref=f43e1028]: 保存 process state
          - paragraph [ref=f43e1035]: retry / incident
          - paragraph [ref=f43e1042]: human task
          - paragraph [ref=f43e1049]: 确定性逻辑
          - paragraph [ref=f43e1056]: process boundary
      - paragraph [ref=f43e1057]:
        - text: 所以更准确的表述是：Camunda 正在把 BPMN 从“纯确定性流程”扩展成“确定性流程 + 受治理的 Agentic Subprocess”。具体的设计与架构建议，见 Camunda 的《Design and architecture》文档。(
        - link "Camunda 8 Docs" [ref=f43e1058] [cursor=pointer]:
          - /url: https://docs.camunda.io/docs/components/agentic-orchestration/ao-design/
        - text: )这个方向与本文后面的主线架构是一致的，落点不同而已：Camunda 把它落在 BPMN 边界内，本文要讨论的是这个边界应该由什么契约来定义。这对金融、保险、银行很合理。但如果目标是一个 AI-native Agent Platform，BPMN 不适合作为核心抽象。
      - heading "7. 领域二（上）· 执行模型" [level=2] [ref=f43e1059]
      - paragraph [ref=f43e1060]: 这个领域的主张最激进，投入也最大。它并不否认 Workflow 的存在，而是主张 Workflow 的实现方式应该被重写。在评价它之前，先把它自己的主张摆出来。而比较合理的模型其实是：
      - document [ref=f43e1062]:
        - generic [ref=f43e1082]:
          - paragraph [ref=f43e1089]: User / Business Event
          - paragraph [ref=f43e1096]: Intent
          - paragraph [ref=f43e1103]: Agent Runtime
          - paragraph [ref=f43e1110]: Policy / Authority
          - paragraph [ref=f43e1117]: Context / Memory
          - paragraph [ref=f43e1124]: Tools / APIs / MCP
          - paragraph [ref=f43e1131]: Dynamic Plan
          - paragraph [ref=f43e1138]: Execution Runtime
          - paragraph [ref=f43e1145]: Deterministic Code
          - paragraph [ref=f43e1152]: Agent Task
          - paragraph [ref=f43e1159]: Human Task
          - paragraph [ref=f43e1166]: External Event
          - paragraph [ref=f43e1173]: Result
          - paragraph [ref=f43e1180]: Verification / Policy Check
          - paragraph [ref=f43e1187]: Durable State + Event Log
      - paragraph [ref=f43e1188]: 这里先说两件事：在 Agent-first 架构中，Agent 可以动态决定下一步的任务或工具调用；但在金融业务流程中，这种自由度被限制在 BPMN 定义的 Agent Task 边界内。Runtime 决定“这个下一步能不能做、怎么执行、出了问题怎么办”。第一点是这个领域与过去 Workflow 最大的区别，也是它后来必须被限制的地方；第二点则不受领域之争影响——无论目标是什么，执行边界都必须存在。
      - heading "Google ADK 2.0" [level=3] [ref=f43e1189]
      - paragraph [ref=f43e1190]:
        - text: Google 在 2026 年把 ADK 从原来的 hierarchical agent executor 明确转向 Workflow Runtime + Graph-based execution：Agent、Tool、Function 全部作为 workflow graph 的节点，并支持 branching、parallelism、loops、human-in-the-loop、state preservation 与 resume；原来的
        - code [ref=f43e1191]: SequentialAgent / LoopAgent
        - text: 正逐步被 graph workflow 取代。(
        - link "GitHub" [ref=f43e1192] [cursor=pointer]:
          - /url: https://github.com/google/adk-docs/blob/main/docs/2.0/index.md
        - text: )先看它的立场，而不是它说了什么：不是“Agent 出现了，所以 Workflow 消失”，而是“Workflow 的实现方式必须适应 Agent”。
      - heading "Microsoft Agent Framework" [level=3] [ref=f43e1193]
      - paragraph [ref=f43e1194]: Microsoft Agent Framework 现在把 Workflow 定义成：
      - document [ref=f43e1196]:
        - generic [ref=f43e1199]:
          - paragraph [ref=f43e1206]: Executors
          - paragraph [ref=f43e1213]: Edges
          - paragraph [ref=f43e1220]: State
          - paragraph [ref=f43e1227]: Events
          - paragraph [ref=f43e1234]: Runtime
      - paragraph [ref=f43e1235]: 而 Executor 可以是：
      - list [ref=f43e1236]:
        - listitem [ref=f43e1237]: 普通代码
        - listitem [ref=f43e1238]: Agent
        - listitem [ref=f43e1239]: Tool
        - listitem [ref=f43e1240]: sub-workflow
      - paragraph [ref=f43e1241]: 并且 runtime 负责：
      - list [ref=f43e1242]:
        - listitem [ref=f43e1243]: execution
        - listitem [ref=f43e1244]: events
        - listitem [ref=f43e1245]: checkpointing
        - listitem [ref=f43e1246]: HITL
        - listitem [ref=f43e1247]: concurrency
        - listitem [ref=f43e1248]: state management
      - paragraph [ref=f43e1249]:
        - text: 也就是说，Workflow 不再等价于 Business Process Diagram，而是一个可执行的 runtime topology。(
        - link "Microsoft Learn" [ref=f43e1250] [cursor=pointer]:
          - /url: https://learn.microsoft.com/en-us/agent-framework/workflows/workflows
        - text: )
      - heading "LangGraph" [level=3] [ref=f43e1251]
      - paragraph [ref=f43e1252]: LangGraph 把自己定位成 low-level orchestration framework for stateful agents。它的核心价值不是“画流程”，而是：
      - document [ref=f43e1254]:
        - generic [ref=f43e1257]:
          - paragraph [ref=f43e1264]: State
          - paragraph [ref=f43e1271]: Node
          - paragraph [ref=f43e1278]: Decision
          - paragraph [ref=f43e1285]: Tool
          - paragraph [ref=f43e1292]: Checkpoint
          - paragraph [ref=f43e1299]: Resume
      - paragraph [ref=f43e1300]:
        - text: 它特别强调 durable execution、stateful agents、long-running execution 与 failure recovery。也就是说，Graph 在这里不是给业务人员看的流程图，而是 Agent 的执行 runtime。(
        - link "GitHub" [ref=f43e1301] [cursor=pointer]:
          - /url: https://github.com/langchain-ai/langgraph
        - text: )所以不要再想
        - code [ref=f43e1302]: Workflow = DAG / BPMN
        - text: ，而应该定义：
      - document [ref=f43e1304]:
        - generic [ref=f43e1312]:
          - paragraph [ref=f43e1319]: Agentic Workflow
          - paragraph [ref=f43e1326]: Intent
          - paragraph [ref=f43e1333]: Policy
          - paragraph [ref=f43e1340]: Execution State
          - paragraph [ref=f43e1347]: Dynamic Plan
          - paragraph [ref=f43e1354]: Durable Runtime
      - heading "① Intent" [level=3] [ref=f43e1355]
      - paragraph [ref=f43e1356]:
        - text: 起点不是
        - code [ref=f43e1357]: Start → A → B → C
        - text: ，而是一个目标，例如“完成投资机会尽调并生成投资建议”。Agent 负责寻找完成这个 Goal 的路径。
      - heading "② Policy" [level=3] [ref=f43e1358]
      - paragraph [ref=f43e1359]: 这个才是企业 Workflow 最应该固定下来的东西。例如：
      - generic [ref=f43e1361]:
        - code [ref=f43e1362]:
          - generic [ref=f43e1363]: "policy:"
          - generic [ref=f43e1364]: "can_read: [market_data, research_db]"
          - generic [ref=f43e1365]: "can_write: [draft_report]"
          - generic [ref=f43e1366]: "approval_required: [execute_trade, send_external_email]"
          - generic [ref=f43e1367]: "forbidden: [customer_pii_export]"
          - generic [ref=f43e1368]: "max_budget: { tokens: 100000, tool_calls: 50 }"
        - button "Copy" [ref=f43e1369]
      - paragraph [ref=f43e1370]: 也就是说，流程可以变动，要固定下来的是权限和边界，这比 BPMN Gateway 更实在。
      - heading "③ Dynamic Plan" [level=3] [ref=f43e1371]
      - paragraph [ref=f43e1372]: Agent 根据目标动态产生工作计划：搜索公司、取财务数据、分析竞争对手、发现信息缺口、再搜索、建模估值、复核假设、产出报告——顺序与内容都由 Agent 自己决定，而不是预先画在流程图上。这个 Plan 对长跑 Agent 而言确实需要持久化，而不是只存在 LLM context 里。但要区分清楚：持久化的是 Agent Task 的执行状态，不是企业业务流程的状态——这一点在第 49 节展开。例如：
      - generic [ref=f43e1374]:
        - code [ref=f43e1375]:
          - generic [ref=f43e1376]: "{"
          - generic [ref=f43e1377]: "\"runId\": \"invest-20260912-001\","
          - generic [ref=f43e1378]: "\"goal\": \"Evaluate XYZ\","
          - generic [ref=f43e1379]: "\"plan\": ["
          - generic [ref=f43e1380]: "{"
          - generic [ref=f43e1381]: "\"id\": \"t1\","
          - generic [ref=f43e1382]: "\"type\": \"research\","
          - generic [ref=f43e1383]: "\"status\": \"completed\""
          - generic [ref=f43e1384]: "},"
          - generic [ref=f43e1385]: "{"
          - generic [ref=f43e1386]: "\"id\": \"t2\","
          - generic [ref=f43e1387]: "\"type\": \"valuation\","
          - generic [ref=f43e1388]: "\"status\": \"running\""
          - generic [ref=f43e1389]: "}"
          - generic [ref=f43e1390]: "]"
          - generic [ref=f43e1391]: "}"
        - button "Copy" [ref=f43e1392]
      - paragraph [ref=f43e1393]: 在这个领域的语境里，“Workflow”的含义已经发生位移：在 Agent-first 系统中，Agent Task 的内部执行计划可以由 Agent 动态生成；它不等于企业 Business Workflow Definition。这是 Agent Platform 视角下的结论。一旦把目标切到企业业务流程，这个区分就变成架构上的硬边界——第 19 节会把两种“计划”明确分开。
      - heading "④ Execution State" [level=3] [ref=f43e1394]
      - paragraph [ref=f43e1395]: 这是传统 Workflow Engine 最值得保留的东西。真实的长任务经常是“跑 25 分钟 → 等待人工 → 6 小时后继续”，状态至少要能区分：
      - generic [ref=f43e1396]: flowchart LR A["RUNNING / WAITING_TOOL / WAITING_HUMAN / WAITING_EVENT"] B["FAILED / RETRYING / COMPLETED / CANCELLED"]
      - paragraph [ref=f43e1397]: 需要的是 durability、checkpoint、resume、timeout、retry、compensation 与 idempotency，而不是漂亮的流程图。这一点比 BPMN 图本身更实在。
      - heading "⑤ Execution Runtime" [level=3] [ref=f43e1398]
      - paragraph [ref=f43e1399]: 真正的核心应该变成：
      - generic [ref=f43e1400]: flowchart LR Agent[Agent Brain] Runtime[Agent Execution Runtime] Agent -->|propose action| Runtime Runtime --> Policy[Policy Engine] Runtime --> Auth[Authority / Identity] Runtime --> Sandbox[Execution Sandbox] Runtime --> Durable[Durable State] Runtime --> Events[Event Log] Policy --> Tools[Tools / MCP / APIs] Auth --> Tools Sandbox --> Tools Tools --> Result[Tool Result] Result --> Runtime Runtime --> Agent
      - paragraph [ref=f43e1401]: Agent 不应该绕过统一的身份、权限、工具和审计边界，直接拿到未治理的生产系统权限。这句话不等于“Agent 不能访问生产系统”。它可以访问，但访问必须走完整链路：
      - generic [ref=f43e1402]: flowchart TD A["Agent"] --> B["Task Context（业务上下文 + 流程实例 + 数据版本）"] B --> C["Tool / Capability"] C --> D["Identity / Authorization"] D --> E["Target System"]
      - paragraph [ref=f43e1403]: 而不是：
      - generic [ref=f43e1404]: flowchart TD A["Agent"] --> B["万能 production credential"]
      - paragraph [ref=f43e1405]: 这里有一个金融场景特有的细节：Authorization 判断的不只是 Agent 的身份。同一个 Agent，对 Investment A 与 Investment B 的权限可能相同，但业务上下文、交易上下文、数据版本与流程实例不同，允许的动作就可能不同。所以完整的授权输入应该是：
      - generic [ref=f43e1406]: flowchart LR A["Agent"] B["User"] C["Workflow Instance"] D["Business Object"] E["Action"] F["Context"]
      - paragraph [ref=f43e1407]: 只写“Agent Identity / Authority”，在评审时会被简化成“这个 Agent 有没有权限”，而金融机构真正要回答的是“在这个 case、这个版本的业务事实上，这一步动作是否被允许”。Agent 只负责 propose、reason、choose 与 delegate；Runtime 负责 authorize、validate、execute、retry、pause、resume 与 audit。这其实就是未来 Agent Platform 最核心的一层。内部 AI Platform 也可以按同一个方向设计：把 Planning、Context 与 Tool Gateway 收进 Agent Runtime，把 Durable State、Event Log 与 Human Task 放在执行侧，再把 Evaluation / Trace 接在末端。这与第 45 节那张平台分层图是同一个判断的两种画法，这里不再重复贴图。需要补一句：BPMN / Camunda / Fluxnova 是一个“外部能力”，不是整个 Agent Platform 的核心。这和今天很多企业的架构思路会完全不同。需要补充一句：这不是本文对金融场景的结论。在金融场景里，BPMN 恰恰是核心控制面，而不是外围能力。两句话并不矛盾，差别只在目标是通用 Agent 平台还是企业业务流程。
      - heading "Microsoft 的第二条线：Durable Runtime" [level=3] [ref=f43e1408]
      - paragraph [ref=f43e1409]:
        - text: 微软实际上同时押了两个方向——
        - code [ref=f43e1410]: Agent + Workflow + Durable Runtime
        - text: ，而不是二选一。除了上一小节那个 graph workflow 模型之外，它还提供了 checkpoint、human-in-the-loop、fan-out / fan-in、sub-workflow、typed routing、graph execution 与 durable execution。更重要的是，微软直接提供 Durable Extension，把 Agent Framework 的 graph workflow 跑在 Durable Task 基础设施上：
      - generic [ref=f43e1411]: flowchart LR A["Agent Framework"] --> B["Graph Workflow"] B --> C["Durable Task"] C --> D["Checkpoint"] D --> E["Resume"] E --> F["Distributed Workers"]
      - paragraph [ref=f43e1412]:
        - text: 并支持 agent 运行数天甚至数周。(
        - link "Microsoft Learn" [ref=f43e1413] [cursor=pointer]:
          - /url: https://learn.microsoft.com/en-us/agent-framework/integrations/durable-extension
        - text: )这里已经非常接近这样的三段式模型：Agent 是 intelligence，Workflow 是 execution topology，Durable Task 是 runtime。
      - heading "8. 领域二（下）· Harness 被产品化" [level=2] [ref=f43e1414]
      - paragraph [ref=f43e1415]: 上一节讲的是“Agent 的执行模型长什么样”，这一节讲的是“厂商正在把什么产品化”。这里有一个值得单独拿出来看的趋势：Agent Harness 本身正在成为独立的基础设施，而不是某个框架的内部实现细节。一旦它可以被单独产品化、单独版本化、单独定价，它在架构上的地位就变了——它从框架的内部细节，变成一层需要被认领的架构。
      - heading "Anthropic：Claude Research 的多 Agent 结构" [level=3] [ref=f43e1416]
      - paragraph [ref=f43e1417]: Anthropic 的做法和微软略有不同。它最经典的生产案例是 Claude Research：一个主 Agent 制定研究计划，再启动多个并行 Agent 搜索，最后汇合。
      - generic [ref=f43e1418]: flowchart TD M[Main Research Agent] --> P[create research plan] P --> R1[Research Agent] P --> R2[Research Agent] P --> R3[Research Agent] R1 --> S1[search] R2 --> S2[search] R3 --> S3[search] S1 --> SY[synthesis] S2 --> SY S3 --> SY
      - paragraph [ref=f43e1419]:
        - text: Anthropic 明确指出，系统设计最大的难点已经变成 coordination、evaluation、reliability 与 tool design，而不是传统 workflow 的节点设计。(
        - link "Anthropic" [ref=f43e1420] [cursor=pointer]:
          - /url: https://www.anthropic.com/engineering/multi-agent-research-system
        - text: ) 这与传统 BPMN 的思路差别很大。
      - heading "Anthropic 的第二条线：Harness" [level=3] [ref=f43e1421]
      - paragraph [ref=f43e1422]:
        - text: Anthropic 对 Agent 的工程实践越来越集中到 Harness，而不是 Workflow Designer。它 2026 年的工程文章把 long-running agents、managed agents、context engineering、skills、tool use、security、agent containment、evals 与 multi-agent research 分成几条独立的线推进。(
        - link "Anthropic" [ref=f43e1423] [cursor=pointer]:
          - /url: https://www.anthropic.com/engineering
        - text: )也就是说，
        - code [ref=f43e1424]: Model + Harness + Tools + Environment + Permissions + Context + Evaluation
        - text: 正在成为一个比传统 workflow 更核心的抽象。不过要说清楚：Anthropic 的公开实践集中在 Harness、Tool Use、Context Engineering、Containment 与 Evaluation，并没有提出一套企业业务流程架构。把它的工程文章读成“BPMN 的替代方案”，是过度解读。
      - heading "OpenAI：从 Agents SDK 到 harness + sandbox" [level=3] [ref=f43e1425]
      - paragraph [ref=f43e1426]:
        - text: OpenAI 2025 年最初的方案是
        - code [ref=f43e1427]: Responses API + Agents SDK + Tools + Handoffs + Guardrails + Tracing
        - text: ，已经明显不是传统 workflow。2026 年更进一步，新的 Agents SDK 强调 model-native harness + sandbox + long-horizon task：
      - generic [ref=f43e1428]: flowchart TD A["Agent"] --> B["Harness"] B --> C["Sandbox"] C --> D["Tools / Files / Commands"] D --> E["Long-running execution"]
      - paragraph [ref=f43e1429]:
        - text: 并且把 harness 与 compute 分离，强调 security、durability 与 scale。(
        - link "OpenAI" [ref=f43e1430] [cursor=pointer]:
          - /url: https://openai.com/index/new-tools-for-building-agents/
        - text: )（
        - link "OpenAI" [ref=f43e1431] [cursor=pointer]:
          - /url: https://openai.com/index/the-next-evolution-of-the-agents-sdk/
        - text: ）这里还有一层意思：Agent Workflow 最终可能不是 DAG，而是一个“可持续运行的 Agent Process”。
      - heading "2026-09-10：OpenAI 把 Harness 单独产品化" [level=3] [ref=f43e1432]
      - paragraph [ref=f43e1433]:
        - text: 这条更新对本文的论证尤其重要，因为它是一个非常直接的证据。OpenAI 在 2026-09-10 发布 Agents API，把驱动 Codex 的同一套 harness 与基础设施开放出来，并且明确由 OpenAI 托管和维护。(
        - link "OpenAI" [ref=f43e1434] [cursor=pointer]:
          - /url: https://openai.com/index/introducing-the-agents-api/
        - text: )它提供的能力清单很能说明问题：
      - generic [ref=f43e1435]: flowchart TD A["managed harness"] B["long-running sessions（模型可以连续工作数小时）"] C["context management（接近上下文上限时自动压缩早期上下文）"] D["sandbox（OpenAI 托管沙箱，或自带基础设施 / 第三方沙箱）"] E["subagents（把任务拆给并行子智能体）"]
      - paragraph [ref=f43e1436]:
        - text: 而开发者只需要定义四样东西：task、model、tools、environment。其余运行时基础设施——会话、上下文压缩、沙箱、并发子智能体调度——由平台负责。(
        - link "OpenAI" [ref=f43e1437] [cursor=pointer]:
          - /url: https://openai.com/index/introducing-the-agents-api/
        - text: )这里有两层含义，方向相反，必须一起看。第一，它支持“Agent Runtime / Harness 正在成为独立基础设施”这个判断。当一个 harness 可以被单独产品化、单独版本化时，它就不再是框架的内部细节，而是一层需要被认领的架构。第二，它同时反证了 Agent Runtime 不等于 Business Workflow Runtime。Agents API 提供的“orchestration”指的是单个 Agent 会话内部的任务编排：决定先查什么、再调什么工具、什么时候停止。它不持有企业流程状态，不负责跨部门审批，也不会为一个投资 Idea 的合规责任签字。这两件事都被称为“编排”，但归属完全不同。这是后面反复要用的一个区分。
      - heading "内部应用：delegated long-horizon task" [level=3] [ref=f43e1438]
      - paragraph [ref=f43e1439]:
        - text: OpenAI 在公开材料里把内部 Codex 的工作单位定义成 delegated long-horizon task，而不是 single interaction：员工把一件长周期任务整体交出去，Agent 自己使用工具、文件与代码反复迭代，直到交出结果。(
        - link "OpenAI" [ref=f43e1440] [cursor=pointer]:
          - /url: https://openai.com/index/how-agents-are-transforming-work/
        - text: )
      - heading "OpenAI Presence：企业 Agent Operating Model" [level=3] [ref=f43e1441]
      - paragraph [ref=f43e1442]: 2026 年推出的 Presence 尤其值得注意，它的切入点不是 Workflow Designer，而是一个具体岗位：
      - generic [ref=f43e1443]: flowchart LR A["specific job"] --> B["knowledge"] B --> C["system access"] C --> D["permissions"] D --> E["policies"] E --> F["agent"] F --> G["escalation"] G --> H["human"]
      - paragraph [ref=f43e1444]:
        - text: 每个 Agent 都有明确的权限、工作范围、approval 与 escalation，典型场景是 billing、insurance claims 与 IT service request。(
        - link "OpenAI" [ref=f43e1445] [cursor=pointer]:
          - /url: https://openai.com/index/introducing-openai-presence/
        - text: )这已经非常接近金融机构需要的模型。
      - heading "Google：Agent Platform + Enterprise Governance" [level=3] [ref=f43e1446]
      - paragraph [ref=f43e1447]:
        - text: Google 2026 年提出的 Agentic Enterprise blueprint 是
        - code [ref=f43e1448]: Agent + Agent Platform + Orchestration + Governance + Enterprise Data
        - text: ，而不是
        - code [ref=f43e1449]: BPMN + LLM Node
        - text: 。Gemini Enterprise 被明确定义成 agent development + orchestration + governance 的一体化平台，并开始支持 long-running agents、agent collaboration spaces、advanced governance 与 agent marketplace。(
        - link "Google Cloud" [ref=f43e1450] [cursor=pointer]:
          - /url: https://cloud.google.com/blog/products/ai-machine-learning/the-new-gemini-enterprise-one-platform-for-agent-development
        - text: )（
        - link "Google Cloud" [ref=f43e1451] [cursor=pointer]:
          - /url: https://cloud.google.com/blog/products/ai-machine-learning/whats-new-in-gemini-enterprise
        - text: ）这说明大型企业平台厂商的竞争重点，正在从“谁有最好的 Agent Builder”转向谁能提供企业级 Agent Operating Environment。
      - heading "Snowflake：Data-native 的 Agent 平台" [level=3] [ref=f43e1452]
      - paragraph [ref=f43e1453]: Snowflake 的 Cortex Agents 架构已经非常清楚：
      - generic [ref=f43e1454]: flowchart TD CA[Cortex Agent] --> AN[Cortex Analyst] CA --> CS[Cortex Search] CA --> CD[Code] AN --> SD[Structured Data] CS --> UD[Unstructured Data] CD --> CP[Compute] SD --> RS[Reasoning] UD --> RS CP --> RS RS --> AC[Action]
      - paragraph [ref=f43e1455]:
        - text: 官方明确说 Cortex Agents 自己负责 reasoning、plan work、call tools、execute code、maintain threads 与 multi-step orchestration，客户不需要自建 orchestration loop / runtime / sandbox。(
        - link "Snowflake Documentation" [ref=f43e1456] [cursor=pointer]:
          - /url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents
        - text: ) 2026-08-28，Snowflake 进一步建议从 Cortex Analyst 迁移到 Cortex Agents，原因就是后者把 structured data、unstructured data、tool calling、thread context 与 multi-step orchestration 放进了同一个 Agent runtime。(
        - link "Snowflake Documentation" [ref=f43e1457] [cursor=pointer]:
          - /url: https://docs.snowflake.com/en/release-notes/2026/other/2026-08-28-cortex-analyst-transition-cortex-agents
        - text: )针对 Financial Services，它的主张不是“做一个金融 Agent”，而是把
        - code [ref=f43e1458]: first-party data + third-party data + semantic layer + search + agent + action
        - text: 组合起来，通过 Cortex Analyst、Cortex Search、Shared Semantic Views、Knowledge Extensions 与 Cortex Agents，让 Agent 在数据所在的位置执行 workflow。(
        - link "Snowflake" [ref=f43e1459] [cursor=pointer]:
          - /url: https://www.snowflake.com/en/blog/agentic-orchestration-financial-services/
        - text: )这对银行、资产管理、保险特别重要。
      - heading "一个必须写清楚的区分" [level=3] [ref=f43e1460]
      - paragraph [ref=f43e1461]:
        - text: Snowflake 的 Cortex Agents 确实提供 reasoning、planning、tool calling 与 multi-step orchestration。(
        - link "Snowflake Documentation" [ref=f43e1462] [cursor=pointer]:
          - /url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents
        - text: )但这里必须写清楚一句话，否则很容易被误读：Cortex Agents 的“workflow / orchestration”是 Agent 内部的任务编排，不等同于金融企业的 BPMN Business Process orchestration。它不替代 Camunda 这类流程引擎，也不承担流程状态、跨部门审批与责任归属。两者是上下游关系：流程引擎决定“这一步该做合规审查”，Cortex Agents 负责“在这次合规审查里把数据查清楚”。
      - heading "9. 领域三 · Durable Execution（Temporal / Durable Task）" [level=2] [ref=f43e1463]
      - paragraph [ref=f43e1464]: Temporal 的思路甚至更激进：
      - generic [ref=f43e1465]: flowchart TD W[Workflow] --> A1[Activity → LLM] W --> A2[Activity → Tool] W --> A3[Activity → Database] W --> A4[Activity → API]
      - paragraph [ref=f43e1466]: Workflow 本身负责：
      - generic [ref=f43e1467]: flowchart TD A["state"] B["ordering"] C["waiting"] D["retry"] E["timeout"] F["resume"]
      - paragraph [ref=f43e1468]:
        - text: 所有 nondeterministic I/O 都放在 Activity。Temporal 最近专门发布了 AI Agent Reference Architecture，把 Agent 的 loop 放进 durable Workflow 中。(
        - link "Temporal" [ref=f43e1469] [cursor=pointer]:
          - /url: https://go.temporal.io/platform-hub/ai-engineering/ai-reference-architecture
        - text: )所以它实际上把 Agent 是 intelligence 和 Workflow 是 durable execution 彻底分开了，这个分离很合理。
      - heading "为什么这一层必须单独存在" [level=3] [ref=f43e1470]
      - paragraph [ref=f43e1471]:
        - text: Microsoft 的 Durable Extension 也属于这一层：Agent Framework 的 graph workflow 跑在 Durable Task 基础设施上，支持 checkpoint、resume，以及数天到数周的运行周期。(
        - link "Microsoft Learn" [ref=f43e1472] [cursor=pointer]:
          - /url: https://learn.microsoft.com/en-us/agent-framework/integrations/durable-extension
        - text: )把 Durable Execution 与 Agent Workflow 分开的理由，是它们的失败模式不同：
      - generic [ref=f43e1473]: flowchart TD A["Agent Workflow 失败：Agent 选了错误的工具，或推理方向错了"] B["Durable Execution 失败：进程崩了、网络断了，执行无法恢复到崩溃前的状态"]
      - paragraph [ref=f43e1474]: 前者是决策质量问题，后者是执行可靠性问题。用同一个组件同时解决两者，最后通常两边都做不好——因为一个需要灵活重规划，另一个需要严格可重放。
      - heading "10. 领域四 · Enterprise Semantic & Data Layer" [level=2] [ref=f43e1475]
      - paragraph [ref=f43e1476]: 前三个领域都在回答“Agent 怎么工作”，这一个回答的是另一个问题：Agent 面对的世界，是用什么语言描述的？
      - heading "Agent 到底应该连接什么" [level=3] [ref=f43e1477]
      - paragraph [ref=f43e1478]: 因为 Palantir 其实回答了一个很关键的问题：Agent 到底应该连接什么？Palantir 的答案不是：
      - generic [ref=f43e1479]: flowchart TD A["Agent"] --> B["1000 API"]
      - paragraph [ref=f43e1480]: 而是：
      - generic [ref=f43e1481]: flowchart TD A["Enterprise Ontology"]
      - paragraph [ref=f43e1482]: Ontology 把企业世界建模成：
      - generic [ref=f43e1483]: flowchart TD A["Objects"] B["Properties"] C["Links"] D["Actions"] E["Logic"] F["Security"]
      - paragraph [ref=f43e1484]:
        - text: 官方把它概括成 Data + Logic + Action + Security。(
        - link "Palantir" [ref=f43e1485] [cursor=pointer]:
          - /url: https://www.palantir.com/docs/foundry/architecture-center/ontology-system
        - text: )更形象一点：
      - generic [ref=f43e1486]: flowchart TD ON[Ontology] --> CO[Company] CO --> IN[Investor] CO --> SE[Security] IN --> TR[Transaction] SE --> TR TR --> AC[Actions]
      - paragraph [ref=f43e1487]: 所以 Agent 看到的不是：
      - generic [ref=f43e1488]: flowchart TD A["table"] B["table"] C["API"] D["API"] E["PDF"] F["database"]
      - paragraph [ref=f43e1489]: 而是：
      - generic [ref=f43e1490]: flowchart TD A["Company"] B["Portfolio"] C["Position"] D["Transaction"] E["Risk"] F["Counterparty"] G["ResearchReport"]
      - paragraph [ref=f43e1491]: 并且这些对象自带：
      - generic [ref=f43e1492]: flowchart TD A["actions"] B["logic"] C["permissions"] D["relationships"]
      - heading "Action 模型：nouns 与 verbs" [level=3] [ref=f43e1493]
      - paragraph [ref=f43e1494]:
        - text: Palantir 有一个很值得重视的思想：数据只是“nouns”，Action 才是“verbs”。也就是说，Company、Position、Loan、Customer、Transaction 这些是 nouns，而 Approve、Reject、Rebalance、Create、Assign、Escalate、Freeze、Review 这些才是 verbs。(
        - link "Palantir" [ref=f43e1495] [cursor=pointer]:
          - /url: https://www.palantir.com/docs/foundry/ontology/why-ontology
        - text: )这恰好解决 Agent 最大的问题：Agent 不只需要知道“这个东西是什么”，还需要知道“对它允许做什么”。
      - heading "Ontology 与 RAG 的差别：world model + action model" [level=3] [ref=f43e1496]
      - paragraph [ref=f43e1497]: 传统：
      - generic [ref=f43e1498]: flowchart TD A["RAG"] --> B["document"] B --> C["answer"]
      - paragraph [ref=f43e1499]: Ontology：
      - generic [ref=f43e1500]: flowchart TD ON[Ontology] --> DA[Data] ON --> LO[Logic] ON --> AC[Action] DA --> SE[Security] LO --> SE AC --> SE SE --> AG[Agent] AG --> RA[Real Action]
      - paragraph [ref=f43e1501]: 从架构角度看，它更接近 Agent 的 enterprise world model + action model，而不是一个 Vector DB。（这是本文的架构解读，不是 Palantir 的官方定义。）
      - heading "Ontology MCP：把语义层变成 Agent 的 substrate" [level=3] [ref=f43e1502]
      - paragraph [ref=f43e1503]: 这一步尤其重要。2026-06 Palantir 已经正式 GA Ontology MCP。意味着：
      - generic [ref=f43e1504]: flowchart TD A["Claude"] B["OpenAI"] C["Gemini"] D["Microsoft Agent Framework"] E["Google ADK"]
      - paragraph [ref=f43e1505]:
        - text: 这些产品本身都支持 MCP，因此任何兼容 MCP 的 Agent / Agent Framework 都可以通过 MCP 做 read Ontology、write Ontology 和 execute Ontology actions，而且调用继续使用 Foundry 权限模型。(
        - link "Palantir" [ref=f43e1506] [cursor=pointer]:
          - /url: https://www.palantir.com/docs/foundry/announcements/2026-06
        - text: )换句话说，Ontology 不需要成为 Agent Framework，它变成 Agent 的 enterprise semantic/action substrate，这比“Palantir 自己做 Agent Framework”更重要。
      - heading "AIP Logic：No-code 没有死，但不再是抽象核心" [level=3] [ref=f43e1507]
      - paragraph [ref=f43e1508]:
        - text: AIP Logic 仍然是 no-code。它可以做 Ontology Object 到 LLM 再到 Condition、Loop、Function 和 Action 的串联，并且支持 testing、evaluation、monitoring、automation 和 human review。(
        - link "Palantir" [ref=f43e1509] [cursor=pointer]:
          - /url: https://www.palantir.com/docs/foundry/logic
        - text: )所以 Palantir 的实际答案不是“No-code 已死”，而是 No-code 不能再是整个系统的抽象，它只是 Ontology / Logic / Action 上面的一个 builder，这个区别直接决定后面怎么搭。
      - heading "Snowflake 的另一条变化：RAG 走向“分析型检索”" [level=3] [ref=f43e1510]
      - paragraph [ref=f43e1511]: 2026 年 Snowflake 推出了 Analytical Search。传统 RAG 是 question 到 top-k documents 再到 LLM，对于“10000 份财报中，有多少家公司……”这类问题其实不行。Snowflake 的新方向是 Agent 调度 multiple Search queries、metadata filters、AISQL、AI_FILTER、AI_AGG，最后 aggregate entire corpus：
      - generic [ref=f43e1512]: flowchart TD A["Agent"] --> B["multiple Search queries"] B --> C["metadata filters"] C --> D["AISQL"] D --> E["AI_FILTER"] E --> F["AI_AGG"] F --> G["aggregate entire corpus"]
      - paragraph [ref=f43e1513]:
        - text: 也就是说，Agent 不只是“找资料”，而是能够调度一套数据处理 workflow。(
        - link "Snowflake Documentation" [ref=f43e1514] [cursor=pointer]:
          - /url: https://docs.snowflake.com/en/release-notes/2026/other/2026-06-30-analytical-search-public-preview
        - text: )这个对金融 research、compliance、credit、ESG 很实用。
      - heading "11. 学术界：Agent Workflow 已经成为一等研究对象" [level=2] [ref=f43e1515]
      - paragraph [ref=f43e1516]: 厂商文档之外，还有一个更值得看的信号：研究界已经不再把 Agent 看成“一个 LLM 加几个工具”，而是把 Agent Workflow 本身当成研究对象。这条线上有几篇值得当作入口的论文。
      - heading "1. 《A Survey on Agent Workflow — Status and Future》" [level=3] [ref=f43e1517]
      - paragraph [ref=f43e1518]:
        - text: 这是目前比较值得当作入口的 survey。论文把 Agent Workflow 按两个维度分类：功能上分 planning、多 Agent、API、tool、memory，架构上分 agent role、orchestration flow、workflow specification。它明确指出，随着 Agent 系统变复杂，workflow/orchestration 已经成为 scalable / controllable / secure agent behavior 的核心基础设施，同时指出标准化、安全和多模态 integration 仍是开放问题。(
        - link "arXiv" [ref=f43e1519] [cursor=pointer]:
          - /url: https://arxiv.org/abs/2508.01186
        - text: )这意味着一个很重要的判断：Workflow 不会消失，只是在从“业务流程建模”变成“智能执行系统建模”，这点很容易被企业架构师忽视。
      - heading "2. 《Architectural Implications of Agentic AI Workflows》" [level=3] [ref=f43e1520]
      - paragraph [ref=f43e1521]: 2026 年 8 月的研究直接分析 Agentic Workflow 对底层基础设施的影响，核心发现很有意思：
      - generic [ref=f43e1522]: flowchart TD RQ[Agent Request] --> L1[LLM inference] L1 --> T1[Tool call] T1 --> CPU[CPU execution] CPU --> L2[LLM inference] L2 --> T2[Tool call] T2 -->|repeat| L1
      - paragraph [ref=f43e1523]: Agent 不是传统 ML 那种 input → GPU → output，而是 CPU、GPU、network、external systems、orchestration 不断交替：
      - generic [ref=f43e1524]: flowchart TD A["CPU"] B["GPU"] C["network"] D["external systems"] E["orchestration"] F["CPU"] G["GPU"] H["..."]
      - paragraph [ref=f43e1525]:
        - text: 不断交替。结果就是 CPU/GPU 利用率不均衡，execution bursty，tool invocation 造成 CPU critical path，multi-agent 增加调度复杂度，heterogeneous workloads 使传统 server provisioning 变得低效。论文甚至做了专门的 Agentic Server 原型 Agora。(
        - link "arXiv" [ref=f43e1526] [cursor=pointer]:
          - /url: https://arxiv.org/abs/2608.04458
        - text: )这其实说明 Agent Runtime 最终可能会成为一种全新的计算运行时，而不只是 Python framework。
      - heading "Workflow 定义本身也在 AI 化" [level=3] [ref=f43e1527]
      - paragraph [ref=f43e1528]: 以前是 Developer 设计 Workflow 再部署：
      - generic [ref=f43e1529]: flowchart TD A["Developer"] --> B["设计 Workflow"] B --> C["部署"]
      - paragraph [ref=f43e1530]: 以后可能是 Business Intent 经由 Agent / Compiler，结合 Execution Policy 生成 Generated Plan 再交由 Runtime 执行：
      - generic [ref=f43e1531]: flowchart TD A["Business Intent"] --> B["Agent / Compiler"] B --> C["Execution Policy"] C --> D["Generated Plan"] D --> E["Runtime"]
      - paragraph [ref=f43e1532]:
        - text: 也就是说，Workflow 从“静态 artifact”变成“动态 execution artifact”。最近研究也开始直接研究 Agentic Workflow Generation，也就是从功能描述自动生成可执行 workflow，而研究结果同时指出：单纯让 LLM 生成流程很容易产生缺失/幻觉数据，因此真正可靠的方向是生成 + 约束 + runtime validation，而不是“让 LLM 随便画流程”。(
        - link "Springer Nature Link" [ref=f43e1533] [cursor=pointer]:
          - /url: https://link.springer.com/article/10.1365/s40702-026-01299-4
        - text: )
      - heading "甚至“Workflow”这个词都可能被弱化" [level=3] [ref=f43e1534]
      - paragraph [ref=f43e1535]:
        - text: 未来更准确的词可能是 Agent Runtime、Agent Execution 或 Task Orchestration，而不是 Workflow Engine。在这个基础上，把 Agent 平台抽象成“Agent Operating System”是一个值得关注的研究方向——需要说明的是，它目前仍然只是研究提案，不是已经被行业标准化的架构。一个 2026 年的代表性工作提出 Agent Operating System (AOS)，把系统分成 Control & Governance Plane 与 Runtime & Coordination Plane：前者负责 intent、policy、authority、trust、audit 与 human oversight，后者负责 agent lifecycle、workflow coordination、model/tool routing、memory、scheduling 与 runtime assurance。(
        - link "arXiv" [ref=f43e1536] [cursor=pointer]:
          - /url: https://arxiv.org/abs/2608.03214
        - text: )值得关注的原因不是这个词，而是它把“控制面”与“运行面”分开的方式，与本文后面的分层判断一致。
      - heading "12. 阶段结论：四个领域怎么组合" [level=2] [ref=f43e1537]
      - paragraph [ref=f43e1538]: 到这里可以看到一个比较清楚的分工：
      - table [ref=f43e1539]:
        - rowgroup [ref=f43e1540]:
          - row [ref=f43e1541]:
            - columnheader "主体" [ref=f43e1542]
            - columnheader "解决的问题" [ref=f43e1543]
        - rowgroup [ref=f43e1544]:
          - row [ref=f43e1545]:
            - cell "Palantir Ontology" [ref=f43e1546]
            - cell "解决：世界是什么、能对世界做什么" [ref=f43e1547]
          - row [ref=f43e1548]:
            - cell "Anthropic / OpenAI" [ref=f43e1549]
            - cell "解决：Agent 如何工作（Harness）" [ref=f43e1550]
          - row [ref=f43e1551]:
            - cell "Microsoft / Temporal" [ref=f43e1552]
            - cell "解决：Agent 如何可靠地长期运行" [ref=f43e1553]
          - row [ref=f43e1554]:
            - cell "Snowflake / Google" [ref=f43e1555]
            - cell "解决：Agent 如何在企业数据与语义边界内工作" [ref=f43e1556]
          - row [ref=f43e1557]:
            - cell "Policy / Governance" [ref=f43e1558]
            - cell "解决：Agent 到底有没有资格做这件事" [ref=f43e1559]
      - paragraph [ref=f43e1560]: 这五块拼起来，才接近所谓的 AI-native enterprise workflow。但这里必须停一下，因为上面的材料对不同的目标会给出相反的答案。它既能支持“BPMN 该退休”，也能支持“BPMN 是合同层”。问题不在材料，在于目标没有定清楚：我们讨论的到底是 Agent Platform，还是企业业务流程？
      - heading "Layer 1：Business Process" [level=3] [ref=f43e1561]
      - paragraph [ref=f43e1562]: 这个可以继续使用：
      - generic [ref=f43e1563]: flowchart TB A["BPMN"] B["Camunda"] C["Fluxnova"] D["SAP workflow"] E["ServiceNow"]
      - paragraph [ref=f43e1564]: 解决合规、审批、SLA、责任、审计和跨部门流程。例如：
      - generic [ref=f43e1565]: flowchart TD A["开户"] --> B["KYC"] B --> C["Risk"] C --> D["Approval"] D --> E["Account Creation"]
      - heading "Layer 2：Agentic Workflow" [level=3] [ref=f43e1566]
      - paragraph [ref=f43e1567]: 这完全不同。例如：
      - generic [ref=f43e1568]: "flowchart TD G[\"Goal: determine whether this company is investable\"] --> A[Research Agent] A --> S1[Search] A --> S2[Read] A --> S3[Compare] A --> S4[Calculate] A --> S5[Ask specialist] A --> S6[Re-plan] A --> S7[Verify]"
      - paragraph [ref=f43e1569]: 这套能力由 Agent Framework、Execution Runtime、Policy、Memory、Tool Runtime 和 Durable State 实现：
      - generic [ref=f43e1570]: flowchart TB A["Agent Framework"] B["Execution Runtime"] C["Policy"] D["Memory"] E["Tool Runtime"] F["Durable State"]
      - heading "分开看：对 Agent Platform，与对企业业务流程" [level=3] [ref=f43e1571]
      - table [ref=f43e1572]:
        - rowgroup [ref=f43e1573]:
          - row [ref=f43e1574]:
            - columnheader "传统方式" [ref=f43e1575]
            - columnheader "Agent 时代对应物" [ref=f43e1576]
        - rowgroup [ref=f43e1577]:
          - row [ref=f43e1578]:
            - cell "BPMN Process" [ref=f43e1579]
            - cell "Execution Policy / Task Model" [ref=f43e1580]
          - row [ref=f43e1581]:
            - cell "Gateway" [ref=f43e1582]
            - cell "Policy / Agent Decision" [ref=f43e1583]
          - row [ref=f43e1584]:
            - cell "Service Task" [ref=f43e1585]
            - cell "Tool" [ref=f43e1586]
          - row [ref=f43e1587]:
            - cell "Sub-process" [ref=f43e1588]
            - cell "Agent / Sub-agent" [ref=f43e1589]
          - row [ref=f43e1590]:
            - cell "Human Task" [ref=f43e1591]
            - cell "Human-in-the-loop" [ref=f43e1592]
          - row [ref=f43e1593]:
            - cell "Process Variable" [ref=f43e1594]
            - cell "Durable State" [ref=f43e1595]
          - row [ref=f43e1596]:
            - cell "Process Instance" [ref=f43e1597]
            - cell "Agent Run" [ref=f43e1598]
          - row [ref=f43e1599]:
            - cell "BPMN Engine" [ref=f43e1600]
            - cell "Agent Execution Runtime" [ref=f43e1601]
          - row [ref=f43e1602]:
            - cell "DMN" [ref=f43e1603]
            - cell "Policy / Rules Engine" [ref=f43e1604]
          - row [ref=f43e1605]:
            - cell "Process Monitor" [ref=f43e1606]
            - cell "Agent Observability" [ref=f43e1607]
          - row [ref=f43e1608]:
            - cell "Process History" [ref=f43e1609]
            - cell "Event / Trace" [ref=f43e1610]
          - row [ref=f43e1611]:
            - cell "Workflow Designer" [ref=f43e1612]
            - cell "Code / DSL / AI-generated Plan" [ref=f43e1613]
          - row [ref=f43e1614]:
            - cell "Static Flow" [ref=f43e1615]
            - cell "Dynamic Execution Plan" [ref=f43e1616]
      - paragraph [ref=f43e1617]: 由此可以给一个更精确的说法。一种常见的表述是“老的那套 Camunda / Fluxnova，甚至所谓 Low-code 产品，都不该再用”，这个判断要分两种情况看。
      - heading [level=3] [ref=f43e1618]:
        - text: 对
        - strong [ref=f43e1619]: Agent Platform 本身
        - text: ，基本正确。
      - paragraph [ref=f43e1620]:
        - text: 不要把
        - code [ref=f43e1621]: Camunda / Fluxnova / BPMN
        - text: 当成核心抽象。
      - heading [level=3] [ref=f43e1622]:
        - text: 对
        - strong [ref=f43e1623]: Enterprise Business Process
        - text: ，则不正确。
      - paragraph [ref=f43e1624]: BPMN 这些东西仍然很有价值，因为法律责任、合规、审批、SLA、审计、跨系统 transaction 和 human accountability 并不会因为 LLM 出现就消失。所以真正可行的架构是下面这一层组合，前两种做法都不行：
      - blockquote [ref=f43e1625]:
        - paragraph [ref=f43e1626]: Business Process Layer + Agent Execution Layer
      - paragraph [ref=f43e1627]:
        - text: 两者之间通过
        - code [ref=f43e1628]: typed task / events / policy / authority / durable state
        - text: 连接。
      - heading "从零设计一个 Agent Platform 时，应该先建什么" [level=3] [ref=f43e1629]
      - paragraph [ref=f43e1630]: 第一步不该是建 Workflow Designer，而应该先建这 7 样东西：
      - generic [ref=f43e1631]: flowchart TB A["1. Agent Runtime"] B["2. Durable Execution Runtime"] C["3. Tool / MCP Gateway"] D["4. Policy & Authority Engine"] E["5. Context / Memory Runtime"] F["6. Human Task Runtime"] G["7. Trace / Evaluation / Audit"]
      - paragraph [ref=f43e1632]:
        - text: 然后再决定哪些地方需要 BPMN，哪些地方需要 Graph，哪些地方完全由 Agent 动态决定。先选 Camunda 再想办法把 Agent 塞进去，顺序就反了，这才是真正的 AI-native workflow architecture。另外，Google、Microsoft、LangGraph、Temporal 当前都在把 workflow 做成 code/runtime-first 的 graph + state + durable execution，而不是继续强化传统“业务人员拖节点”的范式；这已经不是单个厂商的偶然选择。(
        - link "GitHub" [ref=f43e1633] [cursor=pointer]:
          - /url: https://github.com/google/adk-docs/blob/main/docs/2.0/index.md
        - text: )把这个结论落到 “内部 LangChain DeepAgents + AWS AgentCore + LangSmith 的 AI 能力平台” 上，下一步最值得做的是设计一套 Agent Runtime / Execution Runtime / Business Process 三层架构，并把 Temporal、AgentCore、LangGraph、Microsoft Agent Framework、Camunda/Fluxnova 放进去逐项对比。这样才能比较清楚地判断一家平台到底应该自己做什么、买什么、哪些东西根本不该引入。把范围从厂商文档扩大到四类证据——学术研究、模型厂商实践、企业 AI 平台、金融机构与监管机构的实践——结论会更完整：2026 年真正成熟的方向，不是“把 BPMN 换成 Agent”，而是把 Workflow 拆成“Agentic Decisioning + Durable Execution + Policy/Authority + Enterprise Ontology/Data + Evaluation”。对通用 Agent 平台而言，传统 Workflow 仍然存在，但它越来越像受约束的外围控制面，而不是平台的核心抽象。
      - paragraph [ref=f43e1634]: 下面这张地图，覆盖的是这五块各自最值得追的线索。其中真正有前景的企业平台，大概率会把它们组合：
      - generic [ref=f43e1635]: flowchart TD HA[Agent Harness] --> AO[Agent Orchestration] AO --> DR[Durable Runtime] DR --> ON[Ontology] DR --> DA[Data] DR --> TO[Tools] ON --> PI[Policy / Identity] DA --> PI TO --> PI PI --> HC[Human Control] HC --> AE[Audit / Evaluation]
      - heading "趋势阶段的金融分层" [level=3] [ref=f43e1636]
      - paragraph [ref=f43e1637]:
        - text: 趋势阶段常见的一种画法，是把 Experience、Agent、Control、Runtime、Semantic、Tools 六块并列展开。那张图不能算错，但它还没有回答本文真正关心的问题——业务状态归谁、Agent Task 的边界由谁定义。本文最终的主线架构（第 20 节）会把这两件事补上，因此这里不再重复贴图。只需要先记住其中一个判断：Ontology / Semantic Layer 和 Agent Runtime 是两个不同东西。Palantir 最强的是前者，AWS / Microsoft / OpenAI / Anthropic 最强的是后者，而 Snowflake 正在试图把
        - code [ref=f43e1638]: Data + Semantic + Agent Runtime
        - text: 放在一起。
      - heading "趋势阶段的结论" [level=3] [ref=f43e1639]
      - paragraph [ref=f43e1640]: 回到最开始那个判断：“老的 Camunda / Fluxnova，甚至所谓 Low-code，都不应该再用。”把论文与各家厂商、监管机构的材料串起来看之后，这个说法要修正得更精确。
      - heading "错误方向" [level=3] [ref=f43e1641]
      - paragraph [ref=f43e1642]: BPMN 到 LLM Node 再到 Agent 的串法：
      - generic [ref=f43e1643]: flowchart TD A["BPMN"] --> B["LLM Node"] B --> C["Agent"]
      - paragraph [ref=f43e1644]: 这确实不是最有前景的 Agent Platform 架构。
      - heading "同样错误" [level=3] [ref=f43e1645]
      - paragraph [ref=f43e1646]: User 到 Autonomous Agent 再到无限 Tool 直达 Enterprise 的做法：
      - generic [ref=f43e1647]: flowchart TD A["User"] --> B["Autonomous Agent"] B --> C["无限 Tool"] C --> D["Enterprise"]
      - paragraph [ref=f43e1648]: 金融领域尤其不可接受。
      - heading "更合理的 2026+ 模型" [level=3] [ref=f43e1649]
      - generic [ref=f43e1650]: flowchart TD GI[Goal / Intent] --> HA[Agent Harness] HA --> DP[Dynamic Planning] DP --> DR[Durable Agent Runtime] DR --> ON[Ontology] DR --> DA[Data] DR --> TO[Tools] ON --> PA[Policy / Authority] DA --> PA TO --> PA PA --> HAP[Human Approval] PA --> AU[Auto Execution] HAP --> EV[Evidence / Trace] AU --> EV EV --> EA[Evaluation / Audit]
      - paragraph [ref=f43e1651]: 对通用 Agent 平台而言，一句话概括：未来的 Workflow 不是“下一步去哪”，而是“Agent 为了完成 Goal，可以在什么边界内，以什么权限，持续做什么，并且如何被暂停、恢复、验证和追责”。而 Palantir Ontology 解决的是“世界是什么、能对世界做什么”；Anthropic/OpenAI Harness 解决的是“Agent 如何工作”；Microsoft/Temporal/AWS 解决的是“Agent 如何可靠地长期运行”；Snowflake/Google 解决的是“Agent 如何在企业数据与语义边界内工作”；Policy/Governance 则解决“Agent 到底有没有资格做这件事”。这五块拼起来，才比较接近 AI-native enterprise workflow。而金融服务真正应该研究的核心不是“哪个 Workflow Engine 最好”，而是：
      - blockquote [ref=f43e1652]:
        - paragraph [ref=f43e1653]: Agentic Decision + Enterprise Ontology + Durable Execution + Authority + Evidence
      - paragraph [ref=f43e1654]: 这比单纯讨论 Camunda、Temporal、LangGraph 谁替代谁，层次高一个级别。
      - heading "第三部分：金融为什么不能照搬" [level=1] [ref=f43e1655]
      - paragraph [ref=f43e1656]:
        - text: 第二部分介绍的四个领域，都是通用企业场景下的正确答案。金融场景多出来的主要不是技术难度，而是
        - strong [ref=f43e1657]: 举证责任
        - text: 。这一部分说明的是：金融到底额外要求了什么，以及这些要求如何反过来决定架构。
      - heading "13. 金融真正担心的问题：Verifiability Gap" [level=2] [ref=f43e1658]
      - paragraph [ref=f43e1659]:
        - text: 通用企业场景里，最常被讨论的问题是“Agent 够不够聪明”，金融业担心的则是 Agent 到底代表谁行动，这个问题在金融业特别严重。最新一篇关于 Agentic AI governance in FinTech 的研究提出了
        - strong [ref=f43e1660]: Verifiability Gap
        - text: ，也就是说：
      - generic [ref=f43e1661]: flowchart TD A["Agent Authority"] --> B["实际执行"] B --> C["能否证明：为什么当时允许它这么做？"]
      - paragraph [ref=f43e1662]: 这项研究把 orchestration 本身看作 policy layer，并指出以下几点：
      - list [ref=f43e1663]:
        - listitem [ref=f43e1664]: orchestration 本身是 policy layer
        - listitem [ref=f43e1665]: 不同 orchestration 结构会改变最终决策
        - listitem [ref=f43e1666]: historical replay 可能无法重现
        - listitem [ref=f43e1667]: model/version变化会改变结果
        - listitem [ref=f43e1668]:
          - text: deterministic replay 并不等于 historical decision replay (
          - link "arXiv" [ref=f43e1669] [cursor=pointer]:
            - /url: https://arxiv.org/abs/2608.11344
          - text: )
      - paragraph [ref=f43e1670]: 传统 Workflow：
      - generic [ref=f43e1671]: flowchart LR A["same input"] --> B["same BPMN"] B --> C["same path"]
      - paragraph [ref=f43e1672]: Agent：
      - generic [ref=f43e1673]: flowchart LR A["same input"] --> B["different reasoning"] B --> C["different tools"] C --> D["different context"] D --> E["different outcome"]
      - paragraph [ref=f43e1674]: 所以：
      - blockquote [ref=f43e1675]:
        - paragraph [ref=f43e1676]: Agent Workflow 的审计对象不能只是“流程图”，而必须是 Execution Trace + Context + Authority + Evidence。
      - heading "14. 监管机构在看什么" [level=2] [ref=f43e1677]
      - heading "Bank of England" [level=3] [ref=f43e1678]
      - paragraph [ref=f43e1679]:
        - text: 2026 年 Financial Stability Report 已经专门讨论 Agentic AI，其中提到目前金融机构主要使用 Agent 做 research、coding、surveillance 和 lower-risk operations，而不是 autonomous trading。核心风险在于 output 不可预测、validation 困难、autonomy boundary 难定义，以及 correlated behavior (
        - link "Bank of England" [ref=f43e1680] [cursor=pointer]:
          - /url: https://www.bankofengland.co.uk/financial-stability-report/2026/july-2026
        - text: )。
      - heading "FSB 2026：12 类 sound practices" [level=3] [ref=f43e1681]
      - paragraph [ref=f43e1682]:
        - text: Financial Stability Board 2026 年 AI governance consultation 提出了 12 类 sound practices，覆盖 AI governance、lifecycle management、risk identification、operational resilience、third-party dependence，以及 GenAI / agentic AI risks (
        - link "Financial Stability Board" [ref=f43e1683] [cursor=pointer]:
          - /url: https://www.fsb.org/2026/06/sound-practices-for-responsible-adoption-of-artificial-intelligence-ai-consultation-report/
        - text: )。这说明金融监管未来看 Agent，除了 model risk，还要看：
      - generic [ref=f43e1684]: flowchart TB A["Model"] B["Agent"] C["Tool"] D["Data"] E["Permission"] F["Runtime"] G["Vendor"] H["Human Oversight"]
      - heading "15. 已经跑在生产上的样本：Stripe 与 AWS" [level=2] [ref=f43e1685]
      - heading "Stripe" [level=3] [ref=f43e1686]
      - paragraph [ref=f43e1687]: AWS 与 Stripe 2026 年公开的案例很有参考价值，场景如下：
      - generic [ref=f43e1688]: flowchart LR A["金融合规 review"]
      - paragraph [ref=f43e1689]: Stripe 面临：
      - generic [ref=f43e1690]: flowchart LR A["thousands of transactions / day"]
      - paragraph [ref=f43e1691]: 它搭建 production agent system：
      - generic [ref=f43e1692]: flowchart TD A["Agent"] --> B["AWS Bedrock"] B --> C["enterprise data"] C --> D["compliance reasoning"] D --> E["human review"]
      - paragraph [ref=f43e1693]: 公开结果如下：
      - list [ref=f43e1694]:
        - listitem [ref=f43e1695]: review handling time ↓ 26%
        - listitem [ref=f43e1696]: helpfulness >96%
        - listitem [ref=f43e1697]:
          - text: final decision 仍由 human 控制 (
          - link "Amazon Web Services, Inc." [ref=f43e1698] [cursor=pointer]:
            - /url: https://aws.amazon.com/blogs/machine-learning/production-grade-ai-agents-for-financial-compliance-lessons-from-stripe/
          - text: )
      - paragraph [ref=f43e1699]: Stripe 并没有让 Agent 直接取代 Compliance Officer，它真正做的是：
      - generic [ref=f43e1700]: flowchart TB A["Agent = investigation / preparation"] B["Human = decision authority"]
      - paragraph [ref=f43e1701]: 这是当前金融服务中较容易同时满足治理、审计与责任要求的一种落地模式。把它写成“未来几年的主流架构”属于过度推断——监管材料描述的是当前的风险与实践，不足以证明未来的主流形态。
      - heading "AWS 的金融 Agent 参考架构" [level=3] [ref=f43e1702]
      - paragraph [ref=f43e1703]: AWS 2026 年的 Financial Services AgentCore 架构如下：
      - generic [ref=f43e1704]: flowchart TD A[Agent] --> MA[Market Agent] A --> RA[Risk Agent] A --> RE[Research Agent] MA --> OR[Orchestrator] RA --> OR RE --> OR OR --> RT[AgentCore Runtime] RT --> ID[Identity] RT --> TR[Tracing] RT --> SB[Sandbox] ID --> PO[Policy]
      - paragraph [ref=f43e1705]:
        - text: 例如 portfolio advisory 包括 portfolio valuation、risk stress test、market research 和 advisor synthesis，由多个 specialist agents 协同完成。(
        - link "Amazon Web Services, Inc." [ref=f43e1706] [cursor=pointer]:
          - /url: https://aws.amazon.com/blogs/industries/multi-agent-systems-for-financial-services-on-amazon-eks-and-agentcore/
        - text: )
      - paragraph [ref=f43e1707]: 而信用分析案例则是：
      - generic [ref=f43e1708]: flowchart TB A["Policy PDF"] B["Snowflake account history"] C["transaction patterns"] D["Agent reasoning"] E["recommendation"]
      - paragraph [ref=f43e1709]:
        - text: 这非常接近企业真正的 Agent Workflow。(
        - link "Amazon Web Services, Inc." [ref=f43e1710] [cursor=pointer]:
          - /url: https://aws.amazon.com/blogs/industries/ai-credit-analytics-across-amazon-s3-and-snowflake-with-amazon-bedrock-agentcore/
        - text: )
      - heading "16. 金融 Model Risk Management 里的 Agentic Workflow" [level=2] [ref=f43e1711]
      - paragraph [ref=f43e1712]: 这一节看金融领域的实证研究。它们没有停在“客服 Agent”这类演示场景上，而是直接落在信贷、反欺诈和模型风险管理上——比通用的 Agent 案例更接近企业真正的问题。2026 年有一篇比较完整的 survey 覆盖了以下方面：
      - 'heading "Agentic Artificial Intelligence in Finance: A Comprehensive Survey" [level=3] [ref=f43e1713]'
      - paragraph [ref=f43e1714]:
        - text: 涵盖 financial operations、financial markets、architecture、regulation、systemic risk 和 multi-agent coordination (
        - link "arXiv" [ref=f43e1715] [cursor=pointer]:
          - /url: https://arxiv.org/abs/2604.21672
        - text: )。
      - paragraph [ref=f43e1716]: 另外一篇论文的内容如下：
      - heading "AI Agents in Financial Markets" [level=3] [ref=f43e1717]
      - paragraph [ref=f43e1718]: 它把金融 Agent 拆成以下结构：
      - generic [ref=f43e1719]: flowchart TD A["Data Perception"] --> B["Reasoning"] B --> C["Strategy Generation"] C --> D["Execution + Control"]
      - paragraph [ref=f43e1720]: 它的结论是短期最可能的形态不是 fully autonomous finance，而是 bounded autonomy，即：
      - generic [ref=f43e1721]: flowchart TB A["AI"] B["human supervision"] C["constrained execution"]
      - paragraph [ref=f43e1722]:
        - text: 这对企业架构有直接影响。(
        - link "arXiv" [ref=f43e1723] [cursor=pointer]:
          - /url: https://arxiv.org/abs/2603.13942
        - text: )
      - paragraph [ref=f43e1724]: 另一项研究做了以下组合：
      - generic [ref=f43e1725]: flowchart TB A["Modeling Crew"] B["Model Risk Management Crew"]
      - paragraph [ref=f43e1726]: 例如：
      - generic [ref=f43e1727]: flowchart TD M[Manager Agent] --> E1[EDA Agent] M --> E2[Feature Agent] M --> E3[Model Selection Agent] M --> E4[Training Agent] M --> E5[Documentation Agent]
      - paragraph [ref=f43e1728]: 另一组：
      - generic [ref=f43e1729]: flowchart TD M[MRM Manager] --> A1[Compliance Agent] M --> A2[Replication Agent] M --> A3[Conceptual Soundness Agent] M --> A4[Outcome Analysis Agent]
      - paragraph [ref=f43e1730]:
        - text: 该研究在 fraud detection、credit approval 和 credit risk 中做了实验 (
        - link "arXiv" [ref=f43e1731] [cursor=pointer]:
          - /url: https://arxiv.org/abs/2502.05439
        - text: )，这比“客服 Agent”更接近企业真正的问题。
      - heading "17. 金融服务真正需要确定下来的六件事" [level=2] [ref=f43e1732]
      - paragraph [ref=f43e1733]: 把前三部分的材料压成六条，就得到金融服务对架构的硬约束。它们不是设计偏好，而是监管、责任和事故成本直接推导出来的结果。
      - table [ref=f43e1734]:
        - rowgroup [ref=f43e1735]:
          - row [ref=f43e1736]:
            - columnheader "#" [ref=f43e1737]
            - columnheader "约束" [ref=f43e1738]
            - columnheader "为什么" [ref=f43e1739]
            - columnheader "在架构上的落点" [ref=f43e1740]
        - rowgroup [ref=f43e1741]:
          - row [ref=f43e1742]:
            - cell "1" [ref=f43e1743]
            - cell "确定性" [ref=f43e1744]
            - cell "结论必须能从输入与规则推导出来" [ref=f43e1745]
            - cell "Workflow Runtime 持有状态转移" [ref=f43e1746]
          - row [ref=f43e1747]:
            - cell "2" [ref=f43e1748]
            - cell "责任" [ref=f43e1749]
            - cell "每个决策必须有人签字" [ref=f43e1750]
            - cell "Human Task + Identity" [ref=f43e1751]
          - row [ref=f43e1752]:
            - cell "3" [ref=f43e1753]
            - cell "审批" [ref=f43e1754]
            - cell "高风险动作不能自动生效" [ref=f43e1755]
            - cell "BPMN + Policy" [ref=f43e1756]
          - row [ref=f43e1757]:
            - cell "4" [ref=f43e1758]
            - cell "审计" [ref=f43e1759]
            - cell "事后必须能回答“谁做了什么”" [ref=f43e1760]
            - cell "Audit Trail" [ref=f43e1761]
          - row [ref=f43e1762]:
            - cell "5" [ref=f43e1763]
            - cell "授权" [ref=f43e1764]
            - cell "“能做”和“被允许做”是两件事" [ref=f43e1765]
            - cell "IAM + Agent Policy" [ref=f43e1766]
          - row [ref=f43e1767]:
            - cell "6" [ref=f43e1768]
            - cell "可追溯" [ref=f43e1769]
            - cell "结论与证据要对得上" [ref=f43e1770]
            - cell "Evidence + Agent Trace" [ref=f43e1771]
      - paragraph [ref=f43e1772]: 这六条之外，还有一条从 Verifiability Gap 直接推出来、但容易被低估的要求：可复现性（reproducibility）。传统的可复现假设是“同样输入 + 同一个流程版本 = 同样结果”，Agent 打破了这个假设：同样的输入，可能因为不同的检索结果、不同的上下文、不同的模型版本，得到不同的推理路径和结论。所以在金融场景下必须退一步，先明确自己能承诺哪一种复现：
      - generic [ref=f43e1773]: flowchart TB A1["Level A：完全可重放：同输入 + 同模型 + 同工具 + 同上下文快照"] --> A2["同结果"] %% 成本高，通常只用于高风险决策 B1["Level B：可复核：同业务事实快照 + 记录在案的规则版本 + 记录在案的 Agent 轨迹"] --> B2["人可以独立得出同一结论"] C["Level C：可解释：能说明结论的理由与证据来源，但不承诺独立复核能得出同一结论"]
      - paragraph [ref=f43e1774]:
        - text: 大多数业务应该按
        - strong [ref=f43e1775]: Level B
        - text: 设计，把 Level A 留给真正需要法律级举证的动作。这个决定必须在架构设计阶段做，事后基本补不上——因为它决定的是要不要保留业务事实快照、规则版本和完整 Agent 轨迹。等审计来问的时候再补，通常已经晚了。这六条约束加上可复现等级，就是后面架构设计的全部输入。
      - heading "金融领域可以借鉴的形态" [level=3] [ref=f43e1776]
      - paragraph [ref=f43e1777]: 金融领域可以借鉴的形态，同样不是把 Agent 放在整个流程之上，而是：
      - generic [ref=f43e1778]: flowchart TB User[Relationship Manager / Analyst] User --> Agent[Domain Agent] Agent --> Context[Financial Context Layer] Context --> Ontology[Business Ontology] Context --> Docs[Policies / Research / Documents] Context --> Data[Structured Data] Agent --> Planner[Dynamic Planning] Planner --> Runtime[Durable Agent Runtime] Runtime --> Policy[Policy / Authority] Runtime --> Tool[Tool Gateway] Runtime --> Human[Human Approval] Tool --> Core[Core Banking / Trading / CRM / Risk] Tool --> External[External Data Providers] Runtime --> Evidence[Evidence + Trace] Evidence --> Audit[Audit / MRM / Compliance]
      - heading "第四部分：主线架构" [level=1] [ref=f43e1779]
      - heading "18. 全文原则" [level=2] [ref=f43e1780]
      - paragraph [ref=f43e1781]: 前面十二节都是趋势观察。趋势观察的结论会随着“目标是什么”而改变：目标是通用 Agent 平台，还是金融企业的业务流程，答案可以完全相反。
      - paragraph [ref=f43e1782]: 从这一节开始，目标明确为后者：金融服务中确定性业务流程的落地架构。在这个前提下，前面那些材料会收敛出一条比两者都更窄、也更可执行的主线。
      - paragraph [ref=f43e1783]: 把“业务分析师能够把大部分流程梳理清楚”这个前提补上之后，前面的结论需要调整：对于金融服务，BPMN 不应该被淘汰。如果业务分析架构师能够把大部分业务流程、状态、审批关系、异常路径、职责边界都分析清楚，那么 BPMN/DMN 反而仍然是最合适的“业务控制平面”。真正要改的不是“有没有 Workflow”，而是分工：不要让 BPMN 承担 Agent 的智能行为，也不要让 Agent 取代 BPMN 的确定性业务控制。于是新的架构可以定义为：
      - blockquote [ref=f43e1784]:
        - paragraph [ref=f43e1785]: Deterministic Business Workflow + Bounded Agentic Execution
      - paragraph [ref=f43e1786]: 也就是：
      - generic [ref=f43e1787]: flowchart TB A["业务流程确定性"] B["Agent 局部智能化"] C["统一 Policy / Authority"] D["统一 Audit / Evidence"]
      - paragraph [ref=f43e1788]: 这实际上比“纯 Agent Workflow”更适合银行、保险、资管、证券。
      - heading "先定下一条原则" [level=3] [ref=f43e1789]
      - paragraph [ref=f43e1790]: 在展开这一部分之前，先把本文反复使用的那条原则定下来：
      - blockquote [ref=f43e1791]:
        - paragraph [ref=f43e1792]: 任何 Agent 驱动的业务动作，在产生业务状态变化或外部副作用之前，都必须经过确定性的 schema / business validation 与 authorization；是否需要 Human Approval，由 BPMN 与 Policy 按风险等级决定。
      - paragraph [ref=f43e1793]: 这句话里有三个从句，各自解决一个问题。“必须经过确定性验证”保证进入流程的不是一段自然语言，而是一个可校验的结构，这是后面 Task Contract 里 output schema 存在的理由。“必须经过 authorization”保证“Agent 有能力做”和“Agent 被允许做”永远是两件事，前者是模型能力问题，后者是治理问题。“是否人工批准由风险等级决定”避免两个极端：既不要求所有输出都过人工（那等于退回 Level 0，自动化失去意义），也不允许高风险动作走自动通道。后面第 34 节会说明，为什么这条原则必须同时覆盖“建议型输出”和“动作型输出”这两种 Task——只写一半，就会在评审时被抓出漏洞。
      - heading "19. 两类问题：业务怎么走，和某一步怎么完成" [level=2] [ref=f43e1794]
      - paragraph [ref=f43e1795]: 在这个场景下，整个系统可以拆成两个完全不同的问题：
      - heading "问题 A：业务应该怎么走？" [level=3] [ref=f43e1796]
      - paragraph [ref=f43e1797]: 由以下结构确定：
      - generic [ref=f43e1798]: flowchart TD A["Business Architect"] --> B["BPMN / DMN"] B --> C["Workflow Definition"]
      - paragraph [ref=f43e1799]: 包括状态、顺序、并行、条件、审批、角色、SLA、回退、异常、补偿和业务事件，这些尽量确定。
      - heading "问题 B：某一步里面具体怎么完成？" [level=3] [ref=f43e1800]
      - paragraph [ref=f43e1801]: 这里允许 Agent，例如：
      - generic [ref=f43e1802]: flowchart TD A["Compliance Review"] --> B["Agent：找政策<br/>找历史案例<br/>找相关文件<br/>检查证据<br/>总结风险<br/>提出建议"] B --> C["Human"] C --> D["Approve / Reject"]
      - paragraph [ref=f43e1803]: 因此，BPMN 决定“做什么、谁做、何时做、结果去哪”，Agent 决定“这一项任务怎么做得更好”，这是整个设计的边界所在。
      - heading "Workflow 管的是状态转移与业务责任" [level=3] [ref=f43e1804]
      - paragraph [ref=f43e1805]: 在前面那套分层里，有一个界定需要修正。原来是 Workflow 管 State + Action，在这个前提下，应该修正为 Workflow 管 State Transition + Business Responsibility，也就是：
      - generic [ref=f43e1806]: flowchart TD A["BPMN"] --> B["State"] B --> C["Task"] C --> D["Business Rule"] D --> E["Next State"]
      - paragraph [ref=f43e1807]: 而 Agent 是：
      - generic [ref=f43e1808]: flowchart TD A["Task"] --> B["Agent Execution"] B --> C["Structured Result"]
      - paragraph [ref=f43e1809]: Agent 不拥有 Workflow。
      - heading "20. 五层架构" [level=2] [ref=f43e1810]
      - paragraph [ref=f43e1811]: 把前面的分层和这里的约束合起来，得到本文的主线架构，也是全文唯一一张完整架构图。后面所有图都是它的局部展开。
      - generic [ref=f43e1812]: flowchart TB BA[Business Architect] subgraph BP["1. BUSINESS PROCESS PLANE"] BPMN[BPMN Process] DMN[DMN / Business Rules] SLA[SLA / Escalation] end subgraph WR["2. WORKFLOW RUNTIME"] Runtime[Process Runtime] State[Process Instance State] Task[Human / System / Agent Task] Event[Timer / Message / Event] end subgraph AG["3. AGENT EXECUTION PLANE"] Contract[Agent Task Contract] Harness[Agent Harness] Planning[Agent Planning] Context[Context / Knowledge] Tools[Tools / MCP] AgentState[Agent Task State] end subgraph DATA["4. DATA & SEMANTIC PLANE"] BusinessData[Business Data] Semantic[Semantic Layer] Ontology[Business Ontology] Docs[Documents / Knowledge] end subgraph CTRL["5. CONTROL PLANE"] IAM[Identity / Authorization] Policy[Agent Policy / Guardrails] Audit[Audit Trail] Evidence[Evidence] Eval[Evaluation] end BA --> BPMN BA --> DMN BPMN --> Runtime DMN --> Runtime SLA --> Runtime Runtime --> State Runtime --> Task Runtime --> Event Task --> Contract Contract --> Harness Contract --> Policy Harness --> Planning Harness --> Context Harness --> Tools Harness --> AgentState Context --> BusinessData Context --> Semantic Context --> Ontology Context --> Docs Tools --> IAM Tools --> Policy Harness --> Result[Structured Result] Result --> Valid[Validation] Valid --> AuthZ[Authorization] AuthZ --> Human[Human Approval] AuthZ --> Exec[Controlled Execution] Human --> Exec Exec --> Runtime Harness --> Evidence Harness --> Eval Runtime --> Audit
      - paragraph [ref=f43e1813]: 这张图里关键的关系是 Workflow Runtime 创建并控制 Agent Task，Agent Runtime 负责完成这个 Task，也就是第 29 节说的 Agent-in-Process。同样关键的是右下角那条回路：Agent 的输出必须先过 Validation 与 Authorization，再经过必要的人工批准，最后由 Workflow Runtime 落成状态转移。Agent 在这个回路里始终是提议方，不是决定方。
      - heading "五层各自回答什么" [level=3] [ref=f43e1814]
      - table [ref=f43e1815]:
        - rowgroup [ref=f43e1816]:
          - row [ref=f43e1817]:
            - columnheader "层" [ref=f43e1818]
            - columnheader "回答的问题" [ref=f43e1819]
            - columnheader "失败时的典型表现" [ref=f43e1820]
        - rowgroup [ref=f43e1821]:
          - row [ref=f43e1822]:
            - cell "1. Business Process Plane" [ref=f43e1823]
            - cell "流程应该怎么走" [ref=f43e1824]
            - cell "流程只存在于文档和人的记忆里" [ref=f43e1825]
          - row [ref=f43e1826]:
            - cell "2. Workflow Runtime" [ref=f43e1827]
            - cell "这个 case 现在在哪一步" [ref=f43e1828]
            - cell "状态散落在业务表里，没有人能统一回答" [ref=f43e1829]
          - row [ref=f43e1830]:
            - cell "3. Agent Execution Plane" [ref=f43e1831]
            - cell "这一步怎么完成" [ref=f43e1832]
