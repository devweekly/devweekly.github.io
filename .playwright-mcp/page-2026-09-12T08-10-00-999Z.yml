      - paragraph [ref=f43e1903]: 这样也不会再问“是不是 Agent 出现以后，BPMN 就过时了”，BPMN 并没有过时，变化的是职责划分。
      - heading "23. 责任矩阵" [level=2] [ref=f43e1904]
