      - heading "24. 五件容易混在一起的事" [level=2] [ref=f43e1964]
      - paragraph [ref=f43e1965]: “确定性”不等于“只有一张流程图”。在金融场景里，有五类判断，各自必须落在不同机制上。把它们合并成一句“业务规则和权限合同”，是架构评审里最常见的返工来源。
      - paragraph [ref=f43e1966]: 这里有一个必须先纠正的说法：Business Rule 和 Authorization Policy 不是同一类 policy。“投资金额超过 1 亿就需要高级审批”是业务规则，“这个角色有没有投资审批权”是授权。前者判断“条件是否成立”，后者判断“主体有没有资格”。两者都常被写成 policy 配置文件，但变更流程、评审人与举证对象完全不同——业务规则由业务方改，授权由安全与内控改。把两者放进同一套配置里管理，是金融场景里最容易埋下隐患的一种简化。
      - heading "BPMN：流程怎么走" [level=3] [ref=f43e1967]
      - generic [ref=f43e1968]: flowchart TB A["哪里需要审批"] B["什么条件下回到上一步"] C["哪一步可以并行"] D["什么时候结束"]
      - paragraph [ref=f43e1969]:
        - text: 它回答的是
        - strong [ref=f43e1970]: 状态转移
        - text: 。
      - heading "DMN / Business Rules：业务条件怎么判断" [level=3] [ref=f43e1971]
      - generic [ref=f43e1972]: flowchart LR A["investmentAmount大于100M"] --> B["seniorApprovalRequired"]
      - paragraph [ref=f43e1973]:
        - text: 它回答的是
        - strong [ref=f43e1974]: 条件是否成立
        - text: ，而且这个判断是可枚举、可回归测试的。
      - heading "Authorization / IAM：谁有权执行" [level=3] [ref=f43e1975]
      - generic [ref=f43e1976]: flowchart TB A["PM_ROLE"] B["Investment_Approval"] C["Portfolio_X"]
      - paragraph [ref=f43e1977]:
        - text: 它回答的是
        - strong [ref=f43e1978]: 主体资格
        - text: 。同一条流程，不同角色能按的按钮不一样，这是权限问题，不是规则问题。
      - heading "Agent Policy / Guardrails：Agent 可以调用什么" [level=3] [ref=f43e1979]
      - generic [ref=f43e1980]: "flowchart TB A[\"canRead: market_data, research_db\"] B[\"canWrite: draft_report\"] C[\"forbidden: customer_pii_export\"] D[\"maxBudget: { tokens: 100000, toolCalls: 50 }\"]"
      - paragraph [ref=f43e1981]:
        - text: 它回答的是
        - strong [ref=f43e1982]: 这个 Agent 的能力边界
        - text: ，与“这个人有没有资格批准”是两件事。
      - heading "Human Approval：什么风险必须由人承担" [level=3] [ref=f43e1983]
      - generic [ref=f43e1984]: flowchart LR A1["riskLevel GE HIGH"] --> B1["humanApprovalRequired"] A2["agentConfidence LT threshold"] --> B2["humanApprovalRequired"] A3["amount GT limit"] --> B3["humanApprovalRequired"]
      - paragraph [ref=f43e1985]:
        - text: 它回答的是
        - strong [ref=f43e1986]: 责任归属
        - text: ，前四类都是机制性的判断，只有这一类是把责任落到具体的人身上。金融机构做 Agent 立项时，真正需要业务方逐条签字确认的往往就是这张表，而不是流程图本身。
      - paragraph [ref=f43e1987]: 五者关系：
      - generic [ref=f43e1988]: flowchart LR BPMN["BPMN<br/>流程怎么走"] --> GATE["执行前的判定"] DMNL["DMN<br/>条件是否成立"] --> GATE AUTH["Authorization / IAM<br/>谁有权执行"] --> GATE APOL["Agent Policy<br/>Agent 能用什么"] --> GATE HAPL["Human Approval<br/>什么风险由人承担"] --> GATE GATE --> EXEC["执行 / 拒绝 / 转人工"]
      - paragraph [ref=f43e1989]: 金融场景里这五条不能合并，原因是审计时它们的举证对象不同：
      - list [ref=f43e1990]:
        - listitem [ref=f43e1991]: BPMN 举的是流程版本；
        - listitem [ref=f43e1992]: DMN 举的是规则版本与输入；
        - listitem [ref=f43e1993]: IAM 举的是主体与授权记录；
        - listitem [ref=f43e1994]: Agent Policy 举的是能力声明与实际调用日志；
        - listitem [ref=f43e1995]: Human Approval 举的是审批人身份与审批当时的判断依据。
      - paragraph [ref=f43e1996]: 混在一起，事故复盘时就无法归因——你只能证明“当时有这个流程”，但不能证明“当时这个动作是被允许的”，更不能证明“当时是谁承担的”。
      - heading "边界：哪些判断必须留给规则" [level=3] [ref=f43e1997]
      - paragraph [ref=f43e1998]: 这条边界应该画得很严，例如：
      - heading "适合 BPMN/DMN" [level=3] [ref=f43e1999]
      - generic [ref=f43e2000]: flowchart LR A["Investment amount > 100M"] --> B["Senior PM approval"] C["High-risk country"] --> D["Compliance mandatory"] E["Product type = Derivative"] --> F["Risk review mandatory"]
      - paragraph [ref=f43e2001]: 这些全部是确定性的。
      - heading "适合 Agent" [level=3] [ref=f43e2002]
      - generic [ref=f43e2003]: flowchart TB A["这个公司披露的信息有没有前后矛盾？"] B["这份研究报告是否遗漏了重要风险？"] C["这个交易是否存在异常模式？"] D["这份申请材料是否足以支持该结论？"] E["相关政策中是否存在需要特别注意的条款？"]
      - paragraph [ref=f43e2004]: 这些很难纯规则化。
      - paragraph [ref=f43e2005]: 因此可以这样划分：
      - generic [ref=f43e2006]: flowchart LR A["Deterministic"] --> B["BPMN / DMN"] C["Semantic / Investigative"] --> D["Agent"]
      - paragraph [ref=f43e2007]: 这是比较实用的边界。
      - heading "三层决策架构" [level=3] [ref=f43e2008]
      - generic [ref=f43e2009]: flowchart TB L1["Layer 1<br/>Deterministic Business Flow"] L2["Layer 2<br/>Deterministic Business Rules"] L3["Layer 3<br/>Probabilistic Agent Reasoning"] L1 --> L2 L2 --> L3 L3 --> G["Validation / Policy Gate"] G --> L1
      - heading "Layer 1：BPMN" [level=3] [ref=f43e2010]
      - paragraph [ref=f43e2011]: 回答流程走哪里。
      - heading "Layer 2：DMN / Policy" [level=3] [ref=f43e2012]
      - paragraph [ref=f43e2013]: 回答什么情况下允许。
      - heading "Layer 3：Agent" [level=3] [ref=f43e2014]
      - paragraph [ref=f43e2015]: 回答如何分析这个复杂问题。
      - paragraph [ref=f43e2016]: 再回到：
      - generic [ref=f43e2017]: flowchart LR A["Policy / BPMN"]
      - paragraph [ref=f43e2018]: 形成闭环。
      - heading "BPMN 反而会变得更简单" [level=3] [ref=f43e2019]
      - paragraph [ref=f43e2020]: 传统 BPMN 经常被迫表达大量业务逻辑。Agent 出现以后，反而可以把：
      - generic [ref=f43e2021]: flowchart LR A["“需要智能判断”"]
      - paragraph [ref=f43e2022]: 封装成：
      - generic [ref=f43e2023]: flowchart LR A["Agent Task"]
      - paragraph [ref=f43e2024]: 比如：
      - generic [ref=f43e2025]: "flowchart TD %% Before: A[\"Compliance\"] --> B[\"13个 Gateway\"] --> C[\"37个条件\"] --> D[\"8个子流程\"]"
      - paragraph [ref=f43e2026]: 现在：
      - generic [ref=f43e2027]: flowchart TD A["Compliance"] --> B["Agent Review"] --> C["Human Decision"]
      - paragraph [ref=f43e2028]: 但不能把所有东西扔给 Agent，DMN 继续负责明确业务规则。因此更合理的分工如下：
      - generic [ref=f43e2029]: flowchart LR subgraph B["BPMN"] B1[Flow] B2[Role] B3[State] B4[Approval] B5[Task] end subgraph D["DMN"] D1[Eligibility] D2[Threshold] D3[Risk classification] D4[Approval matrix] end subgraph AG["Agent"] A1[Investigation] A2[Interpretation] A3[Evidence discovery] A4[Recommendation] end
      - paragraph [ref=f43e2030]: 三者职责很清楚。
      - heading "25. Workflow 形态的正交分类" [level=2] [ref=f43e2031]
      - paragraph [ref=f43e2032]: 前面有一版分类把 Workflow 分成四种：Deterministic、Agentic、Policy、Human，这个分类不建议保留，原因不是它错，而是这四项不在同一个分类维度上：Deterministic / Agentic 描述的是执行方式，Policy 描述的是控制方式，Human 描述的是参与者。它们并不互斥，同一条流程里同时出现 Agent Task、Policy Gate 和 Human Approval 是常态：
      - generic [ref=f43e2033]: flowchart TD A["BPMN Workflow"] --> B["Agent Task"] --> C["Policy Gate"] --> D["Human Approval"]
      - paragraph [ref=f43e2034]: 于是同一条流程按旧分类会同时属于四类，分类就失去了判别力，更严谨的做法是拆成三个正交维度。
      - heading "维度一：Workflow execution model" [level=3] [ref=f43e2035]
      - generic [ref=f43e2036]: flowchart TB A["Deterministic"] B["Bounded Agentic"] C["Dynamic Agentic"]
      - paragraph [ref=f43e2037]:
        - strong [ref=f43e2038]: Deterministic
        - text: —— 路径由模型明确给出：
      - generic [ref=f43e2039]: flowchart TB A["Settlement"] B["Payment"] C["KYC"] D["Regulatory reporting"]
      - paragraph [ref=f43e2040]:
        - strong [ref=f43e2041]: Bounded Agentic
        - text: —— Agent 在明确的 Task Contract 内完成一段认知工作，边界由外部定义：
      - generic [ref=f43e2042]: flowchart TD A["Compliance Review"] --> B["Agent 在 allowedTools / dataAccess / budget 内完成调查"] --> C["输出结构化结论"]
      - paragraph [ref=f43e2043]:
        - strong [ref=f43e2044]: Dynamic Agentic
        - text: —— 连“下一步做什么”都由 Agent 决定：
      - generic [ref=f43e2045]: flowchart TD A["“调查这家公司是否值得投资”"] --> B["Agent 自己决定搜索、验证、追问、重写的顺序"]
      - heading "维度二：Task execution mode" [level=3] [ref=f43e2046]
      - generic [ref=f43e2047]: flowchart TB A["Human"] B["System"] C["Agent"] D["Hybrid"]
      - paragraph [ref=f43e2048]: Hybrid 是金融场景最常见的一类：
      - generic [ref=f43e2049]: flowchart TD A["Agent"] --> B["Prepare decision package"] --> C["Human review"] --> D["Approve / Reject / Modify"] --> E["Agent continues"]
      - heading "维度三：Control" [level=3] [ref=f43e2050]
      - generic [ref=f43e2051]: flowchart TB A["Rule"] B["Policy"] C["Human approval"]
      - paragraph [ref=f43e2052]: 对应的是这条链路：
      - generic [ref=f43e2053]: "flowchart TD A[\"Agent wants to act\"] --> B[\"Authorization\"] --> C[\"Risk classification\"] --> D{\"Approval?\"} --> E[\"Execute / Reject\"]"
      - heading "怎么用这三个维度描述一条流程" [level=3] [ref=f43e2054]
      - paragraph [ref=f43e2055]: 以本文后面那个投资 Idea 流程为例：
      - generic [ref=f43e2056]: "flowchart TB A[\"execution model : Deterministic（主流程）+ Bounded Agentic（各 Review Task）\"] B[\"task mode : Hybrid\"] C[\"control : Rule + Policy + Human approval\"]"
      - paragraph [ref=f43e2057]: 这个描述可以直接进设计文档，而“四种形态”不能——因为它无法回答“这条流程属于哪一类”。
      - heading "26. Business Data Contract：Agent 看到的是哪一个版本的业务事实" [level=2] [ref=f43e2058]
      - paragraph [ref=f43e2059]: 金融 Agent 落地时，最大的问题往往不是 Agent Runtime 的能力，而是 Agent 到底看到的是哪一个版本的业务事实。考虑一个很普通的时间线：
      - generic [ref=f43e2060]: "flowchart TB A[\"10:01 BPMN: Risk = 0.82\"] B[\"10:05 Agent: 查 Snowflake，得到 Risk = 0.77\"] C[\"10:10 Human: 界面上看到的是 0.79\"]"
      - paragraph [ref=f43e2061]: 三个数字都“正确”，因为它们来自三个时间点的不同来源，但在审计场景里，这直接导致结论无法复现。
      - paragraph [ref=f43e2062]: 所以架构上不能只有：
      - generic [ref=f43e2063]: flowchart LR A["Agent"] --> B["Snowflake"]
      - paragraph [ref=f43e2064]: 而要有：
      - generic [ref=f43e2065]: flowchart TD PI[BPMN Process Instance] --> BC[Business Context] BC --> SNAP["Approved Data Snapshot<br/>Authoritative Source"] SNAP --> AT[Agent Task] AT --> RES[Structured Result] RES --> PI
      - paragraph [ref=f43e2066]: 具体要确定的是四件事：
      - paragraph [ref=f43e2067]:
        - strong [ref=f43e2068]: 权威源（authoritative source）
        - text: —— 某个业务事实以哪个系统为准。Portfolio value 是来自交易系统、估值系统还是数仓，必须指定唯一答案。允许两个系统都“能查到”，就等于允许两个结论。
      - paragraph [ref=f43e2069]:
        - strong [ref=f43e2070]: 快照语义（snapshot semantics）
        - text: —— Agent Task 开始时的业务上下文是否被冻结。如果冻结，整个 Task 内的所有查询都基于同一版本；如果不冻结，就必须显式记录每一次读取的时间戳，并接受结论建立在“混合版本”之上。
      - paragraph [ref=f43e2071]:
        - strong [ref=f43e2072]: 版本标识（context version）
        - text: —— 这个 context 需要一个可写入 Evidence 的标识，让事后能回答“当时它看到的是哪一版”。这是第 17 节里 Level B 可复现的前置条件。
      - paragraph [ref=f43e2073]:
        - strong [ref=f43e2074]: 跨系统一致性窗口
        - text: —— Position、Market price、Risk score、Compliance status 来自不同系统，同步延迟不同。要么给出一个显式的一致性窗口，要么承认“不保证一致”并把风险写进设计文档。最怕的是既没有窗口、也没有声明，等到争议出现时才发现无法解释。
      - paragraph [ref=f43e2075]: 这一层决定了 Agent 的输出能否被复核。模型可以换，harness 可以换，Agent Runtime 的框架可以换，但只要 Data Contract 是清楚的，历史决策至少可以在“同样的业务事实 + 记录在案的规则版本 + 记录在案的 Agent 轨迹”这三个条件下被复核。反过来，如果 Data Contract 不清楚，任何 audit trail 都建立不牢——因为审计看到的是一堆记录，而不是一条能走通的证据链。
      - heading "一个可复现的版本栈" [level=3] [ref=f43e2076]
      - paragraph [ref=f43e2077]: 把上面的四件事合起来，一个金融 Agent 的 Task 要在事后被完整解释，需要同时记住六个版本标识：
      - generic [ref=f43e2078]: flowchart TB A["workflowVersion = investment-idea-review v17"] B["policyVersion = compliance-policy v8"] C["dataSnapshot = ctx-20260912-1030"] D["modelVersion = model@version"] E["promptVersion = compliance-review v12"] F["evidenceRef = doc-123#p17"]
      - paragraph [ref=f43e2079]: 有了这六项，才能回答“为什么当时这个 Agent 会得到这个结论”。缺任何一项，复盘都会退化：只记 workflow 版本，说明不了 Agent 为什么这样判断；只记 model 版本，说明不了它当时看到的是哪一版业务事实。反过来也要说清边界：版本标识解决的是“可复现”，不是“可信任”。记录齐全只保证结论可以被重新推导，不保证结论正确。正确性由业务规则、验证与必要的人工审批负责。这两件事经常被混为一谈，结果是团队花大力气把日志做完整，却依然回答不了监管最关心的那个问题。这也是 Data / Semantic 层不应该被塞进 Control Plane 的原因：它回答的是“世界是什么样”，Control Plane 回答的是“谁被允许做什么”。
      - heading "27. Audit、Evidence、Agent Trace 是三件不同的事" [level=2] [ref=f43e2080]
      - paragraph [ref=f43e2081]: 这三个词在讨论里经常被并列甚至混用，但它们回答的是三个不同的问题，取证方式和保留策略也不同。
      - heading "Audit：谁在什么时候做了什么" [level=3] [ref=f43e2082]
      - generic [ref=f43e2083]: flowchart TB A["user = alice"] B["action = approve"] C["task = risk-review"] D["timestamp = 2026-09-12T10:12:03Z"] E["workflow = investment-idea-review v17"]
      - paragraph [ref=f43e2084]: 特征是主体是人和流程，与模型无关，保留期由监管要求决定。
      - heading "Evidence：这项判断依据了什么" [level=3] [ref=f43e2085]
      - generic [ref=f43e2086]: flowchart TB A["document = filing-2026Q2"] B["page = 17"] C["dataSnapshot = ctx-20260912-1001"] D["policyVersion = compliance-policy v4.2"] E["retrievalRef = kbase:1234"]
      - paragraph [ref=f43e2087]: 特征是主体是业务事实来源。它决定的是结论能不能被复核，而不是能不能被信任。
      - heading "Agent Trace：Agent 是怎么完成这个 Task 的" [level=3] [ref=f43e2088]
      - generic [ref=f43e2089]: flowchart TB A["toolCall = policy.search('restricted securities')"] B["model = model@version"] C["prompt = compliance-review v3"] D["steps = [search, retrieve, compare, draft]"] E["tokens = 42,180"]
      - paragraph [ref=f43e2090]: 特征是主体是执行过程，用于评估、调试和成本归因。保留期通常比 Audit 短，但事故发生时它往往是唯一的排查依据。
      - paragraph [ref=f43e2091]: 三者的关系：
      - generic [ref=f43e2092]: flowchart TD WR[Workflow Runtime] --> AU["Audit<br/>谁 · 何时 · 做了什么"] AT[Agent Task] --> EV["Evidence<br/>依据了什么"] AT --> TR["Agent Trace<br/>怎么做的"] AU --> Q1["合规 / 监管 / 责任"] EV --> Q2["结论可复核"] TR --> Q3["评估 / 调试 / 成本"]
      - paragraph [ref=f43e2093]:
        - text: 一个实际后果是只保留 Audit，复盘会变成“流程没错，但结论不对”；只保留 Trace，则无法回答“当时是谁批准的”。两者都要，并且必须通过同一个 Task ID 串起来，这也是 Task Contract 里
        - code [ref=f43e2094]: audit.traceLevel
        - text: 这个字段存在的意义。
      - heading "28. Agent Runtime 是嵌入式能力，不是 Workflow Engine" [level=2] [ref=f43e2095]
      - paragraph [ref=f43e2096]: 架构如下：
      - generic [ref=f43e2097]: flowchart TD BE[BPMN Engine] --> HT[Human Task] BE --> ST[System Task] BE --> AT[Agent Task] AT --> AR[Agent Runtime] AR --> TO[Tools] AR --> CT[Context] AR --> ME[Memory]
      - heading "BPMN Engine" [level=3] [ref=f43e2098]
      - paragraph [ref=f43e2099]: 负责 execution、state、task、routing、timers、events、retries、SLA 和 human workflow。
      - heading "Agent Runtime" [level=3] [ref=f43e2100]
      - paragraph [ref=f43e2101]: 负责 reasoning、tool use、context、memory、planning 和 evidence gathering。
      - paragraph [ref=f43e2102]: 两者边界很干净。
      - heading "29. “Agent-in-Process”而非“Process-in-Agent”" [level=2] [ref=f43e2103]
      - paragraph [ref=f43e2104]: 这两个名字很形象，不推荐的做法如下：
      - generic [ref=f43e2105]: flowchart TD A["Agent"] --> B["决定整个 Business Process"]
      - paragraph [ref=f43e2106]: 这是 Process-in-Agent，风险很大。推荐的做法如下：
      - generic [ref=f43e2107]: flowchart TD A["Business Process"] --> B["Agent Task"] --> C["Agent"]
      - paragraph [ref=f43e2108]: 这是 Agent-in-Process，符合金融机构对 predictable、controllable、explainable 和 auditable 的要求。
      - heading "不推荐" [level=3] [ref=f43e2109]
      - generic [ref=f43e2110]: flowchart TD A["Agent"] --> B["决定整个 Business Process"]
      - paragraph [ref=f43e2111]: 这是 Process-in-Agent，风险很大。
      - heading "推荐" [level=3] [ref=f43e2112]
      - generic [ref=f43e2113]: flowchart TD A["Business Process"] --> B["Agent Task"] --> C["Agent"]
      - paragraph [ref=f43e2114]: 这是 Agent-in-Process，符合金融机构对 predictable、controllable、explainable 和 auditable 的要求。
      - heading "30. 这套架构的名字，以及它为什么更容易治理" [level=2] [ref=f43e2115]
      - paragraph [ref=f43e2116]: 这套架构可以叫 Deterministic Core, Agentic Edge，在企业内部更贴切的说法是 Deterministic Business Process + Bounded Agent Execution。核心原则如下：
      - generic [ref=f43e2117]: flowchart TD CORE["Deterministic Core<br/>BPMN · DMN · State · Roles<br/>Approval · SLA · Policy · Audit"] EDGE["Agentic Edge<br/>Reasoning · Search · Analysis<br/>Tool use · Planning<br/>Evidence discovery · Recommendation"] VAL["Deterministic Validation<br/>Schema · Rule · Policy<br/>Authority · Human Approval"] CORE -->|Agent Task| EDGE EDGE -->|Structured Result| VAL
      - paragraph [ref=f43e2118]: 这是比较适合金融服务的“新时代 Workflow”。
      - heading "为什么它比“Agent Workflow”更容易治理" [level=3] [ref=f43e2119]
      - paragraph [ref=f43e2120]: 因为审计团队可以问：
      - heading "“这个业务流程是什么？”" [level=3] [ref=f43e2121]
      - paragraph [ref=f43e2122]: → BPMN
      - heading "“为什么这个 case 进入 Compliance？”" [level=3] [ref=f43e2123]
      - paragraph [ref=f43e2124]: → BPMN + DMN
      - heading "“为什么 Agent 推荐这个结论？”" [level=3] [ref=f43e2125]
      - paragraph [ref=f43e2126]: → Agent Trace + Evidence
      - heading "“Agent 为什么能调用这个 API？”" [level=3] [ref=f43e2127]
      - paragraph [ref=f43e2128]: → IAM + Policy
      - heading "“为什么最终允许这个动作？”" [level=3] [ref=f43e2129]
      - paragraph [ref=f43e2130]: → Workflow transition + Policy
      - heading "“谁最终批准？”" [level=3] [ref=f43e2131]
      - paragraph [ref=f43e2132]: → Human Task + Identity
      - paragraph [ref=f43e2133]: 整个责任链到这里是完整的。
      - heading "第五部分：Agent Task Contract" [level=1] [ref=f43e2134]
      - heading "31. BPMN 不应该描述 Agent 的内部过程" [level=2] [ref=f43e2135]
      - paragraph [ref=f43e2136]: 例如：
      - generic [ref=f43e2137]: flowchart LR A["Compliance Review"]
      - paragraph [ref=f43e2138]: 不要继续画成：
      - generic [ref=f43e2139]: flowchart TD A["Compliance"] --> B["Search Policy"] --> C["Search Documents"] --> D["Search Historical Cases"] --> E["LLM Review"] --> F["LLM Critic"] --> G["Search Again"] --> H["Summarize"]
      - paragraph [ref=f43e2140]: 这就走偏了，BPMN 只写：
      - generic [ref=f43e2141]: flowchart TD A["Compliance Review"] --> B["Agent-assisted Review"] --> C["Human Decision"]
      - paragraph [ref=f43e2142]: Agent 内部：
      - generic [ref=f43e2143]: flowchart LR A["search"] --> B["retrieve"] --> C["reason"] --> D["compare"] --> E["identify gap"] --> F["retrieve again"] --> G["produce evidence"] --> H["draft recommendation"]
      - paragraph [ref=f43e2144]:
        - text: 这些属于 Agent Runtime，这是
        - strong [ref=f43e2145]: Workflow
        - text: 和
        - strong [ref=f43e2146]: Agent
        - text: 最重要的边界。
      - heading "32. Agent Task Contract" [level=2] [ref=f43e2147]
      - paragraph [ref=f43e2148]:
        - strong [ref=f43e2149]: Agent Task Contract
        - text: 是本文的核心抽象。前面所有关于边界的讨论——流程归谁、状态归谁、权限归谁——最终都收敛到这个契约上。它很少直接给人看，主要作用是作为 BPMN 侧与 Agent 侧之间唯一需要对齐的接口。
      - paragraph [ref=f43e2150]: 两者的对应关系如下：
      - generic [ref=f43e2151]: flowchart LR A["Agent = Workflow"]
      - paragraph [ref=f43e2152]: 上式不成立，实际应为：
      - generic [ref=f43e2153]: flowchart TD A["BPMN Activity"] --> B["Agent Activity"]
      - paragraph [ref=f43e2154]: 例如：
      - generic [ref=f43e2156]:
        - code [ref=f43e2157]:
          - generic [ref=f43e2158]: "activity:"
          - generic [ref=f43e2159]: "id: compliance-review"
          - generic [ref=f43e2160]: "type: agent-task"
          - generic [ref=f43e2161]: "input:"
          - generic [ref=f43e2162]: "- investment_case"
          - generic [ref=f43e2163]: "- supporting_documents"
          - generic [ref=f43e2164]: "- compliance_policy"
          - generic [ref=f43e2165]: "output:"
          - generic [ref=f43e2166]: "- findings"
          - generic [ref=f43e2167]: "- evidence"
          - generic [ref=f43e2168]: "- recommendation"
          - generic [ref=f43e2169]: "- missing_information"
          - generic [ref=f43e2170]: "allowedTools:"
          - generic [ref=f43e2171]: "- policy.search"
          - generic [ref=f43e2172]: "- document.search"
          - generic [ref=f43e2173]: "- risk.lookup"
          - generic [ref=f43e2174]: "approval:"
          - generic [ref=f43e2175]: "required: true"
        - button "Copy" [ref=f43e2176]
      - paragraph [ref=f43e2177]: 这个 Activity 对 BPMN Runtime 来说仍然是一个普通 Task，只不过内部用了 Agent。
      - heading "一份完整的 Agent Task Contract" [level=3] [ref=f43e2178]
      - paragraph [ref=f43e2179]: 把上一节那个 YAML 展开，一份可用的 Agent Task Contract 至少需要十一项：
      - generic [ref=f43e2181]:
        - code [ref=f43e2182]:
          - generic [ref=f43e2183]: "agentTask:"
          - generic [ref=f43e2184]: "id: compliance-review"
          - generic [ref=f43e2185]: "workflow: investment-idea-review"
          - generic [ref=f43e2186]: "input:"
          - generic [ref=f43e2187]: "schema: InvestmentCase.v3"
          - generic [ref=f43e2188]: "output:"
          - generic [ref=f43e2189]: "schema: ComplianceFinding.v2"
          - generic [ref=f43e2190]: "capabilities:"
          - generic [ref=f43e2191]: "- policy.search"
          - generic [ref=f43e2192]: "- document.search"
          - generic [ref=f43e2193]: "- risk.lookup"
          - generic [ref=f43e2194]: "dataAccess:"
          - generic [ref=f43e2195]: "- investment.case"
          - generic [ref=f43e2196]: "- approved.documents"
          - generic [ref=f43e2197]: "- snapshot: ctx-20260912-1001"
          - generic [ref=f43e2198]: "instruction: compliance-review-policy v4.2"
          - generic [ref=f43e2199]: "execution:"
          - generic [ref=f43e2200]: "maxDuration: 15m"
          - generic [ref=f43e2201]: "maxToolCalls: 30"
          - generic [ref=f43e2202]: "maxTokens: 120000"
          - generic [ref=f43e2203]: "retry:"
          - generic [ref=f43e2204]: "maxAttempts: 2"
          - generic [ref=f43e2205]: "onFailure: escalate"
          - generic [ref=f43e2206]: "control:"
          - generic [ref=f43e2207]: "autoExecute: false"
          - generic [ref=f43e2208]: "humanApproval: required"
          - generic [ref=f43e2209]: "evidence:"
          - generic [ref=f43e2210]: "required: true"
          - generic [ref=f43e2211]: "citationRequired: true"
          - generic [ref=f43e2212]: "escalation:"
          - generic [ref=f43e2213]: "onLowConfidence: human"
          - generic [ref=f43e2214]: "onInsufficientEvidence: request_changes"
          - generic [ref=f43e2215]: "evaluation:"
          - generic [ref=f43e2216]: "criteria: compliance-finding-accuracy"
          - generic [ref=f43e2217]: "minConfidence: 0.8"
          - generic [ref=f43e2218]: "audit:"
          - generic [ref=f43e2219]: "traceLevel: full"
        - button "Copy" [ref=f43e2220]
      - paragraph [ref=f43e2221]: 逐项说明，以及缺了会怎样：
      - table [ref=f43e2222]:
        - rowgroup [ref=f43e2223]:
          - row [ref=f43e2224]:
            - columnheader "字段" [ref=f43e2225]
            - columnheader "作用" [ref=f43e2226]
            - columnheader "缺了会怎样" [ref=f43e2227]
        - rowgroup [ref=f43e2228]:
          - row [ref=f43e2229]:
            - cell "input / output schema" [ref=f43e2230]
            - cell "定义 Task 的输入输出类型" [ref=f43e2231]
            - cell "输出变成自由文本，无法进入流程" [ref=f43e2232]
          - row [ref=f43e2233]:
            - cell "capabilities" [ref=f43e2234]
            - cell "允许调用的工具集合" [ref=f43e2235]
            - cell "Agent 可以调用未授权的能力" [ref=f43e2236]
          - row [ref=f43e2237]:
            - cell "dataAccess" [ref=f43e2238]
            - cell "允许读取的数据范围与快照" [ref=f43e2239]
            - cell "Agent 看到不确定版本的事实" [ref=f43e2240]
          - row [ref=f43e2241]:
            - cell "instruction" [ref=f43e2242]
            - cell "该 Task 使用的策略版本" [ref=f43e2243]
            - cell "无法解释某次决策依据了哪版规则" [ref=f43e2244]
          - row [ref=f43e2245]:
            - cell "execution budget" [ref=f43e2246]
            - cell "时长、工具调用数、token 上限" [ref=f43e2247]
            - cell "成本与时长失控" [ref=f43e2248]
          - row [ref=f43e2249]:
            - cell "retry / escalation" [ref=f43e2250]
            - cell "失败与低置信度时的去向" [ref=f43e2251]
            - cell "失败被静默吞掉，或无限重试" [ref=f43e2252]
          - row [ref=f43e2253]:
            - cell "control" [ref=f43e2254]
            - cell "是否需要人工批准" [ref=f43e2255]
            - cell "高风险动作被自动执行" [ref=f43e2256]
          - row [ref=f43e2257]:
            - cell "evidence" [ref=f43e2258]
            - cell "是否必须给出证据与引用" [ref=f43e2259]
            - cell "结论无法复核" [ref=f43e2260]
          - row [ref=f43e2261]:
            - cell "evaluation" [ref=f43e2262]
            - cell "用哪套标准衡量质量" [ref=f43e2263]
            - cell "质量只能凭感觉" [ref=f43e2264]
          - row [ref=f43e2265]:
            - cell "audit" [ref=f43e2266]
            - cell "轨迹粒度" [ref=f43e2267]
            - cell "出事故后无法复盘" [ref=f43e2268]
      - heading "这份契约真正的价值" [level=3] [ref=f43e2269]
      - paragraph [ref=f43e2270]: 它把两个以前混在一起的问题分开了：
      - generic [ref=f43e2271]: flowchart TB A["BPMN 侧看到的是： 一个 Task，有 ID、有输入、有输出、有 SLA、有审批"] B["Agent 侧看到的是： 一份边界声明，允许它在这个范围内自由决定怎么做"]
      - paragraph [ref=f43e2272]: 于是两边可以独立演进：流程改了，只要契约不变，Agent 不用动；Agent 换了模型或框架，只要契约不变，流程不用动。这就是“受约束的智能”的实际含义：自由度留在合约内部，责任留在合约外部。
      - heading "33. Agent 的输出必须结构化" [level=2] [ref=f43e2273]
      - paragraph [ref=f43e2274]: 这是金融领域必须坚持的一条，具体做法如下。
      - paragraph [ref=f43e2275]: 输出不采用以下形式：
      - generic [ref=f43e2276]: flowchart LR A["Agent"] --> B["一段自然语言"]
      - paragraph [ref=f43e2277]: 输出采用以下结构：
      - generic [ref=f43e2279]:
        - code [ref=f43e2280]:
          - generic [ref=f43e2281]: "{"
          - generic [ref=f43e2282]: "\"decision\": \"REQUEST_CHANGES\","
          - generic [ref=f43e2283]: "\"findings\": ["
          - generic [ref=f43e2284]: "{"
          - generic [ref=f43e2285]: "\"type\": \"MISSING_EVIDENCE\","
          - generic [ref=f43e2286]: "\"description\": \"2025 cash flow forecast missing\""
          - generic [ref=f43e2287]: "}"
          - generic [ref=f43e2288]: "],"
          - generic [ref=f43e2289]: "\"evidence\": ["
          - generic [ref=f43e2290]: "{"
          - generic [ref=f43e2291]: "\"documentId\": \"doc-123\","
          - generic [ref=f43e2292]: "\"page\": 17"
          - generic [ref=f43e2293]: "}"
          - generic [ref=f43e2294]: "],"
          - generic [ref=f43e2295]: "\"confidence\": 0.91"
          - generic [ref=f43e2296]: "}"
        - button "Copy" [ref=f43e2297]
      - paragraph [ref=f43e2298]:
        - text: 这里需要先说明一个细节：
        - code [ref=f43e2299]: confidence
        - text: 是模型自报的数值，不应被当作业务可信度或风险评分使用。一个自报 0.91 的结论可能建立在残缺的证据上，一个自报 0.60 的结论也可能恰好正确——两者之间没有校准关系。如果架构上确实需要“置信度”，它应当由独立的验证或评估机制产生（例如多次 trial 的一致性、证据充分性检查、历史准确率），或者至少明确标注为“模型自评”，不允许直接进入流程判断。
      - paragraph [ref=f43e2300]: Workflow Runtime 只接受：
      - generic [ref=f43e2301]: flowchart LR A["validated structured output"]
      - paragraph [ref=f43e2302]: 然后 BPMN 决定：
      - generic [ref=f43e2303]: flowchart TD A["REQUEST_CHANGES"] --> B["Research"]
      - paragraph [ref=f43e2304]: 或者：
      - generic [ref=f43e2305]: flowchart TD A["APPROVE"] --> B["Next Step"]
      - paragraph [ref=f43e2306]: 因此，Agent 提议业务状态变化，Workflow Runtime 决定它是否真的发生。更精确的表述见第 34 节：Agent 输出的是业务建议或动作提议，共同决定它的是 Workflow Runtime、Business Rule、Authorization 和必要的 Human Task。
      - heading "34. Analysis Task 与 Action Task" [level=2] [ref=f43e2307]
      - paragraph [ref=f43e2308]: 有一个容易含糊的地方需要区分清楚：Agent 的“输出”到底指什么。在本文的模型里，Agent Task 分两类，它们的输出性质完全不同。
      - heading "Agent Analysis Task" [level=3] [ref=f43e2309]
      - paragraph [ref=f43e2310]:
        - text: Agent 产出的是
        - strong [ref=f43e2311]: 判断材料
        - text: ，其作用不含流程指令：
      - generic [ref=f43e2313]:
        - code [ref=f43e2314]:
          - generic [ref=f43e2315]: "{"
          - generic [ref=f43e2316]: "\"recommendation\": \"REQUEST_CHANGES\","
          - generic [ref=f43e2317]: "\"findings\": ["
          - generic [ref=f43e2318]: "{ \"type\": \"MISSING_EVIDENCE\", \"description\": \"2025 现金流预测缺失\" }"
          - generic [ref=f43e2319]: "],"
          - generic [ref=f43e2320]: "\"evidence\": [{ \"documentId\": \"doc-123\", \"page\": 17 }],"
          - generic [ref=f43e2321]: "\"confidence\": 0.91"
          - generic [ref=f43e2322]: "}"
        - button "Copy" [ref=f43e2323]
      - paragraph [ref=f43e2324]:
        - text: 它不应该输出
        - strong [ref=f43e2325]: workflow transition
        - text: 。
      - paragraph [ref=f43e2326]:
        - text: 即使字段名叫
        - code [ref=f43e2327]: recommendation
        - text: ，它的语义也只是“建议把流程导向 Request Changes”。真正决定是否回到 Research 的，是 BPMN 的网关、DMN 的规则，或者一个 Human Task。
      - paragraph [ref=f43e2328]: 把这两件事分开有两个实际好处：
      - list [ref=f43e2329]:
        - listitem [ref=f43e2330]: Agent 的 prompt 里不再需要写“如果……就直接跳到第几步”，流程知识只存在一个地方；
        - listitem [ref=f43e2331]: BPMN 不依赖模型输出的语义，模型升级不会悄悄改变流程走向。
      - heading "Agent Action Task" [level=3] [ref=f43e2332]
      - paragraph [ref=f43e2333]:
        - text: 低风险场景下，Agent 可以提出一个
        - strong [ref=f43e2334]: 动作提议
        - text: ：
      - generic [ref=f43e2336]:
        - code [ref=f43e2337]:
          - generic [ref=f43e2338]: "{"
          - generic [ref=f43e2339]: "\"action\": \"CLASSIFY_DOCUMENT\","
          - generic [ref=f43e2340]: "\"target\": \"doc-123\","
          - generic [ref=f43e2341]: "\"value\": \"quarterly_report\","
          - generic [ref=f43e2342]: "\"confidence\": 0.96"
          - generic [ref=f43e2343]: "}"
        - button "Copy" [ref=f43e2344]
      - paragraph [ref=f43e2345]: 这个动作经过 policy 判断后可以自动执行，“可以自动执行”这个授权由 Policy 配置给出。
      - heading "更精确的表述" [level=3] [ref=f43e2346]
      - paragraph [ref=f43e2347]: 于是前面那句“Agent 提议状态变化，Workflow 决定是否真的发生状态变化”，应该修正为：
      - blockquote [ref=f43e2348]:
        - paragraph [ref=f43e2349]: Agent 输出业务建议或动作提议；Workflow Runtime、Business Rule、Authorization 和必要的 Human Task，共同决定这个提议是否能够产生业务状态变化。
      - paragraph [ref=f43e2350]: 这个表述多出来的部分（Business Rule、Authorization、Human Task），正是金融场景里最需要被明确归属的三个环节。少写一个，评审时就会被追问“那这里谁负责”。
      - heading "35. Governed Action Pipeline" [level=2] [ref=f43e2351]
      - paragraph [ref=f43e2352]: 在金融 Agent workflow 里，任何 Agent 行为都可以统一看成：
      - generic [ref=f43e2353]: flowchart TD A["Agent"] --> B["Proposal"] --> C["Validation"] --> D["Authorization"] --> E["Execution"]
      - paragraph [ref=f43e2354]: 例如：
      - generic [ref=f43e2355]: "flowchart LR A[Agent] --> P[Proposal] P --> V[Schema / Business Validation] V --> Q[Policy Check] Q --> H{Human Approval?} H -->|Yes| HA[Human] H -->|No| E[Execute] HA -->|Approve| E HA -->|Reject| R[Reject] E --> S[State Transition]"
      - paragraph [ref=f43e2356]: 与以下做法相比：
      - generic [ref=f43e2357]: flowchart LR A["Agent"] --> B["API"]
      - paragraph [ref=f43e2358]: 这种方式安全和可审计得多。
      - heading "为什么叫“管道”，而不是“事务”" [level=3] [ref=f43e2359]
      - paragraph [ref=f43e2360]: 这条链路的完整形态是：
      - generic [ref=f43e2361]: flowchart TD A["Agent Proposal"] --> B["Schema / Semantic Validation"] B --> C["Business Rule"] C --> D["Authorization"] D --> E["Human Approval (when required)"] E --> F["Execution"] F --> G["Business State Transition"]
      - paragraph [ref=f43e2362]:
        - text: 它的语义是
        - strong [ref=f43e2363]: 动作治理与授权
        - text: ：关心的是“这个动作有没有资格发生”。它不是分布式事务协议，也不涉及多个参与者能否原子提交的问题——把它套进事务语义去讨论，会让评审直接跑偏到错误的抽象层次上，去追问一个并不存在的协调者。
      - paragraph [ref=f43e2364]: 还有一点要写清楚：这条管道只负责把一个提议送达到“执行或拒绝”这个结论，它本身不产生业务状态转移。最终的状态转移仍然由 Workflow Runtime 依据 BPMN 完成，这也是整套架构里职责划分最干净的一条边界。
      - heading "36. “审批”怎么处理" [level=2] [ref=f43e2365]
      - paragraph [ref=f43e2366]: 例如 PM Approval：
      - generic [ref=f43e2367]: flowchart TD A["BPMN:"] --> B["PM Approval"]
      - paragraph [ref=f43e2368]: 内部可以：
      - generic [ref=f43e2369]: flowchart TD A["Agent prepares recommendation"] --> B["Agent highlights:"] B --> C["expected return"] B --> D["downside"] B --> E["risk"] B --> F["missing evidence"] B --> G["policy violations"] B --> H["PM"] H --> I["Approve / Reject / Request Changes"]
      - paragraph [ref=f43e2370]: PM 的按钮仍然是：
      - generic [ref=f43e2371]: flowchart TB A["Approve"] B["Reject"] C["Request Changes"]
      - paragraph [ref=f43e2372]: Agent 不能替 PM 点击，这正是 AI assistance ≠ AI authority 所表达的意思。
      - heading "37. “修改”也由 BPMN 明确控制" [level=2] [ref=f43e2373]
      - paragraph [ref=f43e2374]: 例如：
      - generic [ref=f43e2375]: flowchart LR RR[Risk Review] -->|Approve| CP[Compliance] RR -->|Reject| EN[End] RR -->|Request Changes| RS[Research]
      - paragraph [ref=f43e2376]: 这在 BPMN 中完全合理。
      - paragraph [ref=f43e2377]: 然后：
      - generic [ref=f43e2378]: flowchart TD A["Research"] --> B["修改材料"] B --> C["Submit"] C --> D["Risk Review"]
      - paragraph [ref=f43e2379]: 这里 BPMN 描述的是确定性的状态转移规则；至于某个具体的 process instance 此刻处于什么状态，由 Workflow Runtime 持有。
      - paragraph [ref=f43e2380]: 不需要由 Agent 来决定“我觉得应该回到 Research”。
      - heading "38. 什么时候允许 Agent 自己完成一个 Task" [level=2] [ref=f43e2381]
      - paragraph [ref=f43e2382]: 不用改 Workflow，只需要改变以下配置：
      - generic [ref=f43e2383]: flowchart TD A["Agent Authority Policy"]
      - paragraph [ref=f43e2384]: 比如：
      - generic [ref=f43e2386]:
        - code [ref=f43e2387]:
          - generic [ref=f43e2388]: "agentAuthority:"
          - generic [ref=f43e2389]: "riskReview:"
          - generic [ref=f43e2390]: "canRecommend: true"
          - generic [ref=f43e2391]: "canApprove: false"
          - generic [ref=f43e2392]: "documentClassification:"
          - generic [ref=f43e2393]: "canRecommend: true"
          - generic [ref=f43e2394]: "canApprove: true"
          - generic [ref=f43e2395]: "investmentApproval:"
          - generic [ref=f43e2396]: "canRecommend: true"
          - generic [ref=f43e2397]: "canApprove: false"
        - button "Copy" [ref=f43e2398]
      - paragraph [ref=f43e2399]: 这样一来，Workflow 定义与 Agent autonomy 解耦，这种解耦让架构更稳定。
      - heading "一个简单的三级模型" [level=3] [ref=f43e2400]
      - paragraph [ref=f43e2401]: 可以建立一个很简单的三级模型：
      - heading "Level 0 — Human only" [level=3] [ref=f43e2402]
      - generic [ref=f43e2403]: flowchart LR A["Agent"] --> B["assist"] C["Human"] --> D["decision"]
      - heading "Level 1 — Agent recommendation" [level=3] [ref=f43e2404]
      - generic [ref=f43e2405]: flowchart LR A["Agent"] --> B["prepare recommendation"] C["Human"] --> D["approve"]
      - heading "Level 2 — Bounded automation" [level=3] [ref=f43e2406]
      - generic [ref=f43e2407]: flowchart LR A["Agent"] --> B["execute"] C["Policy"] --> D["validates"] E["System"] --> F["commits"]
      - paragraph [ref=f43e2408]: 金融机构前期绝大多数应该是 Level 1，部分低风险、重复性的任务可以做到 Level 2，Level 0 则用于真正高风险决策。
      - heading "第六部分：一个完整的金融案例" [level=1] [ref=f43e2409]
      - heading "39. Investment Idea Review 全流程" [level=2] [ref=f43e2410]
      - paragraph [ref=f43e2411]: 比如一个投资 Idea 流程：
      - generic [ref=f43e2412]: flowchart TD A["Draft"] --> B["Research"] B --> C["Risk Review"] C --> D["Compliance Review"] D --> E["PM Review"] E --> F["Approved"]
      - paragraph [ref=f43e2413]: 这个流程业务分析师完全可以用 BPMN 表达。
      - generic [ref=f43e2414]: flowchart LR A[Draft] --> B[Research] B --> C[Risk Review] C --> D[Compliance Review] D --> E[PM Review] E --> F[Approved] C --> X1[Reject] D --> X1 E --> X1 C --> B D --> B E --> B
      - paragraph [ref=f43e2415]:
        - text: 这里不需要消灭
        - strong [ref=f43e2416]: BPMN
        - text: ，因为这个东西本身就是业务知识资产。
      - paragraph [ref=f43e2417]: 它回答了：
      - list [ref=f43e2418]:
        - listitem [ref=f43e2419]: 谁负责？
        - listitem [ref=f43e2420]: 谁批准？
        - listitem [ref=f43e2421]: 哪一步必须发生？
        - listitem [ref=f43e2422]: 什么情况退回？
        - listitem [ref=f43e2423]: 什么情况结束？
        - listitem [ref=f43e2424]: 哪几个环节并行？
      - paragraph [ref=f43e2425]: 这恰恰是金融业务最需要确定性的部分。把这条流程展开，看每一段 Task 里 Agent 具体做什么、Human 具体决定什么。
      - heading "Investment Idea Review" [level=3] [ref=f43e2426]
      - generic [ref=f43e2427]: flowchart TD A[Idea Created] --> B[Research] B --> C[Risk Review] C -->|Approve| D[Compliance Review] C -->|Request Changes| B C -->|Reject| Z[Rejected] D -->|Approve| E[PM Review] D -->|Request Changes| B D -->|Reject| Z E -->|Approve| F[Approved] E -->|Request Changes| B E -->|Reject| Z
      - heading "Research Task" [level=3] [ref=f43e2428]
      - paragraph [ref=f43e2429]: Agent：
      - generic [ref=f43e2430]: flowchart TB A["Search market data"] B["Search company filings"] C["Search internal research"] D["Generate summary"] E["Identify missing evidence"] F["Draft thesis"]
      - paragraph [ref=f43e2431]: 输出：
      - generic [ref=f43e2432]: flowchart TD A["Research Package"]
      - paragraph [ref=f43e2433]: Human：
      - generic [ref=f43e2434]: flowchart TB A["Submit"] B["Request Changes"]
      - heading "Risk Task" [level=3] [ref=f43e2435]
      - paragraph [ref=f43e2436]: Agent：
      - generic [ref=f43e2437]: flowchart TB A["Analyze financials"] B["Calculate risk metrics"] C["Compare peers"] D["Identify anomalies"]
      - paragraph [ref=f43e2438]: 输出：
      - generic [ref=f43e2439]: flowchart TB A["Risk Findings"] B["Risk Recommendation"] C["Evidence"]
      - paragraph [ref=f43e2440]: Human：
      - generic [ref=f43e2441]: flowchart TB A["Approve"] B["Reject"] C["Request Changes"]
      - heading "Compliance Task" [level=3] [ref=f43e2442]
      - paragraph [ref=f43e2443]: Agent：
      - generic [ref=f43e2444]: flowchart TB A["Retrieve policy"] B["Retrieve similar cases"] C["Check restrictions"] D["Identify missing documentation"]
      - paragraph [ref=f43e2445]: Human：
      - generic [ref=f43e2446]: flowchart TB A["Approve"] B["Reject"] C["Request Changes"]
      - heading "PM Task" [level=3] [ref=f43e2447]
      - paragraph [ref=f43e2448]: Agent：
      - generic [ref=f43e2449]: flowchart TB A["Summarize entire case"] B["Challenge thesis"] C["Highlight risk"] D["Compare alternatives"]
      - paragraph [ref=f43e2450]: PM：
      - generic [ref=f43e2451]: flowchart TB A["Approve"] B["Reject"] C["Request Changes"]
      - paragraph [ref=f43e2452]: 这里 Agent 能力很强，但它从头到尾都没有以下行为：
      - generic [ref=f43e2453]: flowchart TB A["改变 BPMN"] B["跳过审批"] C["修改状态"] D["自己批准"]
      - paragraph [ref=f43e2454]: 除非明确授权。
      - heading "40. 投资研究：哪一段应该固化，哪一段必须留给 Agent" [level=2] [ref=f43e2455]
      - paragraph [ref=f43e2456]: 例如：
      - heading "投资研究" [level=3] [ref=f43e2457]
      - paragraph [ref=f43e2458]: 第一次：
      - generic [ref=f43e2459]: flowchart LR A["Agent"] --> B["search"] B --> C["SEC"] C --> D["research"] D --> E["valuation"] E --> F["competitor"] F --> G["analyst review"]
      - paragraph [ref=f43e2460]: 此时 Agent 很自由，跑了 5000 次以后发现：
      - generic [ref=f43e2461]: flowchart LR A["Company Financials"] --> B["Peer Analysis"] B --> C["DCF"] C --> D["Risk Check"] D --> E["Report"]
      - paragraph [ref=f43e2462]: 这套路径已经高度稳定，那么这部分就可以固化为以下流程：
      - generic [ref=f43e2463]: flowchart TD A["compile"] --> B["deterministic research workflow"]
      - paragraph [ref=f43e2464]: 而异常情况仍交给 Agent：
      - generic [ref=f43e2465]: flowchart TB A["new company"] B["unusual accounting"] C["missing data"] D["conflicting filings"]
      - paragraph [ref=f43e2466]:
        - text: 需要强调的是，这里的“固化”并不意味着把 Agent 换成写死的代码，它的含义是把一个
        - strong [ref=f43e2467]: 已经被反复验证过的子过程
        - text: 提升为确定性步骤：
      - generic [ref=f43e2468]: flowchart LR A["Company Financials"] --> B["Peer Analysis"] B --> C["DCF"] C --> D["Risk Check"] D --> E["Report"]
      - paragraph [ref=f43e2469]: 而异常情况仍然交给 Agent：
      - generic [ref=f43e2470]: flowchart TB A["new company"] B["unusual accounting"] C["missing data"] D["conflicting filings"]
      - paragraph [ref=f43e2471]: 这里的分工标准是任务性质：
      - blockquote [ref=f43e2472]:
        - paragraph [ref=f43e2473]: 大部分可规则化的流程保持确定性；只有真正需要语义理解、调查、推理或动态工具选择的任务引入 Agent。
      - paragraph [ref=f43e2474]: 判断某个子过程是否到了可以固化的程度，判据是它是否稳定到“两个不同的人按同样的步骤会得出同一结论”。达不到这个标准的，继续留在 Agent 侧。
      - heading "第七部分：每一层放谁" [level=1] [ref=f43e2475]
      - heading "41. Workflow Engine 的裂解" [level=2] [ref=f43e2476]
      - paragraph [ref=f43e2477]: 过去，一个系统全部负责：
      - generic [ref=f43e2478]: flowchart TD A["Workflow Engine"]
      - paragraph [ref=f43e2479]: 未来更像：
      - generic [ref=f43e2480]: flowchart TD AP[Agent Platform] --> AL[Agent Loop] AP --> DR[Durable Runtime] AP --> PE[Policy Engine] AL --> TL[Tool Layer] DR --> TL PE --> TL TL --> AP1[API] TL --> MC[MCP] TL --> HM[Human]
      - paragraph [ref=f43e2481]: 而这些能力以前往往被归到同一个“BPM / Workflow”标签下：
      - generic [ref=f43e2482]: flowchart LR A["Camunda / Fluxnova / ServiceNow"] --> B["business process orchestration"] C["Temporal / Durable Task"] --> D["durable execution"]
      - paragraph [ref=f43e2483]: 把它们归成同一类，是选型时最常见的起点错误。
      - heading "42. 能力 → 代表产品" [level=2] [ref=f43e2484]
      - paragraph [ref=f43e2485]: 前一版材料把行业归纳为“5 派”，那个分法把不同层次的东西并列了。按能力维度重新列一遍，选型时更不容易搞错：
      - table [ref=f43e2486]:
        - rowgroup [ref=f43e2487]:
          - row [ref=f43e2488]:
            - columnheader "能力" [ref=f43e2489]
            - columnheader "代表" [ref=f43e2490]
            - columnheader "定位" [ref=f43e2491]
        - rowgroup [ref=f43e2492]:
          - row [ref=f43e2493]:
            - cell "Business Process Orchestration" [ref=f43e2494]
            - cell "Camunda / Fluxnova" [ref=f43e2495]
            - cell "确定性流程、责任、审批、SLA、审计" [ref=f43e2496]
          - row [ref=f43e2497]:
            - cell "Agent Workflow / Graph" [ref=f43e2498]
            - cell "LangGraph / Microsoft Agent Framework / Google ADK" [ref=f43e2499]
            - cell "Agent 侧的编排图、state、checkpoint" [ref=f43e2500]
          - row [ref=f43e2501]:
            - cell "Durable Execution" [ref=f43e2502]
            - cell "Temporal / Durable Task" [ref=f43e2503]
            - cell "长时间运行、失败恢复、可重放执行" [ref=f43e2504]
          - row [ref=f43e2505]:
            - cell "Managed Agent Runtime" [ref=f43e2506]
            - cell "AWS AgentCore / OpenAI Agents API / Snowflake Cortex Agents" [ref=f43e2507]
            - cell "托管 harness、sandbox、会话上下文" [ref=f43e2508]
          - row [ref=f43e2509]:
            - cell "Enterprise Data / Ontology" [ref=f43e2510]
            - cell "Palantir / Snowflake" [ref=f43e2511]
            - cell "业务对象、语义层、动作模型" [ref=f43e2512]
      - paragraph [ref=f43e2513]: 这张表要防的是三种常见误判。
      - paragraph [ref=f43e2514]:
        - strong [ref=f43e2515]: 误判一
        - text: ：把 Agent Workflow 和 Durable Execution 当成一类。
      - paragraph [ref=f43e2516]: LangGraph 的 graph 与 Temporal 的 workflow 都在讲“编排”，但前者的产出是 Agent 的执行路径，后者的产出是可重放的执行历史。一个 Agent 图跑在 Temporal Activity 里是常见组合，但它们是两层，不是两个竞品。
      - paragraph [ref=f43e2517]:
        - strong [ref=f43e2518]: 误判二
        - text: ：把 Managed Agent Runtime 当成 Workflow Engine。
      - paragraph [ref=f43e2519]:
        - text: 这是今年最容易出的错。托管运行时的“orchestration”指的是
        - strong [ref=f43e2520]: Agent 内部的任务编排
        - text: ：决定先查什么、再调什么工具、什么时候停止。它不持有企业业务流程的状态，也不负责跨部门的审批与责任归属。
      - paragraph [ref=f43e2521]:
        - strong [ref=f43e2522]: 误判三
        - text: ：认为选了其中一层就等于有了整个架构。
      - paragraph [ref=f43e2523]: 这五层不是五个可选项，而是五个必须回答的问题。任何一层缺失，都会在落地时以事故的形式出现：
      - generic [ref=f43e2524]: flowchart LR A["缺 Workflow Runtime"] --> B["审批与状态没有权威源"] C["缺 Agent Runtime"] --> D["无法接入模型能力"] E["缺 Durable Execution"] --> F["长任务在失败后无法恢复"] G["缺 Managed Runtime"] --> H["每个团队自己造 harness 与沙箱"] I["缺 Data / Semantic"] --> J["Agent 看到的事实无法确定版本"]
      - paragraph [ref=f43e2525]: 反过来看选型问题会简单很多：不要问“谁替代谁”，要问“这一层谁来负责，以及层与层之间的契约是什么”。
      - heading "43. Camunda / Fluxnova 的合理位置" [level=2] [ref=f43e2526]
      - paragraph [ref=f43e2527]: 这一点与前面的结论有明显不同。如果企业的业务架构师已经大量使用 BPMN，并且企业已经具备：
      - list [ref=f43e2528]:
        - listitem [ref=f43e2529]: BPMN 技能
        - listitem [ref=f43e2530]: 流程资产
        - listitem [ref=f43e2531]: 流程治理
        - listitem [ref=f43e2532]: 审计模型
        - listitem [ref=f43e2533]: 人员职责
        - listitem [ref=f43e2534]: 流程设计规范
      - paragraph [ref=f43e2535]: 那么不应该建议抛弃 Camunda 一类的 BPMN Runtime，反而应保留以下定位：
      - blockquote [ref=f43e2536]:
        - paragraph [ref=f43e2537]: 保留 BPMN 作为 Business Process Control Plane。
      - paragraph [ref=f43e2538]: 然后把 Agent Runtime 接进来。
      - paragraph [ref=f43e2539]: 也就是说，选型不做二选一的对比：
      - generic [ref=f43e2540]: flowchart TD A["Camunda vs Agent"]
      - paragraph [ref=f43e2541]: 实际是两者相加：
      - generic [ref=f43e2542]: flowchart TB A["Camunda"] B["Agent Runtime"]
      - heading "44. Palantir Ontology 的定位" [level=2] [ref=f43e2543]
      - paragraph [ref=f43e2544]: 在业务流程确定的前提下，Ontology 不应该取代 BPMN，它更适合做以下事情：
      - generic [ref=f43e2545]: flowchart TB A["Business Objects"] B["Relationships"] C["Actions"] D["Semantic Context"]
      - paragraph [ref=f43e2546]: 例如：
      - generic [ref=f43e2547]: flowchart TB A["Investment"] B["Portfolio"] C["Security"] D["Issuer"] E["Risk"] F["ComplianceRule"] G["ResearchReport"]
      - paragraph [ref=f43e2548]: 然后 BPMN：
      - generic [ref=f43e2549]: flowchart TD A["什么时间做什么"]
      - paragraph [ref=f43e2550]: Ontology：
      - generic [ref=f43e2551]: flowchart TD A["处理的业务对象是什么"]
      - paragraph [ref=f43e2552]: Agent：
      - generic [ref=f43e2553]: flowchart TD A["如何理解和分析这些对象"]
      - paragraph [ref=f43e2554]: 所以三者形成：
      - generic [ref=f43e2555]: flowchart TD A["BPMN"] --> B["Process"] C["Ontology"] --> D["Business World"] E["Agent"] --> F["Intelligence"]
      - paragraph [ref=f43e2556]: 这是一个很漂亮的组合。
      - heading "45. 一个 AI 平台该怎么分层" [level=2] [ref=f43e2557]
      - paragraph [ref=f43e2558]: 更合理的做法是把架构重新分层，具体如下。以下做法不采用：
      - generic [ref=f43e2559]: flowchart TD A["Angular"] --> B["Experience API"] B --> C["LangChain / DeepAgents"] C --> D["Camunda"] D --> E["Agent"]
      - paragraph [ref=f43e2560]: 采用以下分层：
      - generic [ref=f43e2561]: flowchart TD APP[Applications] --> GW[Agent Gateway] GW --> AR[Agent Runtime] GW --> BAPI[Business API] AR --> CTX[Context] AR --> POL[Policy] AR --> PLN[Planner] CTX --> ER[Execution Runtime] POL --> ER PLN --> ER ER --> T[Tools] ER --> AG[Agents] ER --> HU[Human] T --> ES[Enterprise Systems]
      - paragraph [ref=f43e2562]: 各部分的分工是：
      - list [ref=f43e2563]:
        - listitem [ref=f43e2564]:
          - strong [ref=f43e2565]: Durable Execution
          - text: ：
          - code [ref=f43e2566]: Temporal / Durable Task
        - listitem [ref=f43e2567]:
          - strong [ref=f43e2568]: Managed Agent Runtime
          - text: ：
          - code [ref=f43e2569]: AgentCore / OpenAI Agents API
        - listitem [ref=f43e2570]:
          - strong [ref=f43e2571]: Agent orchestration
          - text: ：
          - code [ref=f43e2572]: DeepAgents / LangGraph / Microsoft Agent Framework
        - listitem [ref=f43e2573]:
          - strong [ref=f43e2574]: Observability + evaluation
          - text: ：
          - code [ref=f43e2575]: OpenTelemetry / LangSmith / Foundry
        - listitem [ref=f43e2576]:
          - strong [ref=f43e2577]: Business process
          - text: ：
          - code [ref=f43e2578]: Camunda / Fluxnova
          - text: ，只用在真正需要 BPMN 的企业流程上
      - heading "第八部分：怎么落地" [level=1] [ref=f43e2579]
      - heading "46. 不要重新造 Workflow Engine" [level=2] [ref=f43e2580]
      - paragraph [ref=f43e2581]: 如果企业已经有以下平台，优先复用：
      - list [ref=f43e2582]:
        - listitem [ref=f43e2583]: Camunda
        - listitem [ref=f43e2584]: Flowable
        - listitem [ref=f43e2585]: Temporal
        - listitem [ref=f43e2586]: ServiceNow Workflow
        - listitem [ref=f43e2587]: 自研流程平台
      - paragraph [ref=f43e2588]: 相比“又一个 Workflow Engine”，企业更缺的是以下几块：
      - generic [ref=f43e2589]: flowchart TB A["Agent Task Runtime"] B["Agent Governance"] C["Evidence"] D["Tool Gateway"] E["Agent Evaluation"]
      - paragraph [ref=f43e2590]: 比如现有 Camunda：
      - generic [ref=f43e2591]: flowchart TD CA[Camunda] --> HT[Human Task] CA --> ST[System Task] CA --> GW[Gateway] CA --> TI[Timer] CA --> AT[Agent Task] AT --> AP[Agent Platform]
      - paragraph [ref=f43e2592]: 这就已经足够现代。
      - heading "47. 分阶段落地" [level=2] [ref=f43e2593]
      - heading "Phase 1：先把确定性 Workflow 做好" [level=3] [ref=f43e2594]
      - generic [ref=f43e2595]: flowchart TB A["BPMN"] B["DMN"] C["Human Task"] D["State"] E["Audit"]
      - paragraph [ref=f43e2596]: 先解决业务流程正确性问题。
      - heading "Phase 2：Agent-in-Task" [level=3] [ref=f43e2597]
      - paragraph [ref=f43e2598]: 先给以下领域逐个增加 Agent Assistant：
      - generic [ref=f43e2599]: flowchart TB A["Research"] B["Risk"] C["Compliance"] D["Operations"]
      - paragraph [ref=f43e2600]: 这类助手重点放在以下几类能力上：
      - generic [ref=f43e2601]: flowchart TB A["summarize"] B["search"] C["retrieve"] D["analyze"] E["draft"] F["recommend"]
      - heading "Phase 3：Bounded Agent Automation" [level=3] [ref=f43e2602]
      - paragraph [ref=f43e2603]: 对低风险 Task，走以下路径自动执行：
      - generic [ref=f43e2604]: flowchart TD A["Agent"] --> B["Policy"] B --> C["Auto Execute"]
      - paragraph [ref=f43e2605]: 例如以下几类：
      - list [ref=f43e2606]:
        - listitem [ref=f43e2607]: 文档分类
        - listitem [ref=f43e2608]: 数据校验
        - listitem [ref=f43e2609]: 信息补全
        - listitem [ref=f43e2610]: 标准化检查
      - heading "Phase 4：动态 Agent Sub-process" [level=3] [ref=f43e2611]
      - paragraph [ref=f43e2612]: 只有在真正发现业务分析师根本没法把这一段流程事先定义清楚时，才引入以下形态：
      - generic [ref=f43e2613]: flowchart TD A["Agent-driven sub-workflow"]
      - paragraph [ref=f43e2614]: 而且这个动态部分仍然被一个明确的 BPMN Activity 包起来，执行路径如下：
      - generic [ref=f43e2615]: flowchart TD A["BPMN"] --> B["Dynamic Agent Subprocess"] B --> C["Validated Result"] C --> D["BPMN"]
      - paragraph [ref=f43e2616]: 这样既不会阻碍 AI，也不会破坏金融业务的确定性。
      - heading "第九部分：长期演进" [level=1] [ref=f43e2617]
      - heading "48. Agent 负责探索，Workflow 负责固化" [level=2] [ref=f43e2618]
      - paragraph [ref=f43e2619]: 前面讨论的都是当前应该怎么设计，这一部分讨论的是长期演进，需要先把它的性质说清楚：这一节的结论是架构推论，不是论文结论。区分这一点很必要，因为它决定了这部分内容应该放在核心架构还是演进方向，答案是后者。
      - paragraph [ref=f43e2620]: 微软研究院最近有一项研究：
      - heading "Optimizing Agentic Workflows using Meta-tools" [level=3] [ref=f43e2621]
      - paragraph [ref=f43e2622]: 它发现很多 Agent Workflow 会反复走以下路径：
      - generic [ref=f43e2623]: flowchart LR A["LLM"] --> B["tool"] B --> C["LLM"] C --> D["tool"] D --> E["LLM"] E --> F["tool"]
      - paragraph [ref=f43e2624]: 但这些 tool-call pattern 实际上稳定重复，因此可以做如下收敛：
      - generic [ref=f43e2625]: flowchart TD A["Agent Trace"] --> B["发现高频 tool sequence"] B --> C["自动封装成 Meta-tool"] C --> D["Agent 一次调用"]
      - paragraph [ref=f43e2626]: 这样 LLM calls 下降，latency 下降，failure 下降，success rate 上升：
      - list [ref=f43e2627]:
        - listitem [ref=f43e2628]: LLM calls ↓
        - listitem [ref=f43e2629]: latency ↓
        - listitem [ref=f43e2630]: failure ↓
        - listitem [ref=f43e2631]: success rate ↑
      - paragraph [ref=f43e2632]:
        - text: 实验中 LLM calls 最多减少 11.9%，task success 提升最多 4.2 percentage points。(
        - link "Microsoft" [ref=f43e2633] [cursor=pointer]:
          - /url: https://www.microsoft.com/en-us/research/publication/optimizing-agentic-workflows-using-meta-tools/
        - text: )
      - paragraph [ref=f43e2634]: 这指向未来 Workflow 的一个演进方向：Workflow 不一定由人设计，也可能从 Agent execution traces 中编译出来。
      - heading "从 trace 到确定性流程" [level=3] [ref=f43e2635]
      - paragraph [ref=f43e2636]: 过去是：
      - generic [ref=f43e2637]: flowchart TD A["Human designs workflow"]
      - paragraph [ref=f43e2638]: 未来可能是：
      - generic [ref=f43e2639]: flowchart TD A["Agent runs"] --> B["Execution traces"] B --> C["Pattern mining"] C --> D["Stable subgraph"] D --> E["Compile into deterministic tool/workflow"]
      - paragraph [ref=f43e2640]: 收敛路径如下：
      - generic [ref=f43e2641]: flowchart TD A["Agent"] --> B["exploration"] B --> C["discovery"] C --> D["stable pattern"] D --> E["deterministic execution"]
      - paragraph [ref=f43e2642]: 最终系统变成：
      - blockquote [ref=f43e2643]:
        - paragraph [ref=f43e2644]: Agent负责探索，Workflow负责固化。
      - paragraph [ref=f43e2645]:
        - text: 论文证明的是
        - strong [ref=f43e2646]: tool sequence
        - text: 可以被打包成
        - strong [ref=f43e2647]: meta-tool
        - text: ，业务流程可以被自动固化则是本文的架构推论，强度低于前者。
      - heading "49. 三种“状态”必须分开" [level=2] [ref=f43e2648]
      - paragraph [ref=f43e2649]: Agent-first 领域里有一条主张需要在这里澄清边界：Dynamic Plan 必须持久化。这句话对长时间运行的 Agent 是成立的，一个跑几小时的 Research Task，确实需要一个可检查、可恢复的工作计划。但金融架构必须把三种完全不同的状态分开，它们的所有者、变更权限和生命周期都不一样，混成一个就会直接导致 Agent 接管流程。
      - table [ref=f43e2650]:
        - rowgroup [ref=f43e2651]:
          - row [ref=f43e2652]:
            - columnheader "状态" [ref=f43e2653]
            - columnheader "含义" [ref=f43e2654]
            - columnheader "所有者" [ref=f43e2655]
            - columnheader "能否被改写" [ref=f43e2656]
        - rowgroup [ref=f43e2657]:
          - row [ref=f43e2658]:
            - cell "Business Workflow State" [ref=f43e2659]
            - cell "这个 case 在业务流程的哪一步" [ref=f43e2660]
            - cell "Workflow Runtime" [ref=f43e2661]
            - cell "只能按 BPMN 转移" [ref=f43e2662]
          - row [ref=f43e2663]:
            - cell "Agent Task State" [ref=f43e2664]
            - cell "这个 Agent Task 在运行中、等工具、等人工还是已完成" [ref=f43e2665]
            - cell "Agent Runtime（对外可见）" [ref=f43e2666]
            - cell "受 Task Contract 与 Runtime 规则约束" [ref=f43e2667]
          - row [ref=f43e2668]:
            - cell "Agent Working Plan" [ref=f43e2669]
            - cell "Agent 为了完成这个 Task 自己排的工作顺序" [ref=f43e2670]
            - cell "Agent Runtime（内部）" [ref=f43e2671]
            - cell "可在 Task 内自由调整，甚至推倒重来" [ref=f43e2672]
      - table [ref=f43e2673]:
        - rowgroup [ref=f43e2674]:
          - row [ref=f43e2675]:
            - columnheader "Business Workflow State" [ref=f43e2676]
            - columnheader "Agent Task State" [ref=f43e2677]
            - columnheader "Agent Working Plan" [ref=f43e2678]
        - rowgroup [ref=f43e2679]:
          - row [ref=f43e2680]:
            - 'cell "BPMN: Compliance Review = RUNNING" [ref=f43e2681]': BPMN:Compliance Review = RUNNING
            - 'cell "Agent: RUNNING → WAITING_HUMAN" [ref=f43e2682]': Agent:RUNNING → WAITING_HUMAN
            - 'cell "Agent: 1. Search policy = done 2. Search cases = done 3. Analyze evidence = running 4. Draft finding = pending" [ref=f43e2683]': Agent:1. Search policy = done2. Search cases = done3. Analyze evidence = running4. Draft finding = pending
      - paragraph [ref=f43e2684]: 三者是包含关系：一个 Business Workflow State 之下有一个 Agent Task State，一个 Agent Task State 之下有一个 Working Plan，层次不同，权威源也不同。
      - paragraph [ref=f43e2685]: 分清楚之后，两个经常被混淆的判断就很清楚了：
      - list [ref=f43e2686]:
        - listitem [ref=f43e2687]:
          - strong [ref=f43e2688]: Business Workflow State
          - text: 只能由 Workflow Runtime 依据 BPMN 转移，任何第三方，包括 Agent，都不能直接改写；
        - listitem [ref=f43e2689]:
          - strong [ref=f43e2690]: Agent Working Plan
          - text: 由 Agent Runtime 自己维护，它是否持久化、持久化到什么粒度、保留多久，由 Agent Runtime 决定，它不进流程引擎，也不参与审批与责任归属。
      - paragraph [ref=f43e2691]: 因此，不要把 Agent 的 Working Plan 提升为企业业务流程的 source of truth。反过来，如果一个平台需要回答整体业务卡在哪一步，它应该去查 Workflow Runtime，而不是解析某个 Agent 的 plan。这两件事被混起来，是 Agent 接管流程这类方案在落地时最常见的失控方式。
      - heading "50. 不会被模型迭代绑死" [level=2] [ref=f43e2692]
      - paragraph [ref=f43e2693]: 比如未来可能经历以下模型更替：
      - generic [ref=f43e2694]: flowchart TD A["Claude"] --> B["GPT"] B --> C["Gemini"] C --> D["DeepSeek"] D --> E["Qwen"]
      - paragraph [ref=f43e2695]: BPMN 完全不用变。Agent Runtime 可以通过一层 model abstraction 来变化：
      - generic [ref=f43e2696]: flowchart TD A["Agent Runtime"] --> B["model abstraction"]
      - paragraph [ref=f43e2697]: 甚至 Runtime 选型本身也会换代：
      - generic [ref=f43e2698]: flowchart TD A["2026:"] --> B["LangGraph"] C["2027:"] --> D["Microsoft Agent Framework"] E["2028:"] --> F["internal runtime"]
      - paragraph [ref=f43e2699]: 业务流程仍然停留在：
      - generic [ref=f43e2700]: flowchart TD A["BPMN v7"]
      - paragraph [ref=f43e2701]: 金融企业在选型时通常会看重这一点。
      - heading "51. 最终定义" [level=2] [ref=f43e2702]
      - blockquote [ref=f43e2703]:
        - paragraph [ref=f43e2704]:
          - strong [ref=f43e2705]: BPMN 是企业业务流程的“可执行约束合同”——它约束流程怎么走，但不包含全部业务语义；DMN 是业务规则合同；Authorization / IAM 决定主体资格；Agent Policy 决定 Agent 的能力边界；Workflow Runtime 负责状态与生命周期；Agent 是完成复杂任务的智能执行者。
        - paragraph [ref=f43e2706]:
          - strong [ref=f43e2707]: 任何 Agent 驱动的业务动作，在产生业务状态变化或外部副作用之前，都必须经过确定性的 schema / business validation 与 authorization；是否需要 Human Approval，由 BPMN 与 Policy 按风险等级决定。
      - paragraph [ref=f43e2708]: “可执行约束合同”这个限定不能丢。企业里用来描述业务的东西不止一件：Ontology 描述业务对象与关系，Business Data Model 描述数据的结构与版本，DMN 描述条件判断，Policy 描述许可，而 BPMN 只描述流程走向与责任。把 BPMN 当成包含全部业务逻辑的地方，是传统流程平台常见的过度承诺，它会把越来越多的判断塞进网关和条件分支，最后没有人敢改流程，也没有人说得清某条规则的来源。
      - paragraph [ref=f43e2709]: 这张图就是第 20 节那条主线架构收束成执行路径后的形态：
      - generic [ref=f43e2710]: flowchart TD BA[Business Architect] --> BD[BPMN / DMN] BD --> WR[Workflow Runtime] WR --> HT[Human Task] WR --> ST[System Task] WR --> AT[Agent Task] AT --> AR[Agent Runtime] AR --> CT[Context] AR --> TO[Tools] AR --> RE[Reasoning] CT --> SR[Structured Result] TO --> SR RE --> SR SR --> PV[Policy / Validation] PV --> HA[Human Approval] PV --> AE[Auto Execute] HA --> BS[BPMN State] AE --> BS
      - paragraph [ref=f43e2711]: 这套架构比彻底 Agent 化 Workflow 更适合金融，也比给 BPMN 加一个 LLM Node 更实用。它的处理方式不是推翻传统 Workflow，而是把边界划清楚：业务流程仍然确定，复杂任务开始智能化，业务状态仍然由确定性 Runtime 控制。这也是真正落地时应该坚持的主线。
      - heading "最后再说一次核心命题" [level=3] [ref=f43e2712]
      - paragraph [ref=f43e2713]: 如果这篇文章只能留下一句话：
      - blockquote [ref=f43e2714]:
        - paragraph [ref=f43e2715]:
          - strong [ref=f43e2716]: 金融服务不应该在 BPMN 和 Agent 之间二选一。
        - paragraph [ref=f43e2717]: BPMN/DMN 负责确定性的业务流程、业务规则和责任边界；Agent 负责流程内部那些难以规则化的认知任务；Workflow Runtime 负责业务状态和生命周期；Policy/IAM 负责 Agent 的权限；Agent 的输出必须以受约束的 Task Contract 返回，并经过确定性验证、以及按风险需要的人工批准，才能产生业务副作用。
      - paragraph [ref=f43e2718]: 这个判断与当前几个比较成熟的方向是一致的：
      - list [ref=f43e2719]:
        - listitem [ref=f43e2720]: Camunda 官方已经把 agentic orchestration 定义成 deterministic + dynamic 并存，AI agent 负责流程中非确定性的部分；
        - listitem [ref=f43e2721]: Microsoft 的 Workflow 是 graph + executors + edges + state + runtime，同时提供 Durable Extension，而不是取消 workflow；
        - listitem [ref=f43e2722]: Temporal 把 Agent Loop 放进 durable workflow，并把 nondeterministic I/O 全部收进 Activity；
        - listitem [ref=f43e2723]: OpenAI 把 Agent Harness / Runtime 单独产品化，恰恰反证了 Agent Runtime 与 Business Workflow Runtime 必须分开；
        - listitem [ref=f43e2724]: Palantir 把企业语义与动作层独立出来，Snowflake 把 data-native agent runtime 独立出来，指向的是同一件事。
      - paragraph [ref=f43e2725]: 它比“彻底 Agent 化 Workflow”更适合金融，也比“给 BPMN 加一个 LLM Node”更实用。
