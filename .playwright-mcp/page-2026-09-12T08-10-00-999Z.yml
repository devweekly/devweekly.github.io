            - cell "Agent 看到的是哪一个版本的事实" [ref=f43e1836]
            - cell "同一个指标三个数，结论无法复核" [ref=f43e1837]
          - row [ref=f43e1838]:
            - cell "5. Control Plane" [ref=f43e1839]
            - cell "谁被允许做什么" [ref=f43e1840]
            - cell "“Agent 有权限”成了唯一的安全声明" [ref=f43e1841]
      - heading "为什么是五层，而不是四层" [level=3] [ref=f43e1842]
      - paragraph [ref=f43e1843]:
        - text: 常见的一个版本把
        - code [ref=f43e1844]: IAM / Policy / Audit / Evidence / Data
        - text: 全部放进同一个 Enterprise Control Plane，这会在两个地方出问题。第一，Data 不是控制：
      - table [ref=f43e1845]:
        - rowgroup [ref=f43e1846]:
          - row [ref=f43e1847]:
            - columnheader "平面" [ref=f43e1848]
            - columnheader "回答" [ref=f43e1849]
        - rowgroup [ref=f43e1850]:
          - row [ref=f43e1851]:
            - cell "Data / Semantic Plane" [ref=f43e1852]
            - cell "回答：世界是什么样" [ref=f43e1853]
          - row [ref=f43e1854]:
            - cell "Control Plane" [ref=f43e1855]
            - cell "回答：谁被允许做什么" [ref=f43e1856]
      - paragraph [ref=f43e1857]:
        - text: 两者放在一起，会导致“数据权限”和“数据语义”被混为一谈：访问控制做到位了，但 Agent 依然不知道
        - code [ref=f43e1858]: Position
        - text: 和
        - code [ref=f43e1859]: Portfolio
        - text: 是什么关系，前者是安全问题，后者是能不能正确工作的问题。第二，Evidence 也不是控制。Evidence 是某一次具体执行产生的产物，它天然属于执行侧，只是在最后被 Audit 引用，把 Evidence 放进 Control Plane，会让它看起来像一个统一存储，而不是每一次 Task 都必须产出的东西。它应该在另一个三层关系里被定位：Audit 记录主体，Evidence 记录依据，Trace 记录过程——也就是第 27 节要展开的内容。所以最终是五层：Process / Runtime / Agent Execution / Data & Semantic / Control。
      - heading "21. 展开图：数据与治理怎么接进来" [level=2] [ref=f43e1860]
      - generic [ref=f43e1861]: flowchart TB BA[Business Architect] BA --> BPMN[BPMN Process Definition] BA --> DMN[DMN / Business Rules] subgraph CONTROL["Business Control Plane"] BPMN DMN Roles[Roles / Responsibility] SLA[SLA / Escalation] Policy[Policy / Authority] end BPMN --> WR[Workflow Runtime] DMN --> WR Roles --> WR SLA --> WR Policy --> WR subgraph EXECUTION["Execution Plane"] WR --> HT[Human Task] WR --> ST[System Task] WR --> AT[Agent Task] WR --> WF[Sub Workflow] WR --> EVT[Wait / Event] AT --> AR[Agent Runtime] AR --> Context[Context / Knowledge] AR --> Tools[Tools / MCP / APIs] AR --> Reasoning[Reasoning / Planning] Reasoning --> Proposal[Structured Proposal] Proposal --> Gate[Policy / Validation Gate] Gate --> HT Gate --> ST end subgraph DATA["Enterprise Data"] DB[(Business Data)] DWH[(Snowflake / Data Platform)] DOC[Documents / Knowledge] end Context --> DB Context --> DWH Context --> DOC subgraph GOVERNANCE["Governance"] Audit[Audit Trail] Evidence[Evidence] Eval[Evaluation] Trace[Agent Trace] end WR --> Audit AR --> Trace AR --> Evidence Gate --> Audit AR --> Eval
      - paragraph [ref=f43e1862]: 这是第 20 节那张主线架构在数据与治理侧的展开。
