          - generic [ref=f31e1511]: Microsoft / Temporal 解决：Agent 如何可靠地长期运行
          - generic [ref=f31e1512]: Snowflake / Google 解决：Agent 如何在企业数据与语义边界内工作
          - generic [ref=f31e1513]: Policy / Governance 解决：Agent 到底有没有资格做这件事
        - button "Copy" [ref=f31e1514]
      - paragraph [ref=f31e1515]: 这五块拼起来，才接近所谓的 AI-native enterprise workflow。但这里必须停一下，因为上面的材料对不同的目标会给出相反的答案。它既能支持“BPMN 该退休”，也能支持“BPMN 是合同层”。问题不在材料，在于目标没有定清楚：我们讨论的到底是 Agent Platform，还是企业业务流程？
