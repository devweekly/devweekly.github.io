        - listitem [ref=f31e4107]: 哪几个环节并行？
      - paragraph [ref=f31e4108]: 这恰恰是金融业务最需要确定性的部分。把这条流程展开，看每一段 Task 里 Agent 具体做什么、Human 具体决定什么。
