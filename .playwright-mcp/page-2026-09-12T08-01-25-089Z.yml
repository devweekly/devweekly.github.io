      - paragraph [ref=f31e4207]: 除非明确授权。
      - heading "40. 投资研究：哪一段应该固化，哪一段必须留给 Agent" [level=2] [ref=f31e4208]
      - paragraph [ref=f31e4209]: 例如：
      - heading "投资研究" [level=3] [ref=f31e4210]
      - paragraph [ref=f31e4211]: 第一次：
      - generic [ref=f31e4213]:
        - code [ref=f31e4214]:
          - generic [ref=f31e4215]: Agent
          - generic [ref=f31e4216]: → search
          - generic [ref=f31e4217]: → SEC
          - generic [ref=f31e4218]: → research
          - generic [ref=f31e4219]: → valuation
          - generic [ref=f31e4220]: → competitor
          - generic [ref=f31e4221]: → analyst review
        - button "Copy" [ref=f31e4222]
      - paragraph [ref=f31e4223]: 此时 Agent 很自由，跑了 5000 次以后发现：
      - generic [ref=f31e4225]:
        - code [ref=f31e4226]:
          - generic [ref=f31e4227]: Company Financials
          - generic [ref=f31e4228]: → Peer Analysis
          - generic [ref=f31e4229]: → DCF
          - generic [ref=f31e4230]: → Risk Check
          - generic [ref=f31e4231]: → Report
        - button "Copy" [ref=f31e4232]
      - paragraph [ref=f31e4233]: 这套路径已经高度稳定，那么这部分就可以固化为以下流程：
      - generic [ref=f31e4235]:
        - code [ref=f31e4236]:
          - generic [ref=f31e4237]: compile
          - generic [ref=f31e4238]: ↓
          - generic [ref=f31e4239]: deterministic research workflow
        - button "Copy" [ref=f31e4240]
      - paragraph [ref=f31e4241]: 而异常情况仍交给 Agent：
      - generic [ref=f31e4243]:
        - code [ref=f31e4244]:
          - generic [ref=f31e4245]: new company
          - generic [ref=f31e4246]: unusual accounting
          - generic [ref=f31e4247]: missing data
          - generic [ref=f31e4248]: conflicting filings
        - button "Copy" [ref=f31e4249]
      - paragraph [ref=f31e4250]:
        - text: 需要强调的是，这里的“固化”并不意味着把 Agent 换成写死的代码，它的含义是把一个
        - strong [ref=f31e4251]: 已经被反复验证过的子过程
        - text: 提升为确定性步骤：
      - generic [ref=f31e4253]:
        - code [ref=f31e4254]:
          - generic [ref=f31e4255]: Company Financials → Peer Analysis → DCF → Risk Check → Report
        - button "Copy" [ref=f31e4256]
      - paragraph [ref=f31e4257]: 而异常情况仍然交给 Agent：
      - generic [ref=f31e4259]:
        - code [ref=f31e4260]:
          - generic [ref=f31e4261]: new company
          - generic [ref=f31e4262]: unusual accounting
          - generic [ref=f31e4263]: missing data
          - generic [ref=f31e4264]: conflicting filings
        - button "Copy" [ref=f31e4265]
      - paragraph [ref=f31e4266]: 这里的分工标准是任务性质：
      - blockquote [ref=f31e4267]:
        - paragraph [ref=f31e4268]: 大部分可规则化的流程保持确定性；只有真正需要语义理解、调查、推理或动态工具选择的任务引入 Agent。
      - paragraph [ref=f31e4269]: 判断某个子过程是否到了可以固化的程度，判据是它是否稳定到“两个不同的人按同样的步骤会得出同一结论”。达不到这个标准的，继续留在 Agent 侧。
      - heading "第七部分：每一层放谁" [level=1] [ref=f31e4270]
      - heading "41. Workflow Engine 的裂解" [level=2] [ref=f31e4271]
      - paragraph [ref=f31e4272]: 过去，一个系统全部负责：
      - generic [ref=f31e4274]:
        - code [ref=f31e4275]:
          - generic [ref=f31e4276]: Workflow Engine
        - button "Copy" [ref=f31e4277]
      - paragraph [ref=f31e4278]: 未来更像：
      - generic [ref=f31e4279]: flowchart TD AP[Agent Platform] --> AL[Agent Loop] AP --> DR[Durable Runtime] AP --> PE[Policy Engine] AL --> TL[Tool Layer] DR --> TL PE --> TL TL --> AP1[API] TL --> MC[MCP] TL --> HM[Human]
      - paragraph [ref=f31e4280]: 而这些能力以前往往被归到同一个“BPM / Workflow”标签下：
      - generic [ref=f31e4282]:
        - code [ref=f31e4283]:
          - generic [ref=f31e4284]: Camunda / Fluxnova / ServiceNow
          - generic [ref=f31e4285]: → business process orchestration
          - generic [ref=f31e4286]: Temporal / Durable Task
          - generic [ref=f31e4287]: → durable execution
        - button "Copy" [ref=f31e4288]
      - paragraph [ref=f31e4289]: 把它们归成同一类，是选型时最常见的起点错误。
      - heading "42. 能力 → 代表产品" [level=2] [ref=f31e4290]
      - paragraph [ref=f31e4291]: 前一版材料把行业归纳为“5 派”，那个分法把不同层次的东西并列了。按能力维度重新列一遍，选型时更不容易搞错：
      - table [ref=f31e4292]:
        - rowgroup [ref=f31e4293]:
          - row [ref=f31e4294]:
            - columnheader "能力" [ref=f31e4295]
            - columnheader "代表" [ref=f31e4296]
            - columnheader "定位" [ref=f31e4297]
        - rowgroup [ref=f31e4298]:
          - row [ref=f31e4299]:
            - cell "Business Process Orchestration" [ref=f31e4300]
            - cell "Camunda / Fluxnova" [ref=f31e4301]
            - cell "确定性流程、责任、审批、SLA、审计" [ref=f31e4302]
          - row [ref=f31e4303]:
            - cell "Agent Workflow / Graph" [ref=f31e4304]
            - cell "LangGraph / Microsoft Agent Framework / Google ADK" [ref=f31e4305]
            - cell "Agent 侧的编排图、state、checkpoint" [ref=f31e4306]
          - row [ref=f31e4307]:
            - cell "Durable Execution" [ref=f31e4308]
            - cell "Temporal / Durable Task" [ref=f31e4309]
            - cell "长时间运行、失败恢复、可重放执行" [ref=f31e4310]
          - row [ref=f31e4311]:
            - cell "Managed Agent Runtime" [ref=f31e4312]
            - cell "AWS AgentCore / OpenAI Agents API / Snowflake Cortex Agents" [ref=f31e4313]
            - cell "托管 harness、sandbox、会话上下文" [ref=f31e4314]
          - row [ref=f31e4315]:
            - cell "Enterprise Data / Ontology" [ref=f31e4316]
            - cell "Palantir / Snowflake" [ref=f31e4317]
            - cell "业务对象、语义层、动作模型" [ref=f31e4318]
      - paragraph [ref=f31e4319]: 这张表要防的是三种常见误判。
      - paragraph [ref=f31e4320]:
        - strong [ref=f31e4321]: 误判一
        - text: ：把 Agent Workflow 和 Durable Execution 当成一类。
      - paragraph [ref=f31e4322]: LangGraph 的 graph 与 Temporal 的 workflow 都在讲“编排”，但前者的产出是 Agent 的执行路径，后者的产出是可重放的执行历史。一个 Agent 图跑在 Temporal Activity 里是常见组合，但它们是两层，不是两个竞品。
      - paragraph [ref=f31e4323]:
        - strong [ref=f31e4324]: 误判二
        - text: ：把 Managed Agent Runtime 当成 Workflow Engine。
      - paragraph [ref=f31e4325]:
        - text: 这是今年最容易出的错。托管运行时的“orchestration”指的是
        - strong [ref=f31e4326]: Agent 内部的任务编排
        - text: ：决定先查什么、再调什么工具、什么时候停止。它不持有企业业务流程的状态，也不负责跨部门的审批与责任归属。
      - paragraph [ref=f31e4327]:
        - strong [ref=f31e4328]: 误判三
        - text: ：认为选了其中一层就等于有了整个架构。
      - paragraph [ref=f31e4329]: 这五层不是五个可选项，而是五个必须回答的问题。任何一层缺失，都会在落地时以事故的形式出现：
      - generic [ref=f31e4331]:
        - code [ref=f31e4332]:
          - generic [ref=f31e4333]: 缺 Workflow Runtime → 审批与状态没有权威源
          - generic [ref=f31e4334]: 缺 Agent Runtime → 无法接入模型能力
          - generic [ref=f31e4335]: 缺 Durable Execution → 长任务在失败后无法恢复
          - generic [ref=f31e4336]: 缺 Managed Runtime → 每个团队自己造 harness 与沙箱
          - generic [ref=f31e4337]: 缺 Data / Semantic → Agent 看到的事实无法确定版本
        - button "Copy" [ref=f31e4338]
      - paragraph [ref=f31e4339]: 反过来看选型问题会简单很多：不要问“谁替代谁”，要问“这一层谁来负责，以及层与层之间的契约是什么”。
      - heading "43. Camunda / Fluxnova 的合理位置" [level=2] [ref=f31e4340]
      - paragraph [ref=f31e4341]: 这一点与前面的结论有明显不同。如果企业的业务架构师已经大量使用 BPMN，并且企业已经具备：
      - list [ref=f31e4342]:
        - listitem [ref=f31e4343]: BPMN 技能
        - listitem [ref=f31e4344]: 流程资产
        - listitem [ref=f31e4345]: 流程治理
        - listitem [ref=f31e4346]: 审计模型
        - listitem [ref=f31e4347]: 人员职责
        - listitem [ref=f31e4348]: 流程设计规范
      - paragraph [ref=f31e4349]: 那么不应该建议抛弃 Camunda 一类的 BPMN Runtime，反而应保留以下定位：
      - blockquote [ref=f31e4350]:
        - paragraph [ref=f31e4351]: 保留 BPMN 作为 Business Process Control Plane。
      - paragraph [ref=f31e4352]: 然后把 Agent Runtime 接进来。
      - paragraph [ref=f31e4353]: 也就是说，选型不做二选一的对比：
      - generic [ref=f31e4355]:
        - code [ref=f31e4356]:
          - generic [ref=f31e4357]: Camunda vs Agent
        - button "Copy" [ref=f31e4358]
      - paragraph [ref=f31e4359]: 实际是两者相加：
      - generic [ref=f31e4361]:
        - code [ref=f31e4362]:
          - generic [ref=f31e4363]: Camunda
          - generic [ref=f31e4364]: +
          - generic [ref=f31e4365]: Agent Runtime
        - button "Copy" [ref=f31e4366]
      - heading "44. Palantir Ontology 的定位" [level=2] [ref=f31e4367]
      - paragraph [ref=f31e4368]: 在业务流程确定的前提下，Ontology 不应该取代 BPMN，它更适合做以下事情：
      - generic [ref=f31e4370]:
        - code [ref=f31e4371]:
