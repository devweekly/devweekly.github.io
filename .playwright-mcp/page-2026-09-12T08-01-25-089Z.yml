      - heading "为什么是五层，而不是四层" [level=3] [ref=f31e2819]
      - paragraph [ref=f31e2820]:
        - text: 常见的一个版本把
        - code [ref=f31e2821]: IAM / Policy / Audit / Evidence / Data
        - text: 全部放进同一个 Enterprise Control Plane，这会在两个地方出问题。第一，Data 不是控制：
      - generic [ref=f31e2823]:
        - code [ref=f31e2824]:
          - generic [ref=f31e2825]: Data / Semantic Plane 回答：世界是什么样
          - generic [ref=f31e2826]: Control Plane 回答： 谁被允许做什么
        - button "Copy" [ref=f31e2827]
      - paragraph [ref=f31e2828]:
        - text: 两者放在一起，会导致“数据权限”和“数据语义”被混为一谈：访问控制做到位了，但 Agent 依然不知道
        - code [ref=f31e2829]: Position
        - text: 和
        - code [ref=f31e2830]: Portfolio
        - text: 是什么关系，前者是安全问题，后者是能不能正确工作的问题。第二，Evidence 也不是控制。Evidence 是某一次具体执行产生的产物，它天然属于执行侧，只是在最后被 Audit 引用，把 Evidence 放进 Control Plane，会让它看起来像一个统一存储，而不是每一次 Task 都必须产出的东西。它应该在另一个三层关系里被定位：Audit 记录主体，Evidence 记录依据，Trace 记录过程——也就是第 27 节要展开的内容。所以最终是五层：Process / Runtime / Agent Execution / Data & Semantic / Control。
