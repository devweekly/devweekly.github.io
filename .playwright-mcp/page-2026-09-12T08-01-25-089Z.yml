      - paragraph [ref=f31e4077]: 金融机构前期绝大多数应该是 Level 1，部分低风险、重复性的任务可以做到 Level 2，Level 0 则用于真正高风险决策。
      - heading "第六部分：一个完整的金融案例" [level=1] [ref=f31e4078]
      - heading "39. Investment Idea Review 全流程" [level=2] [ref=f31e4079]
      - paragraph [ref=f31e4080]: 比如一个投资 Idea 流程：
