        - text: )。
      - paragraph [ref=f31e2133]: 另外一篇论文的内容如下：
      - heading "AI Agents in Financial Markets" [level=3] [ref=f31e2134]
      - paragraph [ref=f31e2135]: 它把金融 Agent 拆成以下结构：
      - generic [ref=f31e2137]:
