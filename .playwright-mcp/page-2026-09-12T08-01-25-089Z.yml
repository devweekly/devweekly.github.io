        - text: )，这比“客服 Agent”更接近企业真正的问题。
      - heading "17. 金融服务真正需要确定下来的六件事" [level=2] [ref=f31e2268]
      - paragraph [ref=f31e2269]: 把前三部分的材料压成六条，就得到金融服务对架构的硬约束。它们不是设计偏好，而是监管、责任和事故成本直接推导出来的结果。
      - table [ref=f31e2270]:
        - rowgroup [ref=f31e2271]:
          - row [ref=f31e2272]:
            - columnheader "#" [ref=f31e2273]
            - columnheader "约束" [ref=f31e2274]
            - columnheader "为什么" [ref=f31e2275]
            - columnheader "在架构上的落点" [ref=f31e2276]
        - rowgroup [ref=f31e2277]:
          - row [ref=f31e2278]:
            - cell "1" [ref=f31e2279]
            - cell "确定性" [ref=f31e2280]
            - cell "结论必须能从输入与规则推导出来" [ref=f31e2281]
            - cell "Workflow Runtime 持有状态转移" [ref=f31e2282]
          - row [ref=f31e2283]:
            - cell "2" [ref=f31e2284]
            - cell "责任" [ref=f31e2285]
            - cell "每个决策必须有人签字" [ref=f31e2286]
            - cell "Human Task + Identity" [ref=f31e2287]
          - row [ref=f31e2288]:
            - cell "3" [ref=f31e2289]
            - cell "审批" [ref=f31e2290]
            - cell "高风险动作不能自动生效" [ref=f31e2291]
            - cell "BPMN + Policy" [ref=f31e2292]
          - row [ref=f31e2293]:
            - cell "4" [ref=f31e2294]
            - cell "审计" [ref=f31e2295]
            - cell "事后必须能回答“谁做了什么”" [ref=f31e2296]
            - cell "Audit Trail" [ref=f31e2297]
          - row [ref=f31e2298]:
            - cell "5" [ref=f31e2299]
            - cell "授权" [ref=f31e2300]
            - cell "“能做”和“被允许做”是两件事" [ref=f31e2301]
            - cell "IAM + Agent Policy" [ref=f31e2302]
          - row [ref=f31e2303]:
            - cell "6" [ref=f31e2304]
            - cell "可追溯" [ref=f31e2305]
            - cell "结论与证据要对得上" [ref=f31e2306]
            - cell "Evidence + Agent Trace" [ref=f31e2307]
      - paragraph [ref=f31e2308]: 这六条之外，还有一条从 Verifiability Gap 直接推出来、但容易被低估的要求：可复现性（reproducibility）。传统的可复现假设是“同样输入 + 同一个流程版本 = 同样结果”，Agent 打破了这个假设：同样的输入，可能因为不同的检索结果、不同的上下文、不同的模型版本，得到不同的推理路径和结论。所以在金融场景下必须退一步，先明确自己能承诺哪一种复现：
      - generic [ref=f31e2310]:
        - code [ref=f31e2311]:
          - generic [ref=f31e2312]: Level A：完全可重放
          - generic [ref=f31e2313]: 同输入 + 同模型 + 同工具 + 同上下文快照 → 同结果
          - generic [ref=f31e2314]: （成本高，通常只用于高风险决策）
          - generic [ref=f31e2315]: Level B：可复核
          - generic [ref=f31e2316]: 同业务事实快照 + 记录在案的规则版本 + 记录在案的 Agent 轨迹
          - generic [ref=f31e2317]: → 人可以独立得出同一结论
          - generic [ref=f31e2318]: Level C：可解释
          - generic [ref=f31e2319]: 能说明结论的理由与证据来源，但不承诺独立复核能得出同一结论
        - button "Copy" [ref=f31e2320]
      - paragraph [ref=f31e2321]:
        - text: 大多数业务应该按
        - strong [ref=f31e2322]: Level B
        - text: 设计，把 Level A 留给真正需要法律级举证的动作。这个决定必须在架构设计阶段做，事后基本补不上——因为它决定的是要不要保留业务事实快照、规则版本和完整 Agent 轨迹。等审计来问的时候再补，通常已经晚了。这六条约束加上可复现等级，就是后面架构设计的全部输入。
      - heading "金融领域可以借鉴的形态" [level=3] [ref=f31e2323]
      - paragraph [ref=f31e2324]: 金融领域可以借鉴的形态，同样不是把 Agent 放在整个流程之上，而是：
      - document [ref=f31e2326]:
        - generic [ref=f31e2341]:
          - paragraph [ref=f31e2348]: Relationship Manager / Analyst
          - paragraph [ref=f31e2355]: Domain Agent
          - paragraph [ref=f31e2362]: Financial Context Layer
          - paragraph [ref=f31e2369]: Business Ontology
          - paragraph [ref=f31e2376]: Policies / Research / Documents
          - paragraph [ref=f31e2383]: Structured Data
          - paragraph [ref=f31e2390]: Dynamic Planning
          - paragraph [ref=f31e2397]: Durable Agent Runtime
          - paragraph [ref=f31e2404]: Policy / Authority
          - paragraph [ref=f31e2411]: Tool Gateway
          - paragraph [ref=f31e2418]: Human Approval
          - paragraph [ref=f31e2425]: Core Banking / Trading / CRM / Risk
          - paragraph [ref=f31e2432]: External Data Providers
          - paragraph [ref=f31e2439]: Evidence + Trace
          - paragraph [ref=f31e2446]: Audit / MRM / Compliance
      - heading "第四部分：主线架构" [level=1] [ref=f31e2447]
      - heading "18. 全文原则" [level=2] [ref=f31e2448]
      - paragraph [ref=f31e2449]: 前面十二节都是趋势观察。趋势观察的结论会随着“目标是什么”而改变：目标是通用 Agent 平台，还是金融企业的业务流程，答案可以完全相反。
      - paragraph [ref=f31e2450]: 从这一节开始，目标明确为后者：金融服务中确定性业务流程的落地架构。在这个前提下，前面那些材料会收敛出一条比两者都更窄、也更可执行的主线。
      - paragraph [ref=f31e2451]: 把“业务分析师能够把大部分流程梳理清楚”这个前提补上之后，前面的结论需要调整：对于金融服务，BPMN 不应该被淘汰。如果业务分析架构师能够把大部分业务流程、状态、审批关系、异常路径、职责边界都分析清楚，那么 BPMN/DMN 反而仍然是最合适的“业务控制平面”。真正要改的不是“有没有 Workflow”，而是分工：不要让 BPMN 承担 Agent 的智能行为，也不要让 Agent 取代 BPMN 的确定性业务控制。于是新的架构可以定义为：
      - blockquote [ref=f31e2452]:
        - paragraph [ref=f31e2453]: Deterministic Business Workflow + Bounded Agentic Execution
      - paragraph [ref=f31e2454]: 也就是：
      - generic [ref=f31e2456]:
        - code [ref=f31e2457]:
          - generic [ref=f31e2458]: 业务流程确定性
          - generic [ref=f31e2459]: +
          - generic [ref=f31e2460]: Agent 局部智能化
          - generic [ref=f31e2461]: +
          - generic [ref=f31e2462]: 统一 Policy / Authority
          - generic [ref=f31e2463]: +
          - generic [ref=f31e2464]: 统一 Audit / Evidence
        - button "Copy" [ref=f31e2465]
      - paragraph [ref=f31e2466]: 这实际上比“纯 Agent Workflow”更适合银行、保险、资管、证券。
      - heading "先定下一条原则" [level=3] [ref=f31e2467]
      - paragraph [ref=f31e2468]: 在展开这一部分之前，先把本文反复使用的那条原则定下来：
      - blockquote [ref=f31e2469]:
        - paragraph [ref=f31e2470]: 任何 Agent 驱动的业务动作，在产生业务状态变化或外部副作用之前，都必须经过确定性的 schema / business validation 与 authorization；是否需要 Human Approval，由 BPMN 与 Policy 按风险等级决定。
      - paragraph [ref=f31e2471]: 这句话里有三个从句，各自解决一个问题。“必须经过确定性验证”保证进入流程的不是一段自然语言，而是一个可校验的结构，这是后面 Task Contract 里 output schema 存在的理由。“必须经过 authorization”保证“Agent 有能力做”和“Agent 被允许做”永远是两件事，前者是模型能力问题，后者是治理问题。“是否人工批准由风险等级决定”避免两个极端：既不要求所有输出都过人工（那等于退回 Level 0，自动化失去意义），也不允许高风险动作走自动通道。后面第 34 节会说明，为什么这条原则必须同时覆盖“建议型输出”和“动作型输出”这两种 Task——只写一半，就会在评审时被抓出漏洞。
      - heading "19. 两类问题：业务怎么走，和某一步怎么完成" [level=2] [ref=f31e2472]
      - paragraph [ref=f31e2473]: 在这个场景下，整个系统可以拆成两个完全不同的问题：
      - heading "问题 A：业务应该怎么走？" [level=3] [ref=f31e2474]
      - paragraph [ref=f31e2475]: 由以下结构确定：
      - generic [ref=f31e2477]:
        - code [ref=f31e2478]:
          - generic [ref=f31e2479]: Business Architect
          - generic [ref=f31e2480]: ↓
          - generic [ref=f31e2481]: BPMN / DMN
          - generic [ref=f31e2482]: ↓
          - generic [ref=f31e2483]: Workflow Definition
        - button "Copy" [ref=f31e2484]
      - paragraph [ref=f31e2485]: 包括状态、顺序、并行、条件、审批、角色、SLA、回退、异常、补偿和业务事件，这些尽量确定。
      - heading "问题 B：某一步里面具体怎么完成？" [level=3] [ref=f31e2486]
      - paragraph [ref=f31e2487]: 这里允许 Agent，例如：
      - generic [ref=f31e2489]:
        - code [ref=f31e2490]:
          - generic [ref=f31e2491]: Compliance Review
          - generic [ref=f31e2492]: ↓
          - generic [ref=f31e2493]: "Agent:"
          - generic [ref=f31e2494]: "- 找政策"
          - generic [ref=f31e2495]: "- 找历史案例"
          - generic [ref=f31e2496]: "- 找相关文件"
          - generic [ref=f31e2497]: "- 检查证据"
          - generic [ref=f31e2498]: "- 总结风险"
          - generic [ref=f31e2499]: "- 提出建议"
          - generic [ref=f31e2500]: ↓
          - generic [ref=f31e2501]: Human
          - generic [ref=f31e2502]: ↓
          - generic [ref=f31e2503]: Approve / Reject
        - button "Copy" [ref=f31e2504]
      - paragraph [ref=f31e2505]: 因此，BPMN 决定“做什么、谁做、何时做、结果去哪”，Agent 决定“这一项任务怎么做得更好”，这是整个设计的边界所在。
      - heading "Workflow 管的是状态转移与业务责任" [level=3] [ref=f31e2506]
      - paragraph [ref=f31e2507]: 在前面那套分层里，有一个界定需要修正。原来是 Workflow 管 State + Action，在这个前提下，应该修正为 Workflow 管 State Transition + Business Responsibility，也就是：
      - generic [ref=f31e2509]:
        - code [ref=f31e2510]:
          - generic [ref=f31e2511]: BPMN
          - generic [ref=f31e2512]: ↓
          - generic [ref=f31e2513]: State
          - generic [ref=f31e2514]: ↓
          - generic [ref=f31e2515]: Task
          - generic [ref=f31e2516]: ↓
          - generic [ref=f31e2517]: Business Rule
          - generic [ref=f31e2518]: ↓
          - generic [ref=f31e2519]: Next State
        - button "Copy" [ref=f31e2520]
      - paragraph [ref=f31e2521]: 而 Agent 是：
      - generic [ref=f31e2523]:
        - code [ref=f31e2524]:
          - generic [ref=f31e2525]: Task
          - generic [ref=f31e2526]: ↓
          - generic [ref=f31e2527]: Agent Execution
          - generic [ref=f31e2528]: ↓
          - generic [ref=f31e2529]: Structured Result
        - button "Copy" [ref=f31e2530]
      - paragraph [ref=f31e2531]: Agent 不拥有 Workflow。
      - heading "20. 五层架构" [level=2] [ref=f31e2532]
      - paragraph [ref=f31e2533]: 把前面的分层和这里的约束合起来，得到本文的主线架构，也是全文唯一一张完整架构图。后面所有图都是它的局部展开。
