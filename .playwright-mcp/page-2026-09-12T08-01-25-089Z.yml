      - paragraph [ref=f31e4631]: 最终系统变成：
      - blockquote [ref=f31e4632]:
        - paragraph [ref=f31e4633]: Agent负责探索，Workflow负责固化。
      - paragraph [ref=f31e4634]:
        - text: 论文证明的是
        - strong [ref=f31e4635]: tool sequence
        - text: 可以被打包成
        - strong [ref=f31e4636]: meta-tool
        - text: ，业务流程可以被自动固化则是本文的架构推论，强度低于前者。
      - heading "49. 三种“状态”必须分开" [level=2] [ref=f31e4637]
      - paragraph [ref=f31e4638]: Agent-first 领域里有一条主张需要在这里澄清边界：Dynamic Plan 必须持久化。这句话对长时间运行的 Agent 是成立的，一个跑几小时的 Research Task，确实需要一个可检查、可恢复的工作计划。但金融架构必须把三种完全不同的状态分开，它们的所有者、变更权限和生命周期都不一样，混成一个就会直接导致 Agent 接管流程。
      - table [ref=f31e4639]:
        - rowgroup [ref=f31e4640]:
          - row [ref=f31e4641]:
            - columnheader "状态" [ref=f31e4642]
            - columnheader "含义" [ref=f31e4643]
            - columnheader "所有者" [ref=f31e4644]
            - columnheader "能否被改写" [ref=f31e4645]
        - rowgroup [ref=f31e4646]:
          - row [ref=f31e4647]:
            - cell "Business Workflow State" [ref=f31e4648]
            - cell "这个 case 在业务流程的哪一步" [ref=f31e4649]
            - cell "Workflow Runtime" [ref=f31e4650]
            - cell "只能按 BPMN 转移" [ref=f31e4651]
          - row [ref=f31e4652]:
            - cell "Agent Task State" [ref=f31e4653]
            - cell "这个 Agent Task 在运行中、等工具、等人工还是已完成" [ref=f31e4654]
            - cell "Agent Runtime（对外可见）" [ref=f31e4655]
            - cell "受 Task Contract 与 Runtime 规则约束" [ref=f31e4656]
          - row [ref=f31e4657]:
            - cell "Agent Working Plan" [ref=f31e4658]
            - cell "Agent 为了完成这个 Task 自己排的工作顺序" [ref=f31e4659]
            - cell "Agent Runtime（内部）" [ref=f31e4660]
            - cell "可在 Task 内自由调整，甚至推倒重来" [ref=f31e4661]
      - generic [ref=f31e4663]:
        - code [ref=f31e4664]:
          - generic [ref=f31e4665]: Business Workflow State Agent Task State Agent Working Plan
          - generic [ref=f31e4666]: ─────────────────────── ──────────────── ──────────────────
          - generic [ref=f31e4667]: "BPMN: Agent: Agent:"
          - generic [ref=f31e4668]: Compliance Review = RUNNING RUNNING → WAITING_HUMAN 1. Search policy = done
          - generic [ref=f31e4669]: 2. Search cases = done
          - generic [ref=f31e4670]: 3. Analyze evidence = running
          - generic [ref=f31e4671]: 4. Draft finding = pending
        - button "Copy" [ref=f31e4672]
      - paragraph [ref=f31e4673]: 三者是包含关系：一个 Business Workflow State 之下有一个 Agent Task State，一个 Agent Task State 之下有一个 Working Plan，层次不同，权威源也不同。
      - paragraph [ref=f31e4674]: 分清楚之后，两个经常被混淆的判断就很清楚了：
      - list [ref=f31e4675]:
        - listitem [ref=f31e4676]:
          - strong [ref=f31e4677]: Business Workflow State
          - text: 只能由 Workflow Runtime 依据 BPMN 转移，任何第三方，包括 Agent，都不能直接改写；
        - listitem [ref=f31e4678]:
          - strong [ref=f31e4679]: Agent Working Plan
          - text: 由 Agent Runtime 自己维护，它是否持久化、持久化到什么粒度、保留多久，由 Agent Runtime 决定，它不进流程引擎，也不参与审批与责任归属。
      - paragraph [ref=f31e4680]: 因此，不要把 Agent 的 Working Plan 提升为企业业务流程的 source of truth。反过来，如果一个平台需要回答整体业务卡在哪一步，它应该去查 Workflow Runtime，而不是解析某个 Agent 的 plan。这两件事被混起来，是 Agent 接管流程这类方案在落地时最常见的失控方式。
      - heading "50. 不会被模型迭代绑死" [level=2] [ref=f31e4681]
      - paragraph [ref=f31e4682]: 比如未来可能经历以下模型更替：
      - generic [ref=f31e4684]:
        - code [ref=f31e4685]:
          - generic [ref=f31e4686]: Claude
          - generic [ref=f31e4687]: → GPT
          - generic [ref=f31e4688]: → Gemini
          - generic [ref=f31e4689]: → DeepSeek
          - generic [ref=f31e4690]: → Qwen
        - button "Copy" [ref=f31e4691]
      - paragraph [ref=f31e4692]: BPMN 完全不用变。Agent Runtime 可以通过一层 model abstraction 来变化：
      - generic [ref=f31e4694]:
        - code [ref=f31e4695]:
          - generic [ref=f31e4696]: Agent Runtime
          - generic [ref=f31e4697]: ↓
          - generic [ref=f31e4698]: model abstraction
        - button "Copy" [ref=f31e4699]
      - paragraph [ref=f31e4700]: 甚至 Runtime 选型本身也会换代：
      - generic [ref=f31e4702]:
        - code [ref=f31e4703]:
          - generic [ref=f31e4704]: "2026:"
          - generic [ref=f31e4705]: LangGraph
          - generic [ref=f31e4706]: "2027:"
          - generic [ref=f31e4707]: Microsoft Agent Framework
          - generic [ref=f31e4708]: "2028:"
          - generic [ref=f31e4709]: internal runtime
        - button "Copy" [ref=f31e4710]
      - paragraph [ref=f31e4711]: 业务流程仍然停留在：
      - generic [ref=f31e4713]:
        - code [ref=f31e4714]:
          - generic [ref=f31e4715]: BPMN v7
        - button "Copy" [ref=f31e4716]
      - paragraph [ref=f31e4717]: 金融企业在选型时通常会看重这一点。
      - heading "51. 最终定义" [level=2] [ref=f31e4718]
      - blockquote [ref=f31e4719]:
        - paragraph [ref=f31e4720]:
          - strong [ref=f31e4721]: BPMN 是企业业务流程的“可执行约束合同”——它约束流程怎么走，但不包含全部业务语义；DMN 是业务规则合同；Authorization / IAM 决定主体资格；Agent Policy 决定 Agent 的能力边界；Workflow Runtime 负责状态与生命周期；Agent 是完成复杂任务的智能执行者。
        - paragraph [ref=f31e4722]:
          - strong [ref=f31e4723]: 任何 Agent 驱动的业务动作，在产生业务状态变化或外部副作用之前，都必须经过确定性的 schema / business validation 与 authorization；是否需要 Human Approval，由 BPMN 与 Policy 按风险等级决定。
      - paragraph [ref=f31e4724]: “可执行约束合同”这个限定不能丢。企业里用来描述业务的东西不止一件：Ontology 描述业务对象与关系，Business Data Model 描述数据的结构与版本，DMN 描述条件判断，Policy 描述许可，而 BPMN 只描述流程走向与责任。把 BPMN 当成包含全部业务逻辑的地方，是传统流程平台常见的过度承诺，它会把越来越多的判断塞进网关和条件分支，最后没有人敢改流程，也没有人说得清某条规则的来源。
      - paragraph [ref=f31e4725]: 这张图就是第 20 节那条主线架构收束成执行路径后的形态：
      - generic [ref=f31e4726]: flowchart TD BA[Business Architect] --> BD[BPMN / DMN] BD --> WR[Workflow Runtime] WR --> HT[Human Task] WR --> ST[System Task] WR --> AT[Agent Task] AT --> AR[Agent Runtime] AR --> CT[Context] AR --> TO[Tools] AR --> RE[Reasoning] CT --> SR[Structured Result] TO --> SR RE --> SR SR --> PV[Policy / Validation] PV --> HA[Human Approval] PV --> AE[Auto Execute] HA --> BS[BPMN State] AE --> BS
      - paragraph [ref=f31e4727]: 这套架构比彻底 Agent 化 Workflow 更适合金融，也比给 BPMN 加一个 LLM Node 更实用。它的处理方式不是推翻传统 Workflow，而是把边界划清楚：业务流程仍然确定，复杂任务开始智能化，业务状态仍然由确定性 Runtime 控制。这也是真正落地时应该坚持的主线。
      - heading "最后再说一次核心命题" [level=3] [ref=f31e4728]
      - paragraph [ref=f31e4729]: 如果这篇文章只能留下一句话：
      - blockquote [ref=f31e4730]:
        - paragraph [ref=f31e4731]:
          - strong [ref=f31e4732]: 金融服务不应该在 BPMN 和 Agent 之间二选一。
        - paragraph [ref=f31e4733]: BPMN/DMN 负责确定性的业务流程、业务规则和责任边界；Agent 负责流程内部那些难以规则化的认知任务；Workflow Runtime 负责业务状态和生命周期；Policy/IAM 负责 Agent 的权限；Agent 的输出必须以受约束的 Task Contract 返回，并经过确定性验证、以及按风险需要的人工批准，才能产生业务副作用。
      - paragraph [ref=f31e4734]: 这个判断与当前几个比较成熟的方向是一致的：
      - list [ref=f31e4735]:
        - listitem [ref=f31e4736]: Camunda 官方已经把 agentic orchestration 定义成 deterministic + dynamic 并存，AI agent 负责流程中非确定性的部分；
        - listitem [ref=f31e4737]: Microsoft 的 Workflow 是 graph + executors + edges + state + runtime，同时提供 Durable Extension，而不是取消 workflow；
        - listitem [ref=f31e4738]: Temporal 把 Agent Loop 放进 durable workflow，并把 nondeterministic I/O 全部收进 Activity；
        - listitem [ref=f31e4739]: OpenAI 把 Agent Harness / Runtime 单独产品化，恰恰反证了 Agent Runtime 与 Business Workflow Runtime 必须分开；
        - listitem [ref=f31e4740]: Palantir 把企业语义与动作层独立出来，Snowflake 把 data-native agent runtime 独立出来，指向的是同一件事。
      - paragraph [ref=f31e4741]: 它比“彻底 Agent 化 Workflow”更适合金融，也比“给 BPMN 加一个 LLM Node”更实用。
      - heading "52. 延伸阅读" [level=2] [ref=f31e4742]
      - paragraph [ref=f31e4743]: 学术和架构方面，可以参考：
      - list [ref=f31e4744]:
        - listitem [ref=f31e4745]:
          - text: Agent Workflow Survey (
          - link "arXiv" [ref=f31e4746] [cursor=pointer]:
            - /url: https://arxiv.org/abs/2508.01186
