      - paragraph [ref=f31e1676]: 由此可以给一个更精确的说法。一种常见的表述是“老的那套 Camunda / Fluxnova，甚至所谓 Low-code 产品，都不该再用”，这个判断要分两种情况看。
      - heading [level=3] [ref=f31e1677]:
        - text: 对
        - strong [ref=f31e1678]: Agent Platform 本身
        - text: ，基本正确。
      - paragraph [ref=f31e1679]:
        - text: 不要把
        - code [ref=f31e1680]: Camunda / Fluxnova / BPMN
        - text: 当成核心抽象。
      - heading [level=3] [ref=f31e1681]:
        - text: 对
        - strong [ref=f31e1682]: Enterprise Business Process
        - text: ，则不正确。
      - paragraph [ref=f31e1683]: BPMN 这些东西仍然很有价值，因为法律责任、合规、审批、SLA、审计、跨系统 transaction 和 human accountability 并不会因为 LLM 出现就消失。所以真正可行的架构是下面这一层组合，前两种做法都不行：
      - blockquote [ref=f31e1684]:
        - paragraph [ref=f31e1685]: Business Process Layer + Agent Execution Layer
      - paragraph [ref=f31e1686]:
        - text: 两者之间通过
        - code [ref=f31e1687]: typed task / events / policy / authority / durable state
        - text: 连接。
      - heading "从零设计一个 Agent Platform 时，应该先建什么" [level=3] [ref=f31e1688]
      - paragraph [ref=f31e1689]: 第一步不该是建 Workflow Designer，而应该先建这 7 样东西：
      - generic [ref=f31e1691]:
        - code [ref=f31e1692]:
          - generic [ref=f31e1693]: 1. Agent Runtime
          - generic [ref=f31e1694]: 2. Durable Execution Runtime
          - generic [ref=f31e1695]: 3. Tool / MCP Gateway
          - generic [ref=f31e1696]: 4. Policy & Authority Engine
          - generic [ref=f31e1697]: 5. Context / Memory Runtime
          - generic [ref=f31e1698]: 6. Human Task Runtime
          - generic [ref=f31e1699]: 7. Trace / Evaluation / Audit
        - button "Copy" [ref=f31e1700]
      - paragraph [ref=f31e1701]:
        - text: 然后再决定哪些地方需要 BPMN，哪些地方需要 Graph，哪些地方完全由 Agent 动态决定。先选 Camunda 再想办法把 Agent 塞进去，顺序就反了，这才是真正的 AI-native workflow architecture。另外，Google、Microsoft、LangGraph、Temporal 当前都在把 workflow 做成 code/runtime-first 的 graph + state + durable execution，而不是继续强化传统“业务人员拖节点”的范式；这已经不是单个厂商的偶然选择。(
        - link "GitHub" [ref=f31e1702] [cursor=pointer]:
          - /url: https://github.com/google/adk-docs/blob/main/docs/2.0/index.md
        - text: )把这个结论落到 “内部 LangChain DeepAgents + AWS AgentCore + LangSmith 的 AI 能力平台” 上，下一步最值得做的是设计一套 Agent Runtime / Execution Runtime / Business Process 三层架构，并把 Temporal、AgentCore、LangGraph、Microsoft Agent Framework、Camunda/Fluxnova 放进去逐项对比。这样才能比较清楚地判断一家平台到底应该自己做什么、买什么、哪些东西根本不该引入。把范围从厂商文档扩大到四类证据——学术研究、模型厂商实践、企业 AI 平台、金融机构与监管机构的实践——结论会更完整：2026 年真正成熟的方向，不是“把 BPMN 换成 Agent”，而是把 Workflow 拆成“Agentic Decisioning + Durable Execution + Policy/Authority + Enterprise Ontology/Data + Evaluation”。对通用 Agent 平台而言，传统 Workflow 仍然存在，但它越来越像受约束的外围控制面，而不是平台的核心抽象。
      - paragraph [ref=f31e1703]: 下面这张地图，覆盖的是这五块各自最值得追的线索。其中真正有前景的企业平台，大概率会把它们组合：
      - document [ref=f31e1705]:
        - generic [ref=f31e1713]:
          - paragraph [ref=f31e1720]: Agent Harness
          - paragraph [ref=f31e1727]: Agent Orchestration
          - paragraph [ref=f31e1734]: Durable Runtime
          - paragraph [ref=f31e1741]: Ontology
          - paragraph [ref=f31e1748]: Data
          - paragraph [ref=f31e1755]: Tools
          - paragraph [ref=f31e1762]: Policy / Identity
          - paragraph [ref=f31e1769]: Human Control
          - paragraph [ref=f31e1776]: Audit / Evaluation
      - heading "趋势阶段的金融分层" [level=3] [ref=f31e1777]
      - paragraph [ref=f31e1778]:
        - text: 趋势阶段常见的一种画法，是把 Experience、Agent、Control、Runtime、Semantic、Tools 六块并列展开。那张图不能算错，但它还没有回答本文真正关心的问题——业务状态归谁、Agent Task 的边界由谁定义。本文最终的主线架构（第 20 节）会把这两件事补上，因此这里不再重复贴图。只需要先记住其中一个判断：Ontology / Semantic Layer 和 Agent Runtime 是两个不同东西。Palantir 最强的是前者，AWS / Microsoft / OpenAI / Anthropic 最强的是后者，而 Snowflake 正在试图把
        - code [ref=f31e1779]: Data + Semantic + Agent Runtime
        - text: 放在一起。
      - heading "趋势阶段的结论" [level=3] [ref=f31e1780]
      - paragraph [ref=f31e1781]: 回到最开始那个判断：“老的 Camunda / Fluxnova，甚至所谓 Low-code，都不应该再用。”把论文与各家厂商、监管机构的材料串起来看之后，这个说法要修正得更精确。
      - heading "错误方向" [level=3] [ref=f31e1782]
