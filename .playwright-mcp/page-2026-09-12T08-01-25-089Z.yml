      - paragraph [ref=f31e1907]: 对通用 Agent 平台而言，一句话概括：未来的 Workflow 不是“下一步去哪”，而是“Agent 为了完成 Goal，可以在什么边界内，以什么权限，持续做什么，并且如何被暂停、恢复、验证和追责”。而 Palantir Ontology 解决的是“世界是什么、能对世界做什么”；Anthropic/OpenAI Harness 解决的是“Agent 如何工作”；Microsoft/Temporal/AWS 解决的是“Agent 如何可靠地长期运行”；Snowflake/Google 解决的是“Agent 如何在企业数据与语义边界内工作”；Policy/Governance 则解决“Agent 到底有没有资格做这件事”。这五块拼起来，才比较接近 AI-native enterprise workflow。而金融服务真正应该研究的核心不是“哪个 Workflow Engine 最好”，而是：
      - blockquote [ref=f31e1908]:
        - paragraph [ref=f31e1909]: Agentic Decision + Enterprise Ontology + Durable Execution + Authority + Evidence
      - paragraph [ref=f31e1910]: 这比单纯讨论 Camunda、Temporal、LangGraph 谁替代谁，层次高一个级别。
      - heading "第三部分：金融为什么不能照搬" [level=1] [ref=f31e1911]
      - paragraph [ref=f31e1912]:
        - text: 第二部分介绍的四个领域，都是通用企业场景下的正确答案。金融场景多出来的主要不是技术难度，而是
        - strong [ref=f31e1913]: 举证责任
        - text: 。这一部分说明的是：金融到底额外要求了什么，以及这些要求如何反过来决定架构。
      - heading "13. 金融真正担心的问题：Verifiability Gap" [level=2] [ref=f31e1914]
      - paragraph [ref=f31e1915]:
        - text: 通用企业场景里，最常被讨论的问题是“Agent 够不够聪明”，金融业担心的则是 Agent 到底代表谁行动，这个问题在金融业特别严重。最新一篇关于 Agentic AI governance in FinTech 的研究提出了
        - strong [ref=f31e1916]: Verifiability Gap
        - text: ，也就是说：
      - generic [ref=f31e1918]:
        - code [ref=f31e1919]:
          - generic [ref=f31e1920]: Agent Authority
          - generic [ref=f31e1921]: ↓
          - generic [ref=f31e1922]: 实际执行
          - generic [ref=f31e1923]: ↓
          - generic [ref=f31e1924]: 能否证明：
          - generic [ref=f31e1925]: 为什么当时允许它这么做？
        - button "Copy" [ref=f31e1926]
      - paragraph [ref=f31e1927]: 这项研究把 orchestration 本身看作 policy layer，并指出以下几点：
      - list [ref=f31e1928]:
        - listitem [ref=f31e1929]: orchestration 本身是 policy layer
        - listitem [ref=f31e1930]: 不同 orchestration 结构会改变最终决策
        - listitem [ref=f31e1931]: historical replay 可能无法重现
        - listitem [ref=f31e1932]: model/version变化会改变结果
        - listitem [ref=f31e1933]:
          - text: deterministic replay 并不等于 historical decision replay (
          - link "arXiv" [ref=f31e1934] [cursor=pointer]:
            - /url: https://arxiv.org/abs/2608.11344
          - text: )
      - paragraph [ref=f31e1935]: 传统 Workflow：
      - generic [ref=f31e1937]:
        - code [ref=f31e1938]:
          - generic [ref=f31e1939]: same input
          - generic [ref=f31e1940]: → same BPMN
          - generic [ref=f31e1941]: → same path
        - button "Copy" [ref=f31e1942]
      - paragraph [ref=f31e1943]: Agent：
      - generic [ref=f31e1945]:
        - code [ref=f31e1946]:
          - generic [ref=f31e1947]: same input
          - generic [ref=f31e1948]: → different reasoning
          - generic [ref=f31e1949]: → different tools
          - generic [ref=f31e1950]: → different context
          - generic [ref=f31e1951]: → different outcome
        - button "Copy" [ref=f31e1952]
      - paragraph [ref=f31e1953]: 所以：
      - blockquote [ref=f31e1954]:
        - paragraph [ref=f31e1955]: Agent Workflow 的审计对象不能只是“流程图”，而必须是 Execution Trace + Context + Authority + Evidence。
      - heading "14. 监管机构在看什么" [level=2] [ref=f31e1956]
      - heading "Bank of England" [level=3] [ref=f31e1957]
      - paragraph [ref=f31e1958]:
        - text: 2026 年 Financial Stability Report 已经专门讨论 Agentic AI，其中提到目前金融机构主要使用 Agent 做 research、coding、surveillance 和 lower-risk operations，而不是 autonomous trading。核心风险在于 output 不可预测、validation 困难、autonomy boundary 难定义，以及 correlated behavior (
        - link "Bank of England" [ref=f31e1959] [cursor=pointer]:
          - /url: https://www.bankofengland.co.uk/financial-stability-report/2026/july-2026
        - text: )。
      - heading "FSB 2026：12 类 sound practices" [level=3] [ref=f31e1960]
