            - paragraph [ref=f31e2782]: Human Approval
            - paragraph [ref=f31e2789]: Controlled Execution
      - paragraph [ref=f31e2790]: 这张图里关键的关系是 Workflow Runtime 创建并控制 Agent Task，Agent Runtime 负责完成这个 Task，也就是第 29 节说的 Agent-in-Process。同样关键的是右下角那条回路：Agent 的输出必须先过 Validation 与 Authorization，再经过必要的人工批准，最后由 Workflow Runtime 落成状态转移。Agent 在这个回路里始终是提议方，不是决定方。
      - heading "五层各自回答什么" [level=3] [ref=f31e2791]
