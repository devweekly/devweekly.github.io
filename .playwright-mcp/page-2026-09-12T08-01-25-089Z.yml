        - button "Copy" [ref=f31e3371]
      - paragraph [ref=f31e3372]: 现在：
      - generic [ref=f31e3374]:
        - code [ref=f31e3375]:
          - generic [ref=f31e3376]: Compliance
          - generic [ref=f31e3377]: ↓
          - generic [ref=f31e3378]: Agent Review
          - generic [ref=f31e3379]: ↓
          - generic [ref=f31e3380]: Human Decision
        - button "Copy" [ref=f31e3381]
      - paragraph [ref=f31e3382]: 但不能把所有东西扔给 Agent，DMN 继续负责明确业务规则。因此更合理的分工如下：
      - generic [ref=f31e3383]: flowchart LR subgraph B["BPMN"] B1[Flow] B2[Role] B3[State] B4[Approval] B5[Task] end subgraph D["DMN"] D1[Eligibility] D2[Threshold] D3[Risk classification] D4[Approval matrix] end subgraph AG["Agent"] A1[Investigation] A2[Interpretation] A3[Evidence discovery] A4[Recommendation] end
      - paragraph [ref=f31e3384]: 三者职责很清楚。
      - heading "25. Workflow 形态的正交分类" [level=2] [ref=f31e3385]
      - paragraph [ref=f31e3386]: 前面有一版分类把 Workflow 分成四种：Deterministic、Agentic、Policy、Human，这个分类不建议保留，原因不是它错，而是这四项不在同一个分类维度上：Deterministic / Agentic 描述的是执行方式，Policy 描述的是控制方式，Human 描述的是参与者。它们并不互斥，同一条流程里同时出现 Agent Task、Policy Gate 和 Human Approval 是常态：
      - generic [ref=f31e3388]:
        - code [ref=f31e3389]:
          - generic [ref=f31e3390]: BPMN Workflow
          - generic [ref=f31e3391]: ↓
          - generic [ref=f31e3392]: Agent Task
          - generic [ref=f31e3393]: ↓
          - generic [ref=f31e3394]: Policy Gate
          - generic [ref=f31e3395]: ↓
          - generic [ref=f31e3396]: Human Approval
        - button "Copy" [ref=f31e3397]
      - paragraph [ref=f31e3398]: 于是同一条流程按旧分类会同时属于四类，分类就失去了判别力，更严谨的做法是拆成三个正交维度。
      - heading "维度一：Workflow execution model" [level=3] [ref=f31e3399]
      - generic [ref=f31e3401]:
        - code [ref=f31e3402]:
          - generic [ref=f31e3403]: Deterministic
          - generic [ref=f31e3404]: Bounded Agentic
          - generic [ref=f31e3405]: Dynamic Agentic
        - button "Copy" [ref=f31e3406]
      - paragraph [ref=f31e3407]:
        - strong [ref=f31e3408]: Deterministic
        - text: —— 路径由模型明确给出：
      - generic [ref=f31e3410]:
        - code [ref=f31e3411]:
          - generic [ref=f31e3412]: Settlement
          - generic [ref=f31e3413]: Payment
          - generic [ref=f31e3414]: KYC
          - generic [ref=f31e3415]: Regulatory reporting
        - button "Copy" [ref=f31e3416]
      - paragraph [ref=f31e3417]:
        - strong [ref=f31e3418]: Bounded Agentic
        - text: —— Agent 在明确的 Task Contract 内完成一段认知工作，边界由外部定义：
      - generic [ref=f31e3420]:
        - code [ref=f31e3421]:
          - generic [ref=f31e3422]: Compliance Review
          - generic [ref=f31e3423]: ↓
          - generic [ref=f31e3424]: Agent 在 allowedTools / dataAccess / budget 内完成调查
          - generic [ref=f31e3425]: ↓
          - generic [ref=f31e3426]: 输出结构化结论
        - button "Copy" [ref=f31e3427]
      - paragraph [ref=f31e3428]:
        - strong [ref=f31e3429]: Dynamic Agentic
        - text: —— 连“下一步做什么”都由 Agent 决定：
      - generic [ref=f31e3431]:
        - code [ref=f31e3432]:
          - generic [ref=f31e3433]: “调查这家公司是否值得投资”
          - generic [ref=f31e3434]: ↓
          - generic [ref=f31e3435]: Agent 自己决定搜索、验证、追问、重写的顺序
        - button "Copy" [ref=f31e3436]
      - heading "维度二：Task execution mode" [level=3] [ref=f31e3437]
      - generic [ref=f31e3439]:
        - code [ref=f31e3440]:
          - generic [ref=f31e3441]: Human
          - generic [ref=f31e3442]: System
          - generic [ref=f31e3443]: Agent
          - generic [ref=f31e3444]: Hybrid
        - button "Copy" [ref=f31e3445]
      - paragraph [ref=f31e3446]: Hybrid 是金融场景最常见的一类：
      - generic [ref=f31e3448]:
        - code [ref=f31e3449]:
          - generic [ref=f31e3450]: Agent
          - generic [ref=f31e3451]: ↓
          - generic [ref=f31e3452]: Prepare decision package
          - generic [ref=f31e3453]: ↓
          - generic [ref=f31e3454]: Human review
          - generic [ref=f31e3455]: ↓
          - generic [ref=f31e3456]: Approve / Reject / Modify
          - generic [ref=f31e3457]: ↓
          - generic [ref=f31e3458]: Agent continues
        - button "Copy" [ref=f31e3459]
      - heading "维度三：Control" [level=3] [ref=f31e3460]
      - generic [ref=f31e3462]:
        - code [ref=f31e3463]:
          - generic [ref=f31e3464]: Rule
          - generic [ref=f31e3465]: Policy
          - generic [ref=f31e3466]: Human approval
        - button "Copy" [ref=f31e3467]
      - paragraph [ref=f31e3468]: 对应的是这条链路：
      - generic [ref=f31e3470]:
        - code [ref=f31e3471]:
          - generic [ref=f31e3472]: Agent wants to act
          - generic [ref=f31e3473]: ↓
          - generic [ref=f31e3474]: Authorization
          - generic [ref=f31e3475]: ↓
          - generic [ref=f31e3476]: Risk classification
          - generic [ref=f31e3477]: ↓
          - generic [ref=f31e3478]: Approval?
          - generic [ref=f31e3479]: ↓
          - generic [ref=f31e3480]: Execute / Reject
        - button "Copy" [ref=f31e3481]
      - heading "怎么用这三个维度描述一条流程" [level=3] [ref=f31e3482]
      - paragraph [ref=f31e3483]: 以本文后面那个投资 Idea 流程为例：
      - generic [ref=f31e3485]:
        - code [ref=f31e3486]:
          - generic [ref=f31e3487]: "execution model : Deterministic（主流程）+ Bounded Agentic（各 Review Task）"
          - generic [ref=f31e3488]: "task mode : Hybrid"
          - generic [ref=f31e3489]: "control : Rule + Policy + Human approval"
        - button "Copy" [ref=f31e3490]
      - paragraph [ref=f31e3491]: 这个描述可以直接进设计文档，而“四种形态”不能——因为它无法回答“这条流程属于哪一类”。
      - heading "26. Business Data Contract：Agent 看到的是哪一个版本的业务事实" [level=2] [ref=f31e3492]
      - paragraph [ref=f31e3493]: 金融 Agent 落地时，最大的问题往往不是 Agent Runtime 的能力，而是 Agent 到底看到的是哪一个版本的业务事实。考虑一个很普通的时间线：
      - generic [ref=f31e3495]:
        - code [ref=f31e3496]:
          - generic [ref=f31e3497]: "10:01 BPMN: Risk = 0.82"
          - generic [ref=f31e3498]: "10:05 Agent: 查 Snowflake，得到 Risk = 0.77"
          - generic [ref=f31e3499]: "10:10 Human: 界面上看到的是 0.79"
        - button "Copy" [ref=f31e3500]
      - paragraph [ref=f31e3501]: 三个数字都“正确”，因为它们来自三个时间点的不同来源，但在审计场景里，这直接导致结论无法复现。
      - paragraph [ref=f31e3502]: 所以架构上不能只有：
      - generic [ref=f31e3504]:
        - code [ref=f31e3505]:
          - generic [ref=f31e3506]: Agent → Snowflake
        - button "Copy" [ref=f31e3507]
      - paragraph [ref=f31e3508]: 而要有：
      - generic [ref=f31e3509]: flowchart TD PI[BPMN Process Instance] --> BC[Business Context] BC --> SNAP["Approved Data Snapshot<br/>Authoritative Source"] SNAP --> AT[Agent Task] AT --> RES[Structured Result] RES --> PI
      - paragraph [ref=f31e3510]: 具体要确定的是四件事：
      - paragraph [ref=f31e3511]:
        - strong [ref=f31e3512]: 权威源（authoritative source）
        - text: —— 某个业务事实以哪个系统为准。Portfolio value 是来自交易系统、估值系统还是数仓，必须指定唯一答案。允许两个系统都“能查到”，就等于允许两个结论。
      - paragraph [ref=f31e3513]:
        - strong [ref=f31e3514]: 快照语义（snapshot semantics）
        - text: —— Agent Task 开始时的业务上下文是否被冻结。如果冻结，整个 Task 内的所有查询都基于同一版本；如果不冻结，就必须显式记录每一次读取的时间戳，并接受结论建立在“混合版本”之上。
      - paragraph [ref=f31e3515]:
        - strong [ref=f31e3516]: 版本标识（context version）
        - text: —— 这个 context 需要一个可写入 Evidence 的标识，让事后能回答“当时它看到的是哪一版”。这是第 17 节里 Level B 可复现的前置条件。
      - paragraph [ref=f31e3517]:
        - strong [ref=f31e3518]: 跨系统一致性窗口
        - text: —— Position、Market price、Risk score、Compliance status 来自不同系统，同步延迟不同。要么给出一个显式的一致性窗口，要么承认“不保证一致”并把风险写进设计文档。最怕的是既没有窗口、也没有声明，等到争议出现时才发现无法解释。
      - paragraph [ref=f31e3519]: 这一层决定了 Agent 的输出能否被复核。模型可以换，harness 可以换，Agent Runtime 的框架可以换，但只要 Data Contract 是清楚的，历史决策至少可以在“同样的业务事实 + 记录在案的规则版本 + 记录在案的 Agent 轨迹”这三个条件下被复核。反过来，如果 Data Contract 不清楚，任何 audit trail 都建立不牢——因为审计看到的是一堆记录，而不是一条能走通的证据链。
      - heading "一个可复现的版本栈" [level=3] [ref=f31e3520]
      - paragraph [ref=f31e3521]: 把上面的四件事合起来，一个金融 Agent 的 Task 要在事后被完整解释，需要同时记住六个版本标识：
      - generic [ref=f31e3523]:
        - code [ref=f31e3524]:
          - generic [ref=f31e3525]: workflowVersion = investment-idea-review v17
          - generic [ref=f31e3526]: policyVersion = compliance-policy v8
          - generic [ref=f31e3527]: dataSnapshot = ctx-20260912-1030
          - generic [ref=f31e3528]: modelVersion = <model>@<version>
          - generic [ref=f31e3529]: promptVersion = compliance-review v12
          - generic [ref=f31e3530]: evidenceRef = doc-123#p17
        - button "Copy" [ref=f31e3531]
      - paragraph [ref=f31e3532]: 有了这六项，才能回答“为什么当时这个 Agent 会得到这个结论”。缺任何一项，复盘都会退化：只记 workflow 版本，说明不了 Agent 为什么这样判断；只记 model 版本，说明不了它当时看到的是哪一版业务事实。反过来也要说清边界：版本标识解决的是“可复现”，不是“可信任”。记录齐全只保证结论可以被重新推导，不保证结论正确。正确性由业务规则、验证与必要的人工审批负责。这两件事经常被混为一谈，结果是团队花大力气把日志做完整，却依然回答不了监管最关心的那个问题。这也是 Data / Semantic 层不应该被塞进 Control Plane 的原因：它回答的是“世界是什么样”，Control Plane 回答的是“谁被允许做什么”。
      - heading "27. Audit、Evidence、Agent Trace 是三件不同的事" [level=2] [ref=f31e3533]
      - paragraph [ref=f31e3534]: 这三个词在讨论里经常被并列甚至混用，但它们回答的是三个不同的问题，取证方式和保留策略也不同。
      - heading "Audit：谁在什么时候做了什么" [level=3] [ref=f31e3535]
      - generic [ref=f31e3537]:
        - code [ref=f31e3538]:
          - generic [ref=f31e3539]: user = alice
          - generic [ref=f31e3540]: action = approve
          - generic [ref=f31e3541]: task = risk-review
          - generic [ref=f31e3542]: timestamp = 2026-09-12T10:12:03Z
          - generic [ref=f31e3543]: workflow = investment-idea-review v17
        - button "Copy" [ref=f31e3544]
      - paragraph [ref=f31e3545]: 特征是主体是人和流程，与模型无关，保留期由监管要求决定。
      - heading "Evidence：这项判断依据了什么" [level=3] [ref=f31e3546]
      - generic [ref=f31e3548]:
        - code [ref=f31e3549]:
          - generic [ref=f31e3550]: document = filing-2026Q2
          - generic [ref=f31e3551]: page = 17
          - generic [ref=f31e3552]: dataSnapshot = ctx-20260912-1001
          - generic [ref=f31e3553]: policyVersion = compliance-policy v4.2
          - generic [ref=f31e3554]: retrievalRef = kbase:1234
        - button "Copy" [ref=f31e3555]
      - paragraph [ref=f31e3556]: 特征是主体是业务事实来源。它决定的是结论能不能被复核，而不是能不能被信任。
      - heading "Agent Trace：Agent 是怎么完成这个 Task 的" [level=3] [ref=f31e3557]
      - generic [ref=f31e3559]:
        - code [ref=f31e3560]:
          - generic [ref=f31e3561]: toolCall = policy.search("restricted securities")
          - generic [ref=f31e3562]: model = <model>@<version>
          - generic [ref=f31e3563]: prompt = compliance-review v3
          - generic [ref=f31e3564]: steps = [search, retrieve, compare, draft]
          - generic [ref=f31e3565]: tokens = 42,180
        - button "Copy" [ref=f31e3566]
      - paragraph [ref=f31e3567]: 特征是主体是执行过程，用于评估、调试和成本归因。保留期通常比 Audit 短，但事故发生时它往往是唯一的排查依据。
      - paragraph [ref=f31e3568]: 三者的关系：
      - generic [ref=f31e3569]: flowchart TD WR[Workflow Runtime] --> AU["Audit<br/>谁 · 何时 · 做了什么"] AT[Agent Task] --> EV["Evidence<br/>依据了什么"] AT --> TR["Agent Trace<br/>怎么做的"] AU --> Q1["合规 / 监管 / 责任"] EV --> Q2["结论可复核"] TR --> Q3["评估 / 调试 / 成本"]
      - paragraph [ref=f31e3570]:
        - text: 一个实际后果是只保留 Audit，复盘会变成“流程没错，但结论不对”；只保留 Trace，则无法回答“当时是谁批准的”。两者都要，并且必须通过同一个 Task ID 串起来，这也是 Task Contract 里
        - code [ref=f31e3571]: audit.traceLevel
        - text: 这个字段存在的意义。
      - heading "28. Agent Runtime 是嵌入式能力，不是 Workflow Engine" [level=2] [ref=f31e3572]
      - paragraph [ref=f31e3573]: 架构如下：
      - generic [ref=f31e3574]: flowchart TD BE[BPMN Engine] --> HT[Human Task] BE --> ST[System Task] BE --> AT[Agent Task] AT --> AR[Agent Runtime] AR --> TO[Tools] AR --> CT[Context] AR --> ME[Memory]
      - heading "BPMN Engine" [level=3] [ref=f31e3575]
      - paragraph [ref=f31e3576]: 负责 execution、state、task、routing、timers、events、retries、SLA 和 human workflow。
      - heading "Agent Runtime" [level=3] [ref=f31e3577]
      - paragraph [ref=f31e3578]: 负责 reasoning、tool use、context、memory、planning 和 evidence gathering。
      - paragraph [ref=f31e3579]: 两者边界很干净。
      - heading "29. “Agent-in-Process”而非“Process-in-Agent”" [level=2] [ref=f31e3580]
      - paragraph [ref=f31e3581]: 这两个名字很形象，不推荐的做法如下：
      - generic [ref=f31e3583]:
        - code [ref=f31e3584]:
          - generic [ref=f31e3585]: Agent
          - generic [ref=f31e3586]: ↓
          - generic [ref=f31e3587]: 决定整个 Business Process
        - button "Copy" [ref=f31e3588]
      - paragraph [ref=f31e3589]: 这是 Process-in-Agent，风险很大。推荐的做法如下：
      - generic [ref=f31e3591]:
        - code [ref=f31e3592]:
          - generic [ref=f31e3593]: Business Process
          - generic [ref=f31e3594]: ↓
          - generic [ref=f31e3595]: Agent Task
          - generic [ref=f31e3596]: ↓
          - generic [ref=f31e3597]: Agent
        - button "Copy" [ref=f31e3598]
      - paragraph [ref=f31e3599]: 这是 Agent-in-Process，符合金融机构对 predictable、controllable、explainable 和 auditable 的要求。
      - heading "不推荐" [level=3] [ref=f31e3600]
      - generic [ref=f31e3602]:
        - code [ref=f31e3603]:
          - generic [ref=f31e3604]: Agent
          - generic [ref=f31e3605]: ↓
          - generic [ref=f31e3606]: 决定整个 Business Process
        - button "Copy" [ref=f31e3607]
      - paragraph [ref=f31e3608]: 这是 Process-in-Agent，风险很大。
      - heading "推荐" [level=3] [ref=f31e3609]
      - generic [ref=f31e3611]:
        - code [ref=f31e3612]:
          - generic [ref=f31e3613]: Business Process
          - generic [ref=f31e3614]: ↓
          - generic [ref=f31e3615]: Agent Task
          - generic [ref=f31e3616]: ↓
          - generic [ref=f31e3617]: Agent
        - button "Copy" [ref=f31e3618]
      - paragraph [ref=f31e3619]: 这是 Agent-in-Process，符合金融机构对 predictable、controllable、explainable 和 auditable 的要求。
      - heading "30. 这套架构的名字，以及它为什么更容易治理" [level=2] [ref=f31e3620]
      - paragraph [ref=f31e3621]: 这套架构可以叫 Deterministic Core, Agentic Edge，在企业内部更贴切的说法是 Deterministic Business Process + Bounded Agent Execution。核心原则如下：
      - generic [ref=f31e3622]: flowchart TD CORE["Deterministic Core<br/>BPMN · DMN · State · Roles<br/>Approval · SLA · Policy · Audit"] EDGE["Agentic Edge<br/>Reasoning · Search · Analysis<br/>Tool use · Planning<br/>Evidence discovery · Recommendation"] VAL["Deterministic Validation<br/>Schema · Rule · Policy<br/>Authority · Human Approval"] CORE -->|Agent Task| EDGE EDGE -->|Structured Result| VAL
      - paragraph [ref=f31e3623]: 这是比较适合金融服务的“新时代 Workflow”。
      - heading "为什么它比“Agent Workflow”更容易治理" [level=3] [ref=f31e3624]
      - paragraph [ref=f31e3625]: 因为审计团队可以问：
      - heading "“这个业务流程是什么？”" [level=3] [ref=f31e3626]
      - paragraph [ref=f31e3627]: → BPMN
      - heading "“为什么这个 case 进入 Compliance？”" [level=3] [ref=f31e3628]
      - paragraph [ref=f31e3629]: → BPMN + DMN
      - heading "“为什么 Agent 推荐这个结论？”" [level=3] [ref=f31e3630]
      - paragraph [ref=f31e3631]: → Agent Trace + Evidence
      - heading "“Agent 为什么能调用这个 API？”" [level=3] [ref=f31e3632]
      - paragraph [ref=f31e3633]: → IAM + Policy
      - heading "“为什么最终允许这个动作？”" [level=3] [ref=f31e3634]
      - paragraph [ref=f31e3635]: → Workflow transition + Policy
      - heading "“谁最终批准？”" [level=3] [ref=f31e3636]
      - paragraph [ref=f31e3637]: → Human Task + Identity
      - paragraph [ref=f31e3638]: 整个责任链到这里是完整的。
      - heading "第五部分：Agent Task Contract" [level=1] [ref=f31e3639]
      - heading "31. BPMN 不应该描述 Agent 的内部过程" [level=2] [ref=f31e3640]
      - paragraph [ref=f31e3641]: 例如：
      - generic [ref=f31e3643]:
        - code [ref=f31e3644]:
          - generic [ref=f31e3645]: Compliance Review
        - button "Copy" [ref=f31e3646]
      - paragraph [ref=f31e3647]: 不要继续画成：
      - generic [ref=f31e3649]:
        - code [ref=f31e3650]:
          - generic [ref=f31e3651]: Compliance
          - generic [ref=f31e3652]: ↓
          - generic [ref=f31e3653]: Search Policy
          - generic [ref=f31e3654]: ↓
          - generic [ref=f31e3655]: Search Documents
          - generic [ref=f31e3656]: ↓
          - generic [ref=f31e3657]: Search Historical Cases
          - generic [ref=f31e3658]: ↓
          - generic [ref=f31e3659]: LLM Review
          - generic [ref=f31e3660]: ↓
          - generic [ref=f31e3661]: LLM Critic
          - generic [ref=f31e3662]: ↓
          - generic [ref=f31e3663]: Search Again
          - generic [ref=f31e3664]: ↓
          - generic [ref=f31e3665]: Summarize
        - button "Copy" [ref=f31e3666]
      - paragraph [ref=f31e3667]: 这就走偏了，BPMN 只写：
      - generic [ref=f31e3669]:
        - code [ref=f31e3670]:
          - generic [ref=f31e3671]: Compliance Review
          - generic [ref=f31e3672]: ↓
          - generic [ref=f31e3673]: Agent-assisted Review
          - generic [ref=f31e3674]: ↓
          - generic [ref=f31e3675]: Human Decision
        - button "Copy" [ref=f31e3676]
      - paragraph [ref=f31e3677]: Agent 内部：
      - generic [ref=f31e3679]:
        - code [ref=f31e3680]:
          - generic [ref=f31e3681]: search
          - generic [ref=f31e3682]: → retrieve
          - generic [ref=f31e3683]: → reason
          - generic [ref=f31e3684]: → compare
          - generic [ref=f31e3685]: → identify gap
          - generic [ref=f31e3686]: → retrieve again
          - generic [ref=f31e3687]: → produce evidence
          - generic [ref=f31e3688]: → draft recommendation
        - button "Copy" [ref=f31e3689]
      - paragraph [ref=f31e3690]:
        - text: 这些属于 Agent Runtime，这是
        - strong [ref=f31e3691]: Workflow
        - text: 和
        - strong [ref=f31e3692]: Agent
        - text: 最重要的边界。
      - heading "32. Agent Task Contract" [level=2] [ref=f31e3693]
      - paragraph [ref=f31e3694]:
        - strong [ref=f31e3695]: Agent Task Contract
        - text: 是本文的核心抽象。前面所有关于边界的讨论——流程归谁、状态归谁、权限归谁——最终都收敛到这个契约上。它很少直接给人看，主要作用是作为 BPMN 侧与 Agent 侧之间唯一需要对齐的接口。
      - paragraph [ref=f31e3696]: 两者的对应关系如下：
      - generic [ref=f31e3698]:
        - code [ref=f31e3699]:
          - generic [ref=f31e3700]: Agent = Workflow
        - button "Copy" [ref=f31e3701]
      - paragraph [ref=f31e3702]: 上式不成立，实际应为：
      - generic [ref=f31e3704]:
        - code [ref=f31e3705]:
          - generic [ref=f31e3706]: BPMN Activity
          - generic [ref=f31e3707]: ↓
          - generic [ref=f31e3708]: Agent Activity
        - button "Copy" [ref=f31e3709]
      - paragraph [ref=f31e3710]: 例如：
      - generic [ref=f31e3712]:
        - code [ref=f31e3713]:
          - generic [ref=f31e3714]: "activity:"
          - generic [ref=f31e3715]: "id: compliance-review"
          - generic [ref=f31e3716]: "type: agent-task"
          - generic [ref=f31e3717]: "input:"
          - generic [ref=f31e3718]: "- investment_case"
          - generic [ref=f31e3719]: "- supporting_documents"
          - generic [ref=f31e3720]: "- compliance_policy"
          - generic [ref=f31e3721]: "output:"
          - generic [ref=f31e3722]: "- findings"
          - generic [ref=f31e3723]: "- evidence"
          - generic [ref=f31e3724]: "- recommendation"
          - generic [ref=f31e3725]: "- missing_information"
          - generic [ref=f31e3726]: "allowedTools:"
          - generic [ref=f31e3727]: "- policy.search"
          - generic [ref=f31e3728]: "- document.search"
          - generic [ref=f31e3729]: "- risk.lookup"
          - generic [ref=f31e3730]: "approval:"
          - generic [ref=f31e3731]: "required: true"
        - button "Copy" [ref=f31e3732]
      - paragraph [ref=f31e3733]: 这个 Activity 对 BPMN Runtime 来说仍然是一个普通 Task，只不过内部用了 Agent。
      - heading "一份完整的 Agent Task Contract" [level=3] [ref=f31e3734]
      - paragraph [ref=f31e3735]: 把上一节那个 YAML 展开，一份可用的 Agent Task Contract 至少需要十一项：
      - generic [ref=f31e3737]:
        - code [ref=f31e3738]:
          - generic [ref=f31e3739]: "agentTask:"
          - generic [ref=f31e3740]: "id: compliance-review"
          - generic [ref=f31e3741]: "workflow: investment-idea-review"
          - generic [ref=f31e3742]: "input:"
          - generic [ref=f31e3743]: "schema: InvestmentCase.v3"
          - generic [ref=f31e3744]: "output:"
          - generic [ref=f31e3745]: "schema: ComplianceFinding.v2"
          - generic [ref=f31e3746]: "capabilities:"
          - generic [ref=f31e3747]: "- policy.search"
          - generic [ref=f31e3748]: "- document.search"
          - generic [ref=f31e3749]: "- risk.lookup"
          - generic [ref=f31e3750]: "dataAccess:"
          - generic [ref=f31e3751]: "- investment.case"
          - generic [ref=f31e3752]: "- approved.documents"
          - generic [ref=f31e3753]: "- snapshot: ctx-20260912-1001"
          - generic [ref=f31e3754]: "instruction: compliance-review-policy v4.2"
          - generic [ref=f31e3755]: "execution:"
          - generic [ref=f31e3756]: "maxDuration: 15m"
          - generic [ref=f31e3757]: "maxToolCalls: 30"
          - generic [ref=f31e3758]: "maxTokens: 120000"
          - generic [ref=f31e3759]: "retry:"
          - generic [ref=f31e3760]: "maxAttempts: 2"
          - generic [ref=f31e3761]: "onFailure: escalate"
          - generic [ref=f31e3762]: "control:"
          - generic [ref=f31e3763]: "autoExecute: false"
          - generic [ref=f31e3764]: "humanApproval: required"
          - generic [ref=f31e3765]: "evidence:"
          - generic [ref=f31e3766]: "required: true"
          - generic [ref=f31e3767]: "citationRequired: true"
          - generic [ref=f31e3768]: "escalation:"
          - generic [ref=f31e3769]: "onLowConfidence: human"
          - generic [ref=f31e3770]: "onInsufficientEvidence: request_changes"
          - generic [ref=f31e3771]: "evaluation:"
          - generic [ref=f31e3772]: "criteria: compliance-finding-accuracy"
          - generic [ref=f31e3773]: "minConfidence: 0.8"
          - generic [ref=f31e3774]: "audit:"
          - generic [ref=f31e3775]: "traceLevel: full"
        - button "Copy" [ref=f31e3776]
      - paragraph [ref=f31e3777]: 逐项说明，以及缺了会怎样：
      - table [ref=f31e3778]:
        - rowgroup [ref=f31e3779]:
          - row [ref=f31e3780]:
            - columnheader "字段" [ref=f31e3781]
            - columnheader "作用" [ref=f31e3782]
            - columnheader "缺了会怎样" [ref=f31e3783]
        - rowgroup [ref=f31e3784]:
          - row [ref=f31e3785]:
            - cell "input / output schema" [ref=f31e3786]
            - cell "定义 Task 的输入输出类型" [ref=f31e3787]
            - cell "输出变成自由文本，无法进入流程" [ref=f31e3788]
          - row [ref=f31e3789]:
            - cell "capabilities" [ref=f31e3790]
            - cell "允许调用的工具集合" [ref=f31e3791]
            - cell "Agent 可以调用未授权的能力" [ref=f31e3792]
          - row [ref=f31e3793]:
            - cell "dataAccess" [ref=f31e3794]
            - cell "允许读取的数据范围与快照" [ref=f31e3795]
            - cell "Agent 看到不确定版本的事实" [ref=f31e3796]
          - row [ref=f31e3797]:
            - cell "instruction" [ref=f31e3798]
            - cell "该 Task 使用的策略版本" [ref=f31e3799]
            - cell "无法解释某次决策依据了哪版规则" [ref=f31e3800]
          - row [ref=f31e3801]:
            - cell "execution budget" [ref=f31e3802]
            - cell "时长、工具调用数、token 上限" [ref=f31e3803]
            - cell "成本与时长失控" [ref=f31e3804]
          - row [ref=f31e3805]:
            - cell "retry / escalation" [ref=f31e3806]
            - cell "失败与低置信度时的去向" [ref=f31e3807]
            - cell "失败被静默吞掉，或无限重试" [ref=f31e3808]
          - row [ref=f31e3809]:
            - cell "control" [ref=f31e3810]
            - cell "是否需要人工批准" [ref=f31e3811]
            - cell "高风险动作被自动执行" [ref=f31e3812]
          - row [ref=f31e3813]:
            - cell "evidence" [ref=f31e3814]
            - cell "是否必须给出证据与引用" [ref=f31e3815]
            - cell "结论无法复核" [ref=f31e3816]
          - row [ref=f31e3817]:
            - cell "evaluation" [ref=f31e3818]
            - cell "用哪套标准衡量质量" [ref=f31e3819]
            - cell "质量只能凭感觉" [ref=f31e3820]
          - row [ref=f31e3821]:
            - cell "audit" [ref=f31e3822]
            - cell "轨迹粒度" [ref=f31e3823]
            - cell "出事故后无法复盘" [ref=f31e3824]
      - heading "这份契约真正的价值" [level=3] [ref=f31e3825]
      - paragraph [ref=f31e3826]: 它把两个以前混在一起的问题分开了：
      - generic [ref=f31e3828]:
        - code [ref=f31e3829]:
          - generic [ref=f31e3830]: BPMN 侧看到的是： 一个 Task，有 ID、有输入、有输出、有 SLA、有审批
          - generic [ref=f31e3831]: Agent 侧看到的是： 一份边界声明，允许它在这个范围内自由决定怎么做
        - button "Copy" [ref=f31e3832]
      - paragraph [ref=f31e3833]: 于是两边可以独立演进：流程改了，只要契约不变，Agent 不用动；Agent 换了模型或框架，只要契约不变，流程不用动。这就是“受约束的智能”的实际含义：自由度留在合约内部，责任留在合约外部。
      - heading "33. Agent 的输出必须结构化" [level=2] [ref=f31e3834]
      - paragraph [ref=f31e3835]: 这是金融领域必须坚持的一条，具体做法如下。
      - paragraph [ref=f31e3836]: 输出不采用以下形式：
      - generic [ref=f31e3838]:
        - code [ref=f31e3839]:
          - generic [ref=f31e3840]: Agent → 一段自然语言
        - button "Copy" [ref=f31e3841]
      - paragraph [ref=f31e3842]: 输出采用以下结构：
      - generic [ref=f31e3844]:
        - code [ref=f31e3845]:
          - generic [ref=f31e3846]: "{"
          - generic [ref=f31e3847]: "\"decision\": \"REQUEST_CHANGES\","
          - generic [ref=f31e3848]: "\"findings\": ["
          - generic [ref=f31e3849]: "{"
          - generic [ref=f31e3850]: "\"type\": \"MISSING_EVIDENCE\","
          - generic [ref=f31e3851]: "\"description\": \"2025 cash flow forecast missing\""
          - generic [ref=f31e3852]: "}"
          - generic [ref=f31e3853]: "],"
          - generic [ref=f31e3854]: "\"evidence\": ["
          - generic [ref=f31e3855]: "{"
          - generic [ref=f31e3856]: "\"documentId\": \"doc-123\","
          - generic [ref=f31e3857]: "\"page\": 17"
          - generic [ref=f31e3858]: "}"
          - generic [ref=f31e3859]: "],"
          - generic [ref=f31e3860]: "\"confidence\": 0.91"
          - generic [ref=f31e3861]: "}"
        - button "Copy" [ref=f31e3862]
      - paragraph [ref=f31e3863]:
        - text: 这里需要先说明一个细节：
        - code [ref=f31e3864]: confidence
        - text: 是模型自报的数值，不应被当作业务可信度或风险评分使用。一个自报 0.91 的结论可能建立在残缺的证据上，一个自报 0.60 的结论也可能恰好正确——两者之间没有校准关系。如果架构上确实需要“置信度”，它应当由独立的验证或评估机制产生（例如多次 trial 的一致性、证据充分性检查、历史准确率），或者至少明确标注为“模型自评”，不允许直接进入流程判断。
      - paragraph [ref=f31e3865]: Workflow Runtime 只接受：
      - generic [ref=f31e3867]:
        - code [ref=f31e3868]:
          - generic [ref=f31e3869]: validated structured output
        - button "Copy" [ref=f31e3870]
      - paragraph [ref=f31e3871]: 然后 BPMN 决定：
      - generic [ref=f31e3873]:
        - code [ref=f31e3874]:
          - generic [ref=f31e3875]: REQUEST_CHANGES
          - generic [ref=f31e3876]: ↓
          - generic [ref=f31e3877]: Research
        - button "Copy" [ref=f31e3878]
      - paragraph [ref=f31e3879]: 或者：
      - generic [ref=f31e3881]:
        - code [ref=f31e3882]:
          - generic [ref=f31e3883]: APPROVE
          - generic [ref=f31e3884]: ↓
          - generic [ref=f31e3885]: Next Step
        - button "Copy" [ref=f31e3886]
      - paragraph [ref=f31e3887]: 因此，Agent 提议业务状态变化，Workflow Runtime 决定它是否真的发生。更精确的表述见第 34 节：Agent 输出的是业务建议或动作提议，共同决定它的是 Workflow Runtime、Business Rule、Authorization 和必要的 Human Task。
      - heading "34. Analysis Task 与 Action Task" [level=2] [ref=f31e3888]
      - paragraph [ref=f31e3889]: 有一个容易含糊的地方需要区分清楚：Agent 的“输出”到底指什么。在本文的模型里，Agent Task 分两类，它们的输出性质完全不同。
      - heading "Agent Analysis Task" [level=3] [ref=f31e3890]
      - paragraph [ref=f31e3891]:
        - text: Agent 产出的是
        - strong [ref=f31e3892]: 判断材料
        - text: ，其作用不含流程指令：
      - generic [ref=f31e3894]:
        - code [ref=f31e3895]:
          - generic [ref=f31e3896]: "{"
          - generic [ref=f31e3897]: "\"recommendation\": \"REQUEST_CHANGES\","
          - generic [ref=f31e3898]: "\"findings\": ["
          - generic [ref=f31e3899]: "{ \"type\": \"MISSING_EVIDENCE\", \"description\": \"2025 现金流预测缺失\" }"
          - generic [ref=f31e3900]: "],"
          - generic [ref=f31e3901]: "\"evidence\": [{ \"documentId\": \"doc-123\", \"page\": 17 }],"
          - generic [ref=f31e3902]: "\"confidence\": 0.91"
          - generic [ref=f31e3903]: "}"
        - button "Copy" [ref=f31e3904]
      - paragraph [ref=f31e3905]:
        - text: 它不应该输出
        - strong [ref=f31e3906]: workflow transition
        - text: 。
      - paragraph [ref=f31e3907]:
        - text: 即使字段名叫
        - code [ref=f31e3908]: recommendation
        - text: ，它的语义也只是“建议把流程导向 Request Changes”。真正决定是否回到 Research 的，是 BPMN 的网关、DMN 的规则，或者一个 Human Task。
      - paragraph [ref=f31e3909]: 把这两件事分开有两个实际好处：
      - list [ref=f31e3910]:
        - listitem [ref=f31e3911]: Agent 的 prompt 里不再需要写“如果……就直接跳到第几步”，流程知识只存在一个地方；
        - listitem [ref=f31e3912]: BPMN 不依赖模型输出的语义，模型升级不会悄悄改变流程走向。
      - heading "Agent Action Task" [level=3] [ref=f31e3913]
      - paragraph [ref=f31e3914]:
        - text: 低风险场景下，Agent 可以提出一个
        - strong [ref=f31e3915]: 动作提议
        - text: ：
      - generic [ref=f31e3917]:
        - code [ref=f31e3918]:
          - generic [ref=f31e3919]: "{"
          - generic [ref=f31e3920]: "\"action\": \"CLASSIFY_DOCUMENT\","
          - generic [ref=f31e3921]: "\"target\": \"doc-123\","
          - generic [ref=f31e3922]: "\"value\": \"quarterly_report\","
          - generic [ref=f31e3923]: "\"confidence\": 0.96"
          - generic [ref=f31e3924]: "}"
        - button "Copy" [ref=f31e3925]
      - paragraph [ref=f31e3926]: 这个动作经过 policy 判断后可以自动执行，“可以自动执行”这个授权由 Policy 配置给出。
      - heading "更精确的表述" [level=3] [ref=f31e3927]
      - paragraph [ref=f31e3928]: 于是前面那句“Agent 提议状态变化，Workflow 决定是否真的发生状态变化”，应该修正为：
      - blockquote [ref=f31e3929]:
        - paragraph [ref=f31e3930]: Agent 输出业务建议或动作提议；Workflow Runtime、Business Rule、Authorization 和必要的 Human Task，共同决定这个提议是否能够产生业务状态变化。
      - paragraph [ref=f31e3931]: 这个表述多出来的部分（Business Rule、Authorization、Human Task），正是金融场景里最需要被明确归属的三个环节。少写一个，评审时就会被追问“那这里谁负责”。
      - heading "35. Governed Action Pipeline" [level=2] [ref=f31e3932]
      - paragraph [ref=f31e3933]: 在金融 Agent workflow 里，任何 Agent 行为都可以统一看成：
      - generic [ref=f31e3935]:
        - code [ref=f31e3936]:
          - generic [ref=f31e3937]: Agent
          - generic [ref=f31e3938]: ↓
          - generic [ref=f31e3939]: Proposal
          - generic [ref=f31e3940]: ↓
          - generic [ref=f31e3941]: Validation
          - generic [ref=f31e3942]: ↓
          - generic [ref=f31e3943]: Authorization
          - generic [ref=f31e3944]: ↓
          - generic [ref=f31e3945]: Execution
        - button "Copy" [ref=f31e3946]
      - paragraph [ref=f31e3947]: 例如：
      - generic [ref=f31e3948]: "flowchart LR A[Agent] --> P[Proposal] P --> V[Schema / Business Validation] V --> Q[Policy Check] Q --> H{Human Approval?} H -->|Yes| HA[Human] H -->|No| E[Execute] HA -->|Approve| E HA -->|Reject| R[Reject] E --> S[State Transition]"
      - paragraph [ref=f31e3949]: 与以下做法相比：
      - generic [ref=f31e3951]:
        - code [ref=f31e3952]:
          - generic [ref=f31e3953]: Agent → API
        - button "Copy" [ref=f31e3954]
      - paragraph [ref=f31e3955]: 这种方式安全和可审计得多。
      - heading "为什么叫“管道”，而不是“事务”" [level=3] [ref=f31e3956]
      - paragraph [ref=f31e3957]: 这条链路的完整形态是：
      - generic [ref=f31e3959]:
        - code [ref=f31e3960]:
          - generic [ref=f31e3961]: Agent Proposal
          - generic [ref=f31e3962]: ↓
          - generic [ref=f31e3963]: Schema / Semantic Validation
          - generic [ref=f31e3964]: ↓
          - generic [ref=f31e3965]: Business Rule
          - generic [ref=f31e3966]: ↓
          - generic [ref=f31e3967]: Authorization
          - generic [ref=f31e3968]: ↓
          - generic [ref=f31e3969]: Human Approval (when required)
          - generic [ref=f31e3970]: ↓
          - generic [ref=f31e3971]: Execution
          - generic [ref=f31e3972]: ↓
          - generic [ref=f31e3973]: Business State Transition
        - button "Copy" [ref=f31e3974]
      - paragraph [ref=f31e3975]:
        - text: 它的语义是
        - strong [ref=f31e3976]: 动作治理与授权
        - text: ：关心的是“这个动作有没有资格发生”。它不是分布式事务协议，也不涉及多个参与者能否原子提交的问题——把它套进事务语义去讨论，会让评审直接跑偏到错误的抽象层次上，去追问一个并不存在的协调者。
      - paragraph [ref=f31e3977]: 还有一点要写清楚：这条管道只负责把一个提议送达到“执行或拒绝”这个结论，它本身不产生业务状态转移。最终的状态转移仍然由 Workflow Runtime 依据 BPMN 完成，这也是整套架构里职责划分最干净的一条边界。
      - heading "36. “审批”怎么处理" [level=2] [ref=f31e3978]
      - paragraph [ref=f31e3979]: 例如 PM Approval：
      - generic [ref=f31e3981]:
        - code [ref=f31e3982]:
          - generic [ref=f31e3983]: "BPMN:"
          - generic [ref=f31e3984]: PM Approval
        - button "Copy" [ref=f31e3985]
      - paragraph [ref=f31e3986]: 内部可以：
      - generic [ref=f31e3988]:
        - code [ref=f31e3989]:
          - generic [ref=f31e3990]: Agent prepares recommendation
          - generic [ref=f31e3991]: ↓
          - generic [ref=f31e3992]: "Agent highlights:"
          - generic [ref=f31e3993]: "- expected return"
          - generic [ref=f31e3994]: "- downside"
          - generic [ref=f31e3995]: "- risk"
          - generic [ref=f31e3996]: "- missing evidence"
          - generic [ref=f31e3997]: "- policy violations"
          - generic [ref=f31e3998]: ↓
          - generic [ref=f31e3999]: PM
          - generic [ref=f31e4000]: ↓
          - generic [ref=f31e4001]: Approve / Reject / Request Changes
        - button "Copy" [ref=f31e4002]
      - paragraph [ref=f31e4003]: PM 的按钮仍然是：
      - generic [ref=f31e4005]:
        - code [ref=f31e4006]:
          - generic [ref=f31e4007]: Approve
          - generic [ref=f31e4008]: Reject
          - generic [ref=f31e4009]: Request Changes
        - button "Copy" [ref=f31e4010]
      - paragraph [ref=f31e4011]: Agent 不能替 PM 点击，这正是 AI assistance ≠ AI authority 所表达的意思。
      - heading "37. “修改”也由 BPMN 明确控制" [level=2] [ref=f31e4012]
      - paragraph [ref=f31e4013]: 例如：
      - generic [ref=f31e4014]: flowchart LR RR[Risk Review] -->|Approve| CP[Compliance] RR -->|Reject| EN[End] RR -->|Request Changes| RS[Research]
      - paragraph [ref=f31e4015]: 这在 BPMN 中完全合理。
      - paragraph [ref=f31e4016]: 然后：
      - generic [ref=f31e4018]:
        - code [ref=f31e4019]:
          - generic [ref=f31e4020]: Research
          - generic [ref=f31e4021]: ↓
          - generic [ref=f31e4022]: 修改材料
          - generic [ref=f31e4023]: ↓
          - generic [ref=f31e4024]: Submit
          - generic [ref=f31e4025]: ↓
          - generic [ref=f31e4026]: Risk Review
        - button "Copy" [ref=f31e4027]
      - paragraph [ref=f31e4028]: 这里 BPMN 描述的是确定性的状态转移规则；至于某个具体的 process instance 此刻处于什么状态，由 Workflow Runtime 持有。
      - paragraph [ref=f31e4029]: 不需要由 Agent 来决定“我觉得应该回到 Research”。
      - heading "38. 什么时候允许 Agent 自己完成一个 Task" [level=2] [ref=f31e4030]
      - paragraph [ref=f31e4031]: 不用改 Workflow，只需要改变以下配置：
      - generic [ref=f31e4033]:
        - code [ref=f31e4034]:
          - generic [ref=f31e4035]: Agent Authority Policy
