      - heading "第九部分：长期演进" [level=1] [ref=f31e4559]
      - heading "48. Agent 负责探索，Workflow 负责固化" [level=2] [ref=f31e4560]
      - paragraph [ref=f31e4561]: 前面讨论的都是当前应该怎么设计，这一部分讨论的是长期演进，需要先把它的性质说清楚：这一节的结论是架构推论，不是论文结论。区分这一点很必要，因为它决定了这部分内容应该放在核心架构还是演进方向，答案是后者。
      - paragraph [ref=f31e4562]: 微软研究院最近有一项研究：
      - heading "Optimizing Agentic Workflows using Meta-tools" [level=3] [ref=f31e4563]
      - paragraph [ref=f31e4564]: 它发现很多 Agent Workflow 会反复走以下路径：
      - generic [ref=f31e4566]:
        - code [ref=f31e4567]:
          - generic [ref=f31e4568]: LLM
          - generic [ref=f31e4569]: → tool
          - generic [ref=f31e4570]: → LLM
          - generic [ref=f31e4571]: → tool
          - generic [ref=f31e4572]: → LLM
          - generic [ref=f31e4573]: → tool
        - button "Copy" [ref=f31e4574]
      - paragraph [ref=f31e4575]: 但这些 tool-call pattern 实际上稳定重复，因此可以做如下收敛：
      - generic [ref=f31e4577]:
        - code [ref=f31e4578]:
          - generic [ref=f31e4579]: Agent Trace
          - generic [ref=f31e4580]: ↓
          - generic [ref=f31e4581]: 发现高频 tool sequence
          - generic [ref=f31e4582]: ↓
          - generic [ref=f31e4583]: 自动封装成 Meta-tool
          - generic [ref=f31e4584]: ↓
          - generic [ref=f31e4585]: Agent 一次调用
        - button "Copy" [ref=f31e4586]
      - paragraph [ref=f31e4587]: 这样 LLM calls 下降，latency 下降，failure 下降，success rate 上升：
      - list [ref=f31e4588]:
        - listitem [ref=f31e4589]: LLM calls ↓
        - listitem [ref=f31e4590]: latency ↓
        - listitem [ref=f31e4591]: failure ↓
        - listitem [ref=f31e4592]: success rate ↑
      - paragraph [ref=f31e4593]:
        - text: 实验中 LLM calls 最多减少 11.9%，task success 提升最多 4.2 percentage points。(
        - link "Microsoft" [ref=f31e4594] [cursor=pointer]:
          - /url: https://www.microsoft.com/en-us/research/publication/optimizing-agentic-workflows-using-meta-tools/
        - text: )
      - paragraph [ref=f31e4595]: 这指向未来 Workflow 的一个演进方向：Workflow 不一定由人设计，也可能从 Agent execution traces 中编译出来。
      - heading "从 trace 到确定性流程" [level=3] [ref=f31e4596]
