    - heading "AI时代的业务流程workflow该怎么做？bpmn还是agent" [level=1] [ref=f31e29]
    - generic [ref=f31e30]:
      - generic [ref=f31e34]: "Published:"
      - generic [ref=f31e35]:
        - time [ref=f31e36]: Sep 12, 2026
        - text: "|"
        - generic [ref=f31e37]: at
        - text: 09:23 AM
    - article [ref=f31e38]:
      - paragraph [ref=f31e39]: 2026 年关于“业务流程该用 BPMN 还是 Agent”的讨论，很容易滑向两个极端：一种认为 Workflow 已经过时，另一种把 Agent 当成一个新的节点类型塞进旧流程。把厂商文档、开源实现、学术研究和金融机构的实践放在一起看，得到的答案不是二选一。
      - paragraph [ref=f31e40]: 这篇文章要回答的问题只有一个：在金融服务里，确定性的业务流程和概率性的智能能力，应该怎么被拼在一起？
      - paragraph [ref=f31e41]: 结论先放在这里：
      - blockquote [ref=f31e42]:
        - paragraph [ref=f31e43]: 金融服务不应该在 BPMN 和 Agent 之间二选一。BPMN/DMN 负责确定性的业务流程、业务规则和责任边界；Agent 负责流程内部那些难以规则化的认知任务；Workflow Runtime 负责业务状态和生命周期；Policy/IAM 负责 Agent 的权限；Agent 的输出必须以受约束的 Task Contract 返回，并经过确定性验证、以及按风险需要的人工批准，才能产生业务副作用。
      - heading "这篇文章的结构" [level=3] [ref=f31e44]
      - paragraph [ref=f31e45]: 需要先说明一件事：本文前半部分讨论的 Agent-first 模型（Agent Runtime + Dynamic Plan + Durable Runtime），是通用 Agent 平台这一领域的真实主张，也是 2026 年厂商投入最大的一条线。它是趋势的一部分，但不是本文对金融业务的结论。所以全文按两条线组织：
      - table [ref=f31e46]:
        - rowgroup [ref=f31e47]:
          - row [ref=f31e48]:
            - columnheader "部分" [ref=f31e49]
            - columnheader "回答什么" [ref=f31e50]
            - columnheader "性质" [ref=f31e51]
        - rowgroup [ref=f31e52]:
          - row [ref=f31e53]:
            - cell "第一部分" [ref=f31e54]
            - cell "为什么两个极端都不成立" [ref=f31e55]
            - cell "问题定义" [ref=f31e56]
          - row [ref=f31e57]:
            - cell "第二部分" [ref=f31e58]
            - cell "行业四个架构领域各自在解决什么" [ref=f31e59]
            - cell "趋势观察（含 Agent-first 领域）" [ref=f31e60]
          - row [ref=f31e61]:
            - cell "第三部分" [ref=f31e62]
            - cell "金融为什么不能照搬" [ref=f31e63]
            - cell "约束条件" [ref=f31e64]
          - row [ref=f31e65]:
            - cell "第四、五部分" [ref=f31e66]
            - cell "主线架构与 Agent Task Contract" [ref=f31e67]
            - cell "本文结论" [ref=f31e68]
          - row [ref=f31e69]:
            - cell "第六至九部分" [ref=f31e70]
            - cell "案例、选型、落地、长期演进" [ref=f31e71]
            - cell "可执行部分" [ref=f31e72]
      - paragraph [ref=f31e73]: 只想看结论的读者，可以直接跳到第四部分和第五部分。
      - heading "第一部分：问题定义" [level=1] [ref=f31e74]
      - heading "1. 两个极端" [level=2] [ref=f31e75]
      - paragraph [ref=f31e76]: Agent 进入业务流程的早期，工程团队通常会落到两个极端之一。第一个极端是“BPMN → Agent”：在既有的流程引擎里加一个 Agent 节点，把原来需要智能判断的那一步换成一次 LLM 调用：
      - generic [ref=f31e78]:
        - code [ref=f31e79]:
          - generic [ref=f31e80]: Service Task
          - generic [ref=f31e81]: ↓
          - generic [ref=f31e82]: LLM Node
          - generic [ref=f31e83]: ↓
          - generic [ref=f31e84]: Service Task
        - button "Copy" [ref=f31e85]
      - paragraph [ref=f31e86]: 流程图画得很完整，看起来很可控。
      - paragraph [ref=f31e87]: 第二个极端是“Agent → Everything”：把整个业务流程交给 Agent：
      - generic [ref=f31e89]:
        - code [ref=f31e90]:
          - generic [ref=f31e91]: User Intent
          - generic [ref=f31e92]: ↓
          - generic [ref=f31e93]: Agent
          - generic [ref=f31e94]: ↓
          - generic [ref=f31e95]: Tool / Tool / Tool
          - generic [ref=f31e96]: ↓
          - generic [ref=f31e97]: Business Outcome
        - button "Copy" [ref=f31e98]
      - paragraph [ref=f31e99]: 看起来很先进，演示效果通常也很好。
      - paragraph [ref=f31e100]: 两个极端的问题不一样，但根子是同一个：它们都把“业务流程”和“认知任务”当成了同一种东西。业务流程要回答的是“做什么、谁做、什么时候做、结果去哪、出问题谁负责”；认知任务要回答的是“这一步具体怎么想清楚”。前者需要确定性，后者本身不确定。把它们混成一层，无论混在 BPMN 里还是混在 Agent 里，都会出问题。接下来三节分别说明：传统 Workflow 的边界在哪里，以及两种混法各自错在哪，错得有多贵。
      - heading "2. 传统 Workflow 的假设，以及它的真实边界" [level=2] [ref=f31e101]
      - paragraph [ref=f31e102]: 传统 Camunda / Fluxnova / Flowable / ServiceNow Workflow 的核心模型大概是：
      - document [ref=f31e104]:
        - generic [ref=f31e112]:
          - paragraph [ref=f31e119]: Process Definition
          - paragraph [ref=f31e126]: Step A
          - paragraph [ref=f31e133]: Step B
          - paragraph [ref=f31e140]: Decision
          - paragraph [ref=f31e147]: Step C
          - paragraph [ref=f31e154]: Step D
          - paragraph [ref=f31e161]: Step E
      - paragraph [ref=f31e162]: 流程在设计期基本确定。例如：
      - generic [ref=f31e164]:
        - code [ref=f31e165]:
          - generic [ref=f31e166]: 收到贷款申请
          - generic [ref=f31e167]: → 身份验证
          - generic [ref=f31e168]: → 信用检查
          - generic [ref=f31e169]: → 风险评分
          - generic [ref=f31e170]: → 人工审批
          - generic [ref=f31e171]: → 放款
        - button "Copy" [ref=f31e172]
      - paragraph [ref=f31e173]: 这是很适用的模型，因为路径比较确定，状态比较确定，责任边界、审计要求和 SLA 都明确。所以 BPMN 仍然有价值。但换成 Agent，任务描述会变成：
      - generic [ref=f31e175]:
        - code [ref=f31e176]:
          - generic [ref=f31e177]: “调查这个投资机会，并给出一份结论。”
        - button "Copy" [ref=f31e178]
      - paragraph [ref=f31e179]: 而没人能预先确定 Agent 会走哪条路：
      - generic [ref=f31e181]:
        - code [ref=f31e182]:
          - generic [ref=f31e183]: search web
          - generic [ref=f31e184]: → search Bloomberg
          - generic [ref=f31e185]: → query internal database
          - generic [ref=f31e186]: → read 17 documents
          - generic [ref=f31e187]: → ask another agent
          - generic [ref=f31e188]: → calculate valuation
          - generic [ref=f31e189]: → discover missing information
          - generic [ref=f31e190]: → search again
          - generic [ref=f31e191]: → challenge its own conclusion
          - generic [ref=f31e192]: → ask human
          - generic [ref=f31e193]: → continue
          - generic [ref=f31e194]: → produce report
        - button "Copy" [ref=f31e195]
      - paragraph [ref=f31e196]: 这条路径不可能被提前画出来。所以传统 Workflow 是 Design-Time Control Flow，Agent Workflow 是 Runtime Decision + Execution Boundary，这是根本区别。
      - heading "一个容易被忽略的技术细节：BPMN 不是状态机" [level=3] [ref=f31e197]
      - paragraph [ref=f31e198]: 这里有一个在架构评审时经常被追问、但很多文档写错的点。严格来说，BPMN 是流程建模与编排的记法。运行时才产生 process instance，以及这个实例在流程图上的 token position 与执行状态。所以更准确的表述是：BPMN 提供确定性的流程模型和状态转移语义；具体某个 Process Instance 当前处于什么状态，由 Workflow Runtime 持有。把 BPMN 直接等同于“状态机”，作为通俗解释没问题，但写进架构文档会带来两个后果：一是把模型和运行时状态混为一谈；二是在讨论“状态到底应该存在哪里、出事故时以谁为准”时，失去判断依据。真正需要持有状态的是 Runtime，而不是图。这一点在后面的分层里很关键——因为“Agent 能不能改流程状态”这个问题的答案，取决于状态的所有权在谁手上，而不取决于图是怎么画的。
      - heading "3. 第一个极端：给 BPMN 加一个 LLM Node" [level=2] [ref=f31e199]
      - paragraph [ref=f31e200]: 传统 Low-code：
      - generic [ref=f31e202]:
        - code [ref=f31e203]:
          - generic [ref=f31e204]: 拖一个 HTTP Node
          - generic [ref=f31e205]: ↓
          - generic [ref=f31e206]: 拖一个 Condition
          - generic [ref=f31e207]: ↓
          - generic [ref=f31e208]: 拖一个 LLM Node
          - generic [ref=f31e209]: ↓
          - generic [ref=f31e210]: 拖一个 Approval Node
        - button "Copy" [ref=f31e211]
      - paragraph [ref=f31e212]: 看起来非常容易。但真正复杂之后，会冒出一串运行时问题：
      - generic [ref=f31e214]:
        - code [ref=f31e215]:
          - generic [ref=f31e216]: LLM 为什么选择这个？
          - generic [ref=f31e217]: 为什么重新搜索？
          - generic [ref=f31e218]: 为什么调用这个 tool？
          - generic [ref=f31e219]: 为什么跳过那个 task？
          - generic [ref=f31e220]: 为什么 context 变了？
          - generic [ref=f31e221]: 为什么 agent 重新规划？
        - button "Copy" [ref=f31e222]
      - paragraph [ref=f31e223]: 最终暴露出来的问题是连节点只是表面工作，运行时行为才构成主要复杂度。于是最后会出现一个非常荒谬的东西：
      - generic [ref=f31e225]:
        - code [ref=f31e226]:
          - generic [ref=f31e227]: Low-code workflow
          - generic [ref=f31e228]: +
          - generic [ref=f31e229]: Agent Node
          - generic [ref=f31e230]: +
          - generic [ref=f31e231]: Prompt
          - generic [ref=f31e232]: +
          - generic [ref=f31e233]: Memory Node
          - generic [ref=f31e234]: +
          - generic [ref=f31e235]: Agent Router
          - generic [ref=f31e236]: +
          - generic [ref=f31e237]: Tool Node
          - generic [ref=f31e238]: +
          - generic [ref=f31e239]: Agent Router
          - generic [ref=f31e240]: +
          - generic [ref=f31e241]: Condition
          - generic [ref=f31e242]: +
          - generic [ref=f31e243]: Agent Router
        - button "Copy" [ref=f31e244]
      - paragraph [ref=f31e245]: 这实际上只是用 BPMN GUI 给 Agent 套了一层壳，不是长久方向。同样的道理，也不要把 Agent 的内部逻辑画进 BPMN。例如不要：
      - generic [ref=f31e247]:
        - code [ref=f31e248]:
          - generic [ref=f31e249]: BPMN
          - generic [ref=f31e250]: ├─ Agent Call
          - generic [ref=f31e251]: ├─ Agent Decision
          - generic [ref=f31e252]: ├─ Agent Decision
          - generic [ref=f31e253]: ├─ Agent Loop
          - generic [ref=f31e254]: ├─ Agent Retry
          - generic [ref=f31e255]: ├─ Agent Memory
          - generic [ref=f31e256]: ├─ Agent Tool
          - generic [ref=f31e257]: ├─ Agent Tool
          - generic [ref=f31e258]: └─ Agent Subprocess
        - button "Copy" [ref=f31e259]
      - paragraph [ref=f31e260]: 最终 BPMN 又变成另一种 spaghetti。正确方式是：
      - generic [ref=f31e262]:
        - code [ref=f31e263]:
          - generic [ref=f31e264]: BPMN
          - generic [ref=f31e265]: ↓
          - generic [ref=f31e266]: Agent Activity
          - generic [ref=f31e267]: ↓
          - generic [ref=f31e268]: Agent Runtime
        - button "Copy" [ref=f31e269]
      - paragraph [ref=f31e270]: Agent Runtime 内部再拥有自己的执行模型。
      - heading "4. 第二个极端：让 Agent 决定整个业务流程" [level=2] [ref=f31e271]
      - paragraph [ref=f31e272]: 这同样危险。最差的 AI Workflow：
      - generic [ref=f31e274]:
        - code [ref=f31e275]:
          - generic [ref=f31e276]: Agent
          - generic [ref=f31e277]: ↓
          - generic [ref=f31e278]: Agent
          - generic [ref=f31e279]: ↓
          - generic [ref=f31e280]: Agent
          - generic [ref=f31e281]: ↓
          - generic [ref=f31e282]: Agent
          - generic [ref=f31e283]: ↓
          - generic [ref=f31e284]: Agent
        - button "Copy" [ref=f31e285]
      - paragraph [ref=f31e286]: 然后让模型自己决定整个业务流程，金融领域尤其不能这么做。例如：
      - generic [ref=f31e288]:
        - code [ref=f31e289]:
          - generic [ref=f31e290]: Agent → approve loan
          - generic [ref=f31e291]: Agent → move money
          - generic [ref=f31e292]: Agent → submit trade
          - generic [ref=f31e293]: Agent → change risk limit
        - button "Copy" [ref=f31e294]
      - paragraph [ref=f31e295]: 这里不应该是 Agent 自由决定，更合理的是：
      - document [ref=f31e297]:
        - generic [ref=f31e299]:
          - generic [ref=f31e307]:
            - paragraph [ref=f31e313]: proposal
            - paragraph [ref=f31e319]: safe
            - paragraph [ref=f31e325]: needs approval
            - paragraph [ref=f31e331]: forbidden
            - paragraph [ref=f31e337]: approved
            - paragraph [ref=f31e343]: success
            - paragraph [ref=f31e349]: failure
          - generic [ref=f31e350]:
            - paragraph [ref=f31e357]: Agent
            - paragraph [ref=f31e364]: Policy Gate
            - paragraph [ref=f31e371]: Tool Execution
            - paragraph [ref=f31e378]: Human Approval
            - paragraph [ref=f31e385]: Reject
            - paragraph [ref=f31e392]: Verification
      - paragraph [ref=f31e393]: Agent 有 autonomy，但没有 unrestricted authority。这一点比 Workflow 这个词本身更值得先弄清楚。两个极端各自错在哪，到这里可以说得很具体了。它们错的不是“用了 BPMN”或“用了 Agent”，而是把基本单元搞错了。本文主张的基本单元不是“LLM Node”，而是 Agent Task：
      - generic [ref=f31e395]:
        - code [ref=f31e396]:
          - generic [ref=f31e397]: Business Process
          - generic [ref=f31e398]: ↓
          - generic [ref=f31e399]: Agent Task ← 基本单元
          - generic [ref=f31e400]: ↓
          - generic [ref=f31e401]: Agent Runtime
          - generic [ref=f31e402]: ↓
          - generic [ref=f31e403]: Structured Result
          - generic [ref=f31e404]: ↓
          - generic [ref=f31e405]: Validation / Policy / Authorization
          - generic [ref=f31e406]: ↓
          - generic [ref=f31e407]: Business Process
        - button "Copy" [ref=f31e408]
      - paragraph [ref=f31e409]: 第一个极端把 Agent Task 降级成了一个 LLM Node，于是流程图画满了 Agent 的内部细节，却丢掉了智能本身；第二个极端把 Agent Task 升级成了整个业务流程，于是流程资产、责任边界与审批关系一起消失。第四、第五部分会把这条链路展开成完整架构与契约。
      - heading "第二部分：业界趋势" [level=1] [ref=f31e410]
      - heading "5. 四个架构领域总览" [level=2] [ref=f31e411]
      - paragraph [ref=f31e412]: 2026 年的行业实践，可以按“各自解决什么问题”归成四个架构领域。它们不是互相替代的关系，而是分别占住了架构的不同层。
      - table [ref=f31e413]:
        - rowgroup [ref=f31e414]:
          - row [ref=f31e415]:
            - columnheader "领域" [ref=f31e416]
            - columnheader "解决的问题" [ref=f31e417]
            - columnheader "主要线索" [ref=f31e418]
        - rowgroup [ref=f31e419]:
          - row [ref=f31e420]:
            - cell "领域一 · 确定性业务编排" [ref=f31e421]
            - cell "流程、责任、审批、SLA、审计" [ref=f31e422]
            - cell "Camunda / Fluxnova" [ref=f31e423]
          - row [ref=f31e424]:
            - cell "领域二 · Agent Runtime 与 Harness" [ref=f31e425]
            - cell "Agent 如何工作" [ref=f31e426]
            - cell "OpenAI / Anthropic / LangGraph / Microsoft / Google" [ref=f31e427]
          - row [ref=f31e428]:
            - cell "领域三 · Durable Execution" [ref=f31e429]
            - cell "Agent 如何可靠地长期运行" [ref=f31e430]
            - cell "Temporal / Durable Task" [ref=f31e431]
          - row [ref=f31e432]:
            - cell "领域四 · Enterprise Semantic & Data" [ref=f31e433]
            - cell "Agent 在什么世界里工作" [ref=f31e434]
            - cell "Palantir / Snowflake" [ref=f31e435]
      - document [ref=f31e437]:
        - generic [ref=f31e445]:
          - paragraph [ref=f31e452]: 领域一确定性业务编排
          - paragraph [ref=f31e459]: 领域二Agent Runtime 与 Harness
          - paragraph [ref=f31e466]: 领域三Durable Execution
          - paragraph [ref=f31e473]: 领域四Enterprise Semantic & Data
          - paragraph [ref=f31e480]: 组合点：Agent Task Contract
      - paragraph [ref=f31e481]: 这个分组方式本身就是一个判断：这四件事不在同一个维度上，不能用“谁替代谁”来讨论。其中有一处需要额外说明：领域三（Durable Execution）严格来说不与另外三者处在同一层，而是一层基础能力。它不解决“Agent 怎么决策”，也不解决“流程怎么定义”，它解决的是“执行到一半进程崩了怎么办”。把它当成一个可选方向去和 BPMN 比较，是选型时最常见的误判之一；把它当成所有长任务路径都必须具备的底座，才是它的真实位置。把领域二三混成一句“Agent Workflow 取代了 BPMN”，是这一轮技术讨论里最普遍的一次偷换。后面的第 42 节会把这个问题拆到产品层面。
      - heading "6. 领域一 · 确定性业务编排（Camunda / Fluxnova）" [level=2] [ref=f31e482]
      - paragraph [ref=f31e483]: 为什么用 BPMN 引擎承载 Agent Workflow 会让人本能地抵触？Fluxnova 仍然是 BPMN 引擎：
      - generic [ref=f31e485]:
        - code [ref=f31e486]:
          - generic [ref=f31e487]: BPMN
          - generic [ref=f31e488]: +
          - generic [ref=f31e489]: DMN
          - generic [ref=f31e490]: +
          - generic [ref=f31e491]: Human Task
          - generic [ref=f31e492]: +
          - generic [ref=f31e493]: Process State
          - generic [ref=f31e494]: +
          - generic [ref=f31e495]: Audit
        - button "Copy" [ref=f31e496]
      - paragraph [ref=f31e497]: 它现在已经开始加入：
      - list [ref=f31e498]:
        - listitem [ref=f31e499]: ad-hoc subprocess
        - listitem [ref=f31e500]: agentic subprocess
        - listitem [ref=f31e501]: MCP
        - listitem [ref=f31e502]: AI integration
        - listitem [ref=f31e503]: dynamic routing
      - paragraph [ref=f31e504]:
        - text: 但它仍然是 BPMN-centered orchestration，没有转到 Agent-centered execution runtime。Fluxnova 3.0 本身仍以 BPMN Process Engine 为核心，只是增加了 Ad Hoc Subprocess 等动态能力；其 roadmap 甚至把 AI integration 放到了后续能力路线。(
        - link "GitHub" [ref=f31e505] [cursor=pointer]:
          - /url: https://github.com/finos/fluxnova-bpm-platform/releases
        - text: )
      - heading "更准确的说法：deterministic + dynamic，而不是“把 Agent 塞进 BPMN”" [level=3] [ref=f31e506]
      - paragraph [ref=f31e507]:
        - text: 前面那句“Camunda 的方向是把 Agent 塞进 BPMN”，只说对了一半。Camunda 8.7 的官方文档已经把这件事定义得非常明确：agentic orchestration 是把确定性编排和动态（AI 驱动）编排混合进同一个端到端流程。原文的表述是，AI agent 负责执行流程中非确定性的部分，而 BPMN 提供可预测性、合规性和客户体验的底座。(
        - link "Camunda 8 Docs" [ref=f31e508] [cursor=pointer]:
          - /url: https://docs.camunda.io/docs/8.7/components/agentic-orchestration/
        - text: )
      - paragraph [ref=f31e509]: 分工是清楚的：
      - generic [ref=f31e511]:
        - code [ref=f31e512]:
          - generic [ref=f31e513]: LLM：
          - generic [ref=f31e514]: 决定调用什么工具、以什么顺序、什么时候停止
          - generic [ref=f31e515]: Camunda：
          - generic [ref=f31e516]: 执行 BPMN elements
          - generic [ref=f31e517]: 保存 process state
          - generic [ref=f31e518]: retry / incident
          - generic [ref=f31e519]: human task
          - generic [ref=f31e520]: 确定性逻辑
          - generic [ref=f31e521]: process boundary
        - button "Copy" [ref=f31e522]
      - paragraph [ref=f31e523]:
        - text: 所以更准确的表述是：Camunda 正在把 BPMN 从“纯确定性流程”扩展成“确定性流程 + 受治理的 Agentic Subprocess”。具体的设计与架构建议，见 Camunda 的《Design and architecture》文档。(
        - link "Camunda 8 Docs" [ref=f31e524] [cursor=pointer]:
          - /url: https://docs.camunda.io/docs/components/agentic-orchestration/ao-design/
        - text: )这个方向与本文后面的主线架构是一致的，落点不同而已：Camunda 把它落在 BPMN 边界内，本文要讨论的是这个边界应该由什么契约来定义。这对金融、保险、银行很合理。但如果目标是一个 AI-native Agent Platform，BPMN 不适合作为核心抽象。
      - heading "7. 领域二（上）· 执行模型" [level=2] [ref=f31e525]
      - paragraph [ref=f31e526]: 这个领域的主张最激进，投入也最大。它并不否认 Workflow 的存在，而是主张 Workflow 的实现方式应该被重写。在评价它之前，先把它自己的主张摆出来。而比较合理的模型其实是：
      - document [ref=f31e528]:
        - generic [ref=f31e548]:
          - paragraph [ref=f31e555]: User / Business Event
          - paragraph [ref=f31e562]: Intent
          - paragraph [ref=f31e569]: Agent Runtime
          - paragraph [ref=f31e576]: Policy / Authority
          - paragraph [ref=f31e583]: Context / Memory
          - paragraph [ref=f31e590]: Tools / APIs / MCP
          - paragraph [ref=f31e597]: Dynamic Plan
          - paragraph [ref=f31e604]: Execution Runtime
          - paragraph [ref=f31e611]: Deterministic Code
          - paragraph [ref=f31e618]: Agent Task
          - paragraph [ref=f31e625]: Human Task
          - paragraph [ref=f31e632]: External Event
          - paragraph [ref=f31e639]: Result
          - paragraph [ref=f31e646]: Verification / Policy Check
          - paragraph [ref=f31e653]: Durable State + Event Log
      - paragraph [ref=f31e654]: 这里先说两件事：在 Agent-first 架构中，Agent 可以动态决定下一步的任务或工具调用；但在金融业务流程中，这种自由度被限制在 BPMN 定义的 Agent Task 边界内。Runtime 决定“这个下一步能不能做、怎么执行、出了问题怎么办”。第一点是这个领域与过去 Workflow 最大的区别，也是它后来必须被限制的地方；第二点则不受领域之争影响——无论目标是什么，执行边界都必须存在。
      - heading "Google ADK 2.0" [level=3] [ref=f31e655]
      - paragraph [ref=f31e656]:
        - text: Google 在 2026 年把 ADK 从原来的 hierarchical agent executor 明确转向 Workflow Runtime + Graph-based execution：Agent、Tool、Function 全部作为 workflow graph 的节点，并支持 branching、parallelism、loops、human-in-the-loop、state preservation 与 resume；原来的
        - code [ref=f31e657]: SequentialAgent / LoopAgent
        - text: 正逐步被 graph workflow 取代。(
        - link "GitHub" [ref=f31e658] [cursor=pointer]:
          - /url: https://github.com/google/adk-docs/blob/main/docs/2.0/index.md
        - text: )先看它的立场，而不是它说了什么：不是“Agent 出现了，所以 Workflow 消失”，而是“Workflow 的实现方式必须适应 Agent”。
      - heading "Microsoft Agent Framework" [level=3] [ref=f31e659]
      - paragraph [ref=f31e660]: Microsoft Agent Framework 现在把 Workflow 定义成：
      - generic [ref=f31e662]:
        - code [ref=f31e663]:
          - generic [ref=f31e664]: Executors
          - generic [ref=f31e665]: +
          - generic [ref=f31e666]: Edges
          - generic [ref=f31e667]: +
          - generic [ref=f31e668]: State
          - generic [ref=f31e669]: +
          - generic [ref=f31e670]: Events
          - generic [ref=f31e671]: +
          - generic [ref=f31e672]: Runtime
        - button "Copy" [ref=f31e673]
      - paragraph [ref=f31e674]: 而 Executor 可以是：
      - list [ref=f31e675]:
        - listitem [ref=f31e676]: 普通代码
        - listitem [ref=f31e677]: Agent
        - listitem [ref=f31e678]: Tool
        - listitem [ref=f31e679]: sub-workflow
      - paragraph [ref=f31e680]: 并且 runtime 负责：
      - list [ref=f31e681]:
        - listitem [ref=f31e682]: execution
        - listitem [ref=f31e683]: events
        - listitem [ref=f31e684]: checkpointing
        - listitem [ref=f31e685]: HITL
        - listitem [ref=f31e686]: concurrency
        - listitem [ref=f31e687]: state management
      - paragraph [ref=f31e688]:
        - text: 也就是说，Workflow 不再等价于 Business Process Diagram，而是一个可执行的 runtime topology。(
        - link "Microsoft Learn" [ref=f31e689] [cursor=pointer]:
          - /url: https://learn.microsoft.com/en-us/agent-framework/workflows/workflows
        - text: )
      - heading "LangGraph" [level=3] [ref=f31e690]
      - paragraph [ref=f31e691]: LangGraph 把自己定位成 low-level orchestration framework for stateful agents。它的核心价值不是“画流程”，而是：
      - generic [ref=f31e693]:
        - code [ref=f31e694]:
          - generic [ref=f31e695]: State → Node → Decision → Tool → Checkpoint → Resume
        - button "Copy" [ref=f31e696]
      - paragraph [ref=f31e697]:
        - text: 它特别强调 durable execution、stateful agents、long-running execution 与 failure recovery。也就是说，Graph 在这里不是给业务人员看的流程图，而是 Agent 的执行 runtime。(
        - link "GitHub" [ref=f31e698] [cursor=pointer]:
          - /url: https://github.com/langchain-ai/langgraph
        - text: )所以不要再想
        - code [ref=f31e699]: Workflow = DAG / BPMN
        - text: ，而应该定义：
      - generic [ref=f31e701]:
        - code [ref=f31e702]:
          - generic [ref=f31e703]: Agentic Workflow = Intent + Policy + Execution State + Dynamic Plan + Durable Runtime
        - button "Copy" [ref=f31e704]
      - heading "① Intent" [level=3] [ref=f31e705]
      - paragraph [ref=f31e706]:
        - text: 起点不是
        - code [ref=f31e707]: Start → A → B → C
        - text: ，而是一个目标，例如“完成投资机会尽调并生成投资建议”。Agent 负责寻找完成这个 Goal 的路径。
      - heading "② Policy" [level=3] [ref=f31e708]
      - paragraph [ref=f31e709]: 这个才是企业 Workflow 最应该固定下来的东西。例如：
      - generic [ref=f31e711]:
        - code [ref=f31e712]:
          - generic [ref=f31e713]: "policy:"
          - generic [ref=f31e714]: "can_read: [market_data, research_db]"
          - generic [ref=f31e715]: "can_write: [draft_report]"
          - generic [ref=f31e716]: "approval_required: [execute_trade, send_external_email]"
          - generic [ref=f31e717]: "forbidden: [customer_pii_export]"
          - generic [ref=f31e718]: "max_budget: { tokens: 100000, tool_calls: 50 }"
        - button "Copy" [ref=f31e719]
      - paragraph [ref=f31e720]: 也就是说，流程可以变动，要固定下来的是权限和边界，这比 BPMN Gateway 更实在。
      - heading "③ Dynamic Plan" [level=3] [ref=f31e721]
      - paragraph [ref=f31e722]: Agent 根据目标动态产生工作计划：搜索公司、取财务数据、分析竞争对手、发现信息缺口、再搜索、建模估值、复核假设、产出报告——顺序与内容都由 Agent 自己决定，而不是预先画在流程图上。这个 Plan 对长跑 Agent 而言确实需要持久化，而不是只存在 LLM context 里。但要区分清楚：持久化的是 Agent Task 的执行状态，不是企业业务流程的状态——这一点在第 49 节展开。例如：
      - generic [ref=f31e724]:
        - code [ref=f31e725]:
          - generic [ref=f31e726]: "{"
          - generic [ref=f31e727]: "\"runId\": \"invest-20260912-001\","
          - generic [ref=f31e728]: "\"goal\": \"Evaluate XYZ\","
          - generic [ref=f31e729]: "\"plan\": ["
          - generic [ref=f31e730]: "{"
          - generic [ref=f31e731]: "\"id\": \"t1\","
          - generic [ref=f31e732]: "\"type\": \"research\","
          - generic [ref=f31e733]: "\"status\": \"completed\""
          - generic [ref=f31e734]: "},"
          - generic [ref=f31e735]: "{"
          - generic [ref=f31e736]: "\"id\": \"t2\","
          - generic [ref=f31e737]: "\"type\": \"valuation\","
          - generic [ref=f31e738]: "\"status\": \"running\""
          - generic [ref=f31e739]: "}"
          - generic [ref=f31e740]: "]"
          - generic [ref=f31e741]: "}"
        - button "Copy" [ref=f31e742]
      - paragraph [ref=f31e743]: 在这个领域的语境里，“Workflow”的含义已经发生位移：在 Agent-first 系统中，Agent Task 的内部执行计划可以由 Agent 动态生成；它不等于企业 Business Workflow Definition。这是 Agent Platform 视角下的结论。一旦把目标切到企业业务流程，这个区分就变成架构上的硬边界——第 19 节会把两种“计划”明确分开。
      - heading "④ Execution State" [level=3] [ref=f31e744]
      - paragraph [ref=f31e745]: 这是传统 Workflow Engine 最值得保留的东西。真实的长任务经常是“跑 25 分钟 → 等待人工 → 6 小时后继续”，状态至少要能区分：
      - generic [ref=f31e747]:
        - code [ref=f31e748]:
          - generic [ref=f31e749]: RUNNING / WAITING_TOOL / WAITING_HUMAN / WAITING_EVENT
          - generic [ref=f31e750]: FAILED / RETRYING / COMPLETED / CANCELLED
        - button "Copy" [ref=f31e751]
      - paragraph [ref=f31e752]: 需要的是 durability、checkpoint、resume、timeout、retry、compensation 与 idempotency，而不是漂亮的流程图。这一点比 BPMN 图本身更实在。
      - heading "⑤ Execution Runtime" [level=3] [ref=f31e753]
      - paragraph [ref=f31e754]: 真正的核心应该变成：
      - document [ref=f31e756]:
        - generic [ref=f31e758]:
          - paragraph [ref=f31e777]: propose action
          - generic [ref=f31e778]:
            - paragraph [ref=f31e785]: Agent Brain
            - paragraph [ref=f31e792]: Agent Execution Runtime
            - paragraph [ref=f31e799]: Policy Engine
            - paragraph [ref=f31e806]: Authority / Identity
            - paragraph [ref=f31e813]: Execution Sandbox
            - paragraph [ref=f31e820]: Durable State
            - paragraph [ref=f31e827]: Event Log
            - paragraph [ref=f31e834]: Tools / MCP / APIs
            - paragraph [ref=f31e841]: Tool Result
      - paragraph [ref=f31e842]: Agent 不应该绕过统一的身份、权限、工具和审计边界，直接拿到未治理的生产系统权限。这句话不等于“Agent 不能访问生产系统”。它可以访问，但访问必须走完整链路：
      - generic [ref=f31e844]:
        - code [ref=f31e845]:
          - generic [ref=f31e846]: Agent
          - generic [ref=f31e847]: ↓
          - generic [ref=f31e848]: Task Context（业务上下文 + 流程实例 + 数据版本）
          - generic [ref=f31e849]: ↓
          - generic [ref=f31e850]: Tool / Capability
          - generic [ref=f31e851]: ↓
          - generic [ref=f31e852]: Identity / Authorization
          - generic [ref=f31e853]: ↓
          - generic [ref=f31e854]: Target System
        - button "Copy" [ref=f31e855]
      - paragraph [ref=f31e856]: 而不是：
      - generic [ref=f31e858]:
        - code [ref=f31e859]:
          - generic [ref=f31e860]: Agent
          - generic [ref=f31e861]: ↓
          - generic [ref=f31e862]: 万能 production credential
        - button "Copy" [ref=f31e863]
      - paragraph [ref=f31e864]: 这里有一个金融场景特有的细节：Authorization 判断的不只是 Agent 的身份。同一个 Agent，对 Investment A 与 Investment B 的权限可能相同，但业务上下文、交易上下文、数据版本与流程实例不同，允许的动作就可能不同。所以完整的授权输入应该是：
      - generic [ref=f31e866]:
        - code [ref=f31e867]:
          - generic [ref=f31e868]: Agent + User + Workflow Instance + Business Object + Action + Context
        - button "Copy" [ref=f31e869]
      - paragraph [ref=f31e870]: 只写“Agent Identity / Authority”，在评审时会被简化成“这个 Agent 有没有权限”，而金融机构真正要回答的是“在这个 case、这个版本的业务事实上，这一步动作是否被允许”。Agent 只负责 propose、reason、choose 与 delegate；Runtime 负责 authorize、validate、execute、retry、pause、resume 与 audit。这其实就是未来 Agent Platform 最核心的一层。内部 AI Platform 也可以按同一个方向设计：把 Planning、Context 与 Tool Gateway 收进 Agent Runtime，把 Durable State、Event Log 与 Human Task 放在执行侧，再把 Evaluation / Trace 接在末端。这与第 45 节那张平台分层图是同一个判断的两种画法，这里不再重复贴图。需要补一句：BPMN / Camunda / Fluxnova 是一个“外部能力”，不是整个 Agent Platform 的核心。这和今天很多企业的架构思路会完全不同。需要补充一句：这不是本文对金融场景的结论。在金融场景里，BPMN 恰恰是核心控制面，而不是外围能力。两句话并不矛盾，差别只在目标是通用 Agent 平台还是企业业务流程。
      - heading "Microsoft 的第二条线：Durable Runtime" [level=3] [ref=f31e871]
      - paragraph [ref=f31e872]:
        - text: 微软实际上同时押了两个方向——
        - code [ref=f31e873]: Agent + Workflow + Durable Runtime
        - text: ，而不是二选一。除了上一小节那个 graph workflow 模型之外，它还提供了 checkpoint、human-in-the-loop、fan-out / fan-in、sub-workflow、typed routing、graph execution 与 durable execution。更重要的是，微软直接提供 Durable Extension，把 Agent Framework 的 graph workflow 跑在 Durable Task 基础设施上：
      - generic [ref=f31e875]:
        - code [ref=f31e876]:
          - generic [ref=f31e877]: Agent Framework → Graph Workflow → Durable Task → Checkpoint → Resume → Distributed Workers
        - button "Copy" [ref=f31e878]
      - paragraph [ref=f31e879]:
        - text: 并支持 agent 运行数天甚至数周。(
        - link "Microsoft Learn" [ref=f31e880] [cursor=pointer]:
          - /url: https://learn.microsoft.com/en-us/agent-framework/integrations/durable-extension
        - text: )这里已经非常接近这样的三段式模型：Agent 是 intelligence，Workflow 是 execution topology，Durable Task 是 runtime。
      - heading "8. 领域二（下）· Harness 被产品化" [level=2] [ref=f31e881]
      - paragraph [ref=f31e882]: 上一节讲的是“Agent 的执行模型长什么样”，这一节讲的是“厂商正在把什么产品化”。这里有一个值得单独拿出来看的趋势：Agent Harness 本身正在成为独立的基础设施，而不是某个框架的内部实现细节。一旦它可以被单独产品化、单独版本化、单独定价，它在架构上的地位就变了——它从框架的内部细节，变成一层需要被认领的架构。
      - heading "Anthropic：Claude Research 的多 Agent 结构" [level=3] [ref=f31e883]
      - paragraph [ref=f31e884]: Anthropic 的做法和微软略有不同。它最经典的生产案例是 Claude Research：一个主 Agent 制定研究计划，再启动多个并行 Agent 搜索，最后汇合。
      - document [ref=f31e886]:
        - generic [ref=f31e894]:
          - paragraph [ref=f31e901]: Main Research Agent
          - paragraph [ref=f31e908]: create research plan
          - paragraph [ref=f31e915]: Research Agent
          - paragraph [ref=f31e922]: Research Agent
          - paragraph [ref=f31e929]: Research Agent
          - paragraph [ref=f31e936]: search
          - paragraph [ref=f31e943]: search
          - paragraph [ref=f31e950]: search
          - paragraph [ref=f31e957]: synthesis
      - paragraph [ref=f31e958]:
        - text: Anthropic 明确指出，系统设计最大的难点已经变成 coordination、evaluation、reliability 与 tool design，而不是传统 workflow 的节点设计。(
        - link "Anthropic" [ref=f31e959] [cursor=pointer]:
          - /url: https://www.anthropic.com/engineering/multi-agent-research-system
        - text: ) 这与传统 BPMN 的思路差别很大。
      - heading "Anthropic 的第二条线：Harness" [level=3] [ref=f31e960]
      - paragraph [ref=f31e961]:
        - text: Anthropic 对 Agent 的工程实践越来越集中到 Harness，而不是 Workflow Designer。它 2026 年的工程文章把 long-running agents、managed agents、context engineering、skills、tool use、security、agent containment、evals 与 multi-agent research 分成几条独立的线推进。(
        - link "Anthropic" [ref=f31e962] [cursor=pointer]:
          - /url: https://www.anthropic.com/engineering
        - text: )也就是说，
        - code [ref=f31e963]: Model + Harness + Tools + Environment + Permissions + Context + Evaluation
        - text: 正在成为一个比传统 workflow 更核心的抽象。不过要说清楚：Anthropic 的公开实践集中在 Harness、Tool Use、Context Engineering、Containment 与 Evaluation，并没有提出一套企业业务流程架构。把它的工程文章读成“BPMN 的替代方案”，是过度解读。
      - heading "OpenAI：从 Agents SDK 到 harness + sandbox" [level=3] [ref=f31e964]
      - paragraph [ref=f31e965]:
        - text: OpenAI 2025 年最初的方案是
        - code [ref=f31e966]: Responses API + Agents SDK + Tools + Handoffs + Guardrails + Tracing
        - text: ，已经明显不是传统 workflow。2026 年更进一步，新的 Agents SDK 强调 model-native harness + sandbox + long-horizon task：
      - generic [ref=f31e968]:
        - code [ref=f31e969]:
          - generic [ref=f31e970]: Agent
          - generic [ref=f31e971]: ↓
          - generic [ref=f31e972]: Harness
          - generic [ref=f31e973]: ↓
          - generic [ref=f31e974]: Sandbox
          - generic [ref=f31e975]: ↓
          - generic [ref=f31e976]: Tools / Files / Commands
          - generic [ref=f31e977]: ↓
          - generic [ref=f31e978]: Long-running execution
        - button "Copy" [ref=f31e979]
      - paragraph [ref=f31e980]:
        - text: 并且把 harness 与 compute 分离，强调 security、durability 与 scale。(
        - link "OpenAI" [ref=f31e981] [cursor=pointer]:
          - /url: https://openai.com/index/new-tools-for-building-agents/
        - text: )（
        - link "OpenAI" [ref=f31e982] [cursor=pointer]:
          - /url: https://openai.com/index/the-next-evolution-of-the-agents-sdk/
        - text: ）这里还有一层意思：Agent Workflow 最终可能不是 DAG，而是一个“可持续运行的 Agent Process”。
      - heading "2026-09-10：OpenAI 把 Harness 单独产品化" [level=3] [ref=f31e983]
      - paragraph [ref=f31e984]:
        - text: 这条更新对本文的论证尤其重要，因为它是一个非常直接的证据。OpenAI 在 2026-09-10 发布 Agents API，把驱动 Codex 的同一套 harness 与基础设施开放出来，并且明确由 OpenAI 托管和维护。(
        - link "OpenAI" [ref=f31e985] [cursor=pointer]:
          - /url: https://openai.com/index/introducing-the-agents-api/
        - text: )它提供的能力清单很能说明问题：
      - generic [ref=f31e987]:
        - code [ref=f31e988]:
          - generic [ref=f31e989]: managed harness
          - generic [ref=f31e990]: long-running sessions（模型可以连续工作数小时）
          - generic [ref=f31e991]: context management（接近上下文上限时自动压缩早期上下文）
          - generic [ref=f31e992]: sandbox（OpenAI 托管沙箱，或自带基础设施 / 第三方沙箱）
          - generic [ref=f31e993]: subagents（把任务拆给并行子智能体）
        - button "Copy" [ref=f31e994]
      - paragraph [ref=f31e995]:
        - text: 而开发者只需要定义四样东西：task、model、tools、environment。其余运行时基础设施——会话、上下文压缩、沙箱、并发子智能体调度——由平台负责。(
        - link "OpenAI" [ref=f31e996] [cursor=pointer]:
          - /url: https://openai.com/index/introducing-the-agents-api/
        - text: )这里有两层含义，方向相反，必须一起看。第一，它支持“Agent Runtime / Harness 正在成为独立基础设施”这个判断。当一个 harness 可以被单独产品化、单独版本化时，它就不再是框架的内部细节，而是一层需要被认领的架构。第二，它同时反证了 Agent Runtime 不等于 Business Workflow Runtime。Agents API 提供的“orchestration”指的是单个 Agent 会话内部的任务编排：决定先查什么、再调什么工具、什么时候停止。它不持有企业流程状态，不负责跨部门审批，也不会为一个投资 Idea 的合规责任签字。这两件事都被称为“编排”，但归属完全不同。这是后面反复要用的一个区分。
      - heading "内部应用：delegated long-horizon task" [level=3] [ref=f31e997]
      - paragraph [ref=f31e998]:
        - text: OpenAI 在公开材料里把内部 Codex 的工作单位定义成 delegated long-horizon task，而不是 single interaction：员工把一件长周期任务整体交出去，Agent 自己使用工具、文件与代码反复迭代，直到交出结果。(
        - link "OpenAI" [ref=f31e999] [cursor=pointer]:
          - /url: https://openai.com/index/how-agents-are-transforming-work/
        - text: )
      - heading "OpenAI Presence：企业 Agent Operating Model" [level=3] [ref=f31e1000]
      - paragraph [ref=f31e1001]: 2026 年推出的 Presence 尤其值得注意，它的切入点不是 Workflow Designer，而是一个具体岗位：
      - generic [ref=f31e1003]:
        - code [ref=f31e1004]:
          - generic [ref=f31e1005]: specific job → knowledge → system access → permissions → policies → agent → escalation → human
        - button "Copy" [ref=f31e1006]
      - paragraph [ref=f31e1007]:
        - text: 每个 Agent 都有明确的权限、工作范围、approval 与 escalation，典型场景是 billing、insurance claims 与 IT service request。(
        - link "OpenAI" [ref=f31e1008] [cursor=pointer]:
          - /url: https://openai.com/index/introducing-openai-presence/
        - text: )这已经非常接近金融机构需要的模型。
      - heading "Google：Agent Platform + Enterprise Governance" [level=3] [ref=f31e1009]
      - paragraph [ref=f31e1010]:
        - text: Google 2026 年提出的 Agentic Enterprise blueprint 是
        - code [ref=f31e1011]: Agent + Agent Platform + Orchestration + Governance + Enterprise Data
        - text: ，而不是
        - code [ref=f31e1012]: BPMN + LLM Node
        - text: 。Gemini Enterprise 被明确定义成 agent development + orchestration + governance 的一体化平台，并开始支持 long-running agents、agent collaboration spaces、advanced governance 与 agent marketplace。(
        - link "Google Cloud" [ref=f31e1013] [cursor=pointer]:
          - /url: https://cloud.google.com/blog/products/ai-machine-learning/the-new-gemini-enterprise-one-platform-for-agent-development
        - text: )（
        - link "Google Cloud" [ref=f31e1014] [cursor=pointer]:
          - /url: https://cloud.google.com/blog/products/ai-machine-learning/whats-new-in-gemini-enterprise
        - text: ）这说明大型企业平台厂商的竞争重点，正在从“谁有最好的 Agent Builder”转向谁能提供企业级 Agent Operating Environment。
      - heading "Snowflake：Data-native 的 Agent 平台" [level=3] [ref=f31e1015]
      - paragraph [ref=f31e1016]: Snowflake 的 Cortex Agents 架构已经非常清楚：
      - document [ref=f31e1018]:
        - generic [ref=f31e1026]:
          - paragraph [ref=f31e1033]: Cortex Agent
          - paragraph [ref=f31e1040]: Cortex Analyst
          - paragraph [ref=f31e1047]: Cortex Search
          - paragraph [ref=f31e1054]: Code
          - paragraph [ref=f31e1061]: Structured Data
          - paragraph [ref=f31e1068]: Unstructured Data
          - paragraph [ref=f31e1075]: Compute
          - paragraph [ref=f31e1082]: Reasoning
          - paragraph [ref=f31e1089]: Action
      - paragraph [ref=f31e1090]:
        - text: 官方明确说 Cortex Agents 自己负责 reasoning、plan work、call tools、execute code、maintain threads 与 multi-step orchestration，客户不需要自建 orchestration loop / runtime / sandbox。(
        - link "Snowflake Documentation" [ref=f31e1091] [cursor=pointer]:
          - /url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents
        - text: ) 2026-08-28，Snowflake 进一步建议从 Cortex Analyst 迁移到 Cortex Agents，原因就是后者把 structured data、unstructured data、tool calling、thread context 与 multi-step orchestration 放进了同一个 Agent runtime。(
        - link "Snowflake Documentation" [ref=f31e1092] [cursor=pointer]:
          - /url: https://docs.snowflake.com/en/release-notes/2026/other/2026-08-28-cortex-analyst-transition-cortex-agents
        - text: )针对 Financial Services，它的主张不是“做一个金融 Agent”，而是把
        - code [ref=f31e1093]: first-party data + third-party data + semantic layer + search + agent + action
        - text: 组合起来，通过 Cortex Analyst、Cortex Search、Shared Semantic Views、Knowledge Extensions 与 Cortex Agents，让 Agent 在数据所在的位置执行 workflow。(
        - link "Snowflake" [ref=f31e1094] [cursor=pointer]:
          - /url: https://www.snowflake.com/en/blog/agentic-orchestration-financial-services/
        - text: )这对银行、资产管理、保险特别重要。
      - heading "一个必须写清楚的区分" [level=3] [ref=f31e1095]
      - paragraph [ref=f31e1096]:
        - text: Snowflake 的 Cortex Agents 确实提供 reasoning、planning、tool calling 与 multi-step orchestration。(
        - link "Snowflake Documentation" [ref=f31e1097] [cursor=pointer]:
          - /url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents
        - text: )但这里必须写清楚一句话，否则很容易被误读：Cortex Agents 的“workflow / orchestration”是 Agent 内部的任务编排，不等同于金融企业的 BPMN Business Process orchestration。它不替代 Camunda 这类流程引擎，也不承担流程状态、跨部门审批与责任归属。两者是上下游关系：流程引擎决定“这一步该做合规审查”，Cortex Agents 负责“在这次合规审查里把数据查清楚”。
      - heading "9. 领域三 · Durable Execution（Temporal / Durable Task）" [level=2] [ref=f31e1098]
      - paragraph [ref=f31e1099]: Temporal 的思路甚至更激进：
      - document [ref=f31e1101]:
        - generic [ref=f31e1109]:
          - paragraph [ref=f31e1116]: Workflow
          - paragraph [ref=f31e1123]: Activity → LLM
          - paragraph [ref=f31e1130]: Activity → Tool
          - paragraph [ref=f31e1137]: Activity → Database
          - paragraph [ref=f31e1144]: Activity → API
      - paragraph [ref=f31e1145]: Workflow 本身负责：
      - generic [ref=f31e1147]:
        - code [ref=f31e1148]:
          - generic [ref=f31e1149]: state
          - generic [ref=f31e1150]: ordering
          - generic [ref=f31e1151]: waiting
          - generic [ref=f31e1152]: retry
          - generic [ref=f31e1153]: timeout
          - generic [ref=f31e1154]: resume
        - button "Copy" [ref=f31e1155]
      - paragraph [ref=f31e1156]:
        - text: 所有 nondeterministic I/O 都放在 Activity。Temporal 最近专门发布了 AI Agent Reference Architecture，把 Agent 的 loop 放进 durable Workflow 中。(
        - link "Temporal" [ref=f31e1157] [cursor=pointer]:
          - /url: https://go.temporal.io/platform-hub/ai-engineering/ai-reference-architecture
        - text: )所以它实际上把 Agent 是 intelligence 和 Workflow 是 durable execution 彻底分开了，这个分离很合理。
      - heading "为什么这一层必须单独存在" [level=3] [ref=f31e1158]
      - paragraph [ref=f31e1159]:
        - text: Microsoft 的 Durable Extension 也属于这一层：Agent Framework 的 graph workflow 跑在 Durable Task 基础设施上，支持 checkpoint、resume，以及数天到数周的运行周期。(
        - link "Microsoft Learn" [ref=f31e1160] [cursor=pointer]:
          - /url: https://learn.microsoft.com/en-us/agent-framework/integrations/durable-extension
        - text: )把 Durable Execution 与 Agent Workflow 分开的理由，是它们的失败模式不同：
      - generic [ref=f31e1162]:
        - code [ref=f31e1163]:
          - generic [ref=f31e1164]: Agent Workflow 失败：Agent 选了错误的工具，或推理方向错了
          - generic [ref=f31e1165]: Durable Execution 失败：进程崩了、网络断了，执行无法恢复到崩溃前的状态
        - button "Copy" [ref=f31e1166]
      - paragraph [ref=f31e1167]: 前者是决策质量问题，后者是执行可靠性问题。用同一个组件同时解决两者，最后通常两边都做不好——因为一个需要灵活重规划，另一个需要严格可重放。
      - heading "10. 领域四 · Enterprise Semantic & Data Layer" [level=2] [ref=f31e1168]
      - paragraph [ref=f31e1169]: 前三个领域都在回答“Agent 怎么工作”，这一个回答的是另一个问题：Agent 面对的世界，是用什么语言描述的？
      - heading "Agent 到底应该连接什么" [level=3] [ref=f31e1170]
      - paragraph [ref=f31e1171]: 因为 Palantir 其实回答了一个很关键的问题：Agent 到底应该连接什么？Palantir 的答案不是：
      - generic [ref=f31e1173]:
        - code [ref=f31e1174]:
          - generic [ref=f31e1175]: Agent
          - generic [ref=f31e1176]: ↓
          - generic [ref=f31e1177]: 1000 API
        - button "Copy" [ref=f31e1178]
      - paragraph [ref=f31e1179]: 而是：
      - generic [ref=f31e1181]:
        - code [ref=f31e1182]:
          - generic [ref=f31e1183]: Enterprise Ontology
        - button "Copy" [ref=f31e1184]
      - paragraph [ref=f31e1185]: Ontology 把企业世界建模成：
      - generic [ref=f31e1187]:
        - code [ref=f31e1188]:
          - generic [ref=f31e1189]: Objects
          - generic [ref=f31e1190]: Properties
          - generic [ref=f31e1191]: Links
          - generic [ref=f31e1192]: Actions
          - generic [ref=f31e1193]: Logic
          - generic [ref=f31e1194]: Security
        - button "Copy" [ref=f31e1195]
      - paragraph [ref=f31e1196]:
        - text: 官方把它概括成 Data + Logic + Action + Security。(
        - link "Palantir" [ref=f31e1197] [cursor=pointer]:
          - /url: https://www.palantir.com/docs/foundry/architecture-center/ontology-system
        - text: )更形象一点：
      - document [ref=f31e1199]:
        - generic [ref=f31e1207]:
          - paragraph [ref=f31e1214]: Ontology
          - paragraph [ref=f31e1221]: Company
          - paragraph [ref=f31e1228]: Investor
          - paragraph [ref=f31e1235]: Security
          - paragraph [ref=f31e1242]: Transaction
          - paragraph [ref=f31e1249]: Actions
      - paragraph [ref=f31e1250]: 所以 Agent 看到的不是：
      - generic [ref=f31e1252]:
        - code [ref=f31e1253]:
          - generic [ref=f31e1254]: table
          - generic [ref=f31e1255]: table
          - generic [ref=f31e1256]: API
          - generic [ref=f31e1257]: API
          - generic [ref=f31e1258]: PDF
          - generic [ref=f31e1259]: database
        - button "Copy" [ref=f31e1260]
      - paragraph [ref=f31e1261]: 而是：
      - generic [ref=f31e1263]:
        - code [ref=f31e1264]:
          - generic [ref=f31e1265]: Company
          - generic [ref=f31e1266]: Portfolio
          - generic [ref=f31e1267]: Position
          - generic [ref=f31e1268]: Transaction
          - generic [ref=f31e1269]: Risk
          - generic [ref=f31e1270]: Counterparty
          - generic [ref=f31e1271]: ResearchReport
        - button "Copy" [ref=f31e1272]
      - paragraph [ref=f31e1273]: 并且这些对象自带：
      - generic [ref=f31e1275]:
        - code [ref=f31e1276]:
          - generic [ref=f31e1277]: actions
          - generic [ref=f31e1278]: logic
          - generic [ref=f31e1279]: permissions
          - generic [ref=f31e1280]: relationships
        - button "Copy" [ref=f31e1281]
      - heading "Action 模型：nouns 与 verbs" [level=3] [ref=f31e1282]
      - paragraph [ref=f31e1283]:
        - text: Palantir 有一个很值得重视的思想：数据只是“nouns”，Action 才是“verbs”。也就是说，Company、Position、Loan、Customer、Transaction 这些是 nouns，而 Approve、Reject、Rebalance、Create、Assign、Escalate、Freeze、Review 这些才是 verbs。(
        - link "Palantir" [ref=f31e1284] [cursor=pointer]:
          - /url: https://www.palantir.com/docs/foundry/ontology/why-ontology
        - text: )这恰好解决 Agent 最大的问题：Agent 不只需要知道“这个东西是什么”，还需要知道“对它允许做什么”。
      - heading "Ontology 与 RAG 的差别：world model + action model" [level=3] [ref=f31e1285]
      - paragraph [ref=f31e1286]: 传统：
      - generic [ref=f31e1288]:
        - code [ref=f31e1289]:
          - generic [ref=f31e1290]: RAG
          - generic [ref=f31e1291]: ↓
          - generic [ref=f31e1292]: document
          - generic [ref=f31e1293]: ↓
          - generic [ref=f31e1294]: answer
        - button "Copy" [ref=f31e1295]
      - paragraph [ref=f31e1296]: Ontology：
      - document [ref=f31e1298]:
        - generic [ref=f31e1306]:
          - paragraph [ref=f31e1313]: Ontology
          - paragraph [ref=f31e1320]: Data
          - paragraph [ref=f31e1327]: Logic
          - paragraph [ref=f31e1334]: Action
          - paragraph [ref=f31e1341]: Security
          - paragraph [ref=f31e1348]: Agent
          - paragraph [ref=f31e1355]: Real Action
      - paragraph [ref=f31e1356]: 从架构角度看，它更接近 Agent 的 enterprise world model + action model，而不是一个 Vector DB。（这是本文的架构解读，不是 Palantir 的官方定义。）
      - heading "Ontology MCP：把语义层变成 Agent 的 substrate" [level=3] [ref=f31e1357]
      - paragraph [ref=f31e1358]: 这一步尤其重要。2026-06 Palantir 已经正式 GA Ontology MCP。意味着：
      - generic [ref=f31e1360]:
        - code [ref=f31e1361]:
          - generic [ref=f31e1362]: Claude
          - generic [ref=f31e1363]: OpenAI
          - generic [ref=f31e1364]: Gemini
          - generic [ref=f31e1365]: Microsoft Agent Framework
          - generic [ref=f31e1366]: Google ADK
        - button "Copy" [ref=f31e1367]
      - paragraph [ref=f31e1368]:
        - text: 这些产品本身都支持 MCP，因此任何兼容 MCP 的 Agent / Agent Framework 都可以通过 MCP 做 read Ontology、write Ontology 和 execute Ontology actions，而且调用继续使用 Foundry 权限模型。(
        - link "Palantir" [ref=f31e1369] [cursor=pointer]:
          - /url: https://www.palantir.com/docs/foundry/announcements/2026-06
        - text: )换句话说，Ontology 不需要成为 Agent Framework，它变成 Agent 的 enterprise semantic/action substrate，这比“Palantir 自己做 Agent Framework”更重要。
      - heading "AIP Logic：No-code 没有死，但不再是抽象核心" [level=3] [ref=f31e1370]
      - paragraph [ref=f31e1371]:
        - text: AIP Logic 仍然是 no-code。它可以做 Ontology Object 到 LLM 再到 Condition、Loop、Function 和 Action 的串联，并且支持 testing、evaluation、monitoring、automation 和 human review。(
        - link "Palantir" [ref=f31e1372] [cursor=pointer]:
          - /url: https://www.palantir.com/docs/foundry/logic
        - text: )所以 Palantir 的实际答案不是“No-code 已死”，而是 No-code 不能再是整个系统的抽象，它只是 Ontology / Logic / Action 上面的一个 builder，这个区别直接决定后面怎么搭。
      - heading "Snowflake 的另一条变化：RAG 走向“分析型检索”" [level=3] [ref=f31e1373]
      - paragraph [ref=f31e1374]: 2026 年 Snowflake 推出了 Analytical Search。传统 RAG 是 question 到 top-k documents 再到 LLM，对于“10000 份财报中，有多少家公司……”这类问题其实不行。Snowflake 的新方向是 Agent 调度 multiple Search queries、metadata filters、AISQL、AI_FILTER、AI_AGG，最后 aggregate entire corpus：
      - generic [ref=f31e1376]:
        - code [ref=f31e1377]:
          - generic [ref=f31e1378]: Agent
          - generic [ref=f31e1379]: ↓
          - generic [ref=f31e1380]: multiple Search queries
          - generic [ref=f31e1381]: ↓
          - generic [ref=f31e1382]: metadata filters
          - generic [ref=f31e1383]: ↓
          - generic [ref=f31e1384]: AISQL
          - generic [ref=f31e1385]: ↓
          - generic [ref=f31e1386]: AI_FILTER
          - generic [ref=f31e1387]: ↓
          - generic [ref=f31e1388]: AI_AGG
          - generic [ref=f31e1389]: ↓
          - generic [ref=f31e1390]: aggregate entire corpus
        - button "Copy" [ref=f31e1391]
      - paragraph [ref=f31e1392]:
        - text: 也就是说，Agent 不只是“找资料”，而是能够调度一套数据处理 workflow。(
        - link "Snowflake Documentation" [ref=f31e1393] [cursor=pointer]:
          - /url: https://docs.snowflake.com/en/release-notes/2026/other/2026-06-30-analytical-search-public-preview
        - text: )这个对金融 research、compliance、credit、ESG 很实用。
      - heading "11. 学术界：Agent Workflow 已经成为一等研究对象" [level=2] [ref=f31e1394]
      - paragraph [ref=f31e1395]: 厂商文档之外，还有一个更值得看的信号：研究界已经不再把 Agent 看成“一个 LLM 加几个工具”，而是把 Agent Workflow 本身当成研究对象。这条线上有几篇值得当作入口的论文。
      - heading "1. 《A Survey on Agent Workflow — Status and Future》" [level=3] [ref=f31e1396]
      - paragraph [ref=f31e1397]:
        - text: 这是目前比较值得当作入口的 survey。论文把 Agent Workflow 按两个维度分类：功能上分 planning、多 Agent、API、tool、memory，架构上分 agent role、orchestration flow、workflow specification。它明确指出，随着 Agent 系统变复杂，workflow/orchestration 已经成为 scalable / controllable / secure agent behavior 的核心基础设施，同时指出标准化、安全和多模态 integration 仍是开放问题。(
        - link "arXiv" [ref=f31e1398] [cursor=pointer]:
          - /url: https://arxiv.org/abs/2508.01186
        - text: )这意味着一个很重要的判断：Workflow 不会消失，只是在从“业务流程建模”变成“智能执行系统建模”，这点很容易被企业架构师忽视。
      - heading "2. 《Architectural Implications of Agentic AI Workflows》" [level=3] [ref=f31e1399]
      - paragraph [ref=f31e1400]: 2026 年 8 月的研究直接分析 Agentic Workflow 对底层基础设施的影响，核心发现很有意思：
      - document [ref=f31e1402]:
        - generic [ref=f31e1404]:
          - paragraph [ref=f31e1415]: repeat
          - generic [ref=f31e1416]:
            - paragraph [ref=f31e1423]: Agent Request
            - paragraph [ref=f31e1430]: LLM inference
            - paragraph [ref=f31e1437]: Tool call
            - paragraph [ref=f31e1444]: CPU execution
            - paragraph [ref=f31e1451]: LLM inference
            - paragraph [ref=f31e1458]: Tool call
      - paragraph [ref=f31e1459]: Agent 不是传统 ML 那种 input → GPU → output，而是 CPU、GPU、network、external systems、orchestration 不断交替：
      - generic [ref=f31e1461]:
        - code [ref=f31e1462]:
          - generic [ref=f31e1463]: CPU
          - generic [ref=f31e1464]: GPU
          - generic [ref=f31e1465]: network
          - generic [ref=f31e1466]: external systems
          - generic [ref=f31e1467]: orchestration
          - generic [ref=f31e1468]: CPU
          - generic [ref=f31e1469]: GPU
          - generic [ref=f31e1470]: ...
        - button "Copy" [ref=f31e1471]
      - paragraph [ref=f31e1472]:
        - text: 不断交替。结果就是 CPU/GPU 利用率不均衡，execution bursty，tool invocation 造成 CPU critical path，multi-agent 增加调度复杂度，heterogeneous workloads 使传统 server provisioning 变得低效。论文甚至做了专门的 Agentic Server 原型 Agora。(
        - link "arXiv" [ref=f31e1473] [cursor=pointer]:
          - /url: https://arxiv.org/abs/2608.04458
        - text: )这其实说明 Agent Runtime 最终可能会成为一种全新的计算运行时，而不只是 Python framework。
      - heading "Workflow 定义本身也在 AI 化" [level=3] [ref=f31e1474]
      - paragraph [ref=f31e1475]: 以前是 Developer 设计 Workflow 再部署：
      - generic [ref=f31e1477]:
        - code [ref=f31e1478]:
          - generic [ref=f31e1479]: Developer
          - generic [ref=f31e1480]: ↓
          - generic [ref=f31e1481]: 设计 Workflow
          - generic [ref=f31e1482]: ↓
          - generic [ref=f31e1483]: 部署
        - button "Copy" [ref=f31e1484]
      - paragraph [ref=f31e1485]: 以后可能是 Business Intent 经由 Agent / Compiler，结合 Execution Policy 生成 Generated Plan 再交由 Runtime 执行：
      - generic [ref=f31e1487]:
        - code [ref=f31e1488]:
          - generic [ref=f31e1489]: Business Intent
          - generic [ref=f31e1490]: ↓
          - generic [ref=f31e1491]: Agent / Compiler
          - generic [ref=f31e1492]: ↓
          - generic [ref=f31e1493]: Execution Policy
          - generic [ref=f31e1494]: ↓
          - generic [ref=f31e1495]: Generated Plan
          - generic [ref=f31e1496]: ↓
          - generic [ref=f31e1497]: Runtime
        - button "Copy" [ref=f31e1498]
      - paragraph [ref=f31e1499]:
        - text: 也就是说，Workflow 从“静态 artifact”变成“动态 execution artifact”。最近研究也开始直接研究 Agentic Workflow Generation，也就是从功能描述自动生成可执行 workflow，而研究结果同时指出：单纯让 LLM 生成流程很容易产生缺失/幻觉数据，因此真正可靠的方向是生成 + 约束 + runtime validation，而不是“让 LLM 随便画流程”。(
        - link "Springer Nature Link" [ref=f31e1500] [cursor=pointer]:
          - /url: https://link.springer.com/article/10.1365/s40702-026-01299-4
        - text: )
      - heading "甚至“Workflow”这个词都可能被弱化" [level=3] [ref=f31e1501]
      - paragraph [ref=f31e1502]:
        - text: 未来更准确的词可能是 Agent Runtime、Agent Execution 或 Task Orchestration，而不是 Workflow Engine。在这个基础上，把 Agent 平台抽象成“Agent Operating System”是一个值得关注的研究方向——需要说明的是，它目前仍然只是研究提案，不是已经被行业标准化的架构。一个 2026 年的代表性工作提出 Agent Operating System (AOS)，把系统分成 Control & Governance Plane 与 Runtime & Coordination Plane：前者负责 intent、policy、authority、trust、audit 与 human oversight，后者负责 agent lifecycle、workflow coordination、model/tool routing、memory、scheduling 与 runtime assurance。(
        - link "arXiv" [ref=f31e1503] [cursor=pointer]:
          - /url: https://arxiv.org/abs/2608.03214
        - text: )值得关注的原因不是这个词，而是它把“控制面”与“运行面”分开的方式，与本文后面的分层判断一致。
      - heading "12. 阶段结论：四个领域怎么组合" [level=2] [ref=f31e1504]
      - paragraph [ref=f31e1505]: 到这里可以看到一个比较清楚的分工：
