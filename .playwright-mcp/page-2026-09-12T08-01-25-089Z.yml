        - button "Copy" [ref=f31e1806]
      - paragraph [ref=f31e1807]: 金融领域尤其不可接受。
      - heading "更合理的 2026+ 模型" [level=3] [ref=f31e1808]
      - document [ref=f31e1810]:
        - generic [ref=f31e1822]:
