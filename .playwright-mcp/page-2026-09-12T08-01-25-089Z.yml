          - generic [ref=f31e4373]: +
          - generic [ref=f31e4374]: Relationships
          - generic [ref=f31e4375]: +
          - generic [ref=f31e4376]: Actions
          - generic [ref=f31e4377]: +
          - generic [ref=f31e4378]: Semantic Context
        - button "Copy" [ref=f31e4379]
      - paragraph [ref=f31e4380]: 例如：
      - generic [ref=f31e4382]:
        - code [ref=f31e4383]:
          - generic [ref=f31e4384]: Investment
          - generic [ref=f31e4385]: Portfolio
          - generic [ref=f31e4386]: Security
          - generic [ref=f31e4387]: Issuer
          - generic [ref=f31e4388]: Risk
          - generic [ref=f31e4389]: ComplianceRule
          - generic [ref=f31e4390]: ResearchReport
        - button "Copy" [ref=f31e4391]
      - paragraph [ref=f31e4392]: 然后 BPMN：
      - generic [ref=f31e4394]:
        - code [ref=f31e4395]:
          - generic [ref=f31e4396]: 什么时间做什么
        - button "Copy" [ref=f31e4397]
      - paragraph [ref=f31e4398]: Ontology：
      - generic [ref=f31e4400]:
        - code [ref=f31e4401]:
          - generic [ref=f31e4402]: 处理的业务对象是什么
        - button "Copy" [ref=f31e4403]
      - paragraph [ref=f31e4404]: Agent：
      - generic [ref=f31e4406]:
        - code [ref=f31e4407]:
          - generic [ref=f31e4408]: 如何理解和分析这些对象
        - button "Copy" [ref=f31e4409]
      - paragraph [ref=f31e4410]: 所以三者形成：
      - generic [ref=f31e4412]:
        - code [ref=f31e4413]:
          - generic [ref=f31e4414]: BPMN
          - generic [ref=f31e4415]: ↓
          - generic [ref=f31e4416]: Process
          - generic [ref=f31e4417]: Ontology
          - generic [ref=f31e4418]: ↓
          - generic [ref=f31e4419]: Business World
          - generic [ref=f31e4420]: Agent
          - generic [ref=f31e4421]: ↓
          - generic [ref=f31e4422]: Intelligence
        - button "Copy" [ref=f31e4423]
      - paragraph [ref=f31e4424]: 这是一个很漂亮的组合。
      - heading "45. 一个 AI 平台该怎么分层" [level=2] [ref=f31e4425]
      - paragraph [ref=f31e4426]: 更合理的做法是把架构重新分层，具体如下。以下做法不采用：
      - generic [ref=f31e4428]:
        - code [ref=f31e4429]:
