      - paragraph [ref=f31e3288]: 金融场景里这五条不能合并，原因是审计时它们的举证对象不同：
      - list [ref=f31e3289]:
        - listitem [ref=f31e3290]: BPMN 举的是流程版本；
        - listitem [ref=f31e3291]: DMN 举的是规则版本与输入；
        - listitem [ref=f31e3292]: IAM 举的是主体与授权记录；
        - listitem [ref=f31e3293]: Agent Policy 举的是能力声明与实际调用日志；
        - listitem [ref=f31e3294]: Human Approval 举的是审批人身份与审批当时的判断依据。
      - paragraph [ref=f31e3295]: 混在一起，事故复盘时就无法归因——你只能证明“当时有这个流程”，但不能证明“当时这个动作是被允许的”，更不能证明“当时是谁承担的”。
      - heading "边界：哪些判断必须留给规则" [level=3] [ref=f31e3296]
      - paragraph [ref=f31e3297]: 这条边界应该画得很严，例如：
