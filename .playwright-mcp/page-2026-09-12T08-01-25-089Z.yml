      - heading "16. 金融 Model Risk Management 里的 Agentic Workflow" [level=2] [ref=f31e2128]
      - paragraph [ref=f31e2129]: 这一节看金融领域的实证研究。它们没有停在“客服 Agent”这类演示场景上，而是直接落在信贷、反欺诈和模型风险管理上——比通用的 Agent 案例更接近企业真正的问题。2026 年有一篇比较完整的 survey 覆盖了以下方面：
      - 'heading "Agentic Artificial Intelligence in Finance: A Comprehensive Survey" [level=3] [ref=f31e2130]'
      - paragraph [ref=f31e2131]:
