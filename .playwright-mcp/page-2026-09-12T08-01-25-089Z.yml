          - generic [ref=f31e4610]: ↓
          - generic [ref=f31e4611]: Pattern mining
          - generic [ref=f31e4612]: ↓
          - generic [ref=f31e4613]: Stable subgraph
          - generic [ref=f31e4614]: ↓
          - generic [ref=f31e4615]: Compile into deterministic tool/workflow
        - button "Copy" [ref=f31e4616]
      - paragraph [ref=f31e4617]: 收敛路径如下：
      - generic [ref=f31e4619]:
        - code [ref=f31e4620]:
          - generic [ref=f31e4621]: Agent
          - generic [ref=f31e4622]: ↓
          - generic [ref=f31e4623]: exploration
          - generic [ref=f31e4624]: ↓
