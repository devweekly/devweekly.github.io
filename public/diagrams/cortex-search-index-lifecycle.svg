<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="cortex-search-index-lifecycle-title cortex-search-index-lifecycle-desc"><title id="cortex-search-index-lifecycle-title">Cortex Search 刷新与在线 Serving</title><desc id="cortex-search-index-lifecycle-desc">源查询和刷新 Warehouse 负责初始建索引及后续更新；在线请求通过 Search Service 使用独立的托管 Serving Compute。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#65584D"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8B5A2B"/></marker><filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#221C17" flood-opacity=".08"/></filter></defs><style>
text{fill:#221C17}.eyebrow{font:500 10px 'IBM Plex Mono','Noto Sans SC',monospace;letter-spacing:1.35px;fill:#75695F}.diagram-title{font:600 25px 'IBM Plex Mono','Noto Sans SC',monospace;fill:#221C17}.label{font:600 17px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#221C17}.sub{font:400 12px 'IBM Plex Mono','Noto Sans SC',monospace;fill:#65584D}.chip{font:500 9px 'IBM Plex Mono','Noto Sans SC',monospace;letter-spacing:.45px;fill:#221C17}.note{font:400 12px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#65584D}.node{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.15;filter:url(#soft-shadow)}.focus{fill:#F5E7D4;stroke:#8B5A2B;stroke-width:1.5;filter:url(#soft-shadow)}.connector{fill:none;stroke:#65584D;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}.connector-accent{fill:none;stroke:#8B5A2B;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.connector-return{fill:none;stroke:#75695F;stroke-width:1.2;stroke-dasharray:5 4;stroke-linecap:round;stroke-linejoin:round}.zone{fill:#F1EDE4;stroke:#CFC5B8;stroke-width:1}.actor{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.15;filter:url(#soft-shadow)}.lifeline{stroke:#CFC5B8;stroke-width:1;stroke-dasharray:4 5}.activation{fill:#F1EDE4;stroke:#75695F;stroke-width:.9}.message{stroke:#65584D;stroke-width:1.35;fill:none;marker-end:url(#arrow)}.message-return{stroke:#75695F;stroke-width:1.2;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}.message-success{stroke:#8B5A2B;stroke-width:1.65;fill:none;marker-end:url(#arrow-accent)}.message-label{font:500 9px 'IBM Plex Mono',monospace;fill:#65584D;letter-spacing:.25px}
</style><rect width="1280" height="720" fill="#F9F6EF"/><text x="56" y="36" class="eyebrow">MANAGED SEARCH · INDEX LIFECYCLE AND QUERY PLANE</text><text x="56" y="78" class="diagram-title">Cortex Search 刷新与在线 Serving</text><text x="56" y="106" class="note">源查询和刷新 Warehouse 负责初始建索引及后续更新；在线请求通过 Search Service 使用独立的托管 Serving Compute。</text><path d="M280 220 H360" class="connector" marker-end="url(#arrow)"/><path d="M590 220 H680" class="connector" marker-end="url(#arrow)"/><path d="M280 510 H360" class="connector" marker-end="url(#arrow)"/><path d="M590 510 H680" class="connector" marker-end="url(#arrow)"/><path d="M805 454 V276" class="connector-accent" marker-end="url(#arrow-accent)"/><path d="M930 220 H1000" class="connector" marker-end="url(#arrow)"/><g class="card"><rect x="50" y="164" width="230" height="112" rx="12" class="node"/><rect x="66" y="178" width="114" height="20" rx="10" fill="#F4EFC9"/><text x="123" y="192" text-anchor="middle" class="chip">DATA SOURCE</text><text x="66" y="222" class="label" font-size="18">Snowflake 源查询</text><text x="66" y="246" class="sub">SQL · text · attributes</text><text x="66" y="263" class="sub">已治理的检索数据集</text></g><g class="card"><rect x="360" y="164" width="230" height="112" rx="12" class="node"/><rect x="376" y="178" width="82" height="20" rx="10" fill="#D8EEE8"/><text x="417" y="192" text-anchor="middle" class="chip">REFRESH</text><text x="376" y="222" class="label" font-size="16">Virtual Warehouse</text><text x="376" y="246" class="sub">初始构建 · 增量刷新</text><text x="376" y="263" class="sub">TARGET_LAG 控制目标</text></g><g class="card"><rect x="680" y="164" width="250" height="112" rx="12" class="focus"/><rect x="696" y="178" width="130" height="20" rx="10" fill="#F5E7D4"/><text x="761" y="192" text-anchor="middle" class="chip">MANAGED INDEX</text><text x="696" y="222" class="label" font-size="16">Cortex Search Index</text><text x="696" y="246" class="sub">关键词 + 向量召回</text><text x="696" y="263" class="sub">语义重排与属性过滤</text></g><g class="card"><rect x="50" y="454" width="230" height="112" rx="12" class="node"/><rect x="66" y="468" width="78" height="20" rx="10" fill="#DCE5F4"/><text x="105" y="482" text-anchor="middle" class="chip">CLIENT</text><text x="66" y="512" class="label" font-size="18">应用 / Agent</text><text x="66" y="536" class="sub">Search request</text><text x="66" y="553" class="sub">不直接扫描源表</text></g><g class="card"><rect x="360" y="454" width="230" height="112" rx="12" class="node"/><rect x="376" y="468" width="114" height="20" rx="10" fill="#DCE5F4"/><text x="433" y="482" text-anchor="middle" class="chip">SERVICE API</text><text x="376" y="512" class="label" font-size="16">Cortex Search API</text><text x="376" y="536" class="sub">查询参数 · 属性过滤</text><text x="376" y="553" class="sub">受控角色调用服务</text></g><g class="card"><rect x="680" y="454" width="250" height="112" rx="12" class="node"/><rect x="696" y="468" width="82" height="20" rx="10" fill="#D8EEE8"/><text x="737" y="482" text-anchor="middle" class="chip">SERVING</text><text x="696" y="512" class="label" font-size="16">Managed Serving Compute</text><text x="696" y="536" class="sub">独立在线检索容量</text><text x="696" y="553" class="sub">与刷新 Warehouse 分离</text></g><g class="card"><rect x="1000" y="164" width="230" height="112" rx="12" class="node"/><rect x="1016" y="178" width="78" height="20" rx="10" fill="#DCE5F4"/><text x="1055" y="192" text-anchor="middle" class="chip">RESULT</text><text x="1016" y="222" class="label" font-size="18">Ranked chunks</text><text x="1016" y="246" class="sub">文本 · 属性 · score</text><text x="1016" y="263" class="sub">返回检索证据</text></g><line x1="56" y1="670" x2="1224" y2="670" stroke="#CFC5B8" stroke-width=".8"/><text x="56" y="694" class="note">TARGET_LAG 影响索引新鲜度；在线查询使用托管 Serving Compute，不是每次请求都运行源 SQL。</text></svg>
