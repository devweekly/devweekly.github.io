<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spark Shuffle 数据重分布</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#F9F6EF;color:#221C17;font-family:Geist,Arial,sans-serif;padding:48px 24px}.frame{max-width:1180px;margin:auto}.eyebrow{font:500 11px 'Geist Mono',monospace;letter-spacing:.16em;color:#65584D;text-transform:uppercase}h1{font:400 clamp(28px,4vw,42px) 'Instrument Serif',serif;margin:14px 0 28px}.diagram{overflow-x:auto;background:#F9F6EF}.diagram svg{display:block;min-width:900px;width:100%;height:auto}p{color:#65584D;font-size:14px;line-height:1.6}</style></head><body><main class="frame"><p class="eyebrow">Dev Weekly · Diagram Design</p><h1>Spark Shuffle 数据重分布</h1><div class="diagram"><svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="shuffle-title shuffle-desc"><title id="shuffle-title">Spark shuffle boundary</title><desc id="shuffle-desc">Input partitions are processed locally, shuffled across executors by key, then aggregated in downstream partitions.</desc><defs><marker id="sarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#65584D"/></marker></defs><rect width="1120" height="520" rx="16" fill="#F9F6EF"/><text x="42" y="44" font-family="Arial" font-size="13" letter-spacing="2" fill="#65584D">WHY GROUP BY AND JOIN CAN BE EXPENSIVE</text><g font-family="Arial"><text x="62" y="100" font-size="16" font-weight="700" fill="#221C17">Input partitions</text><text x="420" y="100" font-size="16" font-weight="700" fill="#221C17">Shuffle by key</text><text x="820" y="100" font-size="16" font-weight="700" fill="#221C17">Downstream partitions</text><g><rect x="60" y="125" width="210" height="95" rx="10" fill="#FFFEFA" stroke="#CFC5B8"/><text x="80" y="155" font-size="14" font-weight="700" fill="#221C17">Partition 0</text><text x="80" y="183" font-size="12" fill="#65584D">A · B · A · C</text><rect x="60" y="245" width="210" height="95" rx="10" fill="#FFFEFA" stroke="#CFC5B8"/><text x="80" y="275" font-size="14" font-weight="700" fill="#221C17">Partition 1</text><text x="80" y="303" font-size="12" fill="#65584D">B · C · A · B</text><rect x="60" y="365" width="210" height="95" rx="10" fill="#FFFEFA" stroke="#CFC5B8"/><text x="80" y="395" font-size="14" font-weight="700" fill="#221C17">Partition 2</text><text x="80" y="423" font-size="12" fill="#65584D">C · A · C · B</text></g><g><rect x="405" y="125" width="250" height="95" rx="10" fill="#F5E7D4" stroke="#8B5A2B"/><text x="430" y="155" font-size="14" font-weight="700" fill="#221C17">Network + disk exchange</text><text x="430" y="183" font-size="12" fill="#65584D">Partition records by key</text><rect x="405" y="245" width="250" height="95" rx="10" fill="#F5E7D4" stroke="#8B5A2B"/><text x="430" y="275" font-size="14" font-weight="700" fill="#221C17">Sort / hash / spill</text><text x="430" y="303" font-size="12" fill="#65584D">Serialize and fetch blocks</text><rect x="405" y="365" width="250" height="95" rx="10" fill="#F5E7D4" stroke="#8B5A2B"/><text x="430" y="395" font-size="14" font-weight="700" fill="#221C17">Stage boundary</text><text x="430" y="423" font-size="12" fill="#65584D">Downstream tasks can start</text></g><g><rect x="795" y="125" width="250" height="95" rx="10" fill="#D8EEE8" stroke="#6F948A"/><text x="820" y="155" font-size="14" font-weight="700" fill="#221C17">Key bucket A</text><text x="820" y="183" font-size="12" fill="#65584D">A · A · A · A</text><rect x="795" y="245" width="250" height="95" rx="10" fill="#D8EEE8" stroke="#6F948A"/><text x="820" y="275" font-size="14" font-weight="700" fill="#221C17">Key bucket B</text><text x="820" y="303" font-size="12" fill="#65584D">B · B · B · B</text><rect x="795" y="365" width="250" height="95" rx="10" fill="#D8EEE8" stroke="#6F948A"/><text x="820" y="395" font-size="14" font-weight="700" fill="#221C17">Key bucket C</text><text x="820" y="423" font-size="12" fill="#65584D">C · C · C · C</text></g><path d="M270 172 C320 172 340 172 397 172 M270 292 C330 292 340 292 397 292 M270 412 C330 412 340 412 397 412" stroke="#65584D" stroke-width="1.6" fill="none" marker-end="url(#sarr)"/><path d="M655 172 C710 172 730 172 787 172 M655 292 C710 292 730 292 787 292 M655 412 C710 412 730 412 787 412" stroke="#65584D" stroke-width="1.6" fill="none" marker-end="url(#sarr)"/><text x="560" y="493" font-size="12" text-anchor="middle" fill="#75695F">A hot key can overload one bucket: skew creates long-tail tasks even when average utilization looks low.</text></g></svg></div><p>Diagram is provided as standalone SVG for embedding and this HTML page for full-size viewing.</p></main></body></html>
