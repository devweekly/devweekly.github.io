<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snowflake Time Travel 版本模型</title><style>*{box-sizing:border-box}body{margin:0;background:#F9F6EF;color:#221C17;font-family:'IBM Plex Mono','Noto Sans SC',system-ui,sans-serif}main{max-width:1500px;margin:0 auto;padding:24px}h1{font-size:20px;font-weight:500;margin:0 0 18px}.frame{width:100%;overflow:auto}svg{display:block;width:100%;height:auto;min-width:900px}</style></head><body><main><h1>Snowflake Time Travel 版本模型</h1><div class="frame"><?xml version="1.0" encoding="UTF-8"?>

<text x="72" y="150" class="eyebrow">LOGICAL VIEW · CONCEPTUAL MODEL</text>
