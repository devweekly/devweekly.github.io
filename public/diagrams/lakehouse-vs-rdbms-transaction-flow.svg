<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="lakehouse-vs-rdbms-transaction-flow-title lakehouse-vs-rdbms-transaction-flow-desc"><title id="lakehouse-vs-rdbms-transaction-flow-title">湖仓表格式与传统数据库事务流程</title><desc id="lakehouse-vs-rdbms-transaction-flow-desc">Three transaction paths compare raw Parquet files, Iceberg or Delta snapshot commits, and PostgreSQL or Oracle record-level transaction logging.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#65584D"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#221C17" flood-opacity=".08"/></filter></defs><rect width="100%" height="100%" fill="#F9F6EF"/><style>
text{font-family:'IBM Plex Mono','Noto Sans SC',system-ui,sans-serif;fill:#221C17}
.mono{font-family:'IBM Plex Mono','Noto Sans SC',monospace}
.eyebrow{font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:11px;letter-spacing:1.7px;fill:#75695F}
.title{font-size:28px;font-weight:500;letter-spacing:0}
.label{font-size:16px;font-weight:600}
.sub{font-size:12px;fill:#65584D}
.tiny{font-size:10.5px;fill:#65584D}
.micro{font-size:9px;fill:#75695F}
.zone{fill:#F1EDE4;stroke:#CFC5B8;stroke-width:1}
.node{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.2}
.focus{fill:#F5E7D4;stroke:#8B5A2B;stroke-width:1.5}
.softblue{fill:#DCE5F4;stroke:#AAB9D0;stroke-width:1}
.softgreen{fill:#D8EEE8;stroke:#9EBFB3;stroke-width:1}
.line{fill:none;stroke:#65584D;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arr)}
.dash{fill:none;stroke:#75695F;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arr)}
.divider{stroke:#CFC5B8;stroke-width:1}
</style>
<text x="56" y="48" class="eyebrow">TRANSACTION COMMIT · THREE DIFFERENT MODELS</text>
<text x="56" y="88" class="title">数据湖表格式与传统数据库：事务提交路径并不相同</text>
<text x="56" y="116" class="sub">同样执行 UPDATE / INSERT，真正不同的是：提交什么、并发在哪里协调、读者如何识别已提交状态。</text>

<!-- lane 1 raw files -->
<rect x="56" y="148" width="1328" height="164" rx="12" class="zone"/>
<rect x="72" y="164" width="180" height="132" rx="10" fill="#F1EDE4" stroke="#CFC5B8"/>
<text x="92" y="190" class="eyebrow">A · RAW DATA LAKE</text>
<text x="92" y="220" class="label">Parquet files</text>
<text x="92" y="244" class="tiny">只有文件格式与对象存储</text>
<text x="92" y="270" class="micro">没有表级事务协议</text>
<rect x="282" y="178" width="220" height="92" rx="10" class="node" filter="url(#shadow)"/>
<text x="392" y="207" text-anchor="middle" class="label">写出新文件</text><text x="392" y="232" text-anchor="middle" class="sub">part-001.parquet</text><text x="392" y="252" text-anchor="middle" class="micro">对象存储写入</text>
<path d="M502 224 H554" class="line"/>
<rect x="558" y="178" width="244" height="92" rx="10" class="node" filter="url(#shadow)"/>
<text x="680" y="207" text-anchor="middle" class="label">更新目录 / 覆盖文件</text><text x="680" y="232" text-anchor="middle" class="sub">依赖外部约定或编排</text><text x="680" y="252" text-anchor="middle" class="micro">没有通用原子表提交</text>
<path d="M802 224 H854" class="line"/>
<rect x="858" y="178" width="236" height="92" rx="10" class="node" filter="url(#shadow)"/>
<text x="976" y="207" text-anchor="middle" class="label">读者枚举文件</text><text x="976" y="232" text-anchor="middle" class="sub">可能观察到不完整集合</text><text x="976" y="252" text-anchor="middle" class="micro">无统一 Snapshot 边界</text>
<rect x="1120" y="178" width="236" height="92" rx="10" fill="#FFFEFA" stroke="#CFC5B8"/>
<text x="1238" y="207" text-anchor="middle" class="label">并发写入需自建协调</text><text x="1238" y="232" text-anchor="middle" class="sub">锁、命名约定、调度</text><text x="1238" y="252" text-anchor="middle" class="micro">失败清理与回滚也要自理</text>

<!-- lane 2 Iceberg / Delta -->
<rect x="56" y="330" width="1328" height="188" rx="12" class="zone"/>
<rect x="72" y="346" width="180" height="156" rx="10" fill="#F1EDE4" stroke="#CFC5B8"/>
<text x="92" y="372" class="eyebrow">B · LAKEHOUSE</text>
<text x="92" y="402" class="label">Iceberg / Delta</text>
<text x="92" y="426" class="tiny">表格式 + Catalog / Log</text>
<text x="92" y="452" class="micro">文件集合有事务边界</text>
<rect x="282" y="364" width="220" height="112" rx="10" class="node" filter="url(#shadow)"/>
<text x="392" y="393" text-anchor="middle" class="label">生成数据文件</text><text x="392" y="418" text-anchor="middle" class="sub">Parquet / Delete files</text><text x="392" y="440" text-anchor="middle" class="micro">先写入，尚未对读者可见</text>
<path d="M502 420 H554" class="line"/>
<rect x="558" y="364" width="244" height="112" rx="10" class="node" filter="url(#shadow)"/>
<text x="680" y="393" text-anchor="middle" class="label">生成新元数据</text><text x="680" y="418" text-anchor="middle" class="sub">Iceberg Manifest / Snapshot</text><text x="680" y="440" text-anchor="middle" class="micro">Delta：事务日志提交记录</text>
<path d="M802 420 H854" class="line"/>
<rect x="858" y="364" width="236" height="112" rx="10" class="focus" filter="url(#shadow)"/>
<text x="976" y="393" text-anchor="middle" class="label">原子提交新版本</text><text x="976" y="418" text-anchor="middle" class="sub">Catalog CAS / Log commit</text><text x="976" y="440" text-anchor="middle" class="micro">冲突检测 · 重试或失败</text>
<path d="M1094 420 H1116" class="line"/>
<rect x="1120" y="364" width="236" height="112" rx="10" class="softgreen" filter="url(#shadow)"/>
<text x="1238" y="393" text-anchor="middle" class="label">读者固定 Snapshot</text><text x="1238" y="418" text-anchor="middle" class="sub">只读已提交文件集合</text><text x="1238" y="440" text-anchor="middle" class="micro">旧快照可继续被读取</text>
<text x="282" y="495" class="tiny">原子边界是表快照 / 日志版本；并发冲突在提交时校验，不靠逐行锁。</text>

<!-- lane 3 RDBMS -->
<rect x="56" y="536" width="1328" height="252" rx="12" class="zone"/>
<rect x="72" y="552" width="180" height="220" rx="10" fill="#F1EDE4" stroke="#CFC5B8"/>
<text x="92" y="578" class="eyebrow">C · RDBMS</text>
<text x="92" y="608" class="label">PostgreSQL</text>
<text x="92" y="632" class="label">Oracle</text>
<text x="92" y="668" class="tiny">事务管理器与存储引擎</text>
<text x="92" y="694" class="micro">记录级并发控制</text>
<rect x="282" y="570" width="220" height="174" rx="10" class="node" filter="url(#shadow)"/>
<text x="392" y="599" text-anchor="middle" class="label">修改记录</text>
<text x="300" y="630" class="tiny">PostgreSQL</text><text x="300" y="650" class="micro">新 Tuple 版本</text><text x="300" y="669" class="micro">行锁 / MVCC</text>
<line x1="300" y1="684" x2="484" y2="684" class="divider"/>
<text x="300" y="707" class="tiny">Oracle</text><text x="300" y="726" class="micro">数据块修改 + 行锁</text>
<path d="M502 657 H554" class="line"/>
<rect x="558" y="570" width="244" height="174" rx="10" class="node" filter="url(#shadow)"/>
<text x="680" y="599" text-anchor="middle" class="label">持久化恢复日志</text>
<text x="578" y="632" class="tiny">PostgreSQL · WAL</text><text x="578" y="652" class="micro">记录可重做的变更</text>
<line x1="576" y1="670" x2="784" y2="670" class="divider"/>
<text x="578" y="698" class="tiny">Oracle · Redo + Undo</text><text x="578" y="720" class="micro">Redo 恢复；Undo 回滚 / 一致性读</text>
<path d="M802 657 H854" class="line"/>
<rect x="858" y="570" width="236" height="174" rx="10" class="focus" filter="url(#shadow)"/>
<text x="976" y="599" text-anchor="middle" class="label">提交事务</text>
<text x="876" y="632" class="tiny">PostgreSQL</text><text x="876" y="652" class="micro">Commit record 写入 WAL</text>
<line x1="876" y1="670" x2="1076" y2="670" class="divider"/>
<text x="876" y="698" class="tiny">Oracle</text><text x="876" y="720" class="micro">Redo commit record + SCN</text>
<path d="M1094 657 H1116" class="line"/>
<rect x="1120" y="570" width="236" height="174" rx="10" class="softgreen" filter="url(#shadow)"/>
<text x="1238" y="599" text-anchor="middle" class="label">事务可见 / 恢复</text>
<text x="1138" y="632" class="tiny">PostgreSQL</text><text x="1138" y="652" class="micro">MVCC Snapshot 决定可见性</text>
<line x1="1138" y1="670" x2="1338" y2="670" class="divider"/>
<text x="1138" y="698" class="tiny">Oracle</text><text x="1138" y="720" class="micro">SCN + Undo 重建一致性读</text>

<text x="720" y="820" text-anchor="middle" class="tiny">关键区别：湖仓表格式原子切换“文件集合版本”；传统 RDBMS 原子提交“事务中的记录变更”，并维护行级并发与恢复语义。</text>
</svg>