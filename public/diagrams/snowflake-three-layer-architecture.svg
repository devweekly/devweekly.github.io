<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="sf-architecture-title sf-architecture-desc"><title id="sf-architecture-title">Snowflake 三层架构</title><desc id="sf-architecture-desc">Snowflake separates cloud services, independent MPP virtual warehouses, and persistent cloud object storage.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#65584D"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#221C17" flood-opacity=".08"/></filter></defs><rect width="100%" height="100%" fill="#F9F6EF"/><style>text{font-family:'IBM Plex Mono','Noto Sans SC',system-ui,sans-serif;fill:#221C17} .eyebrow{font-size:11px;letter-spacing:1.5px;fill:#75695F} .label{font-size:16px;font-weight:600} .sub{font-size:12px;fill:#65584D} .tiny{font-size:11px;fill:#65584D} .node{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.2} .zone{fill:#F1EDE4;stroke:#CFC5B8;stroke-width:1} .focus{fill:#F5E7D4;stroke:#8B5A2B;stroke-width:1.5} .line{fill:none;stroke:#65584D;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arr)} .dash{fill:none;stroke:#65584D;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arr)} </style>
<text x="56" y="54" class="eyebrow">SNOWFLAKE · SERVICE ARCHITECTURE</text>
<text x="56" y="91" font-size="28" font-weight="600">三层架构：持久数据、弹性计算与控制面</text>
<rect x="56" y="126" width="1328" height="126" rx="12" class="zone"/>
<text x="82" y="155" class="eyebrow">CLOUD SERVICES · CONTROL PLANE</text>
<rect x="88" y="174" width="250" height="54" rx="9" class="node"/><text x="213" y="197" text-anchor="middle" class="label">身份与权限</text><text x="213" y="216" text-anchor="middle" class="tiny">Auth · RBAC · Governance</text>
<rect x="380" y="174" width="250" height="54" rx="9" class="node"/><text x="505" y="197" text-anchor="middle" class="label">元数据目录</text><text x="505" y="216" text-anchor="middle" class="tiny">Objects · Snapshots · Statistics</text>
<rect x="672" y="174" width="250" height="54" rx="9" class="node"/><text x="797" y="197" text-anchor="middle" class="label">SQL 优化与调度</text><text x="797" y="216" text-anchor="middle" class="tiny">Parse · Plan · Dispatch</text>
<rect x="964" y="174" width="250" height="54" rx="9" class="node"/><text x="1089" y="197" text-anchor="middle" class="label">账户与服务管理</text><text x="1089" y="216" text-anchor="middle" class="tiny">Billing · Lifecycle · Sharing</text>
<rect x="56" y="290" width="1328" height="222" rx="12" class="zone"/>
