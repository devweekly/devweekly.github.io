<rect x="578" y="416" width="82" height="42" rx="6" class="node"/><text x="619" y="442" text-anchor="middle" class="tiny">Node A</text><rect x="679" y="416" width="82" height="42" rx="6" class="node"/><text x="720" y="442" text-anchor="middle" class="tiny">Node B</text><rect x="780" y="416" width="82" height="42" rx="6" class="node"/><text x="821" y="442" text-anchor="middle" class="tiny">Node N</text>
<rect x="990" y="344" width="360" height="138" rx="10" class="node" filter="url(#shadow)"/><text x="1170" y="374" text-anchor="middle" class="label">Ad-hoc Warehouse</text><text x="1170" y="396" text-anchor="middle" class="sub">独立 MPP Cluster</text>
<rect x="1028" y="416" width="82" height="42" rx="6" class="node"/><text x="1069" y="442" text-anchor="middle" class="tiny">Node A</text><rect x="1129" y="416" width="82" height="42" rx="6" class="node"/><text x="1170" y="442" text-anchor="middle" class="tiny">Node B</text><rect x="1230" y="416" width="82" height="42" rx="6" class="node"/><text x="1271" y="442" text-anchor="middle" class="tiny">Node N</text>
<rect x="56" y="550" width="1328" height="152" rx="12" class="zone"/>
<text x="82" y="580" class="eyebrow">DATABASE STORAGE · PERSISTENT CLOUD OBJECT STORAGE</text>
<rect x="330" y="602" width="780" height="70" rx="10" class="focus"/><text x="720" y="630" text-anchor="middle" class="label">Snowflake-managed columnar micro-partitions</text><text x="720" y="652" text-anchor="middle" class="sub">Compressed data · per-column statistics · historical versions</text>
<path d="M505 228 V270 H270 V344" class="line"/><path d="M797 228 V270 H720 V344" class="line"/><path d="M1089 228 V270 H1170 V344" class="line"/>
