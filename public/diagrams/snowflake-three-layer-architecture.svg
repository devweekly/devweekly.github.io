<rect x="128" y="416" width="82" height="42" rx="6" class="node"/><text x="169" y="442" text-anchor="middle" class="tiny">Node A</text><rect x="229" y="416" width="82" height="42" rx="6" class="node"/><text x="270" y="442" text-anchor="middle" class="tiny">Node B</text><rect x="330" y="416" width="82" height="42" rx="6" class="node"/><text x="371" y="442" text-anchor="middle" class="tiny">Node N</text>
