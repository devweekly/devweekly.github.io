<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="connect-title connect-desc"><title id="connect-title">Snowpark Connect execution boundary</title><desc id="connect-desc">A PySpark client submits Spark Connect plans over gRPC to Snowpark Connect, which translates supported operations for Snowflake execution.</desc><defs><marker id="conarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#65584D"/></marker></defs><rect width="1120" height="440" rx="16" fill="#F9F6EF"/><text x="42" y="44" font-family="Arial" font-size="13" letter-spacing="2" fill="#65584D">SPARK CONNECT PROTOCOL · SNOWFLAKE EXECUTION ENGINE</text><rect x="55" y="105" width="250" height="210" rx="12" fill="#F1EDE4" stroke="#CFC5B8"/><text x="80" y="142" font-family="Arial" font-size="18" font-weight="700" fill="#221C17">Client application</text><text x="80" y="180" font-family="Arial" font-size="14" fill="#65584D">PySpark DataFrame API</text><text x="80" y="207" font-family="Arial" font-size="14" fill="#65584D">Build unresolved plan</text><text x="80" y="234" font-family="Arial" font-size="14" fill="#65584D">Python dependencies</text><text x="80" y="278" font-family="Arial" font-size="12" fill="#75695F">No Spark Executor cluster here</text><rect x="420" y="105" width="260" height="210" rx="12" fill="#F5E7D4" stroke="#8B5A2B" stroke-width="1.5"/><text x="445" y="142" font-family="Arial" font-size="18" font-weight="700" fill="#221C17">Snowpark Connect</text><text x="445" y="180" font-family="Arial" font-size="14" fill="#65584D">Spark Connect server</text><text x="445" y="207" font-family="Arial" font-size="14" fill="#65584D">Resolve / translate plan</text><text x="445" y="234" font-family="Arial" font-size="14" fill="#65584D">Check supported API surface</text><text x="445" y="278" font-family="Arial" font-size="12" fill="#75695F">Compatibility is not full equivalence</text><rect x="795" y="105" width="270" height="210" rx="12" fill="#D8EEE8" stroke="#6F948A"/><text x="820" y="142" font-family="Arial" font-size="18" font-weight="700" fill="#221C17">Snowflake engine</text><text x="820" y="180" font-family="Arial" font-size="14" fill="#65584D">SQL optimizer + execution</text><text x="820" y="207" font-family="Arial" font-size="14" fill="#65584D">Virtual Warehouse</text><text x="820" y="234" font-family="Arial" font-size="14" fill="#65584D">Query History / governance</text><text x="820" y="278" font-family="Arial" font-size="12" fill="#75695F">Snowflake owns compute semantics</text><path d="M305 210 H412" stroke="#65584D" stroke-width="2" marker-end="url(#conarr)"/><text x="358" y="195" text-anchor="middle" font-family="Arial" font-size="11" fill="#65584D">gRPC plan</text><path d="M680 210 H787" stroke="#65584D" stroke-width="2" marker-end="url(#conarr)"/><text x="734" y="195" text-anchor="middle" font-family="Arial" font-size="11" fill="#65584D">SQL mapping</text><rect x="55" y="350" width="1010" height="52" rx="8" fill="#F1EDE4"/><text x="80" y="382" font-family="Arial" font-size="13" fill="#65584D">Validate Spark version, API coverage, UDF behavior, file I/O, cache semantics, query plan and operational observability before migration.</text></svg>
