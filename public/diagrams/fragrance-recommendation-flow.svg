<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fr-flow-title fr-flow-desc">
<title id="fr-flow-title">香水推荐请求处理流程</title><desc id="fr-flow-desc">自然语言解析、概念映射、候选召回、硬过滤、软排序和解释输出的处理流程。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker><marker id="arrx" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#bf4520"/></marker></defs><rect width="960" height="620" fill="#f5f5f5"/>
<!-- central spine -->
<path d="M480 82V106M480 158V181M480 239V261M480 321V344M480 405V428M480 489V512" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
<!-- boxes -->
<g><rect x="300" y="30" width="360" height="52" rx="25" fill="#ececec" stroke="#bfc0c0"/><text x="480" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">用户请求</text><text x="480" y="69" text-anchor="middle" font-size="10" fill="#4f5d75">雨后森林、湿润泥土、苔藓；不要太甜</text></g>
<g><rect x="300" y="106" width="360" height="52" rx="7" fill="#ececec" stroke="#bfc0c0"/><text x="480" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">意图与约束解析</text><text x="480" y="145" text-anchor="middle" font-size="10" fill="#4f5d75">正向概念 / 否定概念 / 预算 / 场景 / 强度</text></g>
<g><rect x="300" y="181" width="360" height="58" rx="7" fill="#f8e9e3" stroke="#bf4520" stroke-width="1.5"/><text x="480" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">中文嗅觉本体映射</text><text x="480" y="224" text-anchor="middle" font-size="10" fill="#4f5d75">petrichor · earthy · mossy · woody · low-sweetness</text></g>
<g><rect x="90" y="261" width="780" height="60" rx="7" fill="#ececec" stroke="#bfc0c0"/><text x="480" y="284" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">多路候选召回（Recall）</text><text x="480" y="303" text-anchor="middle" font-size="10" fill="#4f5d75">结构化 SQL 过滤  +  同义词 / BM25  +  向量语义检索  +  相似产品邻居</text></g>
<g><rect x="300" y="344" width="360" height="61" rx="7" fill="#ececec" stroke="#bfc0c0"/><text x="480" y="369" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">硬约束过滤（Filter）</text><text x="480" y="389" text-anchor="middle" font-size="10" fill="#4f5d75">预算 / 浓度 / 可购买地区 / 禁忌 / 明确排除项</text></g>
<g><rect x="300" y="428" width="360" height="61" rx="7" fill="#2d3142" stroke="#2d3142"/><text x="480" y="453" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">个性化重排序（Rank）</text><text x="480" y="473" text-anchor="middle" font-size="10" fill="#d9dce3">气味匹配 + 用户偏好 + 评价证据 + 多样性</text></g>
<g><rect x="300" y="512" width="360" height="58" rx="25" fill="#f8e9e3" stroke="#bf4520" stroke-width="1.5"/><text x="480" y="536" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">推荐列表 + 推荐理由</text><text x="480" y="555" text-anchor="middle" font-size="10" fill="#4f5d75">展示命中属性、来源、置信度与不确定性</text></g>
<!-- side annotation -->
<path d="M660 210H720V286H870" stroke="#4f5d75" stroke-width="1" fill="none"/>
<rect x="720" y="184" width="150" height="68" rx="6" fill="#ececec" stroke="#bfc0c0"/>
<text x="795" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3142">语义映射不是配方</text><text x="795" y="224" text-anchor="middle" font-size="9" fill="#4f5d75">描述相似 ≠ 含有</text><text x="795" y="239" text-anchor="middle" font-size="9" fill="#4f5d75">某个特定分子</text>
<path d="M300 458H170V472" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
<rect x="70" y="472" width="200" height="66" rx="6" fill="#ececec" stroke="#bfc0c0"/>
<text x="170" y="495" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3142">反馈信号</text><text x="170" y="514" text-anchor="middle" font-size="9" fill="#4f5d75">收藏 / 跳过 / 试香 / 购买</text><text x="170" y="528" text-anchor="middle" font-size="9" fill="#4f5d75">带时间与上下文记录</text>
<text x="480" y="600" text-anchor="middle" font-size="9" fill="#4f5d75">Recall 与 Rank 分离：先保证候选覆盖，再优化用户体验与业务目标</text>
</svg>
