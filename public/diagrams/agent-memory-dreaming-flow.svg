<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="agent-memory-dreaming-title agent-memory-dreaming-desc">
  <title id="agent-memory-dreaming-title">Agent Memory Dreaming 流程</title>
  <desc id="agent-memory-dreaming-desc">从会话事件捕获、候选提取和来源校验开始，可信候选进入合并和发布；未满足证据要求的候选暂存，发布后通过 Replay 评估记忆的实际价值。</desc>
  <defs>
    <filter id="dream-node-shadow" x="-12%" y="-12%" width="124%" height="140%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#221C17" flood-opacity="0.10"/></filter>
    <marker id="dream-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#65584D"/></marker>
    <marker id="dream-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8B5A2B"/></marker>
  </defs>
  <style>
    .eyebrow{font-family:'Geist Mono','Noto Sans SC',sans-serif;font-size:11px;letter-spacing:1.5px;fill:#75695F}
    .headline{font-family:'Instrument Serif','Noto Serif SC',serif;font-size:28px;fill:#221C17}
    .node-title{font-family:'Geist','Noto Sans SC',sans-serif;font-size:17px;font-weight:600;fill:#221C17}
    .node-sub{font-family:'Geist','Noto Sans SC',sans-serif;font-size:12px;fill:#65584D}
    .tech{font-family:'Geist Mono','Noto Sans SC',monospace;font-size:10px;fill:#75695F}
    .card{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.2;filter:url(#dream-node-shadow)}
    .focal{fill:#F5E7D4;stroke:#8B5A2B;stroke-width:1.7;filter:url(#dream-node-shadow)}
    .hold{fill:#F1EDE4;stroke:#A99A8B;stroke-width:1.2;filter:url(#dream-node-shadow)}
    .decision{fill:#FFFEFA;stroke:#8B5A2B;stroke-width:1.7;filter:url(#dream-node-shadow)}
    .arrow{fill:none;stroke:#65584D;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#dream-arrow)}
    .accent-arrow{fill:none;stroke:#8B5A2B;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#dream-arrow-accent)}
    .mask{fill:#F9F6EF}
    .branch-label{font-family:'Geist Mono','Noto Sans SC',monospace;font-size:10px;font-weight:600;fill:#65584D}
  </style>
  <rect width="1280" height="960" fill="#F9F6EF"/>
  <text x="48" y="42" class="eyebrow">BACKGROUND MEMORY MAINTENANCE · EVIDENCE FIRST</text>
  <text x="48" y="82" class="headline">Dreaming turns observations into maintained knowledge</text>
  <text x="48" y="106" class="node-sub">候选记忆只有在来源、Scope、时效和冲突检查通过后，才会成为可检索的长期记录</text>

  <ellipse cx="640" cy="142" rx="172" ry="34" class="focal"/>
  <text x="640" y="147" text-anchor="middle" class="node-title">Capture Session Events</text>

  <rect x="465" y="208" width="350" height="78" rx="12" class="card"/>
  <text x="640" y="239" text-anchor="middle" class="node-title">Extract Candidate Facts</text>
  <text x="640" y="263" text-anchor="middle" class="node-sub">偏好 · 决策 · 事实 · 可复用操作经验</text>

  <rect x="465" y="334" width="350" height="78" rx="12" class="card"/>
  <text x="640" y="365" text-anchor="middle" class="node-title">Rehydrate Source Evidence</text>
  <text x="640" y="389" text-anchor="middle" class="node-sub">回读 Transcript · 工具结果 · 原始来源</text>

  <path d="M640 176 V208" class="arrow"/>
  <path d="M640 286 V334" class="arrow"/>
  <path d="M640 412 V432" class="arrow"/>

  <polygon points="640,432 735,495 640,558 545,495" class="decision"/>
  <text x="640" y="490" text-anchor="middle" class="node-title">Evidence</text>
  <text x="640" y="512" text-anchor="middle" class="node-title">Sufficient?</text>

  <rect x="465" y="625" width="350" height="78" rx="12" class="hold"/>
  <text x="640" y="656" text-anchor="middle" class="node-title">Hold / Quarantine</text>
  <text x="640" y="680" text-anchor="middle" class="node-sub">保留候选与缺失原因，等待新证据或拒绝</text>

  <rect x="900" y="456" width="280" height="78" rx="12" class="focal"/>
  <text x="1040" y="487" text-anchor="middle" class="node-title">Merge / Supersede</text>
  <text x="1040" y="511" text-anchor="middle" class="node-sub">去重 · 处理冲突 · 更新有效时间</text>

  <rect x="900" y="590" width="280" height="78" rx="12" class="card"/>
  <text x="1040" y="621" text-anchor="middle" class="node-title">Publish Memory &amp; Indexes</text>
  <text x="1040" y="645" text-anchor="middle" class="node-sub">Notes · Wiki / Graph · Recall Index</text>

  <rect x="900" y="724" width="280" height="78" rx="12" class="card"/>
  <text x="1040" y="755" text-anchor="middle" class="node-title">Replay Tasks</text>
  <text x="1040" y="779" text-anchor="middle" class="node-sub">相同任务：有记忆 / 无记忆</text>

  <ellipse cx="1040" cy="878" rx="140" ry="34" class="focal"/>
  <text x="1040" y="873" text-anchor="middle" class="node-title">Evaluate Utility</text>
  <text x="1040" y="890" text-anchor="middle" class="tech">HELPFUL · NEUTRAL · HARMFUL</text>

  <path d="M735 495 H900" class="accent-arrow"/>
  <path d="M640 558 V625" class="arrow"/>
  <path d="M1040 534 V590" class="arrow"/>
  <path d="M1040 668 V724" class="arrow"/>
  <path d="M1040 802 V844" class="arrow"/>

  <rect x="786" y="464" width="47" height="22" rx="4" class="mask"/>
  <text x="809.5" y="479" text-anchor="middle" class="branch-label">YES</text>
  <rect x="651" y="574" width="42" height="22" rx="4" class="mask"/>
  <text x="672" y="589" text-anchor="middle" class="branch-label">NO</text>

  <text x="48" y="930" class="tech">不应自动晋升的候选进入隔离区；Replay 结果反馈给提取门槛和检索策略，而不是直接改写来源事实。</text>
</svg>