<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="search-authorization-boundaries-title search-authorization-boundaries-desc"><title id="search-authorization-boundaries-title">三种检索后端的权限执行边界</title><desc id="search-authorization-boundaries-desc">统一策略决策产生可信约束，但每种后端的执行语义不同；Cortex Search 的 owner’s rights 尤其需要单独设计。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#65584D"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8B5A2B"/></marker><filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#221C17" flood-opacity=".08"/></filter></defs><style>
text{fill:#221C17}.eyebrow{font:500 10px 'IBM Plex Mono','Noto Sans SC',monospace;letter-spacing:1.35px;fill:#75695F}.diagram-title{font:600 25px 'IBM Plex Mono','Noto Sans SC',monospace;fill:#221C17}.label{font:600 17px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#221C17}.sub{font:400 12px 'IBM Plex Mono','Noto Sans SC',monospace;fill:#65584D}.chip{font:500 9px 'IBM Plex Mono','Noto Sans SC',monospace;letter-spacing:.45px;fill:#221C17}.note{font:400 12px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#65584D}.node{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.15;filter:url(#soft-shadow)}.focus{fill:#F5E7D4;stroke:#8B5A2B;stroke-width:1.5;filter:url(#soft-shadow)}.connector{fill:none;stroke:#65584D;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}.connector-accent{fill:none;stroke:#8B5A2B;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.connector-return{fill:none;stroke:#75695F;stroke-width:1.2;stroke-dasharray:5 4;stroke-linecap:round;stroke-linejoin:round}.zone{fill:#F1EDE4;stroke:#CFC5B8;stroke-width:1}.actor{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.15;filter:url(#soft-shadow)}.lifeline{stroke:#CFC5B8;stroke-width:1;stroke-dasharray:4 5}.activation{fill:#F1EDE4;stroke:#75695F;stroke-width:.9}.message{stroke:#65584D;stroke-width:1.35;fill:none;marker-end:url(#arrow)}.message-return{stroke:#75695F;stroke-width:1.2;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}.message-success{stroke:#8B5A2B;stroke-width:1.65;fill:none;marker-end:url(#arrow-accent)}.message-label{font:500 9px 'IBM Plex Mono',monospace;fill:#65584D;letter-spacing:.25px}
</style><rect width="1280" height="720" fill="#F9F6EF"/><text x="56" y="36" class="eyebrow">SECURITY ARCHITECTURE · POLICY ENFORCEMENT POINTS</text><text x="56" y="78" class="diagram-title">三种检索后端的权限执行边界</text><text x="56" y="106" class="note">统一策略决策产生可信约束，但每种后端的执行语义不同；Cortex Search 的 owner’s rights 尤其需要单独设计。</text><path d="M280 208 H455" class="connector" marker-end="url(#arrow)"/><path d="M610 251 V310" class="connector" /><path d="M230 310 H1050" class="connector" /><path d="M230 310 V370" class="connector" marker-end="url(#arrow)"/><path d="M640 310 V370" class="connector" marker-end="url(#arrow)"/><path d="M1050 310 V370" class="connector" marker-end="url(#arrow)"/><path d="M230 494 V535" class="connector" /><path d="M640 494 V535" class="connector" /><path d="M1050 494 V535" class="connector" /><path d="M230 535 H1050" class="connector" /><path d="M640 535 V548" class="connector" marker-end="url(#arrow)"/><g class="card"><rect x="70" y="150" width="210" height="112" rx="12" class="node"/><rect x="86" y="164" width="90" height="20" rx="10" fill="#DCE5F4"/><text x="131" y="178" text-anchor="middle" class="chip">IDENTITY</text><text x="86" y="208" class="label" font-size="18">可信身份</text><text x="86" y="232" class="sub">user · tenant · role</text><text x="86" y="249" class="sub">由认证上下文提供</text></g><g class="card"><rect x="455" y="135" width="310" height="116" rx="12" class="focus"/><rect x="471" y="149" width="78" height="20" rx="10" fill="#F0DDEB"/><text x="510" y="163" text-anchor="middle" class="chip">POLICY</text><text x="471" y="193" class="label" font-size="16">PDP + Retrieval Router</text><text x="471" y="217" class="sub">确定性 entitlement 决策</text><text x="471" y="234" class="sub">签发服务端过滤约束</text></g><g class="card"><rect x="70" y="370" width="320" height="124" rx="12" class="node"/><rect x="86" y="384" width="106" height="20" rx="10" fill="#DCE5F4"/><text x="139" y="398" text-anchor="middle" class="chip">OPENSEARCH</text><text x="86" y="428" class="label" font-size="16">DLS / ACL filter</text><text x="86" y="452" class="sub">身份映射与文档级策略</text><text x="86" y="469" class="sub">强制服务端注入过滤</text></g><g class="card"><rect x="480" y="370" width="320" height="124" rx="12" class="node"/><rect x="496" y="384" width="90" height="20" rx="10" fill="#D8EEE8"/><text x="541" y="398" text-anchor="middle" class="chip">POSTGRES</text><text x="496" y="428" class="label" font-size="16">SQL / JOIN / RLS</text><text x="496" y="452" class="sub">正确的数据库连接角色</text><text x="496" y="469" class="sub">防止 BYPASSRLS 绕过</text></g><g class="card"><rect x="890" y="370" width="320" height="124" rx="12" class="node"/><rect x="906" y="384" width="130" height="20" rx="10" fill="#F5E7D4"/><text x="971" y="398" text-anchor="middle" class="chip">CORTEX SEARCH</text><text x="906" y="428" class="label" font-size="18">Owner’s rights</text><text x="906" y="452" class="sub">源表 RLS 不等于调用者过滤</text><text x="906" y="469" class="sub">按安全域拆分服务并验证属性</text></g><g class="card"><rect x="455" y="548" width="370" height="112" rx="12" class="node"/><rect x="471" y="562" width="114" height="20" rx="10" fill="#F4EFC9"/><text x="528" y="576" text-anchor="middle" class="chip">FINAL CHECK</text><text x="471" y="606" class="label" font-size="18">回源校验与审计</text><text x="471" y="630" class="sub">ACL · source version · result ids</text><text x="471" y="647" class="sub">返回前再次确认</text></g><line x1="56" y1="670" x2="1224" y2="670" stroke="#CFC5B8" stroke-width=".8"/><text x="56" y="694" class="note">不可绕过的授权必须由可信策略与后端执行；Prompt 中的权限声明不能替代访问控制。</text></svg>
