<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Desktop 执行配置与能力边界</title><style>body{margin:0;padding:24px;background:#f3f5f8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1440px;margin:auto;background:#fff;box-shadow:0 8px 32px #18243a18}svg{display:block;width:100%;height:auto}</style></head><body><main><?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">Agent Desktop execution profiles and capability boundaries</title><desc id="desc">Task policy selects a minimal execution profile. Independent capabilities are enforced by operating system sandbox, file service, network proxy, connector authorization and desktop application approval.</desc><defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#536176}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#536176}.box{fill:#f7f9fc;stroke:#9aa9bd;stroke-width:1.5}.blue{fill:#eaf2ff;stroke:#4779bb;stroke-width:2}.green{fill:#eaf7f0;stroke:#4d9470;stroke-width:2}.amber{fill:#fff5df;stroke:#c18b35;stroke-width:2}.line{stroke:#64748b;stroke-width:2.2;fill:none}.dash{stroke:#8b98aa;stroke-width:1.7;stroke-dasharray:7 6;fill:none}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs><rect width="1440" height="820" fill="#fff"/><text x="64" y="66" class="title">Agent Desktop：任务执行配置与能力边界</text><text x="64" y="96" class="sub">授权策略决定“允许什么”；执行环境负责在技术上限制“实际能做什么”。两者不能互相替代。</text><rect x="64" y="132" width="260" height="104" rx="14" class="blue"/><text x="194" y="170" text-anchor="middle" class="head">Task / 工作目标</text><text x="194" y="199" text-anchor="middle" class="body">用户、数据分类、目标产物</text><rect x="390" y="132" width="300" height="104" rx="14" class="blue"/><text x="540" y="170" text-anchor="middle" class="head">Policy Decision Point</text><text x="540" y="199" text-anchor="middle" class="body">最小权限执行配置 / 风险评估</text><path d="M324 184 H390" class="line" marker-end="url(#arrow)"/><rect x="756" y="132" width="620" height="104" rx="14" class="green"/><text x="1066" y="170" text-anchor="middle" class="head">Execution Profile</text><text x="1066" y="199" text-anchor="middle" class="body">Document Reader · Code Reviewer · Code Runner · Code Developer · Browser / Desktop / Business Operator</text><path d="M690 184 H756" class="line" marker-end="url(#arrow)"/><text x="64" y="292" class="head">独立能力面（按任务逐项授予，不因启用一种能力而继承其他能力）</text><g><rect x="64" y="322" width="202" height="112" rx="12" class="box"/><text x="165" y="359" text-anchor="middle" class="head">文件访问</text><text x="165" y="388" text-anchor="middle" class="body">目录 / 文件 / 操作类型</text><text x="165" y="411" text-anchor="middle" class="small">敏感文件默认拒绝</text><rect x="292" y="322" width="202" height="112" rx="12" class="box"/><text x="393" y="359" text-anchor="middle" class="head">代码执行</text><text x="393" y="388" text-anchor="middle" class="body">Shell / 测试 / 构建</text><text x="393" y="411" text-anchor="middle" class="small">隔离进程与依赖脚本</text><rect x="520" y="322" width="202" height="112" rx="12" class="box"/><text x="621" y="359" text-anchor="middle" class="head">网络访问</text><text x="621" y="388" text-anchor="middle" class="body">目的地 / 协议 / 代理</text><text x="621" y="411" text-anchor="middle" class="small">默认关闭，按需开放</text><rect x="748" y="322" width="202" height="112" rx="12" class="box"/><text x="849" y="359" text-anchor="middle" class="head">结构化工具</text><text x="849" y="388" text-anchor="middle" class="body">MCP / API / Connector</text><text x="849" y="411" text-anchor="middle" class="small">用户身份与资源级授权</text><rect x="976" y="322" width="202" height="112" rx="12" class="box"/><text x="1077" y="359" text-anchor="middle" class="head">浏览器控制</text><text x="1077" y="388" text-anchor="middle" class="body">站点 / 会话 / 上传下载</text><text x="1077" y="411" text-anchor="middle" class="small">独立于文件沙箱</text><rect x="1204" y="322" width="172" height="112" rx="12" class="box"/><text x="1290" y="359" text-anchor="middle" class="head">桌面应用</text><text x="1290" y="388" text-anchor="middle" class="body">应用 / 会话 / 动作</text><text x="1290" y="411" text-anchor="middle" class="small">OS 权限与审批</text></g><path d="M1066 236 V270 H165 V322 M1066 270 H1290 V322" class="dash"/><rect x="64" y="498" width="1312" height="170" rx="16" class="green"/><text x="720" y="536" text-anchor="middle" class="head">执行时强制控制（Policy Enforcement）</text><g><rect x="92" y="562" width="226" height="76" rx="10" fill="#fff" stroke="#4d9470"/><text x="205" y="592" text-anchor="middle" class="head">OS Sandbox / VM</text><text x="205" y="617" text-anchor="middle" class="small">进程、系统调用、资源隔离</text><rect x="342" y="562" width="226" height="76" rx="10" fill="#fff" stroke="#4d9470"/><text x="455" y="592" text-anchor="middle" class="head">File Access Service</text><text x="455" y="617" text-anchor="middle" class="small">句柄、路径、读写与删除</text><rect x="592" y="562" width="226" height="76" rx="10" fill="#fff" stroke="#4d9470"/><text x="705" y="592" text-anchor="middle" class="head">Egress Proxy</text><text x="705" y="617" text-anchor="middle" class="small">网络目的地与数据流向</text><rect x="842" y="562" width="226" height="76" rx="10" fill="#fff" stroke="#4d9470"/><text x="955" y="592" text-anchor="middle" class="head">Connector Gateway</text><text x="955" y="617" text-anchor="middle" class="small">凭证代理、OAuth Scope</text><rect x="1092" y="562" width="256" height="76" rx="10" fill="#fff" stroke="#4d9470"/><text x="1220" y="592" text-anchor="middle" class="head">App / Browser Approval</text><text x="1220" y="617" text-anchor="middle" class="small">应用范围、会话和动作</text></g><rect x="64" y="710" width="1312" height="66" rx="12" class="amber"/><text x="720" y="739" text-anchor="middle" class="head">审批是例外控制，不是沙箱</text><text x="720" y="761" text-anchor="middle" class="small">任务级短时授权 · 绑定资源与参数 · 参数变化重新审批 · 任务结束回收权限 · 全链路审计</text></svg></main></body></html>
