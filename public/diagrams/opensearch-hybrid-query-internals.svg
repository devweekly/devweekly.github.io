<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="opensearch-hybrid-query-internals-title opensearch-hybrid-query-internals-desc"><title id="opensearch-hybrid-query-internals-title">OpenSearch Hybrid Search 执行路径</title><desc id="opensearch-hybrid-query-internals-desc">协调节点将查询分发到相关 Shard；每个 Shard 可同时承载倒排索引和向量 ANN 访问路径，候选结果汇总后进入搜索管线。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#65584D"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8B5A2B"/></marker><filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#221C17" flood-opacity=".08"/></filter></defs><style>
text{fill:#221C17}.eyebrow{font:500 10px 'IBM Plex Mono','Noto Sans SC',monospace;letter-spacing:1.35px;fill:#75695F}.diagram-title{font:600 25px 'IBM Plex Mono','Noto Sans SC',monospace;fill:#221C17}.label{font:600 17px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#221C17}.sub{font:400 12px 'IBM Plex Mono','Noto Sans SC',monospace;fill:#65584D}.chip{font:500 9px 'IBM Plex Mono','Noto Sans SC',monospace;letter-spacing:.45px;fill:#221C17}.note{font:400 12px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#65584D}.node{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.15;filter:url(#soft-shadow)}.focus{fill:#F5E7D4;stroke:#8B5A2B;stroke-width:1.5;filter:url(#soft-shadow)}.connector{fill:none;stroke:#65584D;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}.connector-accent{fill:none;stroke:#8B5A2B;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.connector-return{fill:none;stroke:#75695F;stroke-width:1.2;stroke-dasharray:5 4;stroke-linecap:round;stroke-linejoin:round}.zone{fill:#F1EDE4;stroke:#CFC5B8;stroke-width:1}.actor{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.15;filter:url(#soft-shadow)}.lifeline{stroke:#CFC5B8;stroke-width:1;stroke-dasharray:4 5}.activation{fill:#F1EDE4;stroke:#75695F;stroke-width:.9}.message{stroke:#65584D;stroke-width:1.35;fill:none;marker-end:url(#arrow)}.message-return{stroke:#75695F;stroke-width:1.2;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}.message-success{stroke:#8B5A2B;stroke-width:1.65;fill:none;marker-end:url(#arrow-accent)}.message-label{font:500 9px 'IBM Plex Mono',monospace;fill:#65584D;letter-spacing:.25px}
</style><rect width="1280" height="720" fill="#F9F6EF"/><text x="56" y="36" class="eyebrow">SEARCH ENGINE · DISTRIBUTED SHARD EXECUTION</text><text x="56" y="78" class="diagram-title">OpenSearch Hybrid Search 执行路径</text><text x="56" y="106" class="note">协调节点将查询分发到相关 Shard；每个 Shard 可同时承载倒排索引和向量 ANN 访问路径，候选结果汇总后进入搜索管线。</text><path d="M250 356 H310" class="connector" marker-end="url(#arrow)"/><path d="M530 356 H560 V280 H720 V262" class="connector" marker-end="url(#arrow)"/><path d="M530 356 H560 V506 H600" class="connector" marker-end="url(#arrow)"/><path d="M840 206 H860 V345 H900" class="connector" marker-end="url(#arrow)"/><path d="M840 506 H880 V377 H900" class="connector" marker-end="url(#arrow)"/><path d="M1080 356 H1090" class="connector" marker-end="url(#arrow)"/><g class="card"><rect x="60" y="300" width="190" height="112" rx="12" class="node"/><rect x="76" y="314" width="82" height="20" rx="10" fill="#DCE5F4"/><text x="117" y="328" text-anchor="middle" class="chip">REQUEST</text><text x="76" y="358" class="label" font-size="18">Search API</text><text x="76" y="382" class="sub">Query DSL · filters</text><text x="76" y="399" class="sub">关键词与向量条件</text></g><g class="card"><rect x="310" y="300" width="220" height="112" rx="12" class="focus"/><rect x="326" y="314" width="114" height="20" rx="10" fill="#F5E7D4"/><text x="383" y="328" text-anchor="middle" class="chip">COORDINATOR</text><text x="326" y="358" class="label" font-size="18">协调节点</text><text x="326" y="382" class="sub">选择目标 Shard</text><text x="326" y="399" class="sub">汇总分片候选</text></g><g class="card"><rect x="600" y="150" width="240" height="112" rx="12" class="node"/><rect x="616" y="164" width="82" height="20" rx="10" fill="#D8EEE8"/><text x="657" y="178" text-anchor="middle" class="chip">SHARD A</text><text x="616" y="208" class="label" font-size="18">Shard / Segment</text><text x="616" y="232" class="sub">倒排索引 · BM25</text><text x="616" y="249" class="sub">k-NN · HNSW / IVF</text></g><g class="card"><rect x="600" y="450" width="240" height="112" rx="12" class="node"/><rect x="616" y="464" width="82" height="20" rx="10" fill="#D8EEE8"/><text x="657" y="478" text-anchor="middle" class="chip">SHARD B</text><text x="616" y="508" class="label" font-size="18">Shard / Segment</text><text x="616" y="532" class="sub">倒排索引 · BM25</text><text x="616" y="549" class="sub">k-NN · HNSW / IVF</text></g><g class="card"><rect x="900" y="300" width="180" height="112" rx="12" class="node"/><rect x="916" y="314" width="90" height="20" rx="10" fill="#F5E7D4"/><text x="961" y="328" text-anchor="middle" class="chip">PIPELINE</text><text x="916" y="358" class="label" font-size="18">Search Pipeline</text><text x="916" y="382" class="sub">分数归一化或 RRF</text><text x="916" y="399" class="sub">候选融合与重排</text></g><g class="card"><rect x="1090" y="300" width="135" height="112" rx="12" class="node"/><rect x="1106" y="314" width="78" height="20" rx="10" fill="#DCE5F4"/><text x="1145" y="328" text-anchor="middle" class="chip">OUTPUT</text><text x="1106" y="358" class="label" font-size="18">Top-K</text><text x="1106" y="382" class="sub">Ranked hits</text><text x="1106" y="399" class="sub">返回候选</text></g><line x1="56" y1="670" x2="1224" y2="670" stroke="#CFC5B8" stroke-width=".8"/><text x="56" y="694" class="note">Normalization 与 RRF 是可配置的融合路线；图示为逻辑阶段，不表示两者必须同时执行。</text></svg>
