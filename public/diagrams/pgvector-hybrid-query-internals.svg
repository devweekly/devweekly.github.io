<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="pgvector-hybrid-query-internals-title pgvector-hybrid-query-internals-desc"><title id="pgvector-hybrid-query-internals-title">PostgreSQL + pgvector 混合查询路径</title><desc id="pgvector-hybrid-query-internals-desc">PostgreSQL Planner / Executor 编排全文和向量索引访问，并在 SQL 语义中结合关系过滤、JOIN、RLS 与结果融合。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#65584D"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8B5A2B"/></marker><filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#221C17" flood-opacity=".08"/></filter></defs><style>
text{fill:#221C17}.eyebrow{font:500 10px 'IBM Plex Mono','Noto Sans SC',monospace;letter-spacing:1.35px;fill:#75695F}.diagram-title{font:600 25px 'IBM Plex Mono','Noto Sans SC',monospace;fill:#221C17}.label{font:600 17px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#221C17}.sub{font:400 12px 'IBM Plex Mono','Noto Sans SC',monospace;fill:#65584D}.chip{font:500 9px 'IBM Plex Mono','Noto Sans SC',monospace;letter-spacing:.45px;fill:#221C17}.note{font:400 12px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#65584D}.node{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.15;filter:url(#soft-shadow)}.focus{fill:#F5E7D4;stroke:#8B5A2B;stroke-width:1.5;filter:url(#soft-shadow)}.connector{fill:none;stroke:#65584D;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}.connector-accent{fill:none;stroke:#8B5A2B;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.connector-return{fill:none;stroke:#75695F;stroke-width:1.2;stroke-dasharray:5 4;stroke-linecap:round;stroke-linejoin:round}.zone{fill:#F1EDE4;stroke:#CFC5B8;stroke-width:1}.actor{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.15;filter:url(#soft-shadow)}.lifeline{stroke:#CFC5B8;stroke-width:1;stroke-dasharray:4 5}.activation{fill:#F1EDE4;stroke:#75695F;stroke-width:.9}.message{stroke:#65584D;stroke-width:1.35;fill:none;marker-end:url(#arrow)}.message-return{stroke:#75695F;stroke-width:1.2;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}.message-success{stroke:#8B5A2B;stroke-width:1.65;fill:none;marker-end:url(#arrow-accent)}.message-label{font:500 9px 'IBM Plex Mono',monospace;fill:#65584D;letter-spacing:.25px}
</style><rect width="1280" height="720" fill="#F9F6EF"/><text x="56" y="36" class="eyebrow">DATABASE ENGINE · SQL PLANNER AND INDEX ACCESS</text><text x="56" y="78" class="diagram-title">PostgreSQL + pgvector 混合查询路径</text><text x="56" y="106" class="note">PostgreSQL Planner / Executor 编排全文和向量索引访问，并在 SQL 语义中结合关系过滤、JOIN、RLS 与结果融合。</text><path d="M250 376 H300" class="connector" marker-end="url(#arrow)"/><path d="M510 376 H560 V280 H720 V262" class="connector" marker-end="url(#arrow)"/><path d="M510 376 H540 V506 H600" class="connector" marker-end="url(#arrow)"/><path d="M720 262 V286 H970 V320" class="connector" marker-end="url(#arrow)"/><path d="M840 506 H860 V376 H880" class="connector" marker-end="url(#arrow)"/><path d="M1060 376 H1080" class="connector" marker-end="url(#arrow)"/><path d="M1160 432 V520" class="connector" marker-end="url(#arrow)"/><g class="card"><rect x="60" y="320" width="190" height="112" rx="12" class="node"/><rect x="76" y="334" width="78" height="20" rx="10" fill="#DCE5F4"/><text x="115" y="348" text-anchor="middle" class="chip">SQL</text><text x="76" y="378" class="label" font-size="18">SQL 请求</text><text x="76" y="402" class="sub">WHERE · JOIN · ORDER</text><text x="76" y="419" class="sub">业务字段与向量条件</text></g><g class="card"><rect x="300" y="320" width="210" height="112" rx="12" class="focus"/><rect x="316" y="334" width="98" height="20" rx="10" fill="#F5E7D4"/><text x="365" y="348" text-anchor="middle" class="chip">EXECUTION</text><text x="316" y="378" class="label" font-size="16">Planner / Executor</text><text x="316" y="402" class="sub">执行计划 · MVCC</text><text x="316" y="419" class="sub">数据库角色与事务语义</text></g><g class="card"><rect x="600" y="150" width="240" height="112" rx="12" class="node"/><rect x="616" y="164" width="98" height="20" rx="10" fill="#D8EEE8"/><text x="665" y="178" text-anchor="middle" class="chip">FULL TEXT</text><text x="616" y="208" class="label" font-size="18">tsvector + GIN</text><text x="616" y="232" class="sub">词项召回 · 排名函数</text><text x="616" y="249" class="sub">PostgreSQL FTS</text></g><g class="card"><rect x="600" y="450" width="240" height="112" rx="12" class="node"/><rect x="616" y="464" width="106" height="20" rx="10" fill="#D8EEE8"/><text x="669" y="478" text-anchor="middle" class="chip">VECTOR ANN</text><text x="616" y="508" class="label" font-size="16">pgvector HNSW / IVFFlat</text><text x="616" y="532" class="sub">近似最近邻候选</text><text x="616" y="549" class="sub">可按数据与过滤调参</text></g><g class="card"><rect x="880" y="320" width="180" height="112" rx="12" class="node"/><rect x="896" y="334" width="78" height="20" rx="10" fill="#F0DDEB"/><text x="935" y="348" text-anchor="middle" class="chip">FILTER</text><text x="896" y="378" class="label" font-size="16">SQL / JOIN / RLS</text><text x="896" y="402" class="sub">关系与租户约束</text><text x="896" y="419" class="sub">按执行计划下推</text></g><g class="card"><rect x="1080" y="320" width="160" height="112" rx="12" class="node"/><rect x="1096" y="334" width="78" height="20" rx="10" fill="#F5E7D4"/><text x="1135" y="348" text-anchor="middle" class="chip">FUSION</text><text x="1096" y="378" class="label" font-size="18">RRF / 排序</text><text x="1096" y="402" class="sub">SQL 或应用层</text><text x="1096" y="419" class="sub">Top-K candidates</text></g><g class="card"><rect x="1080" y="520" width="160" height="112" rx="12" class="node"/><rect x="1096" y="534" width="78" height="20" rx="10" fill="#DCE5F4"/><text x="1135" y="548" text-anchor="middle" class="chip">RESULT</text><text x="1096" y="578" class="label" font-size="18">业务行</text><text x="1096" y="602" class="sub">chunks · rows</text><text x="1096" y="619" class="sub">回到业务对象</text></g><line x1="56" y1="670" x2="1224" y2="670" stroke="#CFC5B8" stroke-width=".8"/><text x="56" y="694" class="note">ANN 过滤行为取决于计划与扫描策略；iterative scans、分区和 EXPLAIN ANALYZE 应纳入 PoC。</text></svg>
