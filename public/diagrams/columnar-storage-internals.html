<text x="56" y="48" class="eyebrow">PHYSICAL DATA LAYOUT · CONCEPTUAL INTERNAL VIEW</text>
<text x="56" y="88" class="title">一张表如何变成列式数据块</text>
<text x="56" y="116" class="sub">以一个 Micro-partition 中的 6 行交易数据为例；结构用于解释原理，不代表 Snowflake 未公开的内部文件格式。</text>
