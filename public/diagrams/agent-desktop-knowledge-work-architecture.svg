<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Agent Desktop knowledge work reference architecture</title>
<desc id="desc">Knowledge workers use a desktop workspace connected to an agent runtime, enterprise control plane, governed tools and enterprise systems, with task artifacts and evidence ledger.</desc>
<defs><style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#263247}
.h1{font-size:31px;font-weight:700}.sub{font-size:15px;fill:#65738a}.label{font-size:18px;font-weight:700}.body{font-size:14px;fill:#526178}.small{font-size:12px;fill:#66758b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.blue{fill:#eaf2ff;stroke:#8eaddd}.sand{fill:#f6f0e6;stroke:#c9aa7b}.green{fill:#eaf5ef;stroke:#8bb8a0}.line{stroke:#8090a7;stroke-width:2;fill:none}.dash{stroke-dasharray:7 6}
</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#8090a7"/></marker></defs>
<rect width="1440" height="900" fill="#f7f8fa"/>
<text x="64" y="66" class="h1">Agent Desktop：知识工作参考架构</text><text x="64" y="96" class="sub">Task-first workspace · governed execution · evidence-backed deliverables</text>
<rect x="64" y="132" width="1312" height="112" rx="18" class="box"/>
<text x="90" y="165" class="label">知识工作者</text><text x="90" y="194" class="body">金融分析师 · 研究员 · 架构师 · 审核员</text>
<rect x="430" y="153" width="210" height="65" rx="12" class="blue"/><text x="535" y="180" text-anchor="middle" class="label">委托任务</text><text x="535" y="201" text-anchor="middle" class="small">目标 / 范围 / 交付标准</text>
<rect x="675" y="153" width="210" height="65" rx="12" class="blue"/><text x="780" y="180" text-anchor="middle" class="label">观察与干预</text><text x="780" y="201" text-anchor="middle" class="small">进度 / 暂停 / 接管 / 审批</text>
<rect x="920" y="153" width="210" height="65" rx="12" class="blue"/><text x="1025" y="180" text-anchor="middle" class="label">审查与交付</text><text x="1025" y="201" text-anchor="middle" class="small">证据 / 产物 / 版本 / 分享</text>
<path d="M640 185H670M885 185H915" class="line" marker-end="url(#arrow)"/>
<rect x="64" y="280" width="1312" height="250" rx="18" fill="#f0f4fa" stroke="#aebed2" stroke-width="1.5"/>
<text x="90" y="315" class="label">Agent Runtime（按任务执行）</text>
<rect x="90" y="350" width="230" height="140" rx="12" class="box"/><text x="205" y="383" text-anchor="middle" class="label">Task Manager</text><text x="205" y="412" text-anchor="middle" class="body">任务状态 / checkpoint</text><text x="205" y="437" text-anchor="middle" class="body">取消 / 恢复 / 超时</text><text x="205" y="462" text-anchor="middle" class="small">Task ID · Trace ID</text>
<rect x="365" y="350" width="230" height="140" rx="12" class="box"/><text x="480" y="383" text-anchor="middle" class="label">Agent Orchestrator</text><text x="480" y="412" text-anchor="middle" class="body">规划 / 模型调用</text><text x="480" y="437" text-anchor="middle" class="body">Skills / 子任务 / handoff</text><text x="480" y="462" text-anchor="middle" class="small">模型输出不是授权决策</text>
<rect x="640" y="350" width="230" height="140" rx="12" class="box"/><text x="755" y="383" text-anchor="middle" class="label">Context Assembly</text><text x="755" y="412" text-anchor="middle" class="body">工作区 / 用户权限</text><text x="755" y="437" text-anchor="middle" class="body">来源 / 版本 / 数据分类</text><text x="755" y="462" text-anchor="middle" class="small">最小必要上下文</text>
<rect x="915" y="350" width="190" height="140" rx="12" class="sand"/><text x="1010" y="383" text-anchor="middle" class="label">Artifact Store</text><text x="1010" y="412" text-anchor="middle" class="body">文档 / 工作簿</text><text x="1010" y="437" text-anchor="middle" class="body">报告 / 图表 / 草稿</text><text x="1010" y="462" text-anchor="middle" class="small">版本化交付物</text>
<rect x="1130" y="350" width="220" height="140" rx="12" class="green"/><text x="1240" y="383" text-anchor="middle" class="label">Evidence Ledger</text><text x="1240" y="412" text-anchor="middle" class="body">引用 / 数据来源</text><text x="1240" y="437" text-anchor="middle" class="body">工具结果 / 审批记录</text><text x="1240" y="462" text-anchor="middle" class="small">可复核证据链</text>
<path d="M320 420H360M595 420H635M870 420H910M1105 420H1125" class="line" marker-end="url(#arrow)"/>
<rect x="64" y="568" width="1312" height="130" rx="18" class="sand"/>
<text x="90" y="603" class="label">Enterprise Control Plane（确定性策略，不交给模型决定）</text>
<rect x="90" y="625" width="210" height="50" rx="9" class="box"/><text x="195" y="655" text-anchor="middle" class="body">SSO / IAM / Delegation</text>
<rect x="320" y="625" width="210" height="50" rx="9" class="box"/><text x="425" y="655" text-anchor="middle" class="body">Policy / Risk Tier</text>
<rect x="550" y="625" width="210" height="50" rx="9" class="box"/><text x="655" y="655" text-anchor="middle" class="body">Tool & Model Registry</text>
<rect x="780" y="625" width="210" height="50" rx="9" class="box"/><text x="885" y="655" text-anchor="middle" class="body">Approval Service</text>
<rect x="1010" y="625" width="210" height="50" rx="9" class="box"/><text x="1115" y="655" text-anchor="middle" class="body">Audit / OTEL / DLP</text>
<path d="M195 625V545M425 625V545M655 625V545M885 625V545M1115 625V545" class="line dash"/>
<rect x="64" y="735" width="1312" height="112" rx="18" class="box"/>
<text x="90" y="770" class="label">企业系统与数据源</text>
<rect x="90" y="790" width="220" height="40" rx="8" class="blue"/><text x="200" y="816" text-anchor="middle" class="body">文档 / 协作 / 邮件</text>
<rect x="340" y="790" width="220" height="40" rx="8" class="blue"/><text x="450" y="816" text-anchor="middle" class="body">数据仓库 / Semantic Layer</text>
<rect x="590" y="790" width="220" height="40" rx="8" class="blue"/><text x="700" y="816" text-anchor="middle" class="body">CRM / ERP / Workflow</text>
<rect x="840" y="790" width="220" height="40" rx="8" class="blue"/><text x="950" y="816" text-anchor="middle" class="body">浏览器 / 桌面应用</text>
<rect x="1090" y="790" width="250" height="40" rx="8" class="blue"/><text x="1215" y="816" text-anchor="middle" class="body">CMDB / Git / 知识库</text>
</svg>