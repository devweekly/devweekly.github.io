<svg xmlns="http://www.w3.org/2000/svg" id="spark-snowflake-integration-modes-root" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="spark-snowflake-integration-modes-title spark-snowflake-integration-modes-desc">
<title id="spark-snowflake-integration-modes-title">Spark 与 Snowflake 的三种集成路径</title>
<desc id="spark-snowflake-integration-modes-desc">对比外部 Spark 加 Connector、Snowpark Connect 在 Warehouse 执行，以及 Snowpark Submit 在 SPCS compute pool 中运行。</desc>
<defs>
    <filter id="spark-snowflake-integration-modes-root-shadow" x="-12%" y="-12%" width="124%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#221C17" flood-opacity="0.10"/>
    </filter>
    <marker id="spark-snowflake-integration-modes-root-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#65584D"/>
    </marker>
    <marker id="spark-snowflake-integration-modes-root-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8B5A2B"/>
    </marker>
  </defs>
<rect width="1280" height="720" fill="#F9F6EF"/>
<text x="48" y="45" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="9" font-weight="500" text-anchor="start" fill="#65584D">SPARK + SNOWFLAKE · EXECUTION OWNERSHIP</text>
<text x="48" y="82" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="26" font-weight="600" text-anchor="start" fill="#221C17">先确认谁在执行计算</text>
<text x="48" y="108" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#65584D">接口可以相似，Driver、Executor、Warehouse 和容器资源的归属并不相同。</text>
<!-- panels -->
<rect x="40" y="140" width="382" height="500" rx="14" fill="#F1EDE4" stroke="#CFC5B8"/>
<rect x="449" y="140" width="382" height="500" rx="14" fill="#F1EDE4" stroke="#CFC5B8"/>
<rect x="858" y="140" width="382" height="500" rx="14" fill="#F1EDE4" stroke="#CFC5B8"/>
<text x="64" y="178" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="9" font-weight="500" text-anchor="start" fill="#65584D">01 · EXTERNAL COMPUTE</text>
<text x="64" y="204" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#221C17">Spark 集群仍在平台之外</text>
<text x="473" y="178" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="9" font-weight="500" text-anchor="start" fill="#65584D">02 · WAREHOUSE EXECUTION</text>
<text x="473" y="204" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#221C17">Spark Connect 客户端交给 Snowflake</text>
<text x="882" y="178" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="9" font-weight="500" text-anchor="start" fill="#65584D">03 · CONTAINER EXECUTION</text>
<text x="882" y="204" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#221C17">需要 cluster-mode 时使用 SPCS</text>
<!-- external path -->
<path d="M 231 313 V 346" fill="none" stroke="#65584D" stroke-width="1.6" marker-end="url(#spark-snowflake-integration-modes-root-arrow)"/>
<path d="M 231 458 V 491" fill="none" stroke="#65584D" stroke-width="1.6" marker-end="url(#spark-snowflake-integration-modes-root-arrow)"/>
<rect x="64" y="220" width="334" height="93" rx="12" fill="#FFFEFA" stroke="#CFC5B8" filter="url(#node-shadow)"/><rect x="80" y="232" width="73" height="22" rx="11" fill="#DCE5F4"/><text x="92" y="247" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="8" font-weight="500" text-anchor="start" fill="#221C17">COMPUTE</text><text x="80" y="276" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#221C17">外部 Spark 集群</text><text x="80" y="298" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#65584D">Driver / Executor 处理分区和 Shuffle</text>
<rect x="64" y="355" width="334" height="103" rx="12" fill="#FFFEFA" stroke="#CFC5B8" filter="url(#node-shadow)"/><rect x="80" y="367" width="87" height="22" rx="11" fill="#D8EEE8"/><text x="92" y="382" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="8" font-weight="500" text-anchor="start" fill="#221C17">CONNECTOR</text><text x="80" y="411" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#221C17">Snowflake Connector</text><text x="80" y="433" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#65584D">读写数据，并下推部分受支持的算子</text>
<rect x="64" y="500" width="334" height="96" rx="12" fill="#FFFEFA" stroke="#CFC5B8" filter="url(#node-shadow)"/><rect x="80" y="512" width="72" height="22" rx="11" fill="#F5E7D4"/><text x="92" y="527" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="8" font-weight="500" text-anchor="start" fill="#221C17">DATA</text><text x="80" y="556" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#221C17">Snowflake 表</text><text x="80" y="578" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#65584D">数据在外部 Spark 与 Snowflake 之间传输</text>
<!-- Snowpark Connect path -->
<path d="M 640 313 V 346" fill="none" stroke="#8B5A2B" stroke-width="1.6" marker-end="url(#spark-snowflake-integration-modes-root-arrow)"/>
<path d="M 640 458 V 491" fill="none" stroke="#8B5A2B" stroke-width="1.6" marker-end="url(#spark-snowflake-integration-modes-root-arrow)"/>
<rect x="473" y="220" width="334" height="93" rx="12" fill="#FFFEFA" stroke="#CFC5B8" filter="url(#node-shadow)"/><rect x="489" y="232" width="72" height="22" rx="11" fill="#DCE5F4"/><text x="501" y="247" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="8" font-weight="500" text-anchor="start" fill="#221C17">CLIENT</text><text x="489" y="276" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#221C17">PySpark / Spark Connect 客户端</text><text x="489" y="298" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#65584D">提交 Spark Connect DataFrame 计划</text>
<rect x="473" y="355" width="334" height="103" rx="12" fill="#FFFEFA" stroke="#CFC5B8" filter="url(#node-shadow)"/><rect x="489" y="367" width="80" height="22" rx="11" fill="#F5E7D4"/><text x="501" y="382" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="8" font-weight="500" text-anchor="start" fill="#221C17">PROTOCOL</text><text x="489" y="411" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#221C17">Snowpark Connect</text><text x="489" y="433" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#65584D">解析请求，将支持的操作映射为 SQL</text>
<rect x="473" y="500" width="334" height="96" rx="12" fill="#FFFEFA" stroke="#CFC5B8" filter="url(#node-shadow)"/><rect x="489" y="512" width="73" height="22" rx="11" fill="#D8EEE8"/><text x="501" y="527" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="8" font-weight="500" text-anchor="start" fill="#221C17">COMPUTE</text><text x="489" y="556" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#221C17">Snowflake Virtual Warehouse</text><text x="489" y="578" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#65584D">Snowflake SQL 引擎负责优化和执行</text>
<!-- SPCS and code bundles alternatives -->
<rect x="882" y="220" width="334" height="110" rx="12" fill="#FFFEFA" stroke="#CFC5B8" filter="url(#node-shadow)"/><rect x="898" y="232" width="143" height="22" rx="11" fill="#D8EEE8"/><text x="910" y="247" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="8" font-weight="500" text-anchor="start" fill="#221C17">BATCH · WAREHOUSE</text><text x="898" y="276" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#221C17">Code Bundles</text><text x="898" y="298" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#65584D">Stage + SQL / REST 提交，运行在 Warehouse</text>
<rect x="882" y="385" width="334" height="110" rx="12" fill="#FFFEFA" stroke="#CFC5B8" filter="url(#node-shadow)"/><rect x="898" y="397" width="108" height="22" rx="11" fill="#F5E7D4"/><text x="910" y="412" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="8" font-weight="500" text-anchor="start" fill="#221C17">BATCH · SPCS</text><text x="898" y="441" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#221C17">Snowpark Submit</text><text x="898" y="463" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#65584D">cluster-mode 作业使用 SPCS compute pool</text>
<text x="882" y="535" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#221C17">两条批处理路径不要混为一谈：</text>
<text x="882" y="558" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#65584D">Code Bundles 不需要 SPCS compute pool。</text>
<text x="882" y="581" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#65584D">Snowpark Submit 需要配置 compute pool；</text>
<text x="882" y="604" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#65584D">标准提交流程不等于必须自建 Spark 镜像。</text>
<!-- footnotes -->
<path d="M 64 615 H 807" stroke="#CFC5B8" stroke-width="1"/>
<text x="64" y="630" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#65584D">Connector 不会把外部 Spark 变成 Snowflake 内部计算。</text>
</svg>