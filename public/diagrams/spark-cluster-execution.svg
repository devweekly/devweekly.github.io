<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="spark-cluster-title spark-cluster-desc"><title id="spark-cluster-title">Spark cluster execution architecture</title><desc id="spark-cluster-desc">Driver coordinates Spark jobs and schedules tasks to executors across worker nodes, which read partitions from storage and write results.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#65584D"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8B5A2B"/></marker></defs><rect width="1120" height="590" rx="16" fill="#F9F6EF"/><text x="44" y="46" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#65584D">APACHE SPARK · DISTRIBUTED RUNTIME</text><rect x="44" y="78" width="210" height="150" rx="12" fill="#FFFEFA" stroke="#CFC5B8"/><text x="66" y="110" font-family="Arial" font-size="17" font-weight="700" fill="#221C17">Application</text><text x="66" y="140" font-family="Arial" font-size="13" fill="#65584D">PySpark / SQL</text><text x="66" y="165" font-family="Arial" font-size="13" fill="#65584D">DataFrame plan</text><text x="66" y="190" font-family="Arial" font-size="13" fill="#65584D">Actions trigger jobs</text><rect x="330" y="78" width="300" height="150" rx="12" fill="#F5E7D4" stroke="#8B5A2B" stroke-width="1.5"/><text x="354" y="110" font-family="Arial" font-size="18" font-weight="700" fill="#221C17">Driver</text><text x="354" y="140" font-family="Arial" font-size="13" fill="#65584D">SparkSession · DAG Scheduler</text><text x="354" y="165" font-family="Arial" font-size="13" fill="#65584D">Plans Jobs → Stages → Tasks</text><text x="354" y="190" font-family="Arial" font-size="13" fill="#65584D">Coordinates executors</text><rect x="720" y="78" width="350" height="150" rx="12" fill="#FFFEFA" stroke="#CFC5B8"/><text x="744" y="110" font-family="Arial" font-size="18" font-weight="700" fill="#221C17">Cluster Manager</text><text x="744" y="140" font-family="Arial" font-size="13" fill="#65584D">Kubernetes · YARN · Standalone</text><text x="744" y="165" font-family="Arial" font-size="13" fill="#65584D">Allocates executor resources</text><text x="744" y="190" font-family="Arial" font-size="13" fill="#65584D">Not the SQL query optimizer</text><path d="M254 153 H322" stroke="#65584D" stroke-width="2" marker-end="url(#a)"/><path d="M630 153 H712" stroke="#65584D" stroke-width="2" marker-end="url(#a)"/><rect x="44" y="300" width="240" height="205" rx="12" fill="#F1EDE4" stroke="#CFC5B8"/><text x="66" y="334" font-family="Arial" font-size="17" font-weight="700" fill="#221C17">Storage / Sources</text><text x="66" y="368" font-family="Arial" font-size="13" fill="#65584D">S3 / ADLS / GCS</text><text x="66" y="393" font-family="Arial" font-size="13" fill="#65584D">Parquet / Iceberg / Delta</text><text x="66" y="418" font-family="Arial" font-size="13" fill="#65584D">Kafka / JDBC / Hive</text><text x="66" y="463" font-family="Arial" font-size="12" fill="#75695F">Data is split into partitions</text><rect x="360" y="285" width="710" height="240" rx="14" fill="#F1EDE4" stroke="#CFC5B8"/><text x="386" y="319" font-family="Arial" font-size="13" letter-spacing="1.5" fill="#65584D">WORKER NODES</text><g><rect x="390" y="345" width="190" height="145" rx="10" fill="#FFFEFA" stroke="#CFC5B8"/><text x="412" y="378" font-family="Arial" font-size="16" font-weight="700" fill="#221C17">Executor A</text><rect x="412" y="396" width="65" height="34" rx="6" fill="#DCE5F4"/><rect x="489" y="396" width="65" height="34" rx="6" fill="#DCE5F4"/><text x="444" y="418" font-family="Arial" font-size="12" text-anchor="middle" fill="#221C17">Task 1</text><text x="521" y="418" font-family="Arial" font-size="12" text-anchor="middle" fill="#221C17">Task 2</text><text x="412" y="463" font-family="Arial" font-size="11" fill="#65584D">Cache · Read · Compute</text></g><g><rect x="620" y="345" width="190" height="145" rx="10" fill="#FFFEFA" stroke="#CFC5B8"/><text x="642" y="378" font-family="Arial" font-size="16" font-weight="700" fill="#221C17">Executor B</text><rect x="642" y="396" width="65" height="34" rx="6" fill="#DCE5F4"/><rect x="719" y="396" width="65" height="34" rx="6" fill="#DCE5F4"/><text x="674" y="418" font-family="Arial" font-size="12" text-anchor="middle" fill="#221C17">Task 3</text><text x="751" y="418" font-family="Arial" font-size="12" text-anchor="middle" fill="#221C17">Task 4</text><text x="642" y="463" font-family="Arial" font-size="11" fill="#65584D">Shuffle · Aggregate</text></g><g><rect x="850" y="345" width="190" height="145" rx="10" fill="#FFFEFA" stroke="#CFC5B8"/><text x="872" y="378" font-family="Arial" font-size="16" font-weight="700" fill="#221C17">Executor C</text><rect x="872" y="396" width="65" height="34" rx="6" fill="#DCE5F4"/><rect x="949" y="396" width="65" height="34" rx="6" fill="#DCE5F4"/><text x="904" y="418" font-family="Arial" font-size="12" text-anchor="middle" fill="#221C17">Task 5</text><text x="981" y="418" font-family="Arial" font-size="12" text-anchor="middle" fill="#221C17">Task 6</text><text x="872" y="463" font-family="Arial" font-size="11" fill="#65584D">Write · Return status</text></g><path d="M465 228 V270 H715 V337" fill="none" stroke="#8B5A2B" stroke-width="2" marker-end="url(#b)"/><path d="M895 228 V260 H715 V337" fill="none" stroke="#65584D" stroke-width="1.5" marker-end="url(#a)"/><path d="M284 402 H352" stroke="#65584D" stroke-width="2" marker-end="url(#a)"/><text x="320" y="390" font-family="Arial" font-size="11" text-anchor="middle" fill="#65584D">Read</text><text x="560" y="560" font-family="Arial" font-size="12" fill="#75695F">One task processes one partition at a time; executors run many tasks concurrently.</text></svg>
