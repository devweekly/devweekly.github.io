<text x="52" y="54" font-size="29" font-weight="650" fill="#221C17">Ontology SQL：查询执行与函数复用</text>
<text x="52" y="82" font-size="13" fill="#65584D">SQL is the interface; Ontology metadata and object storage remain the data model and execution substrate.</text>
