<title id="ontology-sql-title">Ontology SQL 查询与函数发布架构</title>
<desc id="ontology-sql-desc">SQL 请求通过共享解析层进入 Ontology 专用数据提供器和查询规划，再由 Object Set Service 选择 Object Storage 内存计算或 Spark。查询也可以发布为 SQL Function，供 Foundry 应用调用。</desc>
