<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Auto Router 决策与升级流程</title>
<desc id="desc">先检查硬约束和任务规则，再由轻量分类器估计模型适配度；低置信度时交给更强决策器；执行后由验证器判断是否接受，失败时有限升级并记录结果。</desc>
<defs>
 <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#626B80"/></marker>
 <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8B603F"/></marker>
</defs>
<rect width="1100" height="760" fill="#EBEDF7"/>
<text x="42" y="45" font-family="Geist,'Noto Sans SC',sans-serif" font-size="11" letter-spacing="1.6" fill="#747D91">ROUTING POLICY · DECISION FLOW</text>
<text x="42" y="78" font-family="Geist,'Noto Sans SC',sans-serif" font-size="24" font-weight="650" fill="#32394D">Route first, verify, then escalate</text>
<g fill="none" stroke="#626B80" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round">
 <path d="M550 132 V165"/>
 <path d="M550 225 V258"/>
 <path d="M550 318 V350"/>
 <path d="M550 410 V445"/>
 <path d="M550 505 V535"/>
 <path d="M550 595 V625"/>
 <path d="M400 285 H255 V350"/>
 <path d="M700 285 H845 V350"/>
 <path d="M255 410 V470 H390 V475"/>
 <path d="M845 410 V470 H710 V475"/>
 <path d="M550 685 H900 V535"/>
</g>
<g fill="none" stroke="#8B603F" stroke-width="1.6" marker-end="url(#arr2)" stroke-linecap="round" stroke-linejoin="round">
 <path d="M710 565 H930 V285 H700"/>
</g>
<g font-family="Geist,'Noto Sans SC',sans-serif" text-anchor="middle">
 <rect x="435" y="95" width="230" height="37" rx="18" fill="#FFFFFF" stroke="#D5D9E4"/>
 <text x="550" y="119" font-size="13" font-weight="650" fill="#32394D">New task / Agent step</text>

 <rect x="400" y="165" width="300" height="60" rx="9" fill="#FFFFFF" stroke="#D5D9E4"/>
 <text x="550" y="190" font-size="14" font-weight="650" fill="#32394D">1. Hard constraints</text>
 <text x="550" y="209" font-size="10" fill="#626B80">Provider availability · Context · Tools · Data policy</text>

 <rect x="400" y="258" width="300" height="60" rx="9" fill="#FFFFFF" stroke="#D5D9E4"/>
 <text x="550" y="283" font-size="14" font-weight="650" fill="#32394D">2. Cheap deterministic rules</text>
 <text x="550" y="302" font-size="10" fill="#626B80">Task type · Step type · Risk class · Known patterns</text>

 <rect x="400" y="350" width="300" height="60" rx="9" fill="#F7EEE8" stroke="#8B603F" stroke-width="1.4"/>
 <text x="550" y="375" font-size="14" font-weight="650" fill="#32394D">3. Lightweight classifier</text>
 <text x="550" y="394" font-size="10" fill="#626B80">Haiku / small decision model · Structured output</text>

 <polygon points="550,445 710,475 550,505 390,475" fill="#FFFFFF" stroke="#D5D9E4" stroke-width="1.2"/>
 <text x="550" y="472" font-size="12" font-weight="650" fill="#32394D">Confidence sufficient?</text>
 <text x="550" y="488" font-size="9" fill="#626B80">and policy allows the selected tier</text>

 <rect x="95" y="350" width="160" height="60" rx="9" fill="#FFFFFF" stroke="#D5D9E4"/>
 <text x="175" y="375" font-size="13" font-weight="650" fill="#32394D">Fallback rule</text>
 <text x="175" y="394" font-size="10" fill="#626B80">Use safe default</text>

 <rect x="845" y="350" width="160" height="60" rx="9" fill="#FFFFFF" stroke="#D5D9E4"/>
 <text x="925" y="375" font-size="13" font-weight="650" fill="#32394D">Strong judge</text>
 <text x="925" y="394" font-size="10" fill="#626B80">Only ambiguous cases</text>

 <rect x="390" y="535" width="320" height="60" rx="9" fill="#FFFFFF" stroke="#D5D9E4"/>
 <text x="550" y="560" font-size="14" font-weight="650" fill="#32394D">4. Execute on selected model</text>
 <text x="550" y="579" font-size="10" fill="#626B80">Fast / Balanced / Frontier</text>

 <polygon points="550,625 710,655 550,685 390,655" fill="#FFFFFF" stroke="#D5D9E4" stroke-width="1.2"/>
 <text x="550" y="652" font-size="12" font-weight="650" fill="#32394D">Verifier accepts result?</text>
 <text x="550" y="668" font-size="9" fill="#626B80">Tests · Schema · Tool outcome · Quality gate</text>

 <rect x="830" y="505" width="220" height="60" rx="9" fill="#F7EEE8" stroke="#8B603F" stroke-width="1.3"/>
 <text x="940" y="530" font-size="13" font-weight="650" fill="#32394D">Escalate one tier</text>
 <text x="940" y="549" font-size="10" fill="#626B80">Bounded retry · Fresh context if needed</text>
 <text x="260" y="338" font-size="10" fill="#626B80">No / low confidence</text>
 <text x="740" y="338" font-size="10" fill="#626B80">Uncertain</text>
 <text x="735" y="458" font-size="10" fill="#626B80">Yes</text>
 <text x="740" y="640" font-size="10" fill="#626B80">No</text>
 <text x="920" y="280" font-size="10" fill="#8B603F">Decision support</text>
 <text x="900" y="720" font-size="10" fill="#747D91">Record outcome, cost, latency and model choice for offline evals and online learning.</text>
</g>
</svg>