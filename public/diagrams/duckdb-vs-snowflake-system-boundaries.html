<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DuckDB 与 Snowflake 架构边界</title><style>*{box-sizing:border-box}body{margin:0;background:#F9F6EF;color:#221C17;font-family:'IBM Plex Mono','Noto Sans SC',system-ui,sans-serif}main{max-width:1500px;margin:0 auto;padding:24px}h1{font-size:20px;font-weight:500;margin:0 0 18px}.frame{width:100%;overflow:auto}svg{display:block;width:100%;height:auto;min-width:900px}</style></head><body><main><h1>DuckDB 与 Snowflake 架构边界</h1><div class="frame"><?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="duckdb-vs-snowflake-title duckdb-vs-snowflake-desc"><title id="duckdb-vs-snowflake-title">DuckDB 与 Snowflake 架构边界</title><desc id="duckdb-vs-snowflake-desc">DuckDB is an embedded analytical engine with optional server and lakehouse components; Snowflake is a managed multi-layer cloud data platform.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#65584D"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#221C17" flood-opacity=".08"/></filter></defs><rect width="100%" height="100%" fill="#F9F6EF"/><style>text{font-family:'IBM Plex Mono','Noto Sans SC',system-ui,sans-serif;fill:#221C17} .eyebrow{font-size:11px;letter-spacing:1.5px;fill:#75695F} .label{font-size:16px;font-weight:600} .sub{font-size:12px;fill:#65584D} .tiny{font-size:11px;fill:#65584D} .node{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.2} .zone{fill:#F1EDE4;stroke:#CFC5B8;stroke-width:1} .focus{fill:#F5E7D4;stroke:#8B5A2B;stroke-width:1.5} .line{fill:none;stroke:#65584D;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arr)} .dash{fill:none;stroke:#65584D;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arr)} </style>
<text x="56" y="54" class="eyebrow">DUCKDB VS SNOWFLAKE · SYSTEM BOUNDARIES</text><text x="56" y="91" font-size="28" font-weight="600">相似的分析执行思路，不同的系统规模与责任边界</text>
<rect x="56" y="132" width="610" height="492" rx="12" class="zone"/><text x="84" y="168" class="eyebrow">DUCKDB · EMBEDDED / SINGLE-NODE FIRST</text>
<rect x="94" y="202" width="534" height="126" rx="10" class="focus"/><text x="361" y="236" text-anchor="middle" class="label">Application Process / Quack Server</text><text x="361" y="262" text-anchor="middle" class="sub">DuckDB SQL · Optimizer · Vectorized Execution</text><text x="361" y="292" text-anchor="middle" class="tiny">多线程并行，主要使用单机 CPU / RAM / 本地磁盘</text>
<rect x="94" y="366" width="250" height="92" rx="9" class="node"/><text x="219" y="399" text-anchor="middle" class="label">Local DB / Cache</text><text x="219" y="426" text-anchor="middle" class="sub">Native Storage</text>
<rect x="378" y="366" width="250" height="92" rx="9" class="node"/><text x="503" y="399" text-anchor="middle" class="label">Parquet / Iceberg / S3</text><text x="503" y="426" text-anchor="middle" class="sub">External Data / Table Format</text>
<path d="M361 328 V346 H219 V366" class="line"/><path d="M361 346 H503 V366" class="line"/>
<text x="94" y="510" class="sub">DuckLake + PostgreSQL Catalog 可增加</text><text x="94" y="534" class="sub">跨进程元数据协调与并发读写能力。</text><text x="94" y="570" class="tiny">但不自动提供跨节点 MPP、统一企业控制面和全托管 SLA。</text>
<rect x="734" y="132" width="650" height="492" rx="12" class="zone"/><text x="762" y="168" class="eyebrow">SNOWFLAKE · MANAGED CLOUD DATA PLATFORM</text>
<rect x="770" y="202" width="578" height="88" rx="10" class="node"/><text x="1059" y="236" text-anchor="middle" class="label">Cloud Services</text><text x="1059" y="262" text-anchor="middle" class="sub">Metadata · Security · Optimization · Scheduling</text>
<rect x="770" y="326" width="578" height="142" rx="10" class="focus"/><text x="1059" y="358" text-anchor="middle" class="label">Independent Virtual Warehouses</text>
<rect x="810" y="386" width="150" height="54" rx="7" class="node"/><text x="885" y="418" text-anchor="middle" class="tiny">MPP Cluster A</text><rect x="984" y="386" width="150" height="54" rx="7" class="node"/><text x="1059" y="418" text-anchor="middle" class="tiny">MPP Cluster B</text><rect x="1158" y="386" width="150" height="54" rx="7" class="node"/><text x="1233" y="418" text-anchor="middle" class="tiny">MPP Cluster N</text>
<rect x="770" y="504" width="578" height="82" rx="10" class="node"/><text x="1059" y="538" text-anchor="middle" class="label">Snowflake-managed Object Storage</text><text x="1059" y="562" text-anchor="middle" class="sub">Micro-partitions · Metadata · Time Travel</text>
<path d="M1059 290 V326" class="line"/><path d="M1059 468 V504" class="line"/>
<text x="720" y="682" text-anchor="middle" class="tiny">DuckDB 可以承担很多分析 SQL；Snowflake 额外交付的是分布式服务化、隔离、治理、弹性与运维体系</text></svg></div></main></body></html>
