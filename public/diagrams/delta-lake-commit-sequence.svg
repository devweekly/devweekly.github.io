.actor{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.2}.dash{fill:none;stroke:#75695F;stroke-width:1.2;stroke-dasharray:5 4}
.activation{fill:#F1EDE4;stroke:#75695F;stroke-width:.8}.msg-label{font-family:'Geist Mono','Noto Sans SC',monospace;font-size:11px;fill:#65584D}
</style><text x="56" y="54" class="eyebrow">SEQUENCE · DELTA TRANSACTION</text><text x="56" y="96" class="title">先写数据文件，再提交表版本</text><line x1="190" y1="166" x2="190" y2="900" class="dash"/><line x1="540" y1="166" x2="540" y2="900" class="dash"/><line x1="890" y1="166" x2="890" y2="900" class="dash"/><line x1="1240" y1="166" x2="1240" y2="900" class="dash"/><path d="M190 218 H882" fill="none" stroke="#65584D" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="450" y="191" width="180" height="16" rx="3" fill="#F9F6EF"/><text x="540" y="203" text-anchor="middle" class="msg-label">读取 vN</text><path d="M890 284 H198" fill="none" stroke="#65584D" stroke-width="1.5" marker-end="url(#arrow-left)"/><rect x="450" y="257" width="180" height="16" rx="3" fill="#F9F6EF"/><text x="540" y="269" text-anchor="middle" class="msg-label">返回快照</text><path d="M190 350 H532" fill="none" stroke="#65584D" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="275" y="323" width="180" height="16" rx="3" fill="#F9F6EF"/><text x="365" y="335" text-anchor="middle" class="msg-label">写入 Parquet</text><path d="M540 416 H198" fill="none" stroke="#65584D" stroke-width="1.5" marker-end="url(#arrow-left)"/><rect x="275" y="389" width="180" height="16" rx="3" fill="#F9F6EF"/><text x="365" y="401" text-anchor="middle" class="msg-label">返回文件信息</text><path d="M190 470 H882" fill="none" stroke="#65584D" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="450" y="443" width="180" height="16" rx="3" fill="#F9F6EF"/><text x="540" y="455" text-anchor="middle" class="msg-label">提交 Add / Remove</text><rect x="350" y="510" width="620" height="210" rx="6" fill="#221C17" fill-opacity=".025" stroke="#75695F" stroke-opacity=".55" stroke-dasharray="5 4"/><rect x="350" y="510" width="48" height="18" rx="3" fill="#F9F6EF" stroke="#75695F" stroke-opacity=".55"/><text x="374" y="523" text-anchor="middle" class="tiny">ALT</text><text x="414" y="523" class="tiny">提交检查</text><text x="370" y="546" class="tiny">[无冲突]</text>