<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="delta-lake-commit-sequence-title delta-lake-commit-sequence-desc"><title id="delta-lake-commit-sequence-title">Delta Lake 写入与提交</title><desc id="delta-lake-commit-sequence-desc">Spark 写入者生成 Parquet 文件，通过 Delta 日志提交新 Snapshot，读者只读取已提交版本，并显示冲突分支。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#65584D"/></marker><marker id="arrow-left" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10z" fill="#65584D"/></marker></defs><rect width="100%" height="100%" fill="#F9F6EF"/><style>
text{font-family:'Geist','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;fill:#221C17}
.eyebrow{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:1.6px;fill:#75695F}
.title{font-family:'Instrument Serif','Noto Serif SC',serif;font-size:31px;font-weight:400;fill:#221C17}
.label{font-size:17px;font-weight:600}.sub{font-family:'Geist Mono','Noto Sans SC',monospace;font-size:12px;fill:#65584D}
