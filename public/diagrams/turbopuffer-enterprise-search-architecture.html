<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enterprise Retrieval Platform Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#F9F6EF;--ink:#221C17;--muted:#65584D}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Mono","Noto Sans SC",monospace}
main{max-width:1380px;margin:0 auto;padding:28px 24px 36px}
header{margin:0 0 18px}
h1{font-size:22px;font-weight:500;margin:0 0 7px}
p{font-size:12px;color:var(--muted);margin:0}
.diagram-container{width:100%;overflow-x:auto;border:1px solid rgba(34,28,23,.10);background:var(--paper)}
svg{display:block;width:100%;min-width:1280px;height:auto}
@media print{.diagram-container{overflow:visible}svg{min-width:0}}
</style>
</head>
<body>
<main>
<header>
<h1>Enterprise Retrieval Platform</h1>
<p>OpenSearch serving · object storage durability · PostgreSQL control plane · Snowflake analytics</p>
</header>
<div class="diagram-container">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Enterprise retrieval architecture based on OpenSearch, PostgreSQL, S3 and Snowflake</title>
<desc id="diagram-desc">Clients query a Search API. The API reads namespace and ACL state from PostgreSQL and executes retrieval against OpenSearch. Source connectors feed ingestion workers, which write original and normalized data to object storage, update PostgreSQL, and publish searchable projections to OpenSearch. Snowflake consumes the durable data for governance and analytics.</desc>
<style>
  .paper{fill:#F9F6EF}
  .zone{fill:#F1EDE4;stroke:rgba(34,28,23,.16);stroke-width:1}
  .surface{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.2}
  .surface-focus{fill:#F8F0E4;stroke:#8B5A2B;stroke-width:1.8}
  .ink{fill:#221C17}
  .muted{fill:#65584D}
  .soft{fill:#75695F}
  .rule{stroke:#65584D;stroke-width:1.6;fill:none}
  .accent{stroke:#8B5A2B;stroke-width:2;fill:none}
  .dashed{stroke:#75695F;stroke-width:1.35;stroke-dasharray:5 5;fill:none}
  .title{font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:27px;font-weight:500;fill:#221C17}
  .subtitle{font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:11px;fill:#65584D}
  .zone-label{font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:9px;letter-spacing:1.7px;font-weight:600;fill:#75695F}
  .node-name{font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:14px;font-weight:600;fill:#221C17}
  .node-sub{font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:10px;fill:#65584D}
  .tag{font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:8px;letter-spacing:.8px;fill:#65584D}
  .arrow-label{font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:9px;fill:#65584D}
  .foot{font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:10px;fill:#75695F}
</style>
<defs>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#65584D"/>
  </marker>
  <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#8B5A2B"/>
  </marker>
</defs>
<rect class="paper" x="0" y="0" width="1280" height="720"/>
<text x="40" y="48" class="title">Enterprise Retrieval Platform</text>
<text x="42" y="72" class="subtitle">OPEN SEARCH SERVING · OBJECT STORAGE DURABILITY · POSTGRES CONTROL PLANE · SNOWFLAKE ANALYTICS</text>

<rect class="zone" x="30" y="112" width="900" height="265" rx="8"/>
<rect x="48" y="120" width="150" height="16" fill="#F9F6EF"/>
<text x="54" y="132" class="zone-label">ONLINE RETRIEVAL</text>

<rect class="zone" x="30" y="398" width="1218" height="206" rx="8"/>
<rect x="48" y="406" width="190" height="16" fill="#F9F6EF"/>
<text x="54" y="418" class="zone-label">INGESTION &amp; DATA FOUNDATION</text>

<!-- connectors behind nodes -->
<path class="rule" d="M225 219 H280" marker-end="url(#arrow-ink)"/>
<path class="rule" d="M480 219 H620" marker-end="url(#arrow-ink)"/>
<path class="accent" d="M380 262 V295" marker-start="url(#arrow-accent)" marker-end="url(#arrow-accent)"/>
<path class="rule" d="M225 501 H280" marker-end="url(#arrow-ink)"/>
<path class="rule" d="M500 501 H620" marker-end="url(#arrow-ink)"/>
<path class="rule" d="M825 501 H970" marker-end="url(#arrow-ink)"/>
<path class="rule" d="M380 452 V377" marker-end="url(#arrow-ink)"/>
<path class="accent" d="M500 480 H560 V270 H735 V262" marker-end="url(#arrow-accent)"/>

<!-- query nodes -->
<rect class="surface" x="55" y="180" width="170" height="78" rx="8"/>
<rect x="70" y="193" width="58" height="15" rx="7" fill="#DCE5F4"/>
<text x="99" y="204" text-anchor="middle" class="tag">CLIENT</text>
<text x="70" y="229" class="node-name">Clients / Agents</text>
<text x="70" y="246" class="node-sub">UI · SDK · MCP</text>

<rect class="surface" x="280" y="176" width="200" height="86" rx="8"/>
<rect x="295" y="189" width="49" height="15" rx="7" fill="#F5E7D4"/>

<text x="295" y="227" class="node-name">Search API</text>
<text x="295" y="245" class="node-sub">Auth · Routing · Fusion</text>

<rect x="635" y="189" width="55" height="15" rx="7" fill="#F5E7D4"/>
<text x="662" y="200" text-anchor="middle" class="tag">SERVE</text>
<text x="635" y="227" class="node-name">OpenSearch</text>
<text x="635" y="245" class="node-sub">BM25 · ANN · Hybrid</text>

<rect class="surface" x="280" y="295" width="200" height="82" rx="8"/>
<rect x="295" y="308" width="66" height="15" rx="7" fill="#D8EEE8"/>
<text x="328" y="319" text-anchor="middle" class="tag">CONTROL</text>
<text x="295" y="346" class="node-name">PostgreSQL</text>
<text x="295" y="364" class="node-sub">Namespace · ACL · Outbox</text>

<!-- ingestion and data nodes -->
<rect class="surface" x="55" y="462" width="170" height="78" rx="8"/>
<rect x="70" y="475" width="62" height="15" rx="7" fill="#DCE5F4"/>

<text x="70" y="511" class="node-name">Connectors</text>
<text x="70" y="528" class="node-sub">Feeds · Files · APIs</text>

<rect class="surface" x="280" y="452" width="220" height="98" rx="8"/>
<rect x="295" y="465" width="60" height="15" rx="7" fill="#D8EEE8"/>
<text x="325" y="476" text-anchor="middle" class="tag">PIPELINE</text>
<text x="295" y="503" class="node-name">Ingestion Workers</text>
<text x="295" y="521" class="node-sub">Parse · Embed · Version</text>
<text x="295" y="537" class="node-sub">Outbox · Retry · Replay</text>

<rect class="surface-focus" x="620" y="452" width="205" height="98" rx="8"/>
<rect x="635" y="465" width="47" height="15" rx="7" fill="#F5E7D4"/>

<text x="635" y="503" class="node-name">Object Storage</text>

<rect class="surface" x="970" y="452" width="220" height="98" rx="8"/>
<rect x="985" y="465" width="56" height="15" rx="7" fill="#F0DDEB"/>

<text x="985" y="503" class="node-name">Snowflake</text>
<text x="985" y="521" class="node-sub">Governance · Coverage</text>
<text x="985" y="537" class="node-sub">Historical analysis · Evals</text>

<!-- labels -->
<text x="246" y="206" text-anchor="middle" class="arrow-label">query</text>
<text x="550" y="206" text-anchor="middle" class="arrow-label">BM25 / ANN</text>
<text x="394" y="279" class="arrow-label">ACL / namespace</text>
<text x="246" y="488" text-anchor="middle" class="arrow-label">ingest</text>
<text x="550" y="488" text-anchor="middle" class="arrow-label">canonical data</text>
<text x="897" y="488" text-anchor="middle" class="arrow-label">analytics feed</text>
<text x="392" y="401" class="arrow-label">write state</text>
<text x="655" y="287" class="arrow-label">index projection</text>

<line x1="40" y1="650" x2="1240" y2="650" stroke="#CFC5B8" stroke-width="1"/>
<text x="42" y="675" class="foot">S3 is the durable document source; OpenSearch is a rebuildable retrieval projection.</text>
<text x="1238" y="675" text-anchor="end" class="foot">REFERENCE ARCHITECTURE · NOT A TURBOPUFFER CLONE</text>
</svg>
</div>
</main>
</body>
</html>
