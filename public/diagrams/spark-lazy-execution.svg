<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="spark-lazy-title spark-lazy-desc"><title id="spark-lazy-title">Spark lazy evaluation</title><desc id="spark-lazy-desc">DataFrame transformations build a logical plan; an action triggers optimization, physical planning, and distributed tasks.</desc><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#65584D"/></marker><marker id="ac" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8B5A2B"/></marker></defs><rect width="1120" height="500" rx="16" fill="#F9F6EF"/><text x="44" y="44" font-family="Arial" font-size="13" letter-spacing="2" fill="#65584D">FROM PYTHON EXPRESSIONS TO CLUSTER TASKS</text><g font-family="Arial"><rect x="48" y="105" width="190" height="90" rx="10" fill="#FFFEFA" stroke="#CFC5B8"/><text x="143" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#221C17">Read</text><text x="143" y="166" text-anchor="middle" font-size="12" fill="#65584D">spark.read.parquet()</text><rect x="280" y="105" width="190" height="90" rx="10" fill="#FFFEFA" stroke="#CFC5B8"/><text x="375" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#221C17">Transform</text><text x="375" y="166" text-anchor="middle" font-size="12" fill="#65584D">filter · select · join</text><rect x="512" y="105" width="190" height="90" rx="10" fill="#FFFEFA" stroke="#CFC5B8"/><text x="607" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#221C17">Transform</text><text x="607" y="166" text-anchor="middle" font-size="12" fill="#65584D">groupBy · agg</text><path d="M238 150 H272 M470 150 H504" stroke="#65584D" stroke-width="2" marker-end="url(#ar)"/><rect x="760" y="92" width="300" height="116" rx="12" fill="#F5E7D4" stroke="#8B5A2B" stroke-width="1.5"/><text x="910" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#221C17">Action</text><text x="910" y="160" text-anchor="middle" font-size="13" fill="#65584D">show() · count() · write()</text><text x="910" y="184" text-anchor="middle" font-size="11" fill="#75695F">Execution starts here</text><path d="M702 150 H752" stroke="#8B5A2B" stroke-width="2" marker-end="url(#ac)"/><rect x="760" y="270" width="300" height="75" rx="10" fill="#FFFEFA" stroke="#CFC5B8"/><text x="910" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#221C17">Catalyst optimization</text><text x="910" y="324" text-anchor="middle" font-size="12" fill="#65584D">Logical → optimized → physical plan</text><path d="M910 208 V262" stroke="#65584D" stroke-width="2" marker-end="url(#ar)"/><rect x="760" y="390" width="300" height="70" rx="10" fill="#D8EEE8" stroke="#6F948A"/><text x="910" y="419" text-anchor="middle" font-size="16" font-weight="700" fill="#221C17">Job → Stages → Tasks</text><text x="910" y="441" text-anchor="middle" font-size="12" fill="#65584D">Tasks run on executor partitions</text><path d="M910 345 V382" stroke="#65584D" stroke-width="2" marker-end="url(#ar)"/><rect x="48" y="270" width="650" height="190" rx="12" fill="#F1EDE4" stroke="#CFC5B8"/><text x="76" y="307" font-size="15" font-weight="700" fill="#221C17">Before an Action</text><text x="76" y="340" font-size="13" fill="#65584D">Spark builds a plan; it does not eagerly materialize every intermediate DataFrame.</text><text x="76" y="374" font-size="13" fill="#65584D">This allows the optimizer to combine filters, prune columns, and choose operators.</text><text x="76" y="408" font-size="13" fill="#65584D">Repeated Actions may re-run the plan unless useful results are persisted.</text></g></svg>
