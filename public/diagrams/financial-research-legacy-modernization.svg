<text x="1086" y="315" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="14" font-weight="600" fill="#221C17">研究应用</text>
<text x="1086" y="345" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="12" fill="#65584D">Workbench</text>
<text x="1086" y="365" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="12" fill="#65584D">Insight Hub</text>
<text x="1086" y="395" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="10" fill="#75695F">只读起步，逐步替代</text>
<text x="45" y="485" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="12" font-weight="600" fill="#221C17">切换控制</text>
<rect x="45" y="505" width="1200" height="92" rx="8" fill="#F1EDE4" stroke="#CFC5B8"/>
<text x="68" y="538" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="13" font-weight="600" fill="#8B5A2B">Shadow Read</text>
<text x="270" y="538" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="13" font-weight="600" fill="#221C17">Reconcile</text>
<text x="480" y="538" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="13" font-weight="600" fill="#221C17">Canary</text>
<text x="670" y="538" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="13" font-weight="600" fill="#221C17">Business Sign-off</text>
<text x="910" y="538" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="13" font-weight="600" fill="#221C17">Controlled Cutover</text>
<text x="68" y="570" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="11" fill="#65584D">双读比对</text>
<text x="270" y="570" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="11" fill="#65584D">数据与业务对账</text>
<text x="480" y="570" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="11" fill="#65584D">小流量验证</text>
<text x="670" y="570" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="11" fill="#65584D">责任人批准</text>
<text x="910" y="570" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="11" fill="#65584D">旧依赖择机退役</text>
<text x="45" y="642" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="11" fill="#65584D">PostgreSQL 保存研究任务、审批与应用状态；不承担企业历史分析仓库职责。</text>
<text x="45" y="663" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="11" fill="#65584D">供应商数据进入缓存、索引、Embedding 或模型上下文前，先确认许可和用途范围。</text>
