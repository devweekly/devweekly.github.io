<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="financial-research-legacy-modernization-title financial-research-legacy-modernization-desc">
<title id="financial-research-legacy-modernization-title">Legacy 数据现代化路径</title><desc id="financial-research-legacy-modernization-desc">从旧系统资产盘点、数据契约和授权、按源类型接入、开放存储、治理数据产品到研究应用逐步推进。旧系统在切换前保持权威，通过双跑、对账和 Canary 完成切换。</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');</style><filter id="financial-research-legacy-modernization-shadow" x="-12%" y="-12%" width="124%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#221C17" flood-opacity=".10"/></filter><marker id="financial-research-legacy-modernization-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#65584D"/></marker><marker id="financial-research-legacy-modernization-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#8B5A2B"/></marker></defs>
<rect width="1280" height="720" fill="#F9F6EF"/>
<text x="40" y="42" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="22" font-weight="600" fill="#221C17">Legacy 数据现代化路径</text>
<text x="40" y="66" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="12" fill="#65584D">Build the new research plane around the systems of record</text>
<rect x="40" y="94" width="1200" height="62" rx="8" fill="#F1EDE4" stroke="#CFC5B8"/>
<text x="60" y="118" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="11" font-weight="600" fill="#8B5A2B">BOUNDARY</text>
<text x="60" y="140" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="13" fill="#221C17">Legacy remains the system of record until reconciliation and business sign-off authorize a controlled cutover.</text>
<!-- flow connectors -->
<path d="M220 340 H250" fill="none" stroke="#65584D" stroke-width="1.6" marker-end="url(#financial-research-legacy-modernization-arrow)"/>
<path d="M425 340 H455" fill="none" stroke="#65584D" stroke-width="1.6" marker-end="url(#financial-research-legacy-modernization-arrow)"/>
<path d="M630 340 H660" fill="none" stroke="#65584D" stroke-width="1.6" marker-end="url(#financial-research-legacy-modernization-arrow)"/>
<path d="M835 340 H865" fill="none" stroke="#8B5A2B" stroke-width="1.8" marker-end="url(#financial-research-legacy-modernization-arrow-accent)"/>
<path d="M1040 340 H1070" fill="none" stroke="#65584D" stroke-width="1.6" marker-end="url(#financial-research-legacy-modernization-arrow)"/>
<!-- stage cards -->
<g filter="url(#financial-research-legacy-modernization-shadow)"><rect x="45" y="250" width="175" height="180" rx="10" fill="#FFFEFA" stroke="#D8CFC2"/></g>
<rect x="61" y="266" width="76" height="18" rx="9" fill="#F0DDEB"/><text x="99" y="279" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#221C17">DISCOVER</text>
<text x="61" y="315" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="14" font-weight="600" fill="#221C17">旧系统资产</text>
