<rect x="881" y="266" width="82" height="18" rx="9" fill="#F5E7D4"/><text x="922" y="279" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#221C17">GOVERN</text>
<text x="881" y="315" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="14" font-weight="600" fill="#221C17">Snowflake</text>
<text x="881" y="345" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="12" fill="#65584D">标准化 Data Product</text>
<text x="881" y="365" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="12" fill="#65584D">Semantic / Access</text>
<text x="881" y="395" font-family="'IBM Plex Mono','Noto Sans SC',monospace" font-size="10" fill="#75695F">质量与血缘可查</text>
<g filter="url(#financial-research-legacy-modernization-shadow)"><rect x="1070" y="250" width="175" height="180" rx="10" fill="#FFFEFA" stroke="#D8CFC2"/></g>
