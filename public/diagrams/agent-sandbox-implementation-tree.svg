<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1480" viewBox="0 0 2200 1480" role="img" aria-labelledby="title desc">
<title id="title">Agent Sandbox Implementation Options and Security Policies</title>
<desc id="desc">A branching taxonomy of application controls, virtual shells, operating-system sandboxes, containers, sandboxed kernels and remote execution. Every concrete technology is paired with the security policies that must be configured around it.</desc>
<defs>
  <style>
    .bg{fill:#f7f8fa}.title{font:700 34px Inter,Arial,sans-serif;fill:#172033}.subtitle{font:18px Inter,Arial,sans-serif;fill:#596579}
    .root{fill:#172033;stroke:#172033;stroke-width:2}.rootText{font:700 21px Inter,Arial,sans-serif;fill:#fff}
    .branch{fill:none;stroke:#8994a6;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .category{fill:#eaf0f8;stroke:#9eacc1;stroke-width:2}.categoryText{font:700 19px Inter,Arial,sans-serif;fill:#203047}
    .categoryTag{font:700 12px Inter,Arial,sans-serif;fill:#596579;letter-spacing:.45px}
    .stack{fill:#fff;stroke:#cbd3df;stroke-width:1.7}.policy{fill:#f0f5f2;stroke:#a9c1b3;stroke-width:1.5}
    .stackTitle{font:700 16px Inter,Arial,sans-serif;fill:#26364c}.stackSub{font:13px Inter,Arial,sans-serif;fill:#596579}
    .policyTitle{font:700 12px Inter,Arial,sans-serif;fill:#476653;letter-spacing:.55px}.policyText{font:14px Inter,Arial,sans-serif;fill:#304b3b}
    .foot{font:14px Inter,Arial,sans-serif;fill:#596579}
  </style>
</defs>
<rect class="bg" width="2200" height="1480"/>
<text class="title" x="70" y="62">Agent Sandbox Implementation Options</text>
<text class="subtitle" x="70" y="96">Each implementation needs explicit enforcement policy; the technology name alone does not provide these controls.</text>
<text class="categoryTag" x="740" y="130">TECHNOLOGY STACK</text>
<text class="categoryTag" x="1380" y="130">SECURITY POLICY TO CONFIGURE / ENFORCE</text>

<rect class="root" x="55" y="680" width="245" height="145" rx="18"/>
<text class="rootText" x="177" y="733" text-anchor="middle">Agent Execution</text>
<text class="rootText" x="177" y="762" text-anchor="middle">Boundary</text>
<text x="177" y="795" text-anchor="middle" style="font:14px Inter,Arial,sans-serif;fill:#d7deea">Where can code run?</text>
<path class="branch" d="M300 752 H335 V225 H375 M335 395 H375 M335 628 H375 M335 873 H375 M335 1073 H375 M335 1273 H375"/>
<circle cx="335" cy="752" r="6" fill="#8994a6"/>

<!-- 1. Application controls -->
<rect class="category" x="375" y="150" width="310" height="150" rx="12"/>
<text class="categoryText" x="395" y="190">1. Application-level</text>
<text class="categoryText" x="395" y="216">controls</text>
<text class="categoryTag" x="395" y="253">NO OS ISOLATION</text>
<path class="branch" d="M685 225 H715 V185 H735 M715 225 V265 H735"/>
<rect class="stack" x="735" y="150" width="600" height="70" rx="9"/>
<text class="stackTitle" x="755" y="178">Capability Filesystem · ResourceRef</text>
<text class="stackSub" x="755" y="201">Scoped file service · directory handles · MCP Filesystem</text>
<rect class="policy" x="1375" y="150" width="760" height="70" rx="9"/>
<text class="policyTitle" x="1395" y="173">RESOURCE-BOUNDARY POLICY</text>
<text class="policyText" x="1395" y="198">Canonicalize paths; reject symlink / mount escapes; separate read, write and delete; keep reference mounts read-only.</text>
<rect class="stack" x="735" y="230" width="600" height="70" rx="9"/>
<text class="stackTitle" x="755" y="258">Tool Registry · Resource Policy · MCP Server</text>
<text class="stackSub" x="755" y="281">Application PEP / Policy Engine</text>
<rect class="policy" x="1375" y="230" width="760" height="70" rx="9"/>
<text class="policyTitle" x="1395" y="253">AUTHORIZATION POLICY</text>
<text class="policyText" x="1395" y="278">Deny by default; check subject / action / resource on every call; bind approval to exact changes; audit decisions.</text>

<!-- 2. Virtual shell -->
<rect class="category" x="375" y="350" width="310" height="90" rx="12"/>
<text class="categoryText" x="395" y="386">2. Virtual / controlled</text>
<text class="categoryText" x="395" y="412">shell</text>
<text class="categoryTag" x="395" y="430">SIMULATED COMMANDS</text>
<path class="branch" d="M685 395 H735"/>
<rect class="stack" x="735" y="350" width="600" height="90" rx="9"/>
<text class="stackTitle" x="755" y="383">just-bash</text>
<text class="stackSub" x="755" y="407">TypeScript virtual shell · virtual filesystem · no native host shell</text>
<rect class="policy" x="1375" y="350" width="760" height="90" rx="9"/>
<text class="policyTitle" x="1395" y="374">EXECUTION POLICY</text>
<text class="policyText" x="1395" y="399">Expose only required commands and virtual paths; disable unsafe host callbacks; deny network by default;</text>
<text class="policyText" x="1395" y="420">cap time, output and operation counts. Treat custom callbacks as trusted host code.</text>

<!-- 3. OS-level sandbox -->
<rect class="category" x="375" y="500" width="310" height="256" rx="12"/>
<text class="categoryText" x="395" y="545">3. OS-level process</text>
<text class="categoryText" x="395" y="571">sandbox</text>
<text class="categoryTag" x="395" y="610">HOST KERNEL SHARED</text>
<text class="stackSub" x="395" y="645">Kernel-enforced file,</text>
<text class="stackSub" x="395" y="665">network and process limits</text>
<path class="branch" d="M685 628 H715 V538 H735 M715 628 V628 H735 M715 628 V718 H735"/>
<rect class="stack" x="735" y="500" width="600" height="76" rx="9"/>
<text class="stackTitle" x="755" y="528">macOS · Seatbelt / sandbox-exec</text>
<text class="stackSub" x="755" y="552">Anthropic Sandbox Runtime · Codex sandbox patterns</text>
<rect class="policy" x="1375" y="500" width="760" height="76" rx="9"/>
<text class="policyTitle" x="1395" y="523">MACOS PROFILE POLICY</text>
<text class="policyText" x="1395" y="548">Deny by default; allow only task paths; constrain network and Mach / IPC; verify child-process inheritance.</text>
<rect class="stack" x="735" y="590" width="600" height="76" rx="9"/>
<text class="stackTitle" x="755" y="618">Linux · bubblewrap / namespaces / seccomp / Landlock</text>
<text class="stackSub" x="755" y="642">Mount, user, PID and network namespace isolation</text>
<rect class="policy" x="1375" y="590" width="760" height="76" rx="9"/>
<text class="policyTitle" x="1395" y="613">LINUX PROFILE POLICY</text>
<text class="policyText" x="1395" y="638">Unshare namespaces; minimal bind mounts; read-only system paths; syscall filter; Landlock path rules;</text>
<text class="policyText" x="1395" y="657">no host sockets or privileged devices; explicit egress path.</text>
<rect class="stack" x="735" y="680" width="600" height="76" rx="9"/>
<text class="stackTitle" x="755" y="708">Windows · AppContainer / Restricted Token / Job Objects</text>
<text class="stackSub" x="755" y="732">ACLs · capability SIDs · process and resource management</text>
<rect class="policy" x="1375" y="680" width="760" height="76" rx="9"/>
<text class="policyTitle" x="1395" y="703">WINDOWS POLICY</text>
<text class="policyText" x="1395" y="728">Use low-privilege token and narrow AppContainer capabilities / ACLs; constrain network; Job Object limits</text>
<text class="policyText" x="1395" y="747">CPU, memory and process tree. A Job Object alone is not a security boundary.</text>

<!-- 4. Containers -->
<rect class="category" x="375" y="790" width="310" height="166" rx="12"/>
<text class="categoryText" x="395" y="835">4. Container</text>
<text class="categoryText" x="395" y="861">isolation</text>
<text class="categoryTag" x="395" y="900">SHARED HOST KERNEL</text>
<path class="branch" d="M685 873 H715 V828 H735 M715 873 V918 H735"/>
<rect class="stack" x="735" y="790" width="600" height="76" rx="9"/>
<text class="stackTitle" x="755" y="818">Docker / Podman</text>
<text class="stackSub" x="755" y="842">Namespaces · cgroups · seccomp · AppArmor / SELinux</text>
<rect class="policy" x="1375" y="790" width="760" height="76" rx="9"/>
<text class="policyTitle" x="1395" y="813">CONTAINER POLICY</text>
<text class="policyText" x="1395" y="838">Prefer rootless; drop capabilities; no privileged mode / host socket / device; read-only rootfs;</text>
<text class="policyText" x="1395" y="857">no-new-privileges; seccomp + MAC profile; cgroup quotas; narrowly scoped mounts.</text>
<rect class="stack" x="735" y="880" width="600" height="76" rx="9"/>
<text class="stackTitle" x="755" y="908">Kubernetes Restricted Pod</text>
<text class="stackSub" x="755" y="932">Pod Security Admission · RBAC · NetworkPolicy · RuntimeClass</text>
<rect class="policy" x="1375" y="880" width="760" height="76" rx="9"/>
<text class="policyTitle" x="1395" y="903">KUBERNETES POD POLICY</text>
<text class="policyText" x="1395" y="928">Non-root; no privilege escalation; drop ALL caps; read-only rootfs; seccomp RuntimeDefault;</text>
<text class="policyText" x="1395" y="947">disable ServiceAccount token automount; default-deny NetworkPolicy; select RuntimeClass deliberately.</text>

<!-- 5. Sandboxed kernel / microVM -->
<rect class="category" x="375" y="990" width="310" height="166" rx="12"/>
<text class="categoryText" x="395" y="1035">5. Sandboxed kernel /</text>
<text class="categoryText" x="395" y="1061">microVM</text>
<text class="categoryTag" x="395" y="1100">ADDITIONAL KERNEL BOUNDARY</text>
<path class="branch" d="M685 1073 H715 V1028 H735 M715 1073 V1118 H735"/>
<rect class="stack" x="735" y="990" width="600" height="76" rx="9"/>
<text class="stackTitle" x="755" y="1018">gVisor</text>
<text class="stackSub" x="755" y="1042">Sentry user-space kernel · runsc</text>
<rect class="policy" x="1375" y="990" width="760" height="76" rx="9"/>
<text class="policyTitle" x="1395" y="1013">GVISOR POLICY</text>
<text class="policyText" x="1395" y="1038">Use an appropriate platform / runtime profile; minimize host mounts and devices; restrict egress;</text>
<text class="policyText" x="1395" y="1057">apply CPU / memory / PID quotas; protect the node and runtime control socket.</text>
<rect class="stack" x="735" y="1080" width="600" height="76" rx="9"/>
<text class="stackTitle" x="755" y="1108">Kata Containers · Firecracker microVM</text>
<text class="stackSub" x="755" y="1132">Guest kernel · VMM / hypervisor boundary</text>
<rect class="policy" x="1375" y="1080" width="760" height="76" rx="9"/>
<text class="policyTitle" x="1395" y="1103">MICROVM POLICY</text>
<text class="policyText" x="1395" y="1128">Minimal virtual devices; isolate per task / tenant; harden VMM / jailer; verify signed images;</text>
<text class="policyText" x="1395" y="1147">block metadata and unintended egress; scope volumes and credentials; enforce quotas.</text>

<!-- 6. Remote execution -->
<rect class="category" x="375" y="1190" width="310" height="166" rx="12"/>
<text class="categoryText" x="395" y="1235">6. Remote isolated</text>
<text class="categoryText" x="395" y="1261">execution</text>
<text class="categoryTag" x="395" y="1300">SEPARATE EXECUTION HOST</text>
<path class="branch" d="M685 1273 H715 V1228 H735 M715 1273 V1318 H735"/>
<rect class="stack" x="735" y="1190" width="600" height="76" rx="9"/>
<text class="stackTitle" x="755" y="1218">Cloudflare Sandbox · E2B · OpenHands Runtime</text>
<text class="stackSub" x="755" y="1242">Managed or task-scoped remote execution environment</text>
<rect class="policy" x="1375" y="1190" width="760" height="76" rx="9"/>
<text class="policyTitle" x="1395" y="1213">REMOTE TASK POLICY</text>
<text class="policyText" x="1395" y="1238">Ephemeral per-task workspace; tenant-bound identity; short-lived scoped credentials; egress proxy / allowlist;</text>
<text class="policyText" x="1395" y="1257">resource and time budgets; audit execution; destroy workspace and revoke grants at task end.</text>
<rect class="stack" x="735" y="1280" width="600" height="76" rx="9"/>
<text class="stackTitle" x="755" y="1308">Dedicated VM / worker pool</text>
<text class="stackSub" x="755" y="1332">Kubernetes + gVisor / Kata / microVM</text>
<rect class="policy" x="1375" y="1280" width="760" height="76" rx="9"/>
<text class="policyTitle" x="1395" y="1303">WORKER-POOL POLICY</text>
<text class="policyText" x="1395" y="1328">Isolate tenant queues, storage and network; use signed immutable images and workload identity;</text>
<text class="policyText" x="1395" y="1347">broker secrets; cap concurrency / cost; reimage or destroy workers after execution.</text>

<text class="foot" x="70" y="1420">Cross-cutting controls: identity and delegation · resource authorization · data classification · credential broker · network egress · quotas · audit · emergency stop · cleanup.</text>
<text class="foot" x="70" y="1448">These are policy responsibilities to implement and test, not guarantees supplied automatically by each product or runtime.</text>
</svg>