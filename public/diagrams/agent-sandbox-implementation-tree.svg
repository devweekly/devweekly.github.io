<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1260" viewBox="0 0 1900 1260" role="img" aria-labelledby="title desc">
<title id="title">Agent Sandbox Implementation Options</title>
<desc id="desc">A branching taxonomy of Agent sandbox approaches, from application-level controls and virtual shells to operating-system sandboxes, containers, virtual machines, and remote execution services, with concrete implementation examples.</desc>
<defs>
  <style>
    .bg{fill:#f7f8fa}.title{font:700 34px Inter,Arial,sans-serif;fill:#172033}.subtitle{font:18px Inter,Arial,sans-serif;fill:#596579}
    .root{fill:#172033;stroke:#172033;stroke-width:2}.rootText{font:700 22px Inter,Arial,sans-serif;fill:#fff}
    .branch{fill:none;stroke:#8994a6;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .node{fill:#fff;stroke:#cbd3df;stroke-width:2}.head{fill:#eaf0f8;stroke:#9eacc1;stroke-width:2}
    .headText{font:700 19px Inter,Arial,sans-serif;fill:#203047}.body{font:16px Inter,Arial,sans-serif;fill:#354258}
    .small{font:14px Inter,Arial,sans-serif;fill:#596579}.tag{font:700 13px Inter,Arial,sans-serif;fill:#41536d;letter-spacing:.5px}
    .note{fill:#fff8e8;stroke:#e2c98e;stroke-width:1.5}.noteText{font:15px Inter,Arial,sans-serif;fill:#624c1d}
  </style>
</defs>
<rect class="bg" width="1900" height="1260"/>
<text class="title" x="70" y="68">Agent Sandbox Implementation Options</text>
<text class="subtitle" x="70" y="103">Choose the enforcement boundary first; then select an implementation that can enforce it.</text>

<rect class="root" x="70" y="535" width="250" height="150" rx="18"/>
<text class="rootText" x="195" y="588" text-anchor="middle">Agent Execution</text>
<text class="rootText" x="195" y="619" text-anchor="middle">Boundary</text>
<text x="195" y="652" text-anchor="middle" style="font:14px Inter,Arial,sans-serif;fill:#d7deea">Where can code run?</text>

<!-- trunk -->
<path class="branch" d="M320 610 H375 V190 H430 M375 350 H430 M375 510 H430 M375 700 H430 M375 890 H430 M375 1080 H430"/>
<circle cx="375" cy="610" r="6" fill="#8994a6"/>

<!-- 1 -->
<path class="branch" d="M430 190 H455"/>
<rect class="head" x="455" y="145" width="330" height="90" rx="12"/>
<text class="headText" x="475" y="180">1. Application-level controls</text>
<text class="tag" x="475" y="207">NO OS ISOLATION</text>
<path class="branch" d="M785 190 H820 V145 H850 M820 190 V235 H850"/>
<rect class="node" x="850" y="112" width="420" height="68" rx="10"/>
<text class="body" x="872" y="140">Capability-based file access</text>
<text class="small" x="872" y="162">Custom ResourceRef / scoped file service</text>
<rect class="node" x="850" y="202" width="420" height="68" rx="10"/>
<text class="body" x="872" y="230">Tool and resource permissions</text>
<text class="small" x="872" y="252">Runtime Policy Engine · MCP Filesystem</text>
<rect class="note" x="1310" y="142" width="510" height="95" rx="10"/>
<text class="noteText" x="1332" y="177">Controls which operations are exposed;</text>
<text class="noteText" x="1332" y="201">does not contain arbitrary code execution.</text>

<!-- 2 -->
<path class="branch" d="M430 350 H455"/>
<rect class="head" x="455" y="305" width="330" height="90" rx="12"/>
<text class="headText" x="475" y="340">2. Virtual / controlled shell</text>
<text class="tag" x="475" y="367">SIMULATED COMMAND ENVIRONMENT</text>
<path class="branch" d="M785 350 H850"/>
<rect class="node" x="850" y="310" width="420" height="80" rx="10"/>
<text class="body" x="872" y="342">just-bash</text>
<text class="small" x="872" y="366">TypeScript virtual shell · constrained commands</text>
<rect class="note" x="1310" y="310" width="510" height="80" rx="10"/>
<text class="noteText" x="1332" y="342">Useful for predictable command workflows;</text>
<text class="noteText" x="1332" y="366">not a boundary for arbitrary native processes.</text>

<!-- 3 -->
<path class="branch" d="M430 510 H455"/>
<rect class="head" x="455" y="465" width="330" height="90" rx="12"/>
<text class="headText" x="475" y="500">3. OS-level process sandbox</text>
<text class="tag" x="475" y="527">SAME HOST KERNEL</text>
<path class="branch" d="M785 510 H850"/>
<rect class="node" x="850" y="405" width="420" height="205" rx="10"/>
<text class="body" x="872" y="442">macOS · Seatbelt / sandbox-exec</text>
<text class="small" x="872" y="466">Anthropic Sandbox Runtime · Codex patterns</text>
<text class="body" x="872" y="505">Linux · bubblewrap / namespaces / seccomp</text>
<text class="small" x="872" y="529">Landlock · network proxy / egress controls</text>
<text class="body" x="872" y="568">Windows · AppContainer / restricted token</text>
<text class="small" x="872" y="592">Job Objects · ACLs · process mitigation</text>
<path class="branch" d="M1270 510 H1310"/>
<rect class="note" x="1310" y="470" width="510" height="125" rx="10"/>
<text class="noteText" x="1332" y="505">Strong host-enforced restrictions for files,</text>
<text class="noteText" x="1332" y="529">processes and network; still shares the host</text>
<text class="noteText" x="1332" y="553">kernel and its attack surface.</text>

<!-- 4 -->
<path class="branch" d="M430 700 H455"/>
<rect class="head" x="455" y="655" width="330" height="90" rx="12"/>
<text class="headText" x="475" y="690">4. Container isolation</text>
<text class="tag" x="475" y="717">SHARED HOST KERNEL BY DEFAULT</text>
<path class="branch" d="M785 700 H820 V665 H850 M820 700 V775 H850"/>
<rect class="node" x="850" y="630" width="420" height="70" rx="10"/>
<text class="body" x="872" y="658">Docker / Podman (rootless where possible)</text>
<text class="small" x="872" y="682">Namespaces · cgroups · seccomp · AppArmor</text>
<rect class="node" x="850" y="740" width="420" height="70" rx="10"/>
<text class="body" x="872" y="768">Kubernetes Restricted Pod</text>
<text class="small" x="872" y="792">Pod Security · NetworkPolicy · RuntimeClass</text>
<path class="branch" d="M1270 665 H1310 M1270 775 H1310"/>
<rect class="note" x="1310" y="675" width="510" height="110" rx="10"/>
<text class="noteText" x="1332" y="710">Good packaging and operational isolation;</text>
<text class="noteText" x="1332" y="734">add a stronger runtime when executing</text>
<text class="noteText" x="1332" y="758">hostile multi-tenant workloads.</text>

<!-- 5 -->
<path class="branch" d="M430 890 H455"/>
<rect class="head" x="455" y="845" width="330" height="90" rx="12"/>
<text class="headText" x="475" y="880">5. Sandboxed kernel / microVM</text>
<text class="tag" x="475" y="907">ADDITIONAL KERNEL BOUNDARY</text>
<path class="branch" d="M785 890 H820 V845 H850 M820 890 V955 H850"/>
<rect class="node" x="850" y="810" width="420" height="70" rx="10"/>
<text class="body" x="872" y="838">gVisor</text>
<text class="small" x="872" y="862">User-space kernel intercepts application syscalls</text>
<rect class="node" x="850" y="920" width="420" height="70" rx="10"/>
<text class="body" x="872" y="948">Kata Containers · Firecracker microVM</text>
<text class="small" x="872" y="972">Guest kernel · lightweight virtual machines</text>
<path class="branch" d="M1270 845 H1310 M1270 955 H1310"/>
<rect class="note" x="1310" y="845" width="510" height="110" rx="10"/>
<text class="noteText" x="1332" y="880">Better fit for untrusted code and stronger</text>
<text class="noteText" x="1332" y="904">tenant separation; requires image, lifecycle,</text>
<text class="noteText" x="1332" y="928">network and credential controls.</text>

<!-- 6 -->
<path class="branch" d="M430 1080 H455"/>
<rect class="head" x="455" y="1035" width="330" height="90" rx="12"/>
<text class="headText" x="475" y="1070">6. Remote isolated execution</text>
<text class="tag" x="475" y="1097">SEPARATE EXECUTION HOST</text>
<path class="branch" d="M785 1080 H820 V1035 H850 M820 1080 V1145 H850"/>
<rect class="node" x="850" y="1000" width="420" height="70" rx="10"/>
<text class="body" x="872" y="1028">Task-scoped remote sandbox</text>
<text class="small" x="872" y="1052">Cloudflare Sandbox · E2B · OpenHands Runtime</text>
<rect class="node" x="850" y="1110" width="420" height="70" rx="10"/>
<text class="body" x="872" y="1138">Dedicated VM / worker pool</text>
<text class="small" x="872" y="1162">Kubernetes + gVisor / Kata / microVM</text>
<path class="branch" d="M1270 1035 H1310 M1270 1145 H1310"/>
<rect class="note" x="1310" y="1040" width="510" height="115" rx="10"/>
<text class="noteText" x="1332" y="1075">Separates execution from the desktop host;</text>
<text class="noteText" x="1332" y="1099">remote tool, remote execution and remote</text>
<text class="noteText" x="1332" y="1123">Agent are different deployment models.</text>

<text class="small" x="70" y="1225">Orthogonal controls still apply at every branch: identity, scoped credentials, resource permissions, egress policy, quotas, audit and lifecycle cleanup.</text>
</svg>