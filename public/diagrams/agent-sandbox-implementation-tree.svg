<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1900" viewBox="0 0 2200 1900" role="img" aria-labelledby="title desc">
<title id="title">Agent Sandbox Landscape</title>
<desc id="desc">A concise map of Agent sandbox implementation families, representative projects and their primary security controls.</desc>
<defs><style>
.bg{fill:#f7f8fa}.title{font:700 42px Inter,Arial,sans-serif;fill:#172033}.sub{font:20px Inter,Arial,sans-serif;fill:#596579}
.head{font:700 16px Inter,Arial,sans-serif;fill:#596579;letter-spacing:1px}
.row{fill:#fff;stroke:#c7d0dd;stroke-width:2}.family{font:700 21px Inter,Arial,sans-serif;fill:#26364c}
.projects{font:700 20px Inter,Arial,sans-serif;fill:#26364c}.guard{font:18px Inter,Arial,sans-serif;fill:#476653}
.note{font:17px Inter,Arial,sans-serif;fill:#596579}
</style></defs>
<rect class="bg" width="2200" height="1900"/>
<text class="title" x="70" y="78">Agent Sandbox Landscape</text>
<text class="sub" x="70" y="116">Implementation families · representative projects · essential controls</text>
<text class="head" x="100" y="200">IMPLEMENTATION FAMILY</text>
<text class="head" x="520" y="200">PROJECTS</text>
<text class="head" x="520" y="225">SECURITY FOCUS</text>
<rect class="row" x="70" y="250" width="2060" height="142" rx="14"/>
<text class="family" x="100" y="298">1 · App permissions</text>
<text class="projects" x="520" y="298">AgentFense · easy-agent · Deep Agents · MCP Filesystem</text>
<text class="guard" x="520" y="341">Scoped paths · tool allowlist · read/write split</text>
<rect class="row" x="70" y="410" width="2060" height="142" rx="14"/>
<text class="family" x="100" y="458">2 · Virtual shell</text>
<text class="projects" x="520" y="458">just-bash</text>
<text class="guard" x="520" y="501">Virtual FS · limited commands · no host shell</text>
<rect class="row" x="70" y="570" width="2060" height="142" rx="14"/>
<text class="family" x="100" y="618">3 · OS process sandbox</text>
<text class="projects" x="520" y="618">Claude Code / Anthropic Sandbox Runtime · OpenAI Codex · Microsoft MXC</text>
<text class="guard" x="520" y="661">Seatbelt · bubblewrap · seccomp · Landlock · path + network rules</text>
<rect class="row" x="70" y="730" width="2060" height="142" rx="14"/>
<text class="family" x="100" y="778">4 · Containers / orchestration</text>
<text class="projects" x="520" y="778">Docker · Podman · OpenHands Runtime · Kubernetes Pod Security / RuntimeClass</text>
<text class="guard" x="520" y="821">Rootless · drop capabilities · read-only FS · NetworkPolicy</text>
<rect class="row" x="70" y="890" width="2060" height="142" rx="14"/>
<text class="family" x="100" y="938">5 · Kernel / microVM</text>
<text class="projects" x="520" y="938">gVisor · Kata Containers · Firecracker</text>
<text class="guard" x="520" y="981">Separate kernel / VMM · minimal devices · isolated storage</text>
<rect class="row" x="70" y="1050" width="2060" height="142" rx="14"/>
<text class="family" x="100" y="1098">6 · Remote execution</text>
<text class="projects" x="520" y="1098">E2B · Cloudflare Sandbox · Modal · Daytona · Vercel Sandbox · AgentCore</text>
<text class="guard" x="520" y="1141">Per-task workspace · tenant identity · short-lived credentials</text>
<rect class="row" x="70" y="1210" width="2060" height="142" rx="14"/>
<text class="family" x="100" y="1258">7 · Agent security runtime</text>
<text class="projects" x="520" y="1258">NVIDIA OpenShell</text>
<text class="guard" x="520" y="1301">Policy enforcement · credential broker · controlled egress</text>
<rect class="row" x="70" y="1370" width="2060" height="142" rx="14"/>
<text class="family" x="100" y="1418">8 · WASM runtime</text>
<text class="projects" x="520" y="1418">Wasmtime · Wasmer · WASI</text>
<text class="guard" x="520" y="1461">Explicit host imports · preopened dirs · fuel / memory limits</text>
<rect class="row" x="70" y="1530" width="2060" height="142" rx="14"/>
<text class="family" x="100" y="1578">9 · Persistent / embedded VM</text>
<text class="projects" x="520" y="1578">BoxLite · SmolVM · Fly.io Sprites · Docker Sandboxes · Deno Sandbox</text>
<text class="guard" x="520" y="1621">Snapshot isolation · restore checks · tenant-bound state</text>
<rect class="row" x="70" y="1690" width="2060" height="142" rx="14"/>
<text class="family" x="100" y="1738">10 · Browser execution</text>
<text class="projects" x="520" y="1738">Browserbase · Steel · Lightpanda · AgentCore Browser</text>
<text class="guard" x="520" y="1781">Per-task profile · cookie isolation · download / egress controls</text>
<rect x="70" y="1740" width="2060" height="105" rx="14" fill="#eaf0f8" stroke="#9eacc1" stroke-width="2"/>
<text class="family" x="100" y="1782">Kubernetes SIG Apps — Agent Sandbox</text>
<text class="projects" x="740" y="1782">kubernetes-sigs/agent-sandbox · Sandbox / SandboxTemplate / SandboxClaim</text>
<text class="guard" x="740" y="1820">Lifecycle API and warm pools; choose RuntimeClass (e.g. gVisor / Kata) for actual isolation.</text>
<text class="note" x="70" y="1880">A control plane or API does not itself provide a kernel / VM security boundary. Verify the selected runtime.</text>
</svg>