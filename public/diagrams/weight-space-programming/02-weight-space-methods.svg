<text x="480" y="438" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="Geist,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">不是严格的线性演进关系：各方法目标、约束与成熟度不同，可组合但不可互相等同。</text>
<text x="480" y="490" text-anchor="middle" fill="#5a6580" font-size="12" font-family="Geist,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">Mechanistic Interpretability 提供内部机制分析视角；它是诊断基础，不是参数更新算法。</text>
<text x="480" y="512" text-anchor="middle" fill="#5a6580" font-size="12" font-family="Geist,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">Task Arithmetic 常用于表达 / 组合参数差分；Model Merging 是更广泛的合并方法族。</text>
