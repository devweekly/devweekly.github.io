<title id="title">PostgreSQL 主栈：事务、关系权限与 SQL 检索</title><desc id="desc">PostgreSQL owns the document catalog, ACL relationships and transactional outbox. Processing workers parse and chunk documents into S3-backed records, then PostgreSQL executes SQL-based lexical and vector retrieval with RLS and relational filters.</desc>
