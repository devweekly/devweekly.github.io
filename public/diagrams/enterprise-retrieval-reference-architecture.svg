<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="enterprise-retrieval-reference-architecture-title enterprise-retrieval-reference-architecture-desc"><title id="enterprise-retrieval-reference-architecture-title">企业混合检索参考架构</title><desc id="enterprise-retrieval-reference-architecture-desc">统一 Retrieval API 在确定性授权约束下路由 OpenSearch、PostgreSQL pgvector 和 Snowflake Cortex Search；各后端分别消费权威数据源构建检索投影。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#65584D"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8B5A2B"/></marker><filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#221C17" flood-opacity=".08"/></filter></defs><style>
text{fill:#221C17}.eyebrow{font:500 10px 'IBM Plex Mono','Noto Sans SC',monospace;letter-spacing:1.35px;fill:#75695F}.diagram-title{font:600 25px 'IBM Plex Mono','Noto Sans SC',monospace;fill:#221C17}.label{font:600 17px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#221C17}.sub{font:400 12px 'IBM Plex Mono','Noto Sans SC',monospace;fill:#65584D}.chip{font:500 9px 'IBM Plex Mono','Noto Sans SC',monospace;letter-spacing:.45px;fill:#221C17}.note{font:400 12px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#65584D}.node{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.15;filter:url(#soft-shadow)}.focus{fill:#F5E7D4;stroke:#8B5A2B;stroke-width:1.5;filter:url(#soft-shadow)}.connector{fill:none;stroke:#65584D;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}.connector-accent{fill:none;stroke:#8B5A2B;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.connector-return{fill:none;stroke:#75695F;stroke-width:1.2;stroke-dasharray:5 4;stroke-linecap:round;stroke-linejoin:round}.zone{fill:#F1EDE4;stroke:#CFC5B8;stroke-width:1}.actor{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.15;filter:url(#soft-shadow)}.lifeline{stroke:#CFC5B8;stroke-width:1;stroke-dasharray:4 5}.activation{fill:#F1EDE4;stroke:#75695F;stroke-width:.9}.message{stroke:#65584D;stroke-width:1.35;fill:none;marker-end:url(#arrow)}.message-return{stroke:#75695F;stroke-width:1.2;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}.message-success{stroke:#8B5A2B;stroke-width:1.65;fill:none;marker-end:url(#arrow-accent)}.message-label{font:500 9px 'IBM Plex Mono',monospace;fill:#65584D;letter-spacing:.25px}
</style><rect width="1280" height="720" fill="#F9F6EF"/><text x="56" y="36" class="eyebrow">REFERENCE ARCHITECTURE · MULTI-ENGINE RETRIEVAL</text><text x="56" y="78" class="diagram-title">企业混合检索参考架构</text><text x="56" y="106" class="note">统一 Retrieval API 在确定性授权约束下路由 OpenSearch、PostgreSQL pgvector 和 Snowflake Cortex Search；各后端分别消费权威数据源构建检索投影。</text><path d="M286 218 H424" class="connector" marker-end="url(#arrow)"/><path d="M704 218 H910" class="connector" marker-end="url(#arrow)"/><path d="M564 282 V326" class="connector" /><path d="M242 326 H1038" class="connector" /><path d="M242 326 V390" class="connector" marker-end="url(#arrow)"/><path d="M640 326 V390" class="connector" marker-end="url(#arrow)"/><path d="M1038 326 V390" class="connector" marker-end="url(#arrow)"/><path d="M242 542 V502" class="connector" marker-end="url(#arrow)"/><path d="M640 542 V502" class="connector" marker-end="url(#arrow)"/><path d="M1038 542 V502" class="connector" marker-end="url(#arrow)"/><g class="card"><rect x="76" y="164" width="210" height="110" rx="12" class="node"/><rect x="92" y="178" width="78" height="20" rx="10" fill="#DCE5F4"/><text x="131" y="192" text-anchor="middle" class="chip">CLIENT</text><text x="92" y="222" class="label" font-size="18">应用 / Agent</text><text x="92" y="246" class="sub">用户问题 · 身份上下文</text><text x="92" y="263" class="sub">业务场景与数据域</text></g><g class="card"><rect x="424" y="156" width="280" height="126" rx="12" class="focus"/><rect x="440" y="170" width="78" height="20" rx="10" fill="#F5E7D4"/><text x="479" y="184" text-anchor="middle" class="chip">ENTRY</text><text x="440" y="214" class="label" font-size="16">Retrieval API / Router</text><text x="440" y="238" class="sub">统一请求 · 后端适配</text><text x="440" y="255" class="sub">路由与结果标准化</text></g><g class="card"><rect x="910" y="156" width="284" height="126" rx="12" class="node"/><rect x="926" y="170" width="78" height="20" rx="10" fill="#F0DDEB"/><text x="965" y="184" text-anchor="middle" class="chip">POLICY</text><text x="926" y="214" class="label" font-size="16">Entitlement / PDP</text><text x="926" y="238" class="sub">验证身份与访问范围</text><text x="926" y="255" class="sub">产生可信过滤约束</text></g><g class="card"><rect x="72" y="390" width="340" height="112" rx="12" class="node"/><rect x="88" y="404" width="78" height="20" rx="10" fill="#DCE5F4"/><text x="127" y="418" text-anchor="middle" class="chip">SEARCH</text><text x="88" y="448" class="label" font-size="16">OpenSearch Cluster</text><text x="88" y="472" class="sub">BM25 + ANN · Shard / Replica</text><text x="88" y="489" class="sub">搜索索引与相关性管线</text></g><g class="card"><rect x="470" y="390" width="340" height="112" rx="12" class="node"/><rect x="486" y="404" width="90" height="20" rx="10" fill="#D8EEE8"/><text x="531" y="418" text-anchor="middle" class="chip">DATABASE</text><text x="486" y="448" class="label" font-size="16">PostgreSQL + pgvector</text><text x="486" y="472" class="sub">业务行 / chunk / vector</text><text x="486" y="489" class="sub">SQL · JOIN · FTS · RLS</text></g><g class="card"><rect x="868" y="390" width="340" height="112" rx="12" class="node"/><rect x="884" y="404" width="82" height="20" rx="10" fill="#F5E7D4"/><text x="925" y="418" text-anchor="middle" class="chip">MANAGED</text><text x="884" y="448" class="label" font-size="16">Cortex Search Service</text><text x="884" y="472" class="sub">Snowflake source query</text><text x="884" y="489" class="sub">托管混合检索与刷新</text></g><g class="card"><rect x="72" y="542" width="340" height="112" rx="12" class="node"/><rect x="88" y="556" width="98" height="20" rx="10" fill="#F4EFC9"/><text x="137" y="570" text-anchor="middle" class="chip">AUTHORITY</text><text x="88" y="600" class="label" font-size="18">产品主数据 / 事件流</text><text x="88" y="624" class="sub">CDC · 业务对象 · 文档引用</text><text x="88" y="641" class="sub">索引由权威源独立构建</text></g><g class="card"><rect x="470" y="542" width="340" height="112" rx="12" class="node"/><rect x="486" y="556" width="98" height="20" rx="10" fill="#F4EFC9"/><text x="535" y="570" text-anchor="middle" class="chip">AUTHORITY</text><text x="486" y="600" class="label" font-size="18">PostgreSQL 业务库</text><text x="486" y="624" class="sub">用户 · 租户 · ACL · 业务对象</text><text x="486" y="641" class="sub">可与检索投影共享事务边界</text></g><g class="card"><rect x="868" y="542" width="340" height="112" rx="12" class="node"/><rect x="884" y="556" width="98" height="20" rx="10" fill="#F4EFC9"/><text x="933" y="570" text-anchor="middle" class="chip">AUTHORITY</text><text x="884" y="600" class="label" font-size="18">Snowflake 数据产品</text><text x="884" y="624" class="sub">治理后的文本与属性列</text><text x="884" y="641" class="sub">Cortex Search 从源查询刷新</text></g><line x1="56" y1="670" x2="1224" y2="670" stroke="#CFC5B8" stroke-width=".8"/><text x="56" y="694" class="note">检索索引是可重建的投影；不要让 OpenSearch、PostgreSQL 和 Snowflake 互相追逐同步。</text></svg>
