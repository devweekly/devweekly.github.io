<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="agent-write-authorization-title agent-write-authorization-desc">
<title id="agent-write-authorization-title">Authorized business write</title>
<desc id="agent-write-authorization-desc">A user request passes through model planning, policy checks, an immutable approval decision and a final authorization recheck.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#bf4520"/></marker><marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<style>.t{font-family="Geist,Arial,sans-serif";fill:#2d3142}.m{font-family="'Geist Mono',monospace";fill:#4f5d75}.node{fill:#fff;stroke:#bfc0c0;stroke-width:1.2}.focal{fill:#fff4ee;stroke:#bf4520;stroke-width:1.8}.zone{fill:#2d3142;fill-opacity:.025;stroke:#bfc0c0;stroke-width:1}.line{fill:none;stroke:#4f5d75;stroke-width:1.35;marker-end:url(#arrow)}.return{fill:none;stroke:#4f5d75;stroke-width:1.2;stroke-dasharray:4 3;marker-end:url(#arrow)}.accent-line{fill:none;stroke:#bf4520;stroke-width:1.6;marker-end:url(#arrow-accent)}.label{font-family:'Geist Mono',monospace;font-size:8px;fill:#4f5d75;letter-spacing:.02em}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="48" y="36" class="m" font-size="9" letter-spacing="2">DIAGRAM DESIGN · ENTERPRISE AI AGENT PLATFORM</text>
<text x="48" y="76" class="t" font-size="28" font-family="'Instrument Serif',Georgia,serif">Authorized business write</text>
<text x="48" y="104" class="m" font-size="10">01 / IDENTITY · POLICY · HUMAN APPROVAL</text><rect x="24" y="122" width="208" height="48" rx="6" class="node"/><text x="128" y="143" text-anchor="middle" class="t" font-size="11" font-weight="600">User / App Channel</text><line x1="128" y1="154" x2="128" y2="624" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4 4"/><rect x="280" y="122" width="208" height="48" rx="6" class="node"/><text x="384" y="143" text-anchor="middle" class="t" font-size="11" font-weight="600">Agent Runtime</text><line x1="384" y1="154" x2="384" y2="624" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4 4"/><rect x="536" y="122" width="208" height="48" rx="6" class="node"/><text x="640" y="143" text-anchor="middle" class="t" font-size="11" font-weight="600">Model Gateway</text><line x1="640" y1="154" x2="640" y2="624" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4 4"/><rect x="792" y="122" width="208" height="48" rx="6" class="node"/><text x="896" y="143" text-anchor="middle" class="t" font-size="11" font-weight="600">Policy Engine</text><line x1="896" y1="154" x2="896" y2="624" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4 4"/><rect x="1048" y="122" width="208" height="48" rx="6" class="node"/><text x="1152" y="143" text-anchor="middle" class="t" font-size="11" font-weight="600">Approval Service</text><line x1="1152" y1="154" x2="1152" y2="624" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4 4"/><path d="M133 202 H379" class="line"/><rect x="169" y="185" width="174" height="12" rx="2" fill="#f5f5f5"/><text x="256" y="194" text-anchor="middle" class="label">Request change + user identity</text><path d="M389 239 H635" class="line"/><rect x="430.2" y="222" width="163.6" height="12" rx="2" fill="#f5f5f5"/><text x="512" y="231" text-anchor="middle" class="label">Request plan / tool proposal</text><path d="M635 276 H389" class="return"/><rect x="438" y="259" width="148" height="12" rx="2" fill="#f5f5f5"/><text x="512" y="268" text-anchor="middle" class="label">Proposed tool + arguments</text><path d="M389 313 H891" class="line"/><rect x="529.6" y="296" width="220.8" height="12" rx="2" fill="#f5f5f5"/><text x="640" y="305" text-anchor="middle" class="label">Authorize user, agent, action, resource</text><path d="M891 350 H389" class="return"/><rect x="584" y="333" width="112" height="12" rx="2" fill="#f5f5f5"/><text x="640" y="342" text-anchor="middle" class="label">Approval required</text><path d="M389 387 H1147" class="line"/><rect x="678.4" y="370" width="179.20000000000002" height="12" rx="2" fill="#f5f5f5"/><text x="768" y="379" text-anchor="middle" class="label">Create immutable action payload</text><path d="M1147 424 H133" class="line"/><rect x="553" y="407" width="174" height="12" rx="2" fill="#f5f5f5"/><text x="640" y="416" text-anchor="middle" class="label">Show impact + requested action</text><path d="M133 461 H1147" class="line"/><rect x="584" y="444" width="112" height="12" rx="2" fill="#f5f5f5"/><text x="640" y="453" text-anchor="middle" class="label">Approve / reject</text><path d="M1147 498 H389" class="return"/><rect x="696.6" y="481" width="142.8" height="12" rx="2" fill="#f5f5f5"/><text x="768" y="490" text-anchor="middle" class="label">Signed approval decision</text><path d="M389 535 H891" class="line"/><rect x="560.8" y="518" width="158.4" height="12" rx="2" fill="#f5f5f5"/><text x="640" y="527" text-anchor="middle" class="label">Revalidate scope + approval</text><path d="M891 572 H389" class="accent-line"/><rect x="584" y="555" width="112" height="12" rx="2" fill="#f5f5f5"/><text x="640" y="564" text-anchor="middle" class="label">Permit</text><line x1="48" y1="664" x2="1232" y2="664" stroke="#bfc0c0" stroke-width="1"/><text x="48" y="684" class="m" font-size="8">SOLID · REQUEST / ACTION</text><line x1="250" y1="681" x2="292" y2="681" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="330" y="684" class="m" font-size="8">DASHED · RETURN / DECISION</text><line x1="550" y1="681" x2="592" y2="681" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>