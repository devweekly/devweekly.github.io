<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="document-ingestion-indexing-flow-title document-ingestion-indexing-flow-desc"><title id="document-ingestion-indexing-flow-title">文档入库与三路检索投影</title><desc id="document-ingestion-indexing-flow-desc">原始文件经过解析、清洗、切片和元数据关联后，按后端的数据模型分别构建搜索投影；Snowflake 路线先装载文本与属性，再刷新 Cortex Search。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#65584D"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8B5A2B"/></marker><filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#221C17" flood-opacity=".08"/></filter></defs><style>
text{fill:#221C17}.eyebrow{font:500 10px 'IBM Plex Mono','Noto Sans SC',monospace;letter-spacing:1.35px;fill:#75695F}.diagram-title{font:600 25px 'IBM Plex Mono','Noto Sans SC',monospace;fill:#221C17}.label{font:600 17px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#221C17}.sub{font:400 12px 'IBM Plex Mono','Noto Sans SC',monospace;fill:#65584D}.chip{font:500 9px 'IBM Plex Mono','Noto Sans SC',monospace;letter-spacing:.45px;fill:#221C17}.note{font:400 12px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#65584D}.node{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.15;filter:url(#soft-shadow)}.focus{fill:#F5E7D4;stroke:#8B5A2B;stroke-width:1.5;filter:url(#soft-shadow)}.connector{fill:none;stroke:#65584D;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}.connector-accent{fill:none;stroke:#8B5A2B;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.connector-return{fill:none;stroke:#75695F;stroke-width:1.2;stroke-dasharray:5 4;stroke-linecap:round;stroke-linejoin:round}.zone{fill:#F1EDE4;stroke:#CFC5B8;stroke-width:1}.actor{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.15;filter:url(#soft-shadow)}.lifeline{stroke:#CFC5B8;stroke-width:1;stroke-dasharray:4 5}.activation{fill:#F1EDE4;stroke:#75695F;stroke-width:.9}.message{stroke:#65584D;stroke-width:1.35;fill:none;marker-end:url(#arrow)}.message-return{stroke:#75695F;stroke-width:1.2;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}.message-success{stroke:#8B5A2B;stroke-width:1.65;fill:none;marker-end:url(#arrow-accent)}.message-label{font:500 9px 'IBM Plex Mono',monospace;fill:#65584D;letter-spacing:.25px}
</style><rect width="1280" height="720" fill="#F9F6EF"/><text x="56" y="36" class="eyebrow">DATA FLOW · INGESTION AND INDEX PROJECTION</text><text x="56" y="78" class="diagram-title">文档入库与三路检索投影</text><text x="56" y="106" class="note">原始文件经过解析、清洗、切片和元数据关联后，按后端的数据模型分别构建搜索投影；Snowflake 路线先装载文本与属性，再刷新 Cortex Search。</text><path d="M245 256 H300" class="connector" marker-end="url(#arrow)"/><path d="M490 256 H545" class="connector" marker-end="url(#arrow)"/><path d="M735 256 H790" class="connector" marker-end="url(#arrow)"/><path d="M885 312 V390" class="connector" marker-end="url(#arrow)"/><path d="M885 502 V524" class="connector" /><path d="M220 524 H1060" class="connector" /><path d="M220 524 V544" class="connector" marker-end="url(#arrow)"/><path d="M640 524 V544" class="connector" marker-end="url(#arrow)"/><path d="M1060 524 V544" class="connector" marker-end="url(#arrow)"/><g class="card"><rect x="55" y="200" width="190" height="112" rx="12" class="node"/><rect x="71" y="214" width="78" height="20" rx="10" fill="#DCE5F4"/><text x="110" y="228" text-anchor="middle" class="chip">SOURCE</text><text x="71" y="258" class="label" font-size="18">S3 / 文档仓库</text><text x="71" y="282" class="sub">PDF · Word · HTML</text><text x="71" y="299" class="sub">原件、版本与对象 URI</text></g><g class="card"><rect x="300" y="200" width="190" height="112" rx="12" class="node"/><rect x="316" y="214" width="82" height="20" rx="10" fill="#D8EEE8"/><text x="357" y="228" text-anchor="middle" class="chip">TRIGGER</text><text x="316" y="258" class="label" font-size="18">事件 / 批处理</text><text x="316" y="282" class="sub">Object event · CDC</text><text x="316" y="299" class="sub">增量或周期性扫描</text></g><g class="card"><rect x="545" y="200" width="190" height="112" rx="12" class="node"/><rect x="561" y="214" width="82" height="20" rx="10" fill="#D8EEE8"/><text x="602" y="228" text-anchor="middle" class="chip">PROCESS</text><text x="561" y="258" class="label" font-size="18">解析与规范化</text><text x="561" y="282" class="sub">文本 · 表格 · 版面</text><text x="561" y="299" class="sub">去重、清洗与实体识别</text></g><g class="card"><rect x="790" y="200" width="190" height="112" rx="12" class="focus"/><rect x="806" y="214" width="90" height="20" rx="10" fill="#F5E7D4"/><text x="851" y="228" text-anchor="middle" class="chip">CHUNKING</text><text x="806" y="258" class="label" font-size="18">Chunk + 元数据</text><text x="806" y="282" class="sub">document_id · page · URI</text><text x="806" y="299" class="sub">版本、实体与安全属性</text></g><g class="card"><rect x="790" y="390" width="190" height="112" rx="12" class="node"/><rect x="806" y="404" width="98" height="20" rx="10" fill="#F5E7D4"/><text x="855" y="418" text-anchor="middle" class="chip">EMBEDDING</text><text x="806" y="448" class="label" font-size="18">Embedding 策略</text><text x="806" y="472" class="sub">模型 · 维度 · 版本</text><text x="806" y="489" class="sub">外部生成或服务侧生成</text></g><g class="card"><rect x="50" y="544" width="340" height="112" rx="12" class="node"/><rect x="66" y="558" width="106" height="20" rx="10" fill="#DCE5F4"/><text x="119" y="572" text-anchor="middle" class="chip">OPENSEARCH</text><text x="66" y="602" class="label" font-size="16">OpenSearch Index</text><text x="66" y="626" class="sub">chunk + BM25 fields + vector</text><text x="66" y="643" class="sub">metadata filter · source URI</text></g><g class="card"><rect x="470" y="544" width="340" height="112" rx="12" class="node"/><rect x="486" y="558" width="90" height="20" rx="10" fill="#D8EEE8"/><text x="531" y="572" text-anchor="middle" class="chip">POSTGRES</text><text x="486" y="602" class="label" font-size="16">PostgreSQL chunk 表</text><text x="486" y="626" class="sub">text + embedding + entity ids</text><text x="486" y="643" class="sub">GIN / pgvector / ACL 关系</text></g><g class="card"><rect x="890" y="544" width="340" height="112" rx="12" class="node"/><rect x="906" y="558" width="98" height="20" rx="10" fill="#F5E7D4"/><text x="955" y="572" text-anchor="middle" class="chip">SNOWFLAKE</text><text x="906" y="602" class="label" font-size="16">Snowflake text / attribute table</text><text x="906" y="626" class="sub">Cortex Search 源查询</text><text x="906" y="643" class="sub">服务刷新托管索引</text></g><line x1="56" y1="670" x2="1224" y2="670" stroke="#CFC5B8" stroke-width=".8"/><text x="56" y="694" class="note">Embedding 可由处理层或检索服务生成；不要默认跨后端复用未经验证的模型、维度和版本。</text></svg>
