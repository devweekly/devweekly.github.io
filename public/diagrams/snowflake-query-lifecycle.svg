<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="snowflake-query-lifecycle-title snowflake-query-lifecycle-desc"><title id="snowflake-query-lifecycle-title">Snowflake 查询生命周期</title><desc id="snowflake-query-lifecycle-desc">五个参与者之间的查询请求、元数据解析、Warehouse 执行和结果返回时序。</desc><defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#65584D"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#8B5A2B"/></marker>
<marker id="arrow-left" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10z" fill="#65584D"/></marker>
</defs><rect width="100%" height="100%" fill="#F9F6EF"/><style>
text{font-family:'Geist','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;fill:#221C17}
.eyebrow{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:1.6px;fill:#75695F}
.title{font-family:'Instrument Serif','Noto Serif SC',serif;font-size:31px;font-weight:400;fill:#221C17}
.label{font-size:17px;font-weight:600}
.sub{font-family:'Geist Mono','Noto Sans SC',monospace;font-size:12px;fill:#65584D}
.tiny{font-family:'Geist Mono','Noto Sans SC',monospace;font-size:10px;fill:#75695F}
.node{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.2}
.focus{fill:#F5E7D4;stroke:#8B5A2B;stroke-width:1.5}
.zone{fill:#F1EDE4;stroke:#CFC5B8;stroke-width:1}
.line{fill:none;stroke:#65584D;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.accent-line{fill:none;stroke:#8B5A2B;stroke-width:1.8;stroke-linecap:round;marker-end:url(#arrow-accent)}
.dash{fill:none;stroke:#75695F;stroke-width:1.2;stroke-dasharray:5 4}
.actor{fill:#FFFEFA;stroke:#CFC5B8;stroke-width:1.2}
.activation{fill:#F1EDE4;stroke:#75695F;stroke-width:0.8}
.msg-label{font-family:'Geist Mono','Noto Sans SC',monospace;font-size:11px;fill:#65584D}
</style><text x="56" y="54" class="eyebrow">SEQUENCE · QUERY EXECUTION</text><text x="56" y="96" class="title">从 SQL 请求到结果返回</text><line x1="160" y1="166" x2="160" y2="790" class="dash"/><line x1="430" y1="166" x2="430" y2="790" class="dash"/><line x1="700" y1="166" x2="700" y2="790" class="dash"/><line x1="970" y1="166" x2="970" y2="790" class="dash"/><line x1="1240" y1="166" x2="1240" y2="790" class="dash"/><path d="M160 220 H422" fill="none" stroke="#65584D" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="187" y="193" width="216" height="16" rx="3" fill="#F9F6EF"/><text x="295" y="205" text-anchor="middle" class="msg-label">1  Submit SQL</text><path d="M430 286 H692" fill="none" stroke="#65584D" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="457" y="259" width="216" height="16" rx="3" fill="#F9F6EF"/><text x="565" y="271" text-anchor="middle" class="msg-label">2  Resolve object and snapshot</text><path d="M700 352 H438" fill="none" stroke="#65584D" stroke-width="1.5" marker-end="url(#arrow-left)"/><rect x="457" y="325" width="216" height="16" rx="3" fill="#F9F6EF"/><text x="565" y="337" text-anchor="middle" class="msg-label">3  Return metadata and statistics</text><path d="M430 418 H962" fill="none" stroke="#65584D" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="592" y="391" width="216" height="16" rx="3" fill="#F9F6EF"/><text x="700" y="403" text-anchor="middle" class="msg-label">4  Dispatch compiled plan</text><path d="M970 484 H1232" fill="none" stroke="#65584D" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="997" y="457" width="216" height="16" rx="3" fill="#F9F6EF"/><text x="1105" y="469" text-anchor="middle" class="msg-label">5  Read selected micro-partitions</text><path d="M1240 550 H978" fill="none" stroke="#65584D" stroke-width="1.5" marker-end="url(#arrow-left)"/><rect x="997" y="523" width="216" height="16" rx="3" fill="#F9F6EF"/><text x="1105" y="535" text-anchor="middle" class="msg-label">6  Return compressed column data</text><path d="M970 616 H438" fill="none" stroke="#65584D" stroke-width="1.5" marker-end="url(#arrow-left)"/><rect x="592" y="589" width="216" height="16" rx="3" fill="#F9F6EF"/><text x="700" y="601" text-anchor="middle" class="msg-label">7  Return result and execution state</text><path d="M430 682 H692" fill="none" stroke="#65584D" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="457" y="655" width="216" height="16" rx="3" fill="#F9F6EF"/><text x="565" y="667" text-anchor="middle" class="msg-label">8  Persist query status</text><path d="M430 748 H168" fill="none" stroke="#65584D" stroke-width="1.5" marker-end="url(#arrow-left)"/><rect x="187" y="721" width="216" height="16" rx="3" fill="#F9F6EF"/><text x="295" y="733" text-anchor="middle" class="msg-label">9  Return result set</text><rect x="422" y="214" width="16" height="488" rx="3" class="activation"/><rect x="692" y="280" width="16" height="80" rx="3" class="activation"/><rect x="962" y="412" width="16" height="214" rx="3" class="activation"/><rect x="56" y="122" width="208" height="56" rx="10" class="actor"/><text x="160" y="145" text-anchor="middle" class="label">SQL Client</text><text x="160" y="164" text-anchor="middle" class="tiny">JDBC / ODBC</text><rect x="326" y="122" width="208" height="56" rx="10" class="actor"/><text x="430" y="145" text-anchor="middle" class="label">Cloud Services</text><text x="430" y="164" text-anchor="middle" class="tiny">Auth · Compile · Dispatch</text><rect x="596" y="122" width="208" height="56" rx="10" class="actor"/><text x="700" y="145" text-anchor="middle" class="label">Metadata Service</text><text x="700" y="164" text-anchor="middle" class="tiny">Objects · Snapshots · Stats</text><rect x="866" y="122" width="208" height="56" rx="10" class="actor"/><text x="970" y="145" text-anchor="middle" class="label">Virtual Warehouse</text><text x="970" y="164" text-anchor="middle" class="tiny">MPP operators · Cache</text><rect x="1136" y="122" width="208" height="56" rx="10" class="actor"/><text x="1240" y="145" text-anchor="middle" class="label">Object Storage</text><text x="1240" y="164" text-anchor="middle" class="tiny">Micro-partitions</text><text x="56" y="824" class="tiny">Metadata 组件的内部实现只按 Snowflake 已公开的资料标注；图不代表其完整服务拓扑。</text></svg>