<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Desktop Risk and Approval Flow</title><style>body{margin:0;background:#f7f8fa;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1440px;margin:24px auto;padding:12px}svg{width:100%;height:auto;display:block}</style></head><body><main><?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Agent Desktop risk-tiered approval workflow</title><desc id="desc">A task is classified by action risk, low-risk reads and drafts execute within policy, write operations require scoped approval, and high-impact actions require business authorization and dual control.</desc>
<defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#263247}.h1{font-size:30px;font-weight:700}.sub{font-size:14px;fill:#65738a}.label{font-size:18px;font-weight:700}.body{font-size:14px;fill:#526178}.small{font-size:12px;fill:#66758b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.blue{fill:#eaf2ff;stroke:#8eaddd}.green{fill:#eaf5ef;stroke:#8bb8a0}.sand{fill:#f6f0e6;stroke:#c9aa7b}.red{fill:#fbefed;stroke:#d8a29b}.line{stroke:#8090a7;stroke-width:2;fill:none}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#8090a7"/></marker></defs>
<rect width="1280" height="760" fill="#f7f8fa"/><text x="60" y="62" class="h1">按动作风险设计自治与审批</text><text x="60" y="90" class="sub">Approval is a scoped business decision, not a generic confirmation dialog.</text>
<rect x="470" y="125" width="340" height="72" rx="14" class="blue"/><text x="640" y="155" text-anchor="middle" class="label">Agent 提出动作</text><text x="640" y="178" text-anchor="middle" class="small">目标对象 · 参数 · 数据依据 · 影响范围</text>
<path d="M640 197V245" class="line" marker-end="url(#arrow)"/>
<path d="M640 245L780 315L640 385L500 315Z" fill="#fff" stroke="#9ba9bb" stroke-width="1.6"/><text x="640" y="309" text-anchor="middle" class="label">策略引擎评估风险</text><text x="640" y="333" text-anchor="middle" class="small">主体 / 动作 / 资源 / 可逆性</text>
<path d="M500 315H245V420" class="line" marker-end="url(#arrow)"/><path d="M640 385V420" class="line" marker-end="url(#arrow)"/><path d="M780 315H1035V420" class="line" marker-end="url(#arrow)"/>
<rect x="70" y="420" width="350" height="155" rx="14" class="green"/><text x="245" y="454" text-anchor="middle" class="label">低风险：读取 / 分析 / 草稿</text><text x="245" y="485" text-anchor="middle" class="body">按用户授权自动执行</text><text x="245" y="511" text-anchor="middle" class="body">保留来源、版本和运行记录</text><text x="245" y="545" text-anchor="middle" class="small">可纠正 · 可重跑 · 无外部副作用</text>
<rect x="465" y="420" width="350" height="155" rx="14" class="sand"/><text x="640" y="454" text-anchor="middle" class="label">中风险：有限写入</text><text x="640" y="485" text-anchor="middle" class="body">展示差异和具体目标，申请审批</text><text x="640" y="511" text-anchor="middle" class="body">审批绑定参数；变更后重新审批</text><text x="640" y="545" text-anchor="middle" class="small">幂等键 · 结果确认 · 可撤销路径</text>
<rect x="860" y="420" width="350" height="155" rx="14" class="red"/><text x="1035" y="454" text-anchor="middle" class="label">高影响：不可逆 / 对外</text><text x="1035" y="485" text-anchor="middle" class="body">强制业务授权与职责分离</text><text x="1035" y="511" text-anchor="middle" class="body">双人复核或由人执行最终动作</text><text x="1035" y="545" text-anchor="middle" class="small">交易 · 发布 · 申报 · 删除 · 权限变更</text>
<path d="M245 575V625H640M640 575V625M1035 575V625H640V650" class="line" marker-end="url(#arrow)"/>
<rect x="420" y="650" width="440" height="66" rx="12" class="box"/><text x="640" y="679" text-anchor="middle" class="label">验证业务结果并写入审计账本</text><text x="640" y="700" text-anchor="middle" class="small">Task ID · Actor · Tool · Policy · Approval · Outcome</text>
</svg></main></body></html>
