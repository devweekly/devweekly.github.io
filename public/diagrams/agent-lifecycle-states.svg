<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="agent-lifecycle-states-title agent-lifecycle-states-desc">
<title id="agent-lifecycle-states-title">Agent lifecycle and control states</title>
<desc id="agent-lifecycle-states-desc">An Agent moves from draft through assessment, development, testing and production, with explicit rejection, suspension, recovery and retirement paths.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#bf4520"/></marker><marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<style>.t{font-family="Geist,Arial,sans-serif";fill:#2d3142}.m{font-family="'Geist Mono',monospace";fill:#4f5d75}.node{fill:#fff;stroke:#bfc0c0;stroke-width:1.2}.focal{fill:#fff4ee;stroke:#bf4520;stroke-width:1.8}.zone{fill:#2d3142;fill-opacity:.025;stroke:#bfc0c0;stroke-width:1}.line{fill:none;stroke:#4f5d75;stroke-width:1.35;marker-end:url(#arrow)}.return{fill:none;stroke:#4f5d75;stroke-width:1.2;stroke-dasharray:4 3;marker-end:url(#arrow)}.accent-line{fill:none;stroke:#bf4520;stroke-width:1.6;marker-end:url(#arrow-accent)}.label{font-family:'Geist Mono',monospace;font-size:8px;fill:#4f5d75;letter-spacing:.02em}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="48" y="36" class="m" font-size="9" letter-spacing="2">DIAGRAM DESIGN · ENTERPRISE AI AGENT PLATFORM</text>
<text x="48" y="76" class="t" font-size="28" font-family="'Instrument Serif',Georgia,serif">Agent lifecycle and control states</text>
<text x="48" y="104" class="m" font-size="10">ASSET LIFECYCLE · EXPLICIT ENTRY CRITERIA · OWNED RECOVERY AND RETIREMENT</text><circle cx="52" cy="278" r="7" fill="#2d3142"/><path d="M59 278 H100" class="line"/><rect x="100" y="252" width="132" height="52" rx="6" class="node"/><text x="166" y="282" text-anchor="middle" class="t" font-size="11" font-weight="600">Draft</text><rect x="260" y="252" width="132" height="52" rx="6" class="node"/><text x="326" y="282" text-anchor="middle" class="t" font-size="11" font-weight="600">Assessment</text><rect x="420" y="252" width="132" height="52" rx="6" class="node"/><text x="486" y="282" text-anchor="middle" class="t" font-size="11" font-weight="600">Development</text><rect x="580" y="252" width="132" height="52" rx="6" class="node"/><text x="646" y="282" text-anchor="middle" class="t" font-size="11" font-weight="600">Testing</text><rect x="740" y="252" width="132" height="52" rx="6" class="node"/><text x="806" y="282" text-anchor="middle" class="t" font-size="11" font-weight="600">Approved</text><rect x="900" y="252" width="132" height="52" rx="6" class="focal"/><text x="966" y="282" text-anchor="middle" class="t" font-size="11" font-weight="600">Production</text><rect x="1060" y="252" width="132" height="52" rx="6" class="node"/><text x="1126" y="282" text-anchor="middle" class="t" font-size="11" font-weight="600">Retired</text><path d="M232 278 H260" class="line"/><path d="M392 278 H420" class="line"/><path d="M552 278 H580" class="line"/><path d="M712 278 H740" class="line"/><path d="M872 278 H900" class="accent-line"/><path d="M1032 278 H1060" class="line"/><rect x="260" y="430" width="132" height="48" rx="6" class="node"/><text x="326" y="458" text-anchor="middle" class="t" font-size="11" font-weight="600">Rejected</text><path d="M326 304 V430" class="line"/><rect x="334" y="354" width="176" height="12" fill="#f5f5f5"/><text x="422" y="363" class="label" text-anchor="middle">RISK / VALUE NOT ACCEPTABLE</text><path d="M486 304 V348 H646 V304" class="line"/><rect x="532" y="336" width="78" height="12" fill="#f5f5f5"/><text x="571" y="345" class="label" text-anchor="middle">BUILD COMPLETE</text><path d="M646 252 V218 H486 V252" class="return"/><rect x="526" y="206" width="80" height="12" fill="#f5f5f5"/><text x="566" y="215" class="label" text-anchor="middle">FIX REQUIRED</text><rect x="900" y="430" width="132" height="48" rx="6" class="node"/><text x="966" y="458" text-anchor="middle" class="t" font-size="11" font-weight="600">Suspended</text><path d="M966 304 V430" class="line"/><rect x="976" y="354" width="140" height="12" fill="#f5f5f5"/><text x="1046" y="363" class="label" text-anchor="middle">INCIDENT / POLICY BREACH</text><path d="M900 454 H852 V278 H900" class="return"/><rect x="850" y="384" width="96" height="12" fill="#f5f5f5"/><text x="898" y="393" class="label" text-anchor="middle">RE-APPROVED</text><path d="M1032 454 H1126 V304" class="line"/><rect x="1040" y="438" width="112" height="12" fill="#f5f5f5"/><text x="1096" y="447" class="label" text-anchor="middle">NO LONGER NEEDED</text><path d="M966 252 V184 H1126 V252" class="return"/><rect x="1002" y="172" width="124" height="12" fill="#f5f5f5"/><text x="1064" y="181" class="label" text-anchor="middle">BUSINESS RETIREMENT</text><path d="M1192 278 H1220" class="line"/><circle cx="1228" cy="278" r="8" fill="none" stroke="#2d3142" stroke-width="1.5"/><circle cx="1228" cy="278" r="4" fill="#2d3142"/><line x1="48" y1="664" x2="1232" y2="664" stroke="#bfc0c0"/><text x="48" y="684" class="m" font-size="8">REJECTED IS A TERMINAL ASSESSMENT OUTCOME · SUSPENDED BLOCKS NEW TASKS UNTIL RE-APPROVAL OR RETIREMENT.</text>
</svg>