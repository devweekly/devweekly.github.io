<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">Computer Use 权限边界</title><desc id="desc">Computer Use 权限边界</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#65584D"/></marker><marker id="arrA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#8B5A2B"/></marker></defs><rect width="1120" height="680" fill="#F9F6EF"/><text x="56" y="58" class="title">Computer Use 是独立的权限面</text><text x="56" y="84" class="subtitle">A folder allowlist does not constrain everything an approved application can open.</text>
<rect x="54" y="132" width="250" height="370" rx="14" class="zone"/><text x="78" y="164" class="label">Agent request</text>
<rect x="84" y="198" width="190" height="72" rx="9" class="card"/><text x="179" y="228" text-anchor="middle" class="label">Task / intent</text><text x="179" y="250" text-anchor="middle" class="small">Read / click / type</text>
<rect x="84" y="314" width="190" height="112" rx="9" class="focus"/><text x="179" y="345" text-anchor="middle" class="label">Policy Decision</text><text x="179" y="371" text-anchor="middle" class="body">User · app · action</text><text x="179" y="393" text-anchor="middle" class="body">Risk · session · scope</text>
<path d="M179 270V308" class="line" marker-end="url(#arr)"/>
<rect x="360" y="132" width="710" height="370" rx="14" class="zone"/><text x="384" y="164" class="label">Managed endpoint permissions</text>
<rect x="390" y="198" width="190" height="100" rx="9" class="card"/><text x="485" y="229" text-anchor="middle" class="label">Screen Recording</text><text x="485" y="253" text-anchor="middle" class="body">See window / pixels</text><text x="485" y="276" text-anchor="middle" class="small">Separate OS permission</text>
<rect x="620" y="198" width="190" height="100" rx="9" class="card"/><text x="715" y="229" text-anchor="middle" class="label">Accessibility</text><text x="715" y="253" text-anchor="middle" class="body">Click / type / navigate</text><text x="715" y="276" text-anchor="middle" class="small">Separate OS permission</text>
<rect x="850" y="198" width="190" height="100" rx="9" class="focus"/><text x="945" y="229" text-anchor="middle" class="label">App approval</text><text x="945" y="253" text-anchor="middle" class="body">Allow / block by app</text><text x="945" y="276" text-anchor="middle" class="small">Session scoped / revocable</text>
<rect x="500" y="354" width="420" height="104" rx="10" class="card"/><text x="710" y="386" text-anchor="middle" class="label">Approved native application</text><text x="710" y="412" text-anchor="middle" class="body">Can expose data beyond the selected file folder</text><text x="710" y="436" text-anchor="middle" class="small">Banking / password manager / admin apps default deny</text>
<path d="M580 248H614M810 248H844M945 298V340H710V348" class="line" marker-end="url(#arr)"/>
<path d="M304 370H354" class="accent" marker-end="url(#arrA)"/>
<rect x="54" y="540" width="1016" height="100" rx="12" class="card"/><text x="82" y="572" class="label">Browser paths must be governed separately</text><text x="82" y="600" class="body">Cloud browser · desktop in-app browser · extension controlling existing tabs · Computer Use controlling native browser</text><text x="82" y="622" class="small">Signed-in accounts, site policies, upload/download rules and audit coverage are not interchangeable.</text></svg>