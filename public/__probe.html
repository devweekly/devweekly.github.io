<!doctype html>
<meta charset="utf-8">
<title>probe</title>
<style>
  html,body{margin:0;background:#888;font:12px monospace}
  #f{border:0;display:block;width:427px;height:829px;background:#fff}
  #out{white-space:pre-wrap;padding:8px;background:#fff}
</style>
<iframe id="f" src="/posts/weight-space-programming%E4%BB%8E%E6%A8%A1%E5%9E%8B%E6%9D%83%E9%87%8D%E5%B7%A5%E7%A8%8B%E5%88%B0-llm-%E7%9B%B4%E6%8E%A5%E7%BC%96%E7%A8%8B%E7%A5%9E%E7%BB%8F%E7%BD%91%E7%BB%9C/"></iframe>
<pre id="out">pending</pre>
<script>
  const q = new URLSearchParams(location.search);
  const W = parseInt(q.get("w") || "427", 10);
  const H = parseInt(q.get("h") || "829", 10);
  const f = document.getElementById("f");
  f.style.width = W + "px";
  f.style.height = H + "px";

  function measure() {
    const d = f.contentDocument, win = f.contentWindow;
    const L = [];
    // hide scrollbars so layout width == requested width (mimics mobile overlay scrollbars)
    const st = d.createElement("style");
    st.textContent = "html{scrollbar-width:none!important}html::-webkit-scrollbar{display:none!important}";
    d.head.appendChild(st);

    const vw = d.documentElement.clientWidth;
    L.push(`W=${W} clientW=${vw} docScrollW=${d.documentElement.scrollWidth} bodyScrollW=${d.body.scrollWidth}`);

    const sel = s => { const e = d.querySelector(s); if (!e) return `${s}: MISSING`;
      const r = e.getBoundingClientRect(); const cs = getComputedStyle(e);
      return `${s}: l=${r.left.toFixed(0)} r=${r.right.toFixed(0)} w=${r.width.toFixed(0)} sw=${e.scrollWidth} cw=${e.clientWidth} disp=${cs.display}`; };
    [".nav-container", ".top-nav-wrap", ".logo", ".hamburger-menu", "#menu-items", "#main-content", "#article", "#article h1"].forEach(s => L.push(sel(s)));

    // internal overflow (content wider than box)
    const inner = [];
    for (const el of d.querySelectorAll("*")) {
      if (el.scrollWidth - el.clientWidth > 1 && el.clientWidth > 0) {
        inner.push(`${el.tagName}${typeof el.className === "string" && el.className ? "." + el.className.trim().split(/\s+/).slice(0,3).join(".") : ""} cw=${el.clientWidth} sw=${el.scrollWidth} over=${el.scrollWidth - el.clientWidth}`);
      }
    }
    L.push(`--- internal overflow (${inner.length}) ---`);
    L.push(...inner.slice(0, 25));

    // furthest right text via Range on every text node
    const probe = [];
    const walker = d.createTreeWalker(d.body, NodeFilter.SHOW_TEXT);
    let n, worst = [];
    while ((n = walker.nextNode())) {
      if (!n.nodeValue.trim()) continue;
      const rg = d.createRange(); rg.selectNodeContents(n);
      const r = rg.getBoundingClientRect();
      if (r.width && r.right > vw + 0.5) {
        worst.push(`${r.right.toFixed(0)}px "${n.nodeValue.trim().slice(0, 40)}"`);
      }
    }
    worst.sort((a, b) => parseFloat(b) - parseFloat(a));
    L.push(`--- text beyond viewport (${worst.length}) ---`);
    L.push(...worst.slice(0, 15));

    const wraps = [...d.querySelectorAll("#article .table-wrap")];
    const widths = wraps.map(w => `${w.scrollWidth > w.clientWidth ? "SCROLL" : "fit"}:${w.clientWidth}/${w.scrollWidth}`);
    L.push(`--- table-wrap (${wraps.length}) --- ${widths.join(" ")}`);

    document.getElementById("out").textContent = L.join("\n");
  }
  f.addEventListener("load", () => setTimeout(measure, 1500));
</script>
