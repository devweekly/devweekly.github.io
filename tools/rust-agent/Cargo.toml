[package]
name = "rust-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "A local-first Rust agent runtime with explicit tool policy"
license = "MIT"

[[bin]]
name = "rust-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
regex = "1"
ignore = "0.4"
