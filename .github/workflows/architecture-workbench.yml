name: Architecture Workbench

on:
  push:
    paths:
      - "tools/architecture-workbench/**"
      - ".github/workflows/architecture-workbench.yml"
  pull_request:
    paths:
      - "tools/architecture-workbench/**"
      - ".github/workflows/architecture-workbench.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: tools/architecture-workbench
        run: npm install --no-audit --no-fund
      - name: Workflow lifecycle tests, typecheck and build
        working-directory: tools/architecture-workbench
        run: npm run build
