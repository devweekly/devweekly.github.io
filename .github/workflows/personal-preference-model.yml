name: Personal Preference Model Tests

on:
  push:
    branches: [main]
    paths:
      - "temp/personal-preference-model/**"
      - ".github/workflows/personal-preference-model.yml"
  pull_request:
    paths:
      - "temp/personal-preference-model/**"
      - ".github/workflows/personal-preference-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: temp/personal-preference-model
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run standard-library unittest suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
